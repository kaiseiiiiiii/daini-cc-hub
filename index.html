.fold-toggle{width:100%; min-height:52px; display:flex; align-items:center; gap:8px; padding:10px 12px;
  background:var(--input-bg); border:1px solid var(--border); border-radius:10px;
  color:var(--text-2); font-size:13px; font-weight:700; cursor:pointer;
  font-family:inherit; margin-bottom:10px; text-align:left;}
.fold-toggle-sub{margin-left:auto; font-size:11px; font-weight:400; color:var(--text-4); white-space:nowrap;}

.notice{margin:10px 16px 0; padding:8px 12px; background:color-mix(in srgb, var(--amber) 12%, transparent); border:1px solid color-mix(in srgb, var(--amber) 30%, transparent); border-radius:8px; font-size:11px; color:var(--amber-c); line-height:1.5;}
.notice-error{background:color-mix(in srgb, var(--red) 12%, transparent); border-color:color-mix(in srgb, var(--red) 32%, transparent); color:var(--red); display:flex; align-items:flex-start; gap:8px; font-size:12px;}
.notice-close{margin-left:auto; background:transparent; border:none; color:inherit; font-size:16px; line-height:1; cursor:pointer; padding:0 2px; font-family:inherit;}

.legacy-card{border-color:color-mix(in srgb, var(--amber) 40%, transparent); background:color-mix(in srgb, var(--amber) 8%, var(--surface));}
.legacy-title{font-weight:700; font-size:13px; color:var(--amber-c); margin-bottom:6px;}
.legacy-body{font-size:12px; color:var(--text-3); line-height:1.7; margin-bottom:10px;}

.pending-mark{color:var(--text-4); font-size:10px; border:1px solid var(--border); border-radius:99px; padding:0 5px; margin-left:4px;}
.edited-mark{color:var(--text-4); font-size:10px; margin-left:6px;}

.post-tools{display:flex; gap:4px; flex-shrink:0; align-items:flex-start;}
.tool-btn{background:transparent; border:1px solid var(--border); border-radius:6px; padding:2px 7px; font-size:11px; color:var(--text-3); cursor:pointer; font-family:inherit; white-space:nowrap;}
.tool-danger{color:var(--red); border-color:color-mix(in srgb, var(--red) 30%, transparent);}
.board-card .post-tools, .survey-head .post-tools{margin-left:auto;}
.board-card .post-tools{justify-content:flex-end; margin-bottom:8px;}
.comment-row .post-tools{margin-left:auto; align-self:center;}
.comment-edit-row{display:flex; gap:6px; align-items:center; margin-bottom:6px;}
.survey-head-info{flex:1; min-width:0;}

.edit-card{border-color:color-mix(in srgb, var(--accent) 40%, transparent);}
.edit-head{font-size:12px; font-weight:700; color:var(--accent); margin-bottom:8px;}
.edit-note{font-size:11px; color:var(--text-4); line-height:1.6;}

.btn-danger{padding:9px 14px; background:var(--red); color:#fff; border:none; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;}
.modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; padding:20px; z-index:100;}
.modal{background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); padding:18px; max-width:340px; width:100%;}
.modal-title{font-size:15px; font-weight:700; color:var(--text); margin-bottom:8px;}
.modal-text{font-size:13px; color:var(--text-2); line-height:1.8; margin-bottom:16px; white-space:pre-wrap;}
.modal-actions{display:flex; gap:8px; justify-content:flex-end;}

.trash-toggle{width:100%; margin-top:14px; padding:8px; background:transparent; border:1px dashed var(--border); border-radius:8px; color:var(--text-4); font-size:11px; cursor:pointer; font-family:inherit;}
.trash-toggle-open{margin-top:0; margin-bottom:8px;}
.trash-box{margin-top:14px; padding:10px; border:1px dashed var(--border); border-radius:10px;}
.trash-row{padding:7px 0; border-top:1px solid var(--border);}
.trash-row:first-of-type{border-top:none;}
.trash-text{font-size:12px; color:var(--text-3); text-decoration:line-through; word-break:break-word;}
.trash-meta{font-size:10px; color:var(--text-4); margin-top:3px;}
</style>
</head>

function tAgo(ts){ var d=Date.now()-ts; if(d<60000) return "たった今"; if(d<3600000) return Math.floor(d/60000)+"分前"; if(d<86400000) return Math.floor(d/3600000)+"時間前"; return Math.floor(d/86400000)+"日前"; }

// ── 日付（"YYYY-MM-DD"）の共通処理 ──────────────────────────
// アンケートの締切とチェックリストの期日で同じ計算を使う。
// 保存形式はどちらも <input type="date"> の値そのままにしてある。
// 文字列のまま持つのは、時刻もタイムゾーンも意味を持たない「日付」で、
// Timestamp にすると時差で1日ずれる事故が起きるため。
function ymdToDate(s){
  if(!s) return null;
  var p = String(s).split("-");
  if(p.length !== 3) return null;
  var d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
  return isNaN(d.getTime()) ? null : d;
}
/** 残り日数。0 は本日、負なら過ぎている、null は日付なし */
function ymdDaysLeft(s){
  var end = ymdToDate(s);
  if(!end) return null;
  end.setHours(0,0,0,0);
  var today = new Date(); today.setHours(0,0,0,0);
  return Math.round((end.getTime() - today.getTime()) / 86400000);
}
/** "8/16（土）" の形に */
function ymdLabel(s){
  var d = ymdToDate(s);
  if(!d) return "";
  return (d.getMonth()+1)+"/"+d.getDate()+"（"+["日","月","火","水","木","金","土"][d.getDay()]+"）";
}
function currentMonthId(){ var d=new Date(); return d.getFullYear()+"_"+(d.getMonth()+1); }

/**
 * 当月から offset か月ずらした月。ドキュメントIDの規則は GAS の monthIdOf_ と揃えてある。
 * new Date(年, 月+offset, 1) は月をまたぐ繰り上がり・繰り下がりを自分で処理してくれるので、
 * 12月→1月や年替わりを個別に書く必要がない。
 */
function monthOf(offset){
  var n = new Date();
  var d = new Date(n.getFullYear(), n.getMonth() + offset, 1);
  return {
    id:    d.getFullYear()+"_"+(d.getMonth()+1),
    label: (d.getMonth()+1)+"月",
    year:  d.getFullYear(),
    month: d.getMonth()+1
  };
}

// ══════════════════════════════════════════════════════════════════
//  アーカイブ（月が変わった投稿を畳む）
//
//  Firestore には何も書かない。「投稿日が当月ではない、かつ固定されて
//  いない」を、そのつど計算して判定している。
//
//  フラグを持たせない理由:
//    ・月初にまとめて書き込む処理（GAS）が要らない。増えた投稿の分だけ
//      書き込みが走る運用は、止まったときに誰も気づけない。
//    ・「固定を外したら自動でアーカイブ」が、外した瞬間に成立する。
//      フラグ方式だと、外したあと次の実行まで一覧に残り続ける。
//    ・過去データの移行が不要。archived を持たない既存の投稿も
//      そのまま正しく畳まれる。
//
//  代償は、古い投稿も購読の対象として読み続けること（表示だけ畳んでいる）。
//  件数が増えて読み取り量が問題になったら、ここを archived フラグと
//  クエリの絞り込みに置き換える。そのときも判定の意味は変えない。
// ══════════════════════════════════════════════════════════════════

/** その投稿が属する月。"2026-8" の形（表示にも並べ替えにも使う） */
function monthKeyOf(ms){
  var d = new Date(ms);
  return d.getFullYear() + "-" + (d.getMonth()+1);
}

function currentMonthKey(){ return monthKeyOf(Date.now()); }

/**
 * アーカイブ済みか。
 * 固定されているものは、何か月経っても現行の一覧に残す。
 * 固定を外した瞬間にここが true になり、次の描画でアーカイブへ移る。
 */
function isArchivedPost(p){
  return !p.pinned && monthKeyOf(p.createdAtMs) !== currentMonthKey();
}

/** "2026-8" → "2026年8月"。横に置く一覧用の短い形。 */
function monthShortLabel(key){
  var parts = key.split("-");
  return parseInt(parts[0],10) + "年" + parseInt(parts[1],10) + "月";
}

/** "2026-8" → "2026年8月（8/1〜8/31）" */
function monthKeyLabel(key){
  var parts = key.split("-");
  var y = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
  // 翌月0日 = その月の末日。月ごとの日数もうるう年もこれで済む。
  var last = new Date(y, m, 0).getDate();
  return y + "年" + m + "月（" + m + "/1〜" + m + "/" + last + "）";
}

/**
 * 投稿の配列を「現行」と「アーカイブ（月ごと）」に分ける。
 * months は新しい月が先。中身の並びは渡されたままの順を保つ。
 */
function splitArchive(list){
  var live = [], byMonth = {};
  list.forEach(function(p){
    if(!isArchivedPost(p)){ live.push(p); return; }
    var k = monthKeyOf(p.createdAtMs);
    (byMonth[k] = byMonth[k] || []).push(p);
  });
  var keys = Object.keys(byMonth).sort(function(a,b){
    var pa = a.split("-"), pb = b.split("-");
    return (pb[0]-pa[0]) || (pb[1]-pa[1]);
  });
  return {
    live: live,
    months: keys.map(function(k){ return { key:k, label:monthKeyLabel(k), posts:byMonth[k] }; }),
    count: list.length - live.length
  };
}

/**
 * アーカイブの折りたたみ。閉じているときはボタン1つだけを出し、
 * 開くと月の見出しごとに投稿を並べる。
 * 月をさらに1つずつ開かせないのは、「1クリックで過去が見える」を
 * 満たすため（2段階にすると、目当ての月を探す手間が増える）。
 */
function renderArchive(split, openFlagKey, renderOne){
  if(!split.count) return "";

    '<span class="reader-caret">'+(open?"▲":"▼")+'</span>' +

  if(!open) return head;
  var body = split.months.map(function(g){
    return '<div class="archive-month">' +
      '<div class="archive-month-head" id="'+esc(openFlagKey)+'-'+esc(g.key)+'">' +
        esc(g.label)+' · '+g.posts.length+'件</div>' +
      g.posts.map(renderOne).join("") +

  }).join("");
  return head + '<div class="archive-body">' + body + '</div>';
}

 * ここに投稿そのものを並べると、同じ投稿が画面に2か所できてしまい、

function getM(id){

  for(i=0;i<session.members.length;i++) if(session.members[i].id===id) return session.members[i];
  var all = session.membersAll || [];

/**
 * アバターに使う画像のファイル名。
 *
 * 値はメンバーマスタから来るので、そのまま src に入れない。
 * assets/ 配下の単純なファイル名だけを通し、`../` や外部URLは弾く。
 * 画像を外部から読ませると、誰がいつ画面を開いたかが
 * その配信元に伝わってしまうため、自前配信に限っている。
 */
function avatarFile(m){
  var f = (m && m.avatar) ? String(m.avatar) : "";
  return /^[A-Za-z0-9][A-Za-z0-9._-]*\.(webp|png|jpg|jpeg)$/i.test(f) ? f : "";
}

function avatar(id,size){
  size = size || 36;
  var m = getM(id);

  // 本人が設定した画像を最優先。次に assets/ に置いたファイル、
  // どちらも無ければ頭文字。混在していても崩れない順番にしている。

      ' width="'+size+'" height="'+size+'" alt="" decoding="async"' +
      ' style="width:'+size+'px;height:'+size+'px">';
  }

  var file = avatarFile(m);
  if(file){
    // alt は空にしている。隣に必ず表示名が出るので、
    // 読み上げで名前が二重になるのを避ける。
    // 遅延読み込みはしない。小さい画像が最初から見える位置に並ぶので、
    // 後から差し込まれると名前の隣がちらついて読みにくくなる。
    return '<img class="avatar avatar-img" src="./assets/'+esc(file)+'"' +
      ' width="'+size+'" height="'+size+'" alt="" decoding="async"' +
      ' style="width:'+size+'px;height:'+size+'px">';
  }
  // 画像が無い人は今までどおり頭文字。全員分の画像が揃わなくても混在で成立する。
  return '<div class="avatar '+teamClass(m.team)+'" style="width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*0.38)+'px">'+esc(m.initial)+'</div>';
}

  boardOpenTask:null,       // 完了状況パネルを開いているチェックリストのID
  boardImageDraft:null,     // 投稿前の添付画像 { dataUrl, width, height }
  editImageDraft:null,      // 編集中に差し替える画像
  editImageRemove:false,    // 編集で画像を外すか
  images:{},                // imageId -> 画像データ | "loading" | "missing" | "error"
  lightbox:null,            // 拡大表示している imageId
  calMonth:0,               // 期日カレンダーが当月から何か月ずれているか
  calOpen:false,            // 期日カレンダーを開いているか
  surveyShowForm:false,
  surveyOpenStatus:null,    // 回答状況パネルを開いているアンケートのID
  surveyDraft:{},           // 送信前の選択。{surveyId: [optionId]}
  surveyRevote:null,        // 回答済みから選び直しに戻しているアンケートのID
  mvvOpen:false,           // MVVパネルの開閉
  progressKpiOpen:false,   // 生産性KPIセクションの開閉
  kpiSel:null,
  busy:false,               // 送信中の二重送信よけ
  notice:"",                // 書き込み失敗などの通知
  legacy:null,              // localStorage に残っていた旧データ
  editing:null,             // { kind, id, postId? } 編集中の対象
  confirm:null,             // { title, body, okLabel, onOk } 確認ダイアログ
  trash:{ feed:[], board:[], surveys:[] },   // 削除済み（admin が確認用に見る）
  showTrash:false,
};

// ══════════════════════════════════════════════════════════════════
//  Firestore ドキュメントの読み替え
// ══════════════════════════════════════════════════════════════════
/**
 * serverTimestamp() はサーバー確定までローカルでは null になる。
 * そのままだと投稿直後に時刻が消え、並び順も崩れるため、
 * "estimate" でローカル時刻を推定値として埋めてもらう。
 */
function mapDoc(d){
  var v = d.data({ serverTimestamps: "estimate" });
  var o = { id: d.id, pending: d.metadata.hasPendingWrites };
  for(var k in v) o[k] = v[k];
  o.createdAtMs = v.createdAt && v.createdAt.toMillis ? v.createdAt.toMillis() : Date.now();
  o.deletedAtMs = v.deletedAt && v.deletedAt.toMillis ? v.deletedAt.toMillis() : null;
  return o;
}
function byNewest(a,b){ return b.createdAtMs - a.createdAtMs; }
function notDeleted(d){ return d.deleted !== true; }
function isDeleted(d){ return d.deleted === true; }

// ── 権限判定 ──────────────────────────────────────────────
// ここは画面の出し分けのためだけのもの。
// 実際の可否は firestore.rules 側で同じ条件を独立に検証している。
// 開発者ツールから直接 update を投げられても、そちらで止まる。
function canEdit(d){   return !!d && d.authorId === currentUserId() && !d.deleted; }
function canDelete(d){ return !!d && !d.deleted && (d.authorId === currentUserId() || isAdmin()); }

// ══════════════════════════════════════════════════════════════════
//  リアルタイム購読
//
//  ログイン中は3本を張りっぱなしにする。
//  onSnapshot はアタッチ時に全件、以降は差分だけを読む。
//  タブ切り替えのたびに解除・再アタッチすると毎回全件読み直しになり、
//  かえって読み取り課金が増える。掲示板の未読バッジも、他タブを
//  見ている間の更新を拾えなくなる。
//
//  解除はこの配列だけを見ればよいようにして、漏れを構造的に防ぐ。
// ══════════════════════════════════════════════════════════════════
var unsubscribers = [];
var commentUnsub = null;
var shiftOtherUnsub = null;   // 前月/翌月を見ているあいだだけ張る

// 鮮度の警告は時間の経過だけで状態が変わる（データは動かない）。
// アプリを開きっぱなしにしていても警告が出るよう、定期的に描き直す。
var freshnessTimer = null;
function startFreshnessTimer(){
  if(freshnessTimer) return;
  var last = "";
  freshnessTimer = setInterval(function(){
    if(session.status !== "ready") return;
    var lv = syncHealth().level;
    if(lv !== last){ last = lv; render(); }
  }, 5 * 60 * 1000);
}
function stopFreshnessTimer(){
  if(freshnessTimer){ clearInterval(freshnessTimer); freshnessTimer = null; }
}

function detachAll(){
  unsubscribers.forEach(function(u){ try{ u(); }catch(e){} });
  unsubscribers = [];
  detachComments();
  detachShiftOther();
  stopFreshnessTimer();
}
function detachComments(){
  if(commentUnsub){ try{ commentUnsub(); }catch(e){} commentUnsub = null; }
  state.comments = [];
}
function detachShiftOther(){
  if(shiftOtherUnsub){ try{ shiftOtherUnsub(); }catch(e){} shiftOtherUnsub = null; }
  state.shiftOther = null;
  state.shiftOtherLoading = false;
}

function subscribe(colName, orderField, onData, extraWhere){
  var parts = [collection(db, colName)];
  if(extraWhere) parts.push(extraWhere);
  parts.push(orderBy(orderField, "desc"));
  parts.push(limit(200));
  var q = query.apply(null, parts);
  unsubscribers.push(onSnapshot(q,
    function(snap){
      // orderBy はサーバー側の順序。未確定の serverTimestamp は null 扱いで
      // 末尾に回ってしまうため、推定値で並べ直す。
      var all = snap.docs.map(mapDoc).sort(byNewest);
      onData(all.filter(notDeleted), all.filter(isDeleted));
      reconcileOpenState();
      render();
    },
    function(err){
      // 生のエラーも必ずコンソールに出す。
      // 索引が足りない場合、Firestore は「この索引を作れ」というURLを
      // エラーの本文に入れて返してくる。画面用の文言だけを出して
      // これを捨てると、一番使える情報が手元に残らない。
      try{ console.error("[第二CC Hub] " + colName + " の購読に失敗", err); }catch(e){}

      // 索引が無いときは「権限がない」と区別が付かないので、専用の案内を出す。
      // 公開範囲で絞りつつ日時で並べるには複合索引が要る（作成は一度だけ）。
      if(err.code === "failed-precondition"){
        state.notice = colName + " を読むための索引がまだありません。" +
          "F12（開発者ツール）→ Console に出ているエラーの中に、" +
          "索引を作るためのリンク（console.firebase.google.com … create_composite）があります。" +
          "それを開いて作成してください。手で作る場合は、コレクション boardPosts に" +
          "「visibleTo は【配列に含む】＋ createdAt は【降順】」の複合インデックスです。" +
          "作成後、状態が「有効」になるまで数分かかります";
      }else{
        state.notice = colName + " の購読に失敗しました（" + err.code + "）";
      }
      render();
    }
  ));
}

function attachAll(){
  detachAll();   // 二重アタッチ防止
  subscribe("feedPosts",  "createdAt", function(live, gone){ state.feed = live;    state.trash.feed = gone; });
  // 掲示板だけは公開範囲で絞る。ルール側は1件ずつ visibleTo を見て許否を決めるため、
  // クエリ側でも同じ条件で絞っておかないと、読めない文書が候補に入って
  // 購読そのものが拒否される（Firestore は「結果に1件でも違反があれば全体を拒否」する）。
  subscribe("boardPosts", "createdAt", function(live, gone){
    // 二重の絞り込み。実際の防御はルールとクエリで済んでいるが、
    // 将来どちらかを触ったときに、画面へ出る側で必ず止まるようにしておく。
    state.board = live.filter(canSeeHere);
    state.trash.board = gone.filter(canSeeHere);
  }, where("visibleTo", "array-contains-any", [VISIBLE_ALL, currentUserId()]));
  subscribe("surveys",    "createdAt", function(live, gone){ state.surveys = live; state.trash.surveys = gone; });
}

/**
 * 別の人が削除した投稿を、こちらが開いていた／編集していた場合の後始末。
 * リアルタイム同期なので、操作中に対象が消えることが普通に起きる。
 * 消えたまま参照を持ち続けると、空のパネルが residual に残ったり
 * 保存時に理由の分からないエラーになる。
 */
function has(list, id){
  for(var i=0;i<list.length;i++) if(list[i].id===id) return true;
  return false;
}
function reconcileOpenState(){
  var lost = "";

  if(state.editing){
    var e = state.editing;
    if(e.kind==="feed"   && !has(state.feed, e.id))      lost = "編集していた投稿は削除されました";
    if(e.kind==="board"  && !has(state.board, e.id))     lost = "編集していた掲示板の投稿は削除されました";
    if(e.kind==="survey" && !has(state.surveys, e.id))   lost = "編集していたアンケートは削除されました";
    // コメントの親は、開いている側のコレクションで探す。
    // 常に state.feed を見ていると、掲示板のコメントを編集中に
    // 「親が消えた」と誤判定して編集が中断される。
    if(e.kind==="comment"){
      var pool = (state.commentKind === "board") ? state.board : state.feed;
      if(!has(pool, e.postId)) lost = "コメント先の投稿は削除されました";
    }
    if(lost) state.editing = null;
  }

  if(state.feedOpenComment && !has(state.feed, state.feedOpenComment)){
    state.feedOpenComment = null;
    detachComments();
  }
  if(state.boardOpenComment && !has(state.board, state.boardOpenComment)){
    state.boardOpenComment = null;
    detachComments();
  }
  if(state.boardOpenReaders && !has(state.board, state.boardOpenReaders)) state.boardOpenReaders = null;
  if(state.boardOpenTask && !has(state.board, state.boardOpenTask)) state.boardOpenTask = null;
  if(state.surveyOpenStatus && !has(state.surveys, state.surveyOpenStatus)) state.surveyOpenStatus = null;

  if(state.confirm && state.confirm.targetId){
    var pool = state.confirm.kind==="feed" ? state.feed
             : state.confirm.kind==="board" ? state.board
             : state.confirm.kind==="survey" ? state.surveys : null;
    if(pool && !has(pool, state.confirm.targetId)){
      state.confirm = null;
      lost = lost || "対象の投稿は、ほかの人がすでに削除しました";
    }
  }

  if(lost) state.notice = lost;
}

/**
 * コメントの購読。フィードと掲示板の両方から使う。
 *
 * 購読は常に1本だけ。開いている投稿は画面全体で1件という前提で、
 * kind（どちらのコレクションか）と postId を渡す。2本張れるように
 * すると、タブを行き来したときに前の購読を落とし忘れる経路ができる。
 */
function attachComments(kind, postId){
  detachComments();
  if(!postId) return;
  var col = kind === "board" ? "boardPosts" : "feedPosts";
  state.commentKind = kind;
  var q = query(collection(db, col, postId, "comments"), orderBy("createdAt", "asc"), limit(200));
  commentUnsub = onSnapshot(q,
    function(snap){
      state.comments = snap.docs.map(mapDoc).filter(notDeleted)
        .sort(function(a,b){ return a.createdAtMs - b.createdAtMs; });
      // 編集中のコメントが他の人に消された場合
      if(state.editing && state.editing.kind==="comment" && !has(state.comments, state.editing.id)){
        state.editing = null;
        state.notice = "編集していたコメントは削除されました";
      }
      render();
    },
    function(err){ state.notice = "コメントの購読に失敗しました（" + err.code + "）"; render(); }
  );
}

window.addEventListener("beforeunload", detachAll);

// ══════════════════════════════════════════════════════════════════
//  旧データ（localStorage）の退避と削除
//
//  移行はしない。旧アプリは「投稿者を選ぶプルダウン」で誰にでも
//  なりすませたため、記録されている作成者が実際の書き手と一致しない。
//  セキュリティルールは authorId == 自分 を強制するので、
//  他人名義の投稿はそもそも作成できない（これは正しい動作）。
//  中身を確認できるようダウンロードだけ用意して、あとは消す。
// ══════════════════════════════════════════════════════════════════
var LEGACY_KEYS = ["cc2:feed", "cc2:board", "cc2:surveys"];

function loadLegacy(){
  var found = null;
  LEGACY_KEYS.forEach(function(k){
    try{
      var raw = localStorage.getItem(k);
      if(!raw) return;
      var parsed = JSON.parse(raw);
      if(!parsed || !parsed.length) return;
      found = found || {};
      found[k] = parsed;
    }catch(e){}
  });
  state.legacy = found;
}
function legacyCount(){
  if(!state.legacy) return 0;
  var n = 0;
  for(var k in state.legacy) n += state.legacy[k].length;
  return n;
}
function downloadLegacy(){
  var blob = new Blob([JSON.stringify(state.legacy, null, 2)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "daini-cc-hub-legacy-backup.json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function discardLegacy(){
  LEGACY_KEYS.forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} });
  state.legacy = null;
  render();
}

// ══════════════════════════════════════════════════════════════════
//  認証
// ══════════════════════════════════════════════════════════════════
function configLooksUnset(){
  return !FIREBASE_CONFIG
      || !FIREBASE_CONFIG.apiKey
      || String(FIREBASE_CONFIG.apiKey).indexOf("PASTE_") === 0;
}

// ══════════════════════════════════════════════════════════════════
//  テーマ（明るい／暗い）
//
//  data-theme を <html> に立てるだけ。CSS 側は
//  :root[data-theme="dark"] の1ブロックで受ける。
//
//  【OS 追従を CSS の media query でやらない理由】
//  同じ上書きを media query 側にも書くことになり、片方だけ直して
//  食い違う事故が起きる。ここで「保存された選択 → 無ければ OS」を
//  判定して data-theme を立てれば、CSS は1ブロックで済む。
//
//  【localStorage を使う】
//  Firestore に置くと、未ログインのログイン画面で色が決められない。
//  端末ごとの見た目の設定なので、そもそも共有する意味も薄い。
//  旧アプリの残骸を消す loadLegacy() とは別のキーにしてある。
// ══════════════════════════════════════════════════════════════════
var THEME_KEY = "dainiCcHub.theme";

/** 保存された選択。"light" | "dark" | null（未選択＝OSに従う） */
function savedTheme(){
  try{
    var v = localStorage.getItem(THEME_KEY);
    return (v === "light" || v === "dark") ? v : null;
  }catch(e){ return null; }   // プライベートモードで localStorage が使えない端末
}

/** いま暗くすべきか。選択が無ければ OS の設定を見る */
function wantsDark(){
  var s = savedTheme();
  if(s) return s === "dark";
  try{ return window.matchMedia("(prefers-color-scheme: dark)").matches; }catch(e){ return false; }
}

/**
 * <html> に data-theme を立てる。
 * 画面を描き直す前に呼ぶこと。CSS 変数の切り替えだけなので、
 * DOM を作り直す必要はない（ボタンの絵柄だけ render で追従する）。
 */
function applyTheme(){
  var el = document.documentElement;
  if(wantsDark()) el.setAttribute("data-theme", "dark");
  else el.setAttribute("data-theme", "light");
}

/** ボタンを押したとき。いまの見た目の逆を明示的に保存する */
function toggleTheme(){
  var dark = document.documentElement.getAttribute("data-theme") === "dark";
  try{ localStorage.setItem(THEME_KEY, dark ? "light" : "dark"); }catch(e){}
  applyTheme();
  render();
}

// OS の設定が開いている間に変わったら追従する。
// ただし自分で選んだ人の設定は上書きしない。
try{
  var mqDark = window.matchMedia("(prefers-color-scheme: dark)");
  if(mqDark.addEventListener){
    mqDark.addEventListener("change", function(){
      if(savedTheme()) return;
      applyTheme();
      render();
    });
  }
}catch(e){}

function boot(){
  applyTheme();
  bindEvents();
  if(configLooksUnset()){
    session.status = "config";
    render();
    return;
  }
  var fbApp = initializeApp(FIREBASE_CONFIG);
  auth = getAuth(fbApp);
  db = getFirestore(fbApp);
  auth.useDeviceLanguage();
  onAuthStateChanged(auth, onAuthChanged);
  render();
}

async function doSignIn(){
  if(session.signingIn || !auth) return;
  session.signingIn = true;
  session.deniedEmail = "";
  session.errorMessage = "";
  if(session.status === "denied") session.status = "signedOut";
  render();
  try{
    var provider = new GoogleAuthProvider();
    // 毎回アカウント選択を出す。共用PCで前の人のアカウントに
    // そのまま入ってしまうのを防ぐため。
    var params = { prompt: "select_account" };
    if(SIGN_IN_HINT_DOMAIN) params.hd = SIGN_IN_HINT_DOMAIN;
    provider.setCustomParameters(params);
    await signInWithPopup(auth, provider);
  }catch(e){
    var code = e && e.code ? e.code : "";
    if(code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request"){
      // ユーザーが自分で閉じただけなので何も出さない
    }else if(code === "auth/popup-blocked"){
      session.errorMessage = "ポップアップがブロックされました。ブラウザの設定でこのサイトのポップアップを許可してください。";
    }else{
      session.errorMessage = "ログインに失敗しました（" + (code || "unknown") + "）";
    }
    render();
  }finally{
    session.signingIn = false;
    render();
  }
}

async function doSignOut(){
  if(!auth) return;
  session.deniedEmail = "";
  session.errorMessage = "";
  await signOut(auth);
}

async function onAuthChanged(user){
  if(!user){
    detachAll();
    session.authUser = null;
    session.member = null;
    session.members = [];
    session.membersAll = [];
    session.teams = [];
    state.feed = []; state.board = []; state.surveys = [];
    // 「利用権限がありません」を表示した直後はサインアウトが走るが、
    // その通知でログイン画面に戻してしまうとメッセージが読めないため、
    // denied のときだけは状態を維持する。
    if(session.status !== "denied") session.status = "signedOut";
    render();
    return;
  }

  session.authUser = user;
  session.status = "loading";
  render();

  var email = String(user.email || "").toLowerCase();
  try{
    // 許可リストの突き合わせ。
    // セキュリティルール上、ここで読めるのは「自分宛の1件」だけ。
    var snap = await getDoc(doc(db, "members", email));
    if(!snap.exists() || snap.data().active !== true){
      await denyAccess(user.email || "");
      return;
    }
    var m = snap.data();
    session.member = {
      id: m.memberId,
      email: email,
      displayName: m.displayName || m.fullName || "?",
      fullName: m.fullName || "",
      initial: m.initial || String(m.displayName || "?").charAt(0),
      team: m.team || null,
      jobTitle: m.jobTitle || "",
      role: m.role === "admin" ? "admin" : "member",
      order: m.order || 0,
      avatar: m.avatar || "",
      // チーム実績タブを見られるか。既定は false。
      //
      // ここは loadMasters() の一覧とは別に、自分の1件だけを読んで組み立てて
      // いる。members に項目を足したら **両方** に足すこと。片方だけだと、
      // 一覧には出るのに自分の判定には効かない（実際それで
      // 「権限を付けたのにタブが出ない」を出した）。
      canSeeTeamKpi: m.canSeeTeamKpi === true,
      // 課題（赤いチップ）の対象にするか。既定は対象にする。
      // 管理職や、他拠点扱いで比べても意味がない人は Firestore 側で
      // false にする。氏名をコードに書かないための項目。
      kpiIssueTarget: m.kpiIssueTarget !== false
    };
    await loadMasters();
    loadLegacy();
    session.status = "ready";
    render();
    attachAll();
    attachSyncedData();
    attachAvatars();
    startFreshnessTimer();
  }catch(e){
    if(e && e.code === "permission-denied"){
      await denyAccess(user.email || "");
      return;
    }
    session.errorMessage = (e && e.message) ? e.message : String(e);
    session.status = "error";
    render();
  }
}

async function denyAccess(email){
  detachAll();
  session.deniedEmail = email;
  session.member = null;
  session.status = "denied";
  render();
  try{ await signOut(auth); }catch(e){}
  render();
}

async function loadMasters(){
  var tsnap = await getDocs(query(collection(db, "teams"), orderBy("order")));
  session.teams = tsnap.docs.map(function(d){
    var v = d.data();
    return { id:d.id, label:v.label || d.id, order:v.order || 0, colorKey:v.colorKey || "none",
             // KPIの測定対象にするか。未設定なら対象。
             // 管理職チームのように、同じ予算で測っても意味がない括りを
             // false にすると、着地シナリオと課題チップから丸ごと外れる。
             // メンバー1人ずつ設定しなくて済むよう、チーム側に置いてある。
             kpiTarget: v.kpiTarget !== false };
  });

  var msnap = await getDocs(query(collection(db, "members"), orderBy("order")));
  var everyone = msnap.docs.map(function(d){
    var v = d.data();
    return {
      id: v.memberId,
      displayName: v.displayName || v.fullName || "?",
      fullName: v.fullName || "",
      initial: v.initial || String(v.displayName || "?").charAt(0),
      team: v.team || null,
      jobTitle: v.jobTitle || "",
      role: v.role === "admin" ? "admin" : "member",
      order: v.order || 0,
      // assets/ 配下のファイル名。空なら頭文字のアバターになる。
      avatar: v.avatar || "",
      active: v.active !== false,
      // シフト表に載せるか。未設定なら載せる（既存メンバーの挙動を変えないため）。
      inShift: v.inShift !== false,
      // 課題（赤いチップ）の対象にするか。未設定なら対象にする。
      // 管理職や他拠点扱いの人は false にすると、チップも赤いマスも出ない。
      kpiIssueTarget: v.kpiIssueTarget !== false,
      // チーム実績タブを見られるか。既定は false（持っていない人は見られない）。
      // 画面の出し分けはここを見るが、実際の可否は firestore.rules 側が
      // 独立に判定している。ここを書き換えても data は取れない。
      canSeeTeamKpi: v.canSeeTeamKpi === true
    };
  });

  // 現役だけを session.members に入れる。宛先の候補・シフト表・KPIの集計は
  // すべてここを見るので、退職者が混ざると選べてしまう。
  session.members = everyone.filter(function(m){ return m.active; });

  // 退職者も名前だけは引けるように、全員ぶんを別に持つ。
  //
  // 【なぜ要るか】
  // getM() が見つけられないと投稿者名が「?」になる。退職した人の過去の
  // 投稿・コメント・サンクスが軒並み「?」になってしまい、誰の発言だったのか
  // 分からなくなる（active:false にしただけでこうなっていた）。
  // 名前を引く用と、選択肢に出す用は別の話なので、持ち方を分ける。
  session.membersAll = everyone;
}

/**
 * シフト関連の集計・表示に載せるメンバー。
 *
 * シフト表・本日のサマリー・ヘッダーの人数・残り稼働時間の4つは、
 * すべてここを通す。片方だけ除外すると「表には出ないのに稼働時間には
 * 数えられている」という追いにくい食い違いになるため。
 *
 * 除外はコードではなく Firestore のメンバーマスタ側で行う（inShift: false）。
 */
function shiftMembers(){
  return session.members.filter(function(m){ return m.inShift !== false; });
}

// シフト・実績・目標はスプレッドシートから GAS が1時間おきに書き込む。
// 単発の getDoc ではなく購読にしてあるのは、同期が走った直後に
// 「最終更新」の表示と鮮度の警告が自動で切り替わるようにするため。
// いずれも1ドキュメントなので、変化がなければ読み取りは発生しない。
function subscribeDoc(path, id, onData){
  unsubscribers.push(onSnapshot(doc(db, path, id),
    function(snap){ onData(snap.exists() ? snap.data() : null); render(); },
    function(){ onData(null); render(); }
  ));
}

/**
 * アイコン。memberId をキーにした小さなドキュメントを購読する。
 * 誰かが変えたら全員の画面ですぐ差し替わる。
 */
/**
 * 日次のメンバー別KPI。1日1ドキュメントなので、新しい順に35件だけ購読する。
 *
 * 全期間を購読すると日が経つほど読み取りが増える。35日ぶんあれば
 * 週の比較には足りるし、当日ぶん以外は変わらないので、2回目以降の
 * スナップショットは実質1件しか読まない。
 *
 * ドキュメントIDが日付だが、orderBy には date フィールドを使う。
 * documentId() での並べ替えは import を増やすことになるので、
 * GAS 側で date を持たせて揃えてある。
 */
function subscribeDailyKpi(){
  var q = query(collection(db, "memberKpiDaily"), orderBy("date", "desc"), limit(35));
  unsubscribers.push(onSnapshot(q,
    function(snap){
      state.memberKpiDaily = snap.docs.map(function(d){
        var v = d.data();
        return { date: v.date || d.id, byMember: v.byMember || {} };
      });
      render();
    },
    function(err){
      // 権限が無い人はそもそも購読しないので、ここに来るのは索引などの問題。
      // 日次が無くても他は動くので、通知だけ出して黙って畳む。
      try{ console.error("[第二CC Hub] memberKpiDaily の購読に失敗", err); }catch(e){}
      state.memberKpiDaily = [];
      render();
    }
  ));
}

function attachAvatars(){
  unsubscribers.push(onSnapshot(collection(db, "avatars"),
    function(snap){
      var map = {};
      snap.docs.forEach(function(d){
        var v = d.data();
        if(v && typeof v.dataUrl === "string") map[d.id] = v.dataUrl;
      });
      session.avatars = map;
      render();
    },
    function(){ session.avatars = {}; }
  ));
}

/** その日の座席表のドキュメントID。"YYYY-MM-DD"（GAS 側と同じ規則） */
function seatDocId(offsetDays){
  var d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + offsetDays);
  return d.getFullYear() + "-" +
         ("0"+(d.getMonth()+1)).slice(-2) + "-" +
         ("0"+d.getDate()).slice(-2);
}

function attachSyncedData(){
  subscribeDoc("shifts", currentMonthId(), function(v){ state.shiftCurrent = v; });
  // 当日と翌日の2件だけ購読する。1件はだいたい100セル程度なので軽い。
  // 翌日分を持っておくのは、前夜のうちに「明日どこに座るか」を
  // 見られるようにするため（23時台の取り込みはそのためにある）。
  subscribeDoc("seats", seatDocId(0), function(v){ state.seatToday = v; });
  subscribeDoc("seats", seatDocId(1), function(v){ state.seatTomorrow = v; });
  subscribeDoc("metrics", "latest",        function(v){ state.metrics = v; });
  // メンバー別KPI。読める人だけ購読する。
  // 権限の無い人が張ると onSnapshot が permission-denied で鳴り続けるので、
  // 「出さない」ではなく「そもそも張らない」にしてある。
  if(canSeeTeamKpi()){
    subscribeDoc("memberKpi", "current",   function(v){ state.memberKpi = v; });
    subscribeDailyKpi();
    // 着地シナリオ。当月ぶんだけ。書き込みもここを見ている人が行う。
    subscribeDoc("landingScenario", monthOf(0).id, function(v){ state.landing = v; });
  }
  subscribeDoc("goals", "current",         function(v){ state.goals = v; });
  subscribeDoc("syncStatus", "spreadsheet", function(v){
    state.syncStatus = v;
    state.syncedAtMs = (v && v.lastSyncedAt && v.lastSyncedAt.toMillis) ? v.lastSyncedAt.toMillis() : null;
  });
}

/**
 * 表示する月を切り替える。
 * 当月は attachSyncedData で張った購読を使い回し、前月・翌月を見るあいだだけ
 * 2本目を張って、離れたら必ず落とす（張りっぱなしは読み取り課金の無駄になる）。
 */
function setShiftMonth(offset){
  if(offset === state.shiftMonthOffset) return;
  state.shiftMonthOffset = offset;
  state.shiftWeekStart = null;          // 月が変わったら週の位置は選び直す
  detachShiftOther();
  if(offset !== 0){
    state.shiftOtherLoading = true;
    shiftOtherUnsub = onSnapshot(doc(db, "shifts", monthOf(offset).id),
      function(snap){
        state.shiftOther = snap.exists() ? snap.data() : null;
        state.shiftOtherLoading = false;
        render();
      },
      function(){ state.shiftOther = null; state.shiftOtherLoading = false; render(); }
    );
  }
  render();
}

/** いま表示すべき月のシフト。当月なら常時購読しているものを返す。 */
function displayedShift(){
  return state.shiftMonthOffset === 0 ? state.shiftCurrent : state.shiftOther;
}

// ══════════════════════════════════════════════════════════════════
//  同期の鮮度
//
//  一番危ないのは、同期が止まっているのに古い数字が最新の顔で
//  出ていることなので、疑わしい状態は必ず画面に出す。
//
//  ただし深夜は同期しない設計なので、単純な経過時間だけで判定すると
//  毎朝かならず誤検知する。稼働時間帯かどうかで分けている。
// ══════════════════════════════════════════════════════════════════
var SYNC_HOUR_FROM = 10;   // GAS 側と同じ値
var SYNC_HOUR_TO   = 22;
var STALE_HOURS    = 3;

function sameLocalDay(a, b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

// now を引数で受けられるようにしてあるのは、深夜・早朝の分岐を
// 実時刻に頼らず確かめられるようにするため。通常は省略して呼ぶ。
function syncHealth(now){
  var ms = state.syncedAtMs;
  if(!ms) return { level:"never" };

  now = now || new Date();
  var hour = now.getHours();
  var inHours = hour >= SYNC_HOUR_FROM && hour <= SYNC_HOUR_TO;
  var ageH = (now.getTime() - ms) / 3600000;
  var today = sameLocalDay(new Date(ms), now);

  if(state.syncStatus && state.syncStatus.lastResult === "error"){
    return { level:"error", message:"前回の同期が失敗しています。数字が古いままの可能性があります" };
  }
  if(!inHours) return { level:"ok" };                 // 深夜・早朝は警告しない
  if(!today && hour === SYNC_HOUR_FROM){
    return { level:"yesterday", message:"前日の数字を表示中です。本日分の同期はこれから行われます" };
  }
  if(!today){
    return { level:"stale", message:"本日まだ一度も同期されていません。数字は前日のものです" };
  }
  if(ageH >= STALE_HOURS){
    return { level:"stale", message:"最終更新から"+Math.floor(ageH)+"時間が経過しています。同期が止まっている可能性があります" };
  }
  return { level:"ok" };
}

function syncedAtLabel(){
  if(state.syncedAtMs){
    var d = new Date(state.syncedAtMs);
    return (d.getMonth()+1)+"月"+d.getDate()+"日 "+d.getHours()+"時"+("0"+d.getMinutes()).slice(-2)+"分";
  }
  if(state.syncStatus && state.syncStatus.lastSyncedAtLabel) return state.syncStatus.lastSyncedAtLabel;
  return null;
}

/** シフトタブ・実績タブの先頭に出す最終更新と警告 */
function renderSyncBar(){
  var label = syncedAtLabel();
  var h = syncHealth();
  var warn = "";
  if(h.level === "error"){
    // 同期そのものが失敗した場合だけ INさんを出す。
    // 「3時間更新がない」だけの状態は失敗とは限らないので出さない。
    warn = '<div class="sync-warn sync-warn-bad sync-warn-in">' +
      inChar("trouble", "データが取れませんでした", 56) +
      '<span>'+esc(h.message)+'</span></div>';
  }else if(h.level === "stale"){
    warn = '<div class="sync-warn sync-warn-bad">⚠️ '+esc(h.message)+'</div>';
  }else if(h.level === "yesterday"){
    warn = '<div class="sync-warn sync-warn-soft">🕙 '+esc(h.message)+'</div>';
  }
  return warn + '<div class="shift-note">' +
    (label ? '最終更新 '+esc(label) : 'まだ一度も同期されていません') +
  '</div>';
}

function todayScheduledCount(){
  // どの月を見ていてもヘッダーは「本日」を出すので、当月の購読だけを見る。
  var sh = state.shiftCurrent;
  if(!sh || !sh.dates || !sh.rows) return null;
  var idx = sh.dates.indexOf(todayDateLabel());
  if(idx < 0) return null;
  var n = 0;
  shiftMembers().forEach(function(m){
    var row = sh.rows[m.id];
    if(row && row[idx]) n++;
  });
  return n;
}

function renderHeader(){
  var me = currentUser();
  var scheduled = todayScheduledCount();
  return '' +
    '<div class="header">' +
      '<div class="header-info">' +
        '<div class="header-title">🚀 第二CC Hub</div>' +
        (scheduled !== null ? '<div class="header-online">● 本日 '+scheduled+'名 シフト予定</div>' : '') +
      '</div>' +
      '<div class="header-me">' +
        '<button class="avatar-btn" data-act="avatar-open" data-id="'+esc(me.id)+'" aria-label="アイコンを変更">'+avatar(me.id, 28)+'</button>' +
        '<div class="header-me-text">' +

/**

 * 押すとその場で切り替わり、選択は localStorage に残る。何も選んで

}

/**
 * 削除済みの一覧（管理者のみ）。
 * 「あの投稿、誰が消した？」に答えられるようにするための窓口。
 * これが無いと、記録はしていても Firestore コンソールを開くしか
 * 確認手段がなくなる。
 */
function renderTrash(kind){
  if(!isAdmin()) return "";
  var rows = state.trash[kind] || [];
  if(!rows.length) return "";
  var label = { feed:"投稿", board:"共有事項", surveys:"アンケート" }[kind];
  if(!state.showTrash){
    return '<button class="trash-toggle" data-act="trash-toggle">🗑 削除済みの'+label+' '+rows.length+'件を表示</button>';
  }
  return '<div class="trash-box">' +
    '<button class="trash-toggle trash-toggle-open" data-act="trash-toggle">🗑 削除済みの'+label+' '+rows.length+'件を隠す</button>' +
    rows.map(function(d){
      var who = getM(d.deletedBy || "").displayName;
      var title = kind==="board" ? d.title : (kind==="surveys" ? d.title : d.text);
      return '<div class="trash-row">' +
        '<div class="trash-text">'+esc(String(title||"").slice(0,60))+'</div>' +
        '<div class="trash-meta">' +
          esc(getM(d.authorId).displayName)+'さんの'+label+' · ' +
          '<strong>'+esc(who)+'さんが削除</strong>' +
          (d.deletedAtMs ? ' · '+tAgo(d.deletedAtMs) : '') +
        '</div>' +
      '</div>';
    }).join("") +
  '</div>';
}

/**
 * 未読の掲示板。
 * アーカイブに畳まれたものは数えない。開かないと見えないものを
 * バッジに載せると、押しても減らない数字になる。
 */
function unreadBoards(){
  var me = currentUserId();
  return state.board.filter(function(p){
    return !isArchivedPost(p) && !(p.readBy && p.readBy[me]);
  });
}
/** 未回答のアンケート（締切済みは除く） */
function pendingSurveys(){
  var me = currentUserId();
  return state.surveys.filter(function(s){ return !s.closed && !(s.votes && s.votes[me]); });
}

/** 月曜起点の週の開始時刻 */
function weekStartMs(offsetWeeks){
  var d = new Date();
  d.setHours(0,0,0,0);
  var dow = (d.getDay() + 6) % 7;            // 月曜=0
  d.setDate(d.getDate() - dow + (offsetWeeks||0) * 7);
  return d.getTime();
}
/** 今週と先週の Thanks 件数 */
function thanksCounts(){
  var thisStart = weekStartMs(0), lastStart = weekStartMs(-1);
  var now = 0, prev = 0;
  state.feed.forEach(function(p){
    if(p.type !== "Thanks") return;
    if(p.createdAtMs >= thisStart) now++;
    else if(p.createdAtMs >= lastStart) prev++;
  });
  return { now: now, prev: prev };
}

      esc(t.l) + (t.count ? '<span class="count">'+t.count+'</span>' : '') +
    '</button>';

  return '<div class="pc-topbar">' +
    '<div class="pc-brand">第二CC Hub</div>' +
    '<nav class="pc-tabs">'+tabs+'</nav>' +
    '<div class="pc-me">' +
      '<button class="avatar-btn" data-act="avatar-open" data-id="'+esc(me.id)+'" aria-label="アイコンを変更">'+avatar(me.id, 32)+'</button>' +
      '<span class="pc-me-name">'+esc(me.displayName)+'</span>' +
      (isAdmin() ? '<span class="pc-me-role">管理者</span>' : '') +
      renderThemeToggle() +
      '<button class="pc-signout" data-act="signout">サインアウト</button>' +

/** タブ定義と未読件数。上部タブと下部タブで共有する。 */
// アンケートを画面に出すか。
//
// 【消さずに隠している】
// 実装も Firestore の surveys コレクションも残したまま、タブだけ出さない。
// 過去の回答が消えないし、使いたくなったら true に戻すだけで済む。
// コードごと消すと、回答データだけが宙に浮いて誰も読めなくなる。
var SHOW_SURVEY = false;

function navTabs(){
  var tabs = [
    { id:"feed",     icon:"📡", l:"フィード" },
    { id:"board",    icon:"📋", l:"掲示板",     count: unreadBoards().length }
  ];
  if(SHOW_SURVEY) tabs.push({ id:"survey", icon:"📊", l:"アンケート", count: pendingSurveys().length });
  tabs.push({ id:"shift",    icon:"🕐", l:"シフト" });
  tabs.push({ id:"progress", icon:"🎯", l:"目標進捗" });
  // チーム実績は canSeeTeamKpi を持つ人にだけ出す。
  // 出したうえで中身を空にすると「権限が無い」ことが伝わらず、
  // かつタブの存在自体が「見られない何かがある」という情報になる。
  if(canSeeTeamKpi()) tabs.push({ id:"teamkpi", icon:"👥", l:"チーム" });
  return tabs;
}

/**
 * 全画面共通の情報バー。本日のシフトを1行に畳んで常に見える位置に置く。
 * どのタブを見ていても「今日は誰がいるか」が分かる状態にするため。
 */
function renderInfobar(){
  var g = todayShiftGroups();
  var left;
  if(!g){
    left = '<span class="infobar-mute">本日のシフトは未同期です</span>';
  }else{
    var d = new Date();
    var wd = ["日","月","火","水","木","金","土"][d.getDay()];
    var total = 0;
    g.order.forEach(function(k){ total += g.byKind[k].length; });
    var kinds = g.order.map(function(k){
      return '<span class="infobar-kind"><i class="dot '+shiftCellClass(k)+'"></i>'+
        esc(k)+' '+g.byKind[k].length+'</span>';
    }).join("");
    left = '<span class="infobar-date">本日 '+(d.getMonth()+1)+'/'+d.getDate()+'（'+wd+'）</span>' +
      '<span class="infobar-total">'+total+'名 シフト予定</span>' + kinds;
  }
  var ub = unreadBoards().length;
  // 隠しているあいだは未読数にも出さない（開く先が無いため）。
  var ps = SHOW_SURVEY ? pendingSurveys().length : 0;
  var right = (ub || ps)
    ? '<span class="infobar-unread">未読 ' +
        (ub ? '掲示板'+ub+'件' : '') + (ub && ps ? ' / ' : '') + (ps ? 'アンケート'+ps+'件' : '') +
      '</span>'
    : '<span class="infobar-mute">未読なし</span>';
  return '<div class="infobar"><div class="infobar-left">'+left+'</div>'+right+'</div>';
}

/** 右サイドバー。フィードと掲示板だけに出す。 */
function renderSidebar(){
  // 掲示板は月ごとの入口だけ。サンクスも未読も、掲示板を読んでいる最中には
  // 関係がない（読みに来た人の邪魔をしないほうが読まれる）。
  if(state.tab === "board"){
    var bNav = renderMonthNav("boardArchiveOpen", state.board);
    return bNav ? '<aside class="pc-side">'+bNav+'</aside>' : "";
  }
  if(state.tab !== "feed") return "";
  var t = thanksCounts();
  var ub = unreadBoards().slice(0, 5);
  var ps = pendingSurveys().slice(0, 5);

  // 0件のとき「壊れている」と読まれないように、数えている範囲を必ず添える。
  // 週は月曜はじまりなので、水曜に見れば対象はまだ3日ぶんしかない。
  // 「今週まだ無い」と「数え損ねている」は、数字だけでは見分けが付かない。
  var wkFrom = new Date(weekStartMs(0));
  var thanksCard = '<div class="card side-card">' +
    '<div class="side-title">今週のサンクス</div>' +
    '<div class="side-num"><b>'+t.now+'</b>件' +
      '<span class="side-sub">（先週 '+t.prev+'件）</span></div>' +
    '<div class="side-note">' +
      (wkFrom.getMonth()+1)+'/'+wkFrom.getDate()+'（月）〜 いまのところ' +
      (t.now ? '' : '<br>種別を「Thanks」にした投稿だけを数えます') +
    '</div>' +
  '</div>';

  var boardCard = ub.length ? '<div class="card side-card">' +
    '<div class="side-title">未読の掲示板</div>' +
    '<ul class="side-list">' + ub.map(function(p){
      return '<li><button class="side-link" data-act="tab" data-id="board">'+esc(p.title)+'</button></li>';
    }).join("") + '</ul>' +
  '</div>' : "";

  // タブを隠しているあいだは、サイドの導線も出さない。
  // 押しても feed に戻されるだけで、押した人には壊れて見える。
  var surveyCard = (SHOW_SURVEY && ps.length) ? '<div class="card side-card side-card-pending">' +
    '<div class="side-title">未回答のアンケート '+ps.length+'件</div>' +
    '<ul class="side-list">' + ps.map(function(s){
      return '<li><button class="side-link" data-act="tab" data-id="survey">'+esc(s.title)+
        (s.deadline ? '<span class="side-due">期限 '+esc(s.deadline)+'</span>' : '') +
      '</button></li>';
    }).join("") + '</ul>' +
  '</div>' : "";

  // 月ごとの入口。フィード最下部の折りたたみと同じ中身を指しているだけで、
  // 投稿の置き場を増やしてはいない（同じ投稿が2か所にあると、どちらが本物か
  // 分からなくなる）。押すと折りたたみが開き、その月の見出しまで飛ぶ。
  var monthCard = renderMonthNav("feedArchiveOpen", state.feed);

  return '<aside class="pc-side">'+thanksCard+monthCard+boardCard+surveyCard+'</aside>';
}

/**
 * 所属チーム順にグルーピングしたメンバーの <option> 群。
 * 既存の「投稿者を選ぶプルダウン」は認証の導入で廃止したが、
 * チーム順グルーピングはフィードの宛先選択で流用する。
 */
function memberOptionsGrouped(excludeSelf, selectedId){
  var meId = currentUserId();
  var used = {};
  var html = "";
  function opt(m){
    return '<option value="'+esc(m.id)+'"'+(m.id===selectedId?" selected":"")+'>'+esc(m.displayName)+'</option>';
  }
  session.teams.forEach(function(t){
    var ms = session.members.filter(function(m){
      return m.team === t.id && !(excludeSelf && m.id === meId);
    });
    if(!ms.length) return;
    html += '<optgroup label="'+esc(t.label)+'">';
    ms.forEach(function(m){ used[m.id] = true; html += opt(m); });
    html += '</optgroup>';
  });
  var rest = session.members.filter(function(m){
    return !used[m.id] && !(excludeSelf && m.id === meId);
  });
  if(rest.length){
    html += '<optgroup label="その他">';
    rest.forEach(function(m){ html += opt(m); });
    html += '</optgroup>';
  }
  return html;
}

function renderFeed(){
  var sorted = state.feed.slice().sort(function(a,b){
    if(state.feedSort==="react") return reactCount(b)-reactCount(a);
    if(state.feedSort==="comment") return (b.commentCount||0)-(a.commentCount||0);
    return b.createdAtMs-a.createdAtMs;
  });
  var sortDefs = [["new","✨ 新着"],["react","🔥 スタンプ"],["comment","💬 コメント"]];
  var sortHtml = sortDefs.map(function(sd){
    return '<button class="chip'+(state.feedSort===sd[0]?" chip-active":"")+'" data-act="feed-sort" data-id="'+sd[0]+'">'+sd[1]+'</button>';
  }).join("");
  var formHtml = renderComposer();
  // 先月以前の投稿は畳む。並べ替えは畳む前に済ませてあるので、
  // アーカイブの中も選んだ順（新着／スタンプ／コメント）のまま並ぶ。
  var split = splitArchive(sorted);
  var body = split.live.length
    ? split.live.map(renderFeedPost).join("")
    : (split.count
        ? emptyState("📡","今月の投稿はまだありません","過去の投稿は下にまとまっています")
        : emptyStateIn("lonely","まだ何もないですね","まだ投稿がありません","最初の投稿をしてみましょう"));
  return '<div class="tab-pad">' +
    renderLegacyCard() +
    renderMvvPanel() +
    '<div class="sortbar">'+sortHtml+'</div>' +
    formHtml +
    body +
    renderArchive(split, "feedArchiveOpen", renderFeedPost) +
    renderTrash("feed") +
  '</div>';
}

/** reactions は {memberId: [emoji]} なので、絵文字ごとの人数はここで数える */
function reactionsByEmoji(post){
  var byEmoji = {};
  var r = post.reactions || {};
  for(var memberId in r){
    (r[memberId] || []).forEach(function(e){
      (byEmoji[e] = byEmoji[e] || []).push(memberId);
    });
  }
  return byEmoji;
}

          badge(post.type, CT[post.type]||"blue") +
