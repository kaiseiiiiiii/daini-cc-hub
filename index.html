function deadlineDate(sv){ return ymdToDate(sv.deadline); }

/** 締切までの残り日数。0 は本日締切、null は期限なし */
function surveyDaysLeft(sv){ return ymdDaysLeft(sv.deadline); }

/** 期限を "8/16（土）" の形に */
function deadlineLabel(sv){ return ymdLabel(sv.deadline); }

/** 期限と選択方式のバッジ。締切が近いものは色を変える */
function surveyBadges(sv){
  var out = "";
  if(sv.closed){
    out += '<span class="sbadge sbadge-done">締切済み'+(sv.deadline?' · '+esc(deadlineLabel(sv)):'')+'</span>';
  }else{
    var d = surveyDaysLeft(sv);
    if(d === null){
      out += '<span class="sbadge">期限なし</span>';
    }else if(d < 0){
      out += '<span class="sbadge sbadge-done">期限切れ · '+esc(deadlineLabel(sv))+'</span>';
    }else{
      // 残り2日以内は色を変える。締切当日に初めて気づく事態を避けるため。
      out += '<span class="sbadge'+(d<=2?" sbadge-soon":"")+'">⏳ ' +
        (d===0 ? "本日まで" : "残り"+d+"日") + ' · '+esc(deadlineLabel(sv))+'</span>';
    }
  }
  out += '<span class="sbadge sbadge-mode">'+(sv.multi?"複数選択":"単一選択")+'</span>';
  return '<div class="sbadges">'+out+'</div>';
}

/** 自分がまだ答えていない、回答可能なアンケート */
function surveyNeedsMe(sv){
  var me = currentUserId();
  if(sv.closed) return false;
  var d = surveyDaysLeft(sv);
  if(d !== null && d < 0) return false;
  if(state.surveyRevote === sv.id) return true;   // 選び直し中は回答フォームを出す
  return !(sv.votes && sv.votes[me]);
}

/** 選択肢を選ぶ。送信するまでは手元に置くだけ */
function pickVote(surveyId, optId){
  var sv = state.surveys.filter(function(s){ return s.id===surveyId; })[0];
  if(!sv) return;
  var me = currentUserId();
  var cur = state.surveyDraft[surveyId] || (sv.votes && sv.votes[me]) || [];
  var next;
  if(cur.indexOf(optId) >= 0){
    next = cur.filter(function(x){ return x!==optId; });
  }else{
    next = sv.multi ? cur.concat([optId]) : [optId];
  }
  state.surveyDraft[surveyId] = next;
  render();
}

/** 選んだ内容をまとめて書き込む */
function submitVote(surveyId){
  var me = currentUserId();
  var draft = state.surveyDraft[surveyId];
  if(!draft || !draft.length) return;
  var patch = {};
  patch["votes." + me] = draft;
  delete state.surveyDraft[surveyId];
  state.surveyRevote = null;
  write("回答", function(){ return updateDoc(doc(db, "surveys", surveyId), patch); }, true);
}

function renderSurvey(){
  var formHtml = state.surveyShowForm ? renderSurveyForm() : "";
  var trigger = '<button class="dashed-trigger" data-act="'+
    (state.surveyShowForm?"survey-cancel":"survey-open-form")+'">'+
    (state.surveyShowForm?"× 閉じる":"+ アンケートを作成する")+'</button>';

  if(!state.surveys.length){
    return '<div class="tab-pad">'+trigger+formHtml+
      emptyState("📊","まだアンケートがありません")+renderTrash("surveys")+'</div>';
  }

  // 回答待ちのものを分けて、答える場所と結果を見る場所を混ぜない。
  // 広い画面では回答待ちを右に寄せ、左は結果一覧に専念させる。
  var todo = state.surveys.filter(surveyNeedsMe);
  var rest = state.surveys.filter(function(s){ return !surveyNeedsMe(s); });

  if(isWide()){
    return '<div class="survey-cols">' +
      '<div class="survey-main">' + trigger + formHtml +
        (rest.length ? rest.map(renderSurveyCard).join("")
                     : '<div class="prog-note">回答済みのアンケートはまだありません。</div>') +
        renderTrash("surveys") +
      '</div>' +
      '<div class="survey-todo">' +
        (todo.length ? todo.map(renderSurveyVoteCard).join("")
                     : '<div class="card side-card"><div class="side-title">回答待ちはありません</div></div>') +
      '</div>' +
    '</div>';
  }

  return '<div class="tab-pad">' + trigger + formHtml +
    todo.map(renderSurveyVoteCard).join("") +
    rest.map(renderSurveyCard).join("") +
    renderTrash("surveys") +
  '</div>';
}

/**
 * 回答フォーム。選択肢は行ごとのボタンにして、押しやすくする。
 * 選んだ内容は送信するまでローカルに置く。複数選択で1つ選ぶたびに
 * 書き込むと、途中の状態が他の人の画面に出てしまうため。
 */
function renderSurveyVoteCard(sv){
  if(state.editing && state.editing.kind==="survey" && state.editing.id===sv.id && canEdit(sv)){
    return renderSurveyEditForm(sv);
  }
  var me = currentUserId();
  var draft = state.surveyDraft[sv.id] || (sv.votes && sv.votes[me]) || [];

  var rows = (sv.options || []).map(function(opt){
    var on = draft.indexOf(opt.id) >= 0;
    return '<button class="option'+(on?" option--selected":"")+'" ' +
      'data-act="vote-pick" data-id="'+sv.id+'" data-opt="'+esc(opt.id)+'" ' +
      'role="'+(sv.multi?"checkbox":"radio")+'" aria-checked="'+(on?"true":"false")+'">' +
      '<span class="option-box'+(sv.multi?"":" option-box-round")+'">'+(on?"✓":"")+'</span>' +
      '<span>'+esc(opt.label)+'</span>' +
    '</button>';
  }).join("");

  return '<div class="card vote-card">' +
    surveyBadges(sv) +
    '<div class="survey-title">'+esc(sv.title)+editedMark(sv)+'</div>' +
    '<div class="vote-opts">'+rows+'</div>' +
    '<button class="btn-post btn-vote" data-act="vote-submit" data-id="'+sv.id+'"'+
      (draft.length?"":" disabled")+'>回答する</button>' +
  '</div>';
}

function renderSurveyForm(){
  return '<div class="card form-card">' +
    '<div class="form-col">' +
      '<input id="surveyFormTitle" class="input" placeholder="質問内容">' +
      '<div id="surveyOptsContainer" class="form-col-tight">' +
        '<input class="input survey-opt" placeholder="選択肢 1">' +
        '<input class="input survey-opt" placeholder="選択肢 2">' +
      '</div>' +
      '<button class="btn-dash" data-act="survey-add-opt">+ 選択肢を追加</button>' +
      '<div class="form-row form-row-center">' +
        '<label class="checkbox-label nowrap"><input type="checkbox" id="surveyFormMulti"> 複数選択可</label>' +
        '<input type="date" id="surveyFormDeadline" class="input" style="flex:1">' +
      '</div>' +
      errorSlot("surveyFormError") +
      '<button class="btn-primary" data-act="survey-submit">作成する</button>' +
    '</div>' +
  '</div>';
}

/**
 * votes は {memberId: [optionId]} なので、選択肢ごとの票数はここで数える。
 * 「誰がどれに入れたか」は画面には一切出さない（設計上の約束）。
 */
function voteCounts(sv){
  var counts = {}, total = 0;
  var v = sv.votes || {};
  (sv.options || []).forEach(function(o){ counts[o.id] = 0; });
  for(var memberId in v){
    (v[memberId] || []).forEach(function(optId){
      if(counts[optId] === undefined) counts[optId] = 0;
      counts[optId]++; total++;
    });
  }
  return { counts: counts, total: total };
}

function renderSurveyEditForm(sv){
  var optRows = (sv.options||[]).map(function(o, i){
    return '<input class="input edit-opt" value="'+esc(o.label)+'" aria-label="選択肢 '+(i+1)+'">';
  }).join("");
  return '<div class="card form-card edit-card">' +
    '<div class="edit-head">アンケートを編集</div>' +
    '<div class="form-col">' +
      '<input id="editTitle" class="input" value="'+esc(sv.title)+'">' +
      '<div class="form-col-tight">'+optRows+'</div>' +
      '<div class="edit-note">選択肢の文言だけ直せます。追加・削除はできません（すでに入っている票の行き場が無くなるため）。</div>' +
      '<div class="form-row form-row-center">' +
        '<label class="checkbox-label nowrap"><input type="checkbox" id="editMulti"'+(sv.multi?" checked":"")+'> 複数選択可</label>' +
        '<input type="date" id="editDeadline" class="input" style="flex:1" value="'+esc(sv.deadline||"")+'">' +
      '</div>' +
      '<label class="checkbox-label"><input type="checkbox" id="editClosed"'+(sv.closed?" checked":"")+'> 締め切る（投票を止める）</label>' +
      errorSlot("editFormError") +
      '<div class="form-row">' +
        '<button class="btn-primary" data-act="edit-save" data-kind="survey" data-id="'+sv.id+'">保存する</button>' +
        '<button class="btn-ghost" data-act="edit-cancel">キャンセル</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function renderSurveyCard(sv){
  if(state.editing && state.editing.kind==="survey" && state.editing.id===sv.id && canEdit(sv)){
    return renderSurveyEditForm(sv);
  }
  var me = currentUserId();
  var c = voteCounts(sv);
  var myV = (sv.votes && sv.votes[me]) || [];

  // 結果表示。バーの色は1位＝水色、2位＝江戸紫、以降＝灰。
  // 順位を煽らないよう、数字は票数と割合だけにしている。
  var ranked = (sv.options || []).slice().sort(function(a,b){
    return (c.counts[b.id]||0) - (c.counts[a.id]||0);
  });
  var rankOf = {};
  ranked.forEach(function(o,i){ rankOf[o.id] = i; });

  var optsHtml = (sv.options || []).map(function(opt){
    var cnt = c.counts[opt.id] || 0;
    var pct = c.total>0 ? Math.round(cnt/c.total*100) : 0;
    var voted = myV.indexOf(opt.id)>=0;
    var fill = rankOf[opt.id]===0 ? "" : (rankOf[opt.id]===1 ? " bar__fill--alt" : " bar__fill--mute");
    return '<div class="survey-opt-row">' +
      '<div class="survey-opt-line">' +
        '<span class="survey-opt-label'+(voted?" voted":"")+'">'+(voted?"✓ ":"")+esc(opt.label)+'</span>' +
        '<span class="survey-opt-count">'+cnt+'票・'+pct+'%</span>' +
      '</div>' +
      '<div class="bar"><div class="bar__fill'+fill+'" style="width:'+pct+'%"></div></div>' +
    '</div>';
  }).join("");

  // 回答状況。誰が何に入れたかは出さず、「回答したかどうか」だけを見る。
  var done    = session.members.filter(function(m){ return !!(sv.votes && sv.votes[m.id]); });
  var pending = session.members.filter(function(m){ return !(sv.votes && sv.votes[m.id]); });
  var isOpen  = state.surveyOpenStatus === sv.id;

  return '<div class="card">' +
    '<div class="survey-head">' + avatar(sv.authorId,28) +
      '<div class="survey-head-info">' +
        surveyBadges(sv) +
        '<div class="survey-title">'+esc(sv.title)+editedMark(sv)+'</div>' +
        '<div class="survey-meta">'+esc(getM(sv.authorId).displayName)+'</div>' +
      '</div>' +
      renderTools("survey", sv) +
    '</div>' +
    optsHtml +
    '<div class="survey-foot">' +
      '<span class="survey-total-text">合計 '+c.total+'票</span>' +
      (!sv.closed && myV.length
        ? '<button class="revote-btn" data-act="vote-revote" data-id="'+sv.id+'">回答を変更</button>' : '') +
      '<button class="reader-toggle'+(isOpen?" reader-toggle-open":"")+'" data-act="survey-status" data-id="'+sv.id+'" aria-expanded="'+(isOpen?"true":"false")+'">' +
        '回答 '+done.length+'名' +
        (pending.length ? '<span class="reader-toggle-unread">未回答 '+pending.length+'</span>' : '') +
        '<span class="reader-caret">'+(isOpen?"▲":"▼")+'</span>' +
      '</button>' +
    '</div>' +
    (isOpen ? renderPeoplePanel({
      pendingLabel:"未回答", pending:pending,
      doneLabel:"回答済み", done:done,
      allDoneText:"全員が回答済みです"
    }) : "") +
    (isOpen ? '<div class="survey-privacy">※ 誰がどの選択肢を選んだかは表示しません</div>' : "") +
  '</div>';
}

// ══════════════════════════════════════════════════════════════════
//  RENDER: SHIFT
//  データは Firestore の shifts/{YYYY_M}（Phase 5 で GAS が書き込む）。
// ══════════════════════════════════════════════════════════════════
// 「休み」と「未提出」の区別について。
//
// 原本のセルは、休みでも未提出でも同じ空欄なので、セル単体では区別できない。
// ただし「その人の行がシフト表に無い」ことは区別できる（GAS が氏名で照合して
// 一致した行だけ rows に入れるため）。そこで、
//
//   行が無い          → 未提出（表に載っていない）
//   行はあるが空欄    → 休み
//
// とした。行の中の空欄をさらに分けたい場合は、原本側に「休」などの明示的な
// 記号を入れてもらう必要がある。それ以外に判別材料は無い。
function shiftCellClass(val){
  if(val==="早番") return "shift-early";
  if(val==="遅番") return "shift-late";
  if(val==="21時") return "shift-night";   // 出現頻度が高いのでデザイン上も独立した色を持つ
  if(val) return "shift-other";
  return "shift-off";
}
function shiftCellLabel(val, wide){
  if(val==="早番") return wide ? "早番" : "早";
  if(val==="遅番") return wide ? "遅番" : "遅";
  if(val) return val;
  return "–";
}

/** 表示中の月のシフト表に、その人の行があるか */
function hasShiftRow(sh, memberId){
  return !!(sh && sh.rows && sh.rows[memberId]);
}

/** 絞り込み後のメンバー。チームセレクタと連動する。 */
function shiftFilteredMembers(){
  if(state.shiftTeam === "all") return shiftMembers();
  return shiftMembers().filter(function(m){ return m.team === state.shiftTeam; });
}

/**
 * 週表示で出す日付の範囲を決める。
 *
 * 週の始まりは月曜。手配粗利額シートの Weekly 集計が月曜起点なので、
 * そちらに合わせておかないと「今週の実績」と見比べたときにズレる。
 */
function shiftWeekRange(sh){
  var dates = sh.dates || [];
  var wds = sh.weekdays || [];
  if(!dates.length) return { start:0, end:0 };

  var start = state.shiftWeekStart;
  if(start === null || start === undefined){
    // 本日を含む週。本日が別の月なら、その月の最初の週。
    var t = dates.indexOf(todayDateLabel());
    start = t >= 0 ? t : 0;
    while(start > 0 && String(wds[start]).trim() !== "月") start--;
  }
  start = Math.max(0, Math.min(start, dates.length - 1));

  // 月曜から次の月曜の手前まで。月初・月末は7日に満たないこともある。
  var end = start + 1;
  while(end < dates.length && String(wds[end]).trim() !== "月" && end - start < 7) end++;
  return { start:start, end:end };
}

/** その週の1つ前・1つ後の月曜の index（無ければ null） */
function shiftWeekStep(sh, dir){
  var dates = sh.dates || [], wds = sh.weekdays || [];
  var r = shiftWeekRange(sh);
  if(dir > 0){
    return r.end < dates.length ? r.end : null;
  }
  if(r.start === 0) return null;
  var i = r.start - 1;
  while(i > 0 && String(wds[i]).trim() !== "月") i--;
  return i;
}

/**
 * 本日のシフトを区分ごとにまとめる。
 * 「早番が誰か」を名前で知りたいのが第一の用途なので、区分→氏名の配列にする。
 * どの月を見ていても本日を出すため、当月の購読だけを見る。
 */
function todayShiftGroups(){
  var sh = state.shiftCurrent;
  if(!sh || !sh.dates || !sh.rows) return null;
  var idx = sh.dates.indexOf(todayDateLabel());
  if(idx < 0) return null;

  var order = [], byKind = {}, restCount = 0, unsubmitted = 0;
  shiftMembers().forEach(function(m){
    if(!hasShiftRow(sh, m.id)){ unsubmitted++; return; }
    var v = String(sh.rows[m.id][idx] || "").trim();
    if(!v){ restCount++; return; }
    if(!byKind[v]){ byKind[v] = []; order.push(v); }
    byKind[v].push(m.displayName);
  });

  // 早番・遅番を先に、残りは人数の多い順。運用上その2つを最初に見るため。
  order.sort(function(a,b){
    var rank = function(k){ return k==="早番" ? 0 : k==="遅番" ? 1 : 2; };
    if(rank(a) !== rank(b)) return rank(a) - rank(b);
    return byKind[b].length - byKind[a].length;
  });
  return { order:order, byKind:byKind, rest:restCount, unsubmitted:unsubmitted };
}

// ══════════════════════════════════════════════════════════════════
//  アイコンの設定
//
//  選ばれた画像はそのまま送らず、必ずブラウザ側で正方形に切って
//  128px まで縮めてから保存する。スマホで撮った写真は数MBあり、
//  そのまま置くと Firestore の1ドキュメント上限に触れるうえ、
//  全員の読み込みが遅くなるため。
// ══════════════════════════════════════════════════════════════════
var AVATAR_PX = 128;

function readAsImage(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error("ファイルを読めませんでした")); };
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){ resolve(img); };
      img.onerror = function(){ reject(new Error("画像として開けませんでした")); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/** 中央を正方形に切り、128px に縮めて data URL にする */
function squareDataUrl(img){
  var side = Math.min(img.naturalWidth, img.naturalHeight);
  var sx = (img.naturalWidth - side) / 2;
  var sy = (img.naturalHeight - side) / 2;
  var canvas = document.createElement("canvas");
  canvas.width = canvas.height = AVATAR_PX;
  var ctx = canvas.getContext("2d");
  ctx.drawImage(img, sx, sy, side, side, 0, 0, AVATAR_PX, AVATAR_PX);
  // webp が使えない環境では jpeg に落ちる
  var url = canvas.toDataURL("image/webp", 0.85);
  if(url.indexOf("data:image/webp") !== 0) url = canvas.toDataURL("image/jpeg", 0.85);
  return url;
}

async function pickAvatarFile(file, targetId){
  if(!file) return;
  if(!/^image\//.test(file.type)){
    state.notice = "画像ファイルを選んでください"; render(); return;
  }
  try{
    var img = await readAsImage(file);
    var url = squareDataUrl(img);
    if(url.length > 110000){
      state.notice = "画像を小さくできませんでした。別の画像でお試しください";
      render(); return;
    }
    state.avatarDraft = url;
    render();
  }catch(e){
    state.notice = e.message || "画像を読み込めませんでした";
    render();
  }
}

/** 指定した日のシフトを種別ごとにまとめる */
function shiftGroupsAt(sh, idx){
  if(!sh || !sh.rows || idx == null || idx < 0) return null;
  var order = [], byKind = {}, rest = [], unsubmitted = [];
  shiftFilteredMembers().forEach(function(m){
    if(!hasShiftRow(sh, m.id)){ unsubmitted.push(m); return; }
    var v = String(sh.rows[m.id][idx] || "").trim();
    if(!v){ rest.push(m); return; }
    if(!byKind[v]){ byKind[v] = []; order.push(v); }
    byKind[v].push(m);
  });
  // 早番・遅番・21時を先に。運用上その3つを最初に見るため。
  order.sort(function(a,b){
    var rank = function(k){ return k==="早番"?0 : k==="遅番"?1 : k==="21時"?2 : 3; };
    if(rank(a)!==rank(b)) return rank(a)-rank(b);
    return byKind[b].length - byKind[a].length;
  });
  return { order:order, byKind:byKind, rest:rest, unsubmitted:unsubmitted };
}

  return bar +

/** 週/月の切り替えとチーム絞り込み */
function renderShiftControls(){
  // 狭い画面では表の形が違うので、切り替えの選択肢も変える。
  var views = isNarrow() ? [["day","日"],["week","週"]] : [["week","週"],["month","月"]];
  var cur = isNarrow() ? state.shiftMobileView : state.shiftView;
  var act = isNarrow() ? "shift-mview" : "shift-view";
  var chips = views.map(function(v){
    return '<button class="chip'+(cur===v[0]?" chip-active":"")+'" '+
      'data-act="'+act+'" data-id="'+v[0]+'">'+v[1]+'</button>';
  }).join("");

  var teamChips = '<button class="chip'+(state.shiftTeam==="all"?" chip-active":"")+'" '+
    'data-act="shift-team" data-id="all">全体</button>' +
    session.teams.map(function(t){
      return '<button class="chip'+(state.shiftTeam===t.id?" chip-active":"")+'" '+
        'data-act="shift-team" data-id="'+esc(t.id)+'">'+esc(t.label)+'</button>';
    }).join("");

  return '<div class="shift-controls">'+chips+
    '<span class="shift-controls-spacer"></span>'+teamChips+'</div>';
}

function renderShift(){
  var sh = displayedShift();
  var off = state.shiftMonthOffset;

  if(!sh || !sh.dates || !sh.dates.length){
    var body;
    if(state.shiftOtherLoading){
      body = emptyState("🕐","読み込み中…","");
    }else if(off === 1){
      // 翌月分がまだ作られていないのは正常な状態。エラーとして見せない。
      body = emptyState("🗓","翌月のシフトは未作成です",
        "原本に翌月のシートが追加されると、次の同期で表示されます");
    }else if(off === -1){
      body = emptyState("🗓","前月のシフトが見つかりません",
        "原本に前月のシートが無いか、まだ同期されていません");
    }else{
      body = emptyState("🕐","この月のシフトはまだ同期されていません",
        "スプレッドシート同期が動くと表示されます");
    }
    return '<div class="tab-pad">' +
      renderSyncBar() + renderShiftMonthBar() + renderTodayShiftCard() + body +
    '</div>';
  }

  var todayIdx = sh.dates.indexOf(todayDateLabel());

  // 狭い画面は表ではなく、日付を縦軸にした別構造にする
  if(isNarrow()){
    return '<div class="tab-pad">' +
      renderSyncBar() +
      renderShiftMonthBar() +
      renderTodayShiftCard() +
      renderShiftControls() +
      (state.shiftMobileView === "week"
        ? renderShiftWeekMobile(sh, todayIdx)
        : renderShiftDayView(sh, todayIdx)) +
      renderShiftLegend() +
    '</div>';
  }

  var wide = state.shiftView === "week";

  // 表示する日付の範囲。月表示は全日、週表示は月曜起点の1週間。
  var from = 0, to = sh.dates.length, weekBar = "";
  if(wide){
    var r = shiftWeekRange(sh);
    from = r.start; to = r.end;
    var prev = shiftWeekStep(sh, -1), next = shiftWeekStep(sh, 1);
    weekBar = '<div class="shift-bar">' +
      '<button class="shift-nav-btn" data-act="shift-week" data-id="'+(prev===null?"":prev)+'"'+
        (prev===null?' disabled':'')+' aria-label="前の週">◀</button>' +
      '<div class="shift-bar-label">'+esc(sh.dates[from])+' 〜 '+esc(sh.dates[to-1])+'</div>' +
      '<button class="shift-nav-btn" data-act="shift-week" data-id="'+(next===null?"":next)+'"'+
        (next===null?' disabled':'')+' aria-label="次の週">▶</button>' +
    '</div>';
  }

  var idxs = [];
  for(var i = from; i < to; i++) idxs.push(i);

  var dateHeaderCells = idxs.map(function(i){
    return '<div class="shift-cell shift-date-head'+(i===todayIdx?" shift-today":"")+'">' +
      esc(String(sh.dates[i]).split("/")[1])+'<br>'+esc((sh.weekdays||[])[i]||"") +
    '</div>';
  }).join("");

  var members = shiftFilteredMembers();

  function shiftRowsFor(ms){
    return ms.map(function(m){
      var hasRow = hasShiftRow(sh, m.id);
      var data = hasRow ? sh.rows[m.id] : [];
      var cells = idxs.map(function(i){
        if(!hasRow){
          return '<div class="shift-cell shift-none'+(i===todayIdx?" shift-today":"")+'">未</div>';
        }
        var val = String(data[i] || "").trim();
        return '<div class="shift-cell '+shiftCellClass(val)+(i===todayIdx?" shift-today":"")+'">' +
          esc(shiftCellLabel(val, wide)) + '</div>';
      }).join("");
      return '<div class="shift-row">' +
        '<div class="shift-name-cell'+(hasRow?"":" shift-name-none")+'">' +
          avatar(m.id,24)+'<span>'+esc(m.displayName)+'</span>' +
        '</div>' +
        '<div class="shift-days">'+cells+'</div>' +
      '</div>';
    }).join("");
  }

  var placed = {};
  var teamsHtml = session.teams.map(function(team){
    var ms = members.filter(function(m){ return m.team===team.id; });
    ms.forEach(function(m){ placed[m.id] = true; });
    if(!ms.length) return "";
    return '<div class="team-block-title">'+esc(team.label)+'</div>' + shiftRowsFor(ms);
  }).join("");

  // チーム未設定のメンバーが表から抜け落ちないようにする。
  // 「載っていない人がいる」ことに気づけないのが一番まずいため。
  var orphans = members.filter(function(m){ return !placed[m.id]; });
  if(orphans.length){
    teamsHtml += '<div class="team-block-title">その他</div>' + shiftRowsFor(orphans);
  }

  // 日別の人数。絞り込み中はその範囲の人数になるので、見えている行と一致する。
  //
  // 人数が少ない日への警告色は入れていない。土日や、遅番を置かない曜日など
  // 「元々薄いのが正常」な日が実データに存在し、機械的に色を付けると
  // ノイズになって誰も見なくなるため。数字だけ出して判断は人に委ねる。
  var countCells = idxs.map(function(i){
    var e = 0, l = 0;
    members.forEach(function(m){
      if(!hasShiftRow(sh, m.id)) return;
      var v = String(sh.rows[m.id][i] || "").trim();
      if(v === "早番") e++;
      else if(v === "遅番") l++;
    });
    return '<div class="shift-cell shift-count-cell'+(i===todayIdx?" shift-today":"")+'">' +
      '<span class="shift-count-early">'+e+'</span>' +
      '<span class="shift-count-late">'+l+'</span>' +
    '</div>';
  }).join("");

  return '<div class="tab-pad">' +
    renderSyncBar() +
    renderShiftMonthBar() +
    renderTodayShiftCard() +
    renderShiftControls() +
    weekBar +
    '<div class="shift-scroll'+(wide?" shift-week":"")+'">' +
      '<div class="shift-row shift-header-row">' +
        '<div class="shift-name-cell shift-name-head">メンバー</div>' +
        '<div class="shift-days">'+dateHeaderCells+'</div>' +
      '</div>' +
      teamsHtml +
      '<div class="shift-row shift-count-row">' +
        '<div class="shift-name-cell">早番 / 遅番</div>' +
        '<div class="shift-days">'+countCells+'</div>' +
      '</div>' +
    '</div>' +
    renderShiftLegend() +
  '</div>';
}

// ══════════════════════════════════════════════════════════════════
//  RENDER: 目標進捗（旧・実績タブ）
//
//  「第二CC の目標達成まであとどれくらいか」を出すタブ。
//  シフトから残り稼働時間を積み上げ、必要ペースを円/時間で示す。
//
//  数値の定義（2026-08-11 に合意）
//    指標      手配粗利額（円）。月次の目標と実績が揃う唯一の指標。
//              生産性データ側（通話率・手配数）には月次目標が無いため使えない
//    月間目標  Σ dailyTarget
//    実績      Σ dailyActual（値が入っている日まで）
//    確定境界  dailyActual が入っている最後の日。それ以降は「残り」として扱う
//    実働時間  早番・遅番・21時 = 8時間 / AM・PM = 4時間
//              時間帯表記は差分から休憩1時間を引く
//              業務外・社外・記念 = 0時間、空欄（休み）= 0時間
//    対象日    dailyTarget > 0 の日（目標0の日は残り営業日に数えない）
//
//  【重要】原本の Monthly 結果（J列）は使っていない。
//  あれは28日間のローリング集計で、月末になると月初の実績が窓から外れる。
//  実測では 8/31 の値が 8/1〜8/3 を含んでおらず、月間実績として使うと
//  過小表示になる。実績は Daily 結果（D列）を自分で合計している。
// ══════════════════════════════════════════════════════════════════

// 1人1日あたりの実働時間。ここが必要ペースの分母になるので、
// 変更すると画面の数字が直接動く。運用が変わったらここを直す。
var SHIFT_HOURS = {
  "早番": 8, "遅番": 8, "21時": 8,
  "AM": 4, "PM": 4,
  "業務外": 0, "社外": 0, "記念": 0
};
var SHIFT_BREAK_HOURS = 1;   // 時間帯表記（10-18 など）から引く休憩

/** "9" "9.5" "0845" "1600" を時（小数）に直す */
function parseClock(s){
  if(/^\d{3,4}$/.test(s)){
    return parseInt(s.slice(0, s.length-2), 10) + parseInt(s.slice(-2), 10)/60;
  }
  var n = parseFloat(s);
  return isNaN(n) ? null : n;
}

/**
 * シフトの値から実働時間を出す。
 *
 * 対応表に無い値は 0 ではなく null を返す。原本には裸の数字（3 4 5 11 12）が
 * 混ざっているが、これは入力ミスで直さない方針が確認済みなので、稼働時間には
 * 数えず、画面にも出さない（出し続けても直らない警告はノイズになるため）。
 *
 * 0 と null を分けているのは、集計側で「休み（0時間）」と「区分不明（除外）」を
 * 別物として扱えるようにしておくため。結果として分母はその分だけ小さくなり、
 * 必要ペースはわずかに大きく出る。件数が増えて無視できなくなったときに
 * 気づけるよう、集計側では件数だけ数え続けている。
 */
function shiftHours(val){
  var v = String(val==null?"":val).trim();
  if(!v) return 0;                                   // 空欄＝休み
  if(SHIFT_HOURS[v] !== undefined) return SHIFT_HOURS[v];
  var m = v.match(/^([0-9.]+)\s*[-–〜~]\s*([0-9.]+)$/);
  if(m){
    var a = parseClock(m[1]), b = parseClock(m[2]);
    if(a !== null && b !== null && b > a){
      return Math.max(0, Math.round((b - a - SHIFT_BREAK_HOURS) * 100) / 100);
    }
  }
  return null;                                       // 不明
}

function yen(n){ return Math.round(n).toLocaleString("ja-JP") + "円"; }
function hoursText(h){ return (Math.round(h * 10) / 10).toLocaleString("ja-JP") + "時間"; }

/** 目標進捗の計算。画面はこの戻り値だけを見る。 */
function computeProgress(){
  var team = state.goals && state.goals.teams && state.goals.teams.all;
  var days = team && team.days;
  if(!days || !days.length) return null;

  var sh = state.shiftCurrent;
  // シフトと目標が同じ月を指しているか。ずれていたら稼働時間は出さない
  // （前月の出勤日数で今月の必要ペースを割るのが一番まずい間違いになる）。
  var monthMatches = !!(sh && sh.dates && state.goals.monthId === currentMonthId());

  var shiftIdx = {};
  if(sh && sh.dates) sh.dates.forEach(function(d, i){ shiftIdx[d] = i; });

  // 区分不明だった値 → 出現回数。画面には出さない方針だが、
  // 件数が膨らんだときに調べられるよう戻り値には残してある。
  var unknown = {};

  function hoursOn(dateLabel){
    if(!monthMatches) return null;
    var i = shiftIdx[dateLabel];
    if(i === undefined) return null;
    var total = 0;
    shiftMembers().forEach(function(m){
      if(!hasShiftRow(sh, m.id)) return;
      var v = String(sh.rows[m.id][i] || "").trim();
      var h = shiftHours(v);
      if(h === null){ unknown[v] = (unknown[v] || 0) + 1; return; }
      total += h;
    });
    return total;
  }

  var monthTarget = 0, actual = 0, lastActualIdx = -1;
  days.forEach(function(d, i){
    monthTarget += (d.dailyTarget || 0);
    if(d.dailyActual !== null && d.dailyActual !== undefined){
      actual += d.dailyActual;
      lastActualIdx = i;
    }
  });

  var doneHours = 0, doneDays = 0, leftHours = 0, leftDays = 0, hoursUnavailable = false;
  days.forEach(function(d, i){
    var h = hoursOn(d.date);
    if(h === null && monthMatches) hoursUnavailable = true;
    if(i <= lastActualIdx){
      doneDays++;
      if(h !== null) doneHours += h;
    }else if((d.dailyTarget || 0) > 0){
      leftDays++;
      if(h !== null) leftHours += h;
    }
  });

  var remaining  = monthTarget - actual;
  var totalHours = doneHours + leftHours;
  var nowPerHour = doneHours > 0 ? actual / doneHours : null;

  // 月初は消化が薄く、そこから伸ばすと非現実的な着地になる。
  // 総稼働の1割を消化するまでは見込みを出さない。
  var enough   = totalHours > 0 && doneHours >= totalHours * 0.1;
  var forecast = (enough && nowPerHour !== null) ? nowPerHour * totalHours : null;

  // 想定ライン＝確定している最終日までの目標の積み上げ。
  // 「いま何%か」だけだと月初なら低くて当然で、遅れているのか判断できない。
  // 同じ日までの目標と並べて初めて、進み具合の意味が出る。
  var planned = 0;
  days.forEach(function(d, i){
    if(lastActualIdx >= 0 && i <= lastActualIdx) planned += (d.dailyTarget || 0);
  });

  // 週ごとの実績。月曜起点で、日付ラベルから週を切り出す。
  var weeks = [], cur = null;
  days.forEach(function(d, i){
    var wd = d.weekday;
    if(cur === null || wd === "月"){
      cur = { label: d.date, actual: 0, target: 0, hasActual: false };
      weeks.push(cur);
    }
    cur.target += (d.dailyTarget || 0);
    if(d.dailyActual !== null && d.dailyActual !== undefined){
      cur.actual += d.dailyActual;
      cur.hasActual = true;
    }
  });

  return {
    monthTarget: monthTarget,
    actual: actual,
    planned: planned,
    plannedPct: monthTarget > 0 ? (planned / monthTarget * 100) : 0,
    weeks: weeks,
    remaining: remaining,
    pct: monthTarget > 0 ? (actual / monthTarget * 100) : 0,
    lastActualDate: lastActualIdx >= 0 ? days[lastActualIdx].date : null,
    doneHours: doneHours, doneDays: doneDays,
    leftHours: leftHours, leftDays: leftDays,
    needPerHour: leftHours > 0 ? remaining / leftHours : null,
    nowPerHour: nowPerHour,
    forecast: forecast,
    gap: forecast !== null ? forecast - monthTarget : null,
    monthMatches: monthMatches,
    hoursUnavailable: hoursUnavailable,
    unknown: unknown
  };
}

/**
 * 見出しの一文。
 * 未達でも煽らず、必要な数字だけを出す（責める文言は入れない）。
 */
function progressHeadline(p){
  if(p.remaining <= 0){
    return { lead:"月間目標を達成しています", main:"超過 " + yen(-p.remaining),
             sub:"残りは上積みになります" };
  }
  if(!p.monthMatches || p.leftHours <= 0){
    var why = !p.monthMatches
      ? "シフトが同じ月の分でないため、残り稼働時間を計算できません"
      : "残りのシフトに稼働予定がありません";
    return { lead:"目標まで", main:yen(p.remaining), sub:why };
  }
  return {
    lead: "あと " + hoursText(p.leftHours) + " で",
    main: "1時間あたり " + yen(p.needPerHour) + " のペースが必要",
    sub:  "残り " + yen(p.remaining) + " ／ 残り " + p.leftDays + "日"
  };
}

function renderProgress(){
  var p = computeProgress();
  if(!p){
    return '<div class="tab-pad">' +
      renderSyncBar() +
      emptyState("🎯","目標データがまだ同期されていません",
        "スプレッドシート同期が動くと表示されます") +
      renderKpiSection() +
    '</div>';
  }

  var h = progressHeadline(p);
  var pct = Math.max(0, Math.min(100, p.pct));

  // 実績がどこまで確定しているかを必ず出す。
  // 日中に見ている数字が当日を含まないことが分からないと、
  // 未達に見えて誤った判断につながる。
  var confirmNote = p.lastActualDate
    ? '<div class="prog-note">📌 実績は <b>'+esc(p.lastActualDate)+'</b> 分まで確定しています。'+
      'それ以降（本日分を含む）は集計中のため、この数字には入っていません。</div>'
    : '<div class="prog-note">📌 今月はまだ実績が入っていません。</div>';

  function cell(label, value, sub, color){
    return '<div class="card prog-cell">' +
      '<div class="prog-cell-label">'+esc(label)+'</div>' +
      '<div class="prog-cell-value"'+(color?' style="color:var(--'+color+')"':'')+'>'+esc(value)+'</div>' +
      (sub ? '<div class="prog-cell-sub">'+esc(sub)+'</div>' : '') +
    '</div>';
  }

  var cells = "";
  cells += cell("現ペース",
    p.nowPerHour !== null ? yen(p.nowPerHour)+" / 時" : "—",
    p.doneHours > 0 ? "消化 "+hoursText(p.doneHours)+"（"+p.doneDays+"日）"
      : (!p.monthMatches ? "シフトの月が一致しません" : "確定分がありません"));

  if(p.forecast !== null){
    cells += cell("着地見込み", yen(p.forecast), "現ペースが続いた場合");
    // 不足側を赤で出さない（デザイン指定）。
    // 足りていないことは符号と「不足の見込み」の文字で足りる。
    cells += cell("目標との差",
      (p.gap >= 0 ? "+" : "−") + yen(Math.abs(p.gap)),
      p.gap >= 0 ? "超過の見込み" : "不足の見込み",
      p.gap >= 0 ? "green" : "");
  }else{
    cells += cell("着地見込み", "算出前",
      "消化稼働が総稼働の1割に届くまでは出しません");
  }

  cells += cell("残り稼働時間",
    p.monthMatches ? hoursText(p.leftHours) : "—",
    p.monthMatches ? "残り "+p.leftDays+"日" : "シフトの月が一致しません");

  var main = '' +
    '<div class="card prog-head">' +
      '<div class="prog-head-lead">'+esc(h.lead)+'</div>' +
      '<div class="prog-head-main">'+esc(h.main)+'</div>' +
      '<div class="prog-head-sub">'+esc(h.sub)+'</div>' +
    '</div>' +
    '<div class="card prog-bar-card">' +
      '<div class="prog-bar-top">' +
        '<span class="prog-bar-name">手配粗利額</span>' +
        '<span class="prog-bar-pct">'+(Math.round(p.pct*10)/10)+'%</span>' +
      '</div>' +
      // 想定ラインのマーカー。確定日までの目標の位置を重ねる。
      '<div class="prog-bar-bg prog-bar-marked">' +
        '<div class="prog-bar" style="width:'+pct+'%"></div>' +
        (p.lastActualDate && p.plannedPct > 0 && p.plannedPct < 100
          ? '<span class="prog-marker" style="left:'+Math.min(100, p.plannedPct)+'%" ' +
            'title="'+esc(p.lastActualDate)+' 時点の想定ライン"></span>' : '') +
      '</div>' +
      (p.lastActualDate && p.plannedPct > 0
        ? '<div class="prog-plan">想定ライン '+(Math.round(p.plannedPct*10)/10)+'%'+
          '（'+esc(p.lastActualDate)+' 時点）・実績との差 '+
          (p.pct - p.plannedPct >= 0 ? "+" : "−")+
          (Math.round(Math.abs(p.pct - p.plannedPct)*10)/10)+'pt</div>' : '') +
      '<div class="prog-bar-labels">' +
        '<span>実績 '+esc(yen(p.actual))+'</span>' +
        '<span>目標 '+esc(yen(p.monthTarget))+'</span>' +
      '</div>' +
    '</div>' +
    '<div class="prog-grid">'+cells+'</div>' +
    // 月間目標を達成したときだけ。未達のときに励ます演出は入れない（デザイン指定）。
    // 数字の隣ではなく、数字を読み終えた先に置く。
    (p.monthTarget > 0 && p.actual >= p.monthTarget
      ? '<div class="in-strip in-strip-happy">' + inChar("happy", "達成です！", 88) + '</div>'
      : "") +
    renderKpiSection();

  if(isWide()){
    return '<div class="prog-cols">' +
      '<div class="prog-main">' + renderSyncBar() + confirmNote + main + '</div>' +
      '<div class="prog-side">' + renderWeeklyChart(p) + '</div>' +
    '</div>';
  }
  return '<div class="tab-pad">' + renderSyncBar() + confirmNote + main +
    renderWeeklyChart(p) + '</div>';
}

/**
 * 週ごとの積み上げ。棒の高さは実績、細い線がその週の目標。
 * 月の合計だけだと「どこで落ちたか」が分からないので、週単位で並べる。
 * 実績が入っていない週は薄いままにして、0件と未確定を混同させない。
 */
function renderWeeklyChart(p){
  var weeks = p.weeks || [];
  if(!weeks.length) return "";
  var max = 0;
  weeks.forEach(function(w){ max = Math.max(max, w.actual, w.target); });
  if(max <= 0) return "";

  var bars = weeks.map(function(w, i){
    var ah = Math.round(w.actual / max * 100);
    var th = Math.round(w.target / max * 100);
    return '<div class="wk">' +
      '<div class="wk-col">' +
        (w.target > 0 ? '<span class="wk-target" style="bottom:'+th+'%"></span>' : '') +
        '<div class="wk-bar'+(w.hasActual?"":" wk-bar-none")+'" style="height:'+ah+'%"></div>' +
      '</div>' +
      '<div class="wk-label">'+esc(w.label)+'〜</div>' +
      '<div class="wk-val">'+(w.hasActual ? esc(yenShort(w.actual)) : "—")+'</div>' +
    '</div>';
  }).join("");

  return '<div class="card wk-card">' +
    '<div class="side-title">週ごとの積み上げ</div>' +
    '<div class="wk-grid">'+bars+'</div>' +
    '<div class="wk-legend">棒＝実績　／　横線＝その週の目標</div>' +
  '</div>';
}

/** グラフの脇に置く短い金額表記 */
function yenShort(n){
  if(n === null || n === undefined) return "—";
  if(Math.abs(n) >= 10000) return Math.round(n/10000*10)/10 + "万";
  return String(Math.round(n));
}

// ══════════════════════════════════════════════════════════════════
//  生産性KPI（目標進捗タブの下部。折りたたみ）
//  データは Firestore の metrics/latest（Phase 5 で GAS が書き込む）。
//  個人別ランキングは作らない方針なので、一覧と本人選択だけ。
// ══════════════════════════════════════════════════════════════════
function kSt(key,val){
  var t = KPI_DEF[key];
  if(t.g==="high") return val>=t.t ? "success" : (val>=t.t*0.9 ? "warn" : "bad");
  if(t.g==="low") return val<=t.t ? "success" : (val<=t.t*1.1 ? "warn" : "bad");
  return Math.abs(val-t.t)<=0.5 ? "success" : (Math.abs(val-t.t)<=1 ? "warn" : "bad");
}
function renderKpiSection(){
  var byMember = (state.metrics && state.metrics.byMember) || null;
  var open = state.progressKpiOpen;

  var head = '<button class="prog-toggle" data-act="kpi-section-toggle">' +
    '<span>'+(open ? "▼" : "▶")+' 生産性KPI</span>' +
    '<span class="prog-toggle-sub">通話率・待機率など</span>' +
  '</button>';

  if(!open) return '<div class="prog-section">'+head+'</div>';

  if(!byMember){
    return '<div class="prog-section">'+head+
      '<div class="prog-note">生産性データはまだ同期されていません。</div></div>';
  }

  // 集計対象は「同期データに実績が入っているメンバー」。
  // role は権限区分（member/admin）であって職位ではないため、
  // 集計対象の判定には使わない。
  var agents = session.members.filter(function(m){ return !!byMember[m.id]; });
  var avg = {};
  Object.keys(KPI_DEF).forEach(function(k){
    var vals = []; agents.forEach(function(m){ if(byMember[m.id] && byMember[m.id][k]!=null) vals.push(byMember[m.id][k]); });
    // 値が1件も無い指標は 0 ではなく null。
    // 0 を入れると「0%・未達」として表示され、
    // データが無いことと成績が悪いことの区別が付かなくなる。
    avg[k] = vals.length ? Math.round(vals.reduce(function(a,b){return a+b;},0)/vals.length*10)/10 : null;
  });

  var disp = state.kpiSel ? byMember[state.kpiSel] : avg;
  var filterHtml = '<button class="chip'+(!state.kpiSel?" chip-active":"")+'" data-act="kpi-clear">全体</button>' +
    agents.map(function(m){ return '<button class="chip'+(state.kpiSel===m.id?" chip-active":"")+'" data-act="kpi-toggle" data-id="'+m.id+'">'+esc(m.displayName)+'</button>'; }).join("");

  // 日中は実績が入っている人が数名しかいない。全体＝その数名の平均に
  // なることを書いておかないと、センター全体の数字だと誤読される。
  var scopeNote = '<div class="prog-note">実績が入っているのは '+agents.length+
    '名分です。「全体」はその平均で、確定値ではありません。</div>';

  if(state.kpiSel && !byMember[state.kpiSel]){
    return '<div class="prog-section">'+head+
      '<div class="kpi-filter">'+filterHtml+'</div>' +
      '<div class="prog-note">'+esc(getM(state.kpiSel).displayName)+
        'さんは本日の生産性データがまだありません。</div>' +
    '</div>';
  }

  var gridHtml = Object.keys(KPI_DEF).map(function(key){
    var cfg = KPI_DEF[key]; var val = disp ? disp[key] : null;
    if(val==null) return "";
    // 目標進捗に赤は使わない（デザイン指定）。未達は煽らず、
    // 数字と目標を並べて出すだけにする。達成だけ緑で拾う。
    var st = kSt(key,val);
    var colorVar = st==="success" ? "color-grow-ink"
                 : st==="warn"    ? "color-dusk-ink"
                                  : "color-text-sub";
    var pct = cfg.g==="low" ? Math.min(100, Math.round(cfg.t/val*100)) : Math.min(100, Math.round(val/cfg.t*100));
    return '<div class="card kpi-card">' +
      '<div class="kpi-label">'+cfg.l+'</div>' +
      '<div class="kpi-value-row"><span class="kpi-value" style="color:var(--'+colorVar+')">'+val+'</span><span class="kpi-unit">'+cfg.u+'</span><span class="kpi-target">目標'+cfg.t+'</span></div>' +
      '<div class="kpi-bar-bg"><div class="kpi-bar" style="width:'+pct+'%;background:var(--'+colorVar+')"></div></div>' +
    '</div>';
  }).join("");

  return '<div class="prog-section">'+head+
    scopeNote +
    '<div class="kpi-filter">'+filterHtml+'</div>' +
    '<div class="kpi-grid">'+gridHtml+'</div>' +
  '</div>';
}

// ══════════════════════════════════════════════════════════════════
//  MAIN RENDER
// ══════════════════════════════════════════════════════════════════
function render(){
  var app = document.getElementById("app");

  // ログインしていない／許可されていない間は、アプリの中身を一切描画しない。
  if(session.status === "config")    { app.innerHTML = renderConfigNotice(); return; }
  if(session.status === "loading")   { app.innerHTML = renderSplash("読み込み中..."); return; }
  if(session.status === "signedOut") { app.innerHTML = renderLogin(); return; }
  if(session.status === "denied")    { app.innerHTML = renderDenied(); return; }
  if(session.status === "error")     { app.innerHTML = renderErrorScreen(); return; }

  var body =
    state.tab==="feed"   ? renderFeed() :
    state.tab==="board"  ? renderBoard() :
    state.tab==="survey" ? renderSurvey() :
    state.tab==="shift"  ? renderShift() :
    renderProgress();
  var noticeHtml = state.notice
    ? '<div class="notice notice-error">'+esc(state.notice)+
      '<button class="notice-close" data-act="notice-close" aria-label="閉じる">×</button></div>'
    : '';

  // 広い画面は上部タブ＋2カラム、狭い画面は今までどおり下部タブの1カラム。
  // 中身（各タブの描画）は共通で、外側の骨組みだけを差し替えている。
  document.body.classList.toggle("wide", isWide());
  if(isWide()){
    app.innerHTML =
      renderTopbar() +
      renderInfobar() +
      noticeHtml +
      '<div class="content" id="content">' +
        '<div class="pc-cols">' +
          '<div class="pc-main">'+body+'</div>' +
          renderSidebar() +
        '</div>' +
      '</div>' +
      renderConfirmDialog() + renderAvatarDialog();
    return;
  }

  app.innerHTML = renderHeader() + noticeHtml +
    '<div class="content" id="content">'+body+'</div>' + renderNav() +
    renderConfirmDialog() + renderAvatarDialog();
}

// ══════════════════════════════════════════════════════════════════
//  ACTIONS
// ══════════════════════════════════════════════════════════════════
/**
 * 楽観的更新は自前で持たない。
 * Firestore SDK のレイテンシ補償が、書き込んだ瞬間にローカルキャッシュを
 * 更新して onSnapshot を発火させ、サーバー確定後にもう一度発火して整合を取る。
 * 失敗すれば自動でロールバックされ、ここの catch に来る。
 * 二重管理を避けるため、画面の状態は常に onSnapshot 由来のものだけを使う。
 */
async function write(label, fn, exclusive){
  // exclusive はフォーム送信用の二重送信よけ。
  // リアクションや投票は連打されうるので、ここでは弾かない
  // （弾くと押したのに反映されない、という分かりにくい挙動になる）。
  if(exclusive && state.busy) return;
  if(exclusive) state.busy = true;
  state.notice = "";
  try{
    await fn();
  }catch(e){
    var code = (e && e.code) ? e.code : String(e);
    state.notice = label + "に失敗しました（" + code + "）" +
      (code === "permission-denied" ? " — 権限がないか、ログインが切れています" : "");
  }finally{
    state.busy = false;
    render();
  }
}

/** 投稿・コメントに共通で載せるフィールド（Phase 4 の編集・削除で使う） */
/**
 * 送信をやめる理由をフォームの中に出す。返り値は「続けてよいか」。
 *
 *   if(!refuse("boardFormError", !title, "タイトルを入れてください")) return;
 *
 * 以前は入力が足りないと黙って return していた。押しても何も起きず、
 * 何が足りないのかも分からないので、壊れているのと区別が付かなかった。
 *
 * ここで render() を呼ばないのは、フォームの入力欄が state ではなく
 * DOM に値を持っているため。描き直すと、理由を出すために
 * 入力途中の本文を消してしまう。差し込み先だけを直接書き換える。
 *
 * 差し込み先のIDをフォームごとに分けているのは、投稿フォームと編集フォームが
 * 同時に開いていることがあり、共通のIDだと違うフォームに理由が出るため。
 */
function refuse(slotId, bad, message){
  if(!bad) return true;
  var slot = document.getElementById(slotId);
  if(slot){
    slot.textContent = message;
    slot.hidden = false;
    slot.scrollIntoView({ block:"nearest" });
  }else{
    // 差し込み先が無いフォームからの呼び出し。消えるものが無いので描き直してよい。
    state.notice = message;
    render();
  }
  return false;
}

/** refuse() が書き込む空の差し込み先 */
function errorSlot(slotId){
  return '<div class="form-error" id="'+slotId+'" role="alert" hidden></div>';
}

function baseFields(){
  return {
    authorId: currentUserId(),
    createdAt: serverTimestamp(),
    updatedAt: serverTimestamp(),
    edited: false,
    deleted: false,
    deletedBy: null,
    deletedAt: null
  };
}

function submitFeedPost(){
  var text = document.getElementById("feedFormText").value.trim();
  if(!refuse("feedFormError", !text, "内容を入れてください")) return;
  var type = document.getElementById("feedFormType").value;
  var to = document.getElementById("feedFormTo").value;
  var val = document.getElementById("feedFormVal").value;
  var payload = baseFields();
  payload.toMemberId = to || null;
  payload.type = type;
  payload.valueTag = val || null;
  payload.text = text;
  payload.reactions = {};
  payload.commentCount = 0;
  write("投稿", function(){ return addDoc(collection(db, "feedPosts"), payload); }, true);
}

function toggleReaction(id, emoji){
  var me = currentUserId();
  var post = state.feed.filter(function(p){ return p.id===id; })[0];
  if(!post) return;
  var mine = (post.reactions && post.reactions[me]) || [];
  var next = mine.indexOf(emoji)>=0
    ? mine.filter(function(x){ return x!==emoji; })
    : mine.concat([emoji]);
  // 自分のキーだけを指定して更新する。ルール側も
  // 「reactions の変更キーが自分だけ」であることを検証している。
  var patch = {};
  patch["reactions." + me] = next.length ? next : deleteField();
  write("リアクション", function(){ return updateDoc(doc(db, "feedPosts", id), patch); });
}

function submitComment(postId, text){
  var payload = baseFields();
  payload.text = text;
  write("コメント", async function(){
    await addDoc(collection(db, "feedPosts", postId, "comments"), payload);
    // 一覧に「💬 N」を出すための非正規化値。ルールで ±1 しか許していない。
    await updateDoc(doc(db, "feedPosts", postId), { commentCount: increment(1) });
  });
}

function submitBoardPost(){
  var title = document.getElementById("boardFormTitle").value.trim();
  var body = document.getElementById("boardFormBody").value.trim();
  // 本文は任意。「8月アップデート・8/21」のように、タイトルと期日だけで
  // 用が済むタスクがある（もとのスプレッドシートも項目と期日だけだった）。
  if(!refuse("boardFormError", !title, "タイトルを入れてください")) return;
  var payload = baseFields();
  payload.title = title;
  payload.body = body;
  payload.category = document.getElementById("boardFormCat").value;
  payload.pinned = document.getElementById("boardFormPinned").checked;
  // 書いた本人は既読扱いにしておく。そうしないと自分の投稿で
  // 自分が未読者リストに並び、声かけ対象が水増しされる。
  payload.readBy = {};
  payload.readBy[currentUserId()] = serverTimestamp();
  // 期日が入っていればチェックリストになる。入っていなければ
  // dueDate は null で、これまでどおりの連絡事項として扱われる。
  var task = readTaskFields("boardForm");
  payload.dueDate = task.dueDate;
  payload.checkTargets = task.checkTargets;
  // 既読とは違い、作成者も未完了から始める。作った本人が
  // やらなくていいとは限らない（自分にも課すのが普通の運用）。
  payload.doneBy = {};
  state.boardShowForm = false;
  write("投稿", function(){ return addDoc(collection(db, "boardPosts"), payload); }, true);
}

/**
 * 自分の完了チェックを付け外しする。
 * 「完了にする」を押した時点で読んだことは確実なので、既読も一緒に付ける
 * （ボタンを押すとカード全体の board-read は発火しないため）。
 */
function toggleTaskDone(id){
  var me = currentUserId();
  var post = state.board.filter(function(p){ return p.id===id; })[0];
  if(!post || !isTask(post) || !isTaskTarget(post, me)) return;
  var patch = {};
  patch["doneBy." + me] = taskDone(post, me) ? deleteField() : serverTimestamp();
  write("完了の記録", function(){ return updateDoc(doc(db, "boardPosts", id), patch); });
  markBoardRead(id);
}

function markBoardRead(id){
  var me = currentUserId();
  var post = state.board.filter(function(p){ return p.id===id; })[0];
  if(!post || (post.readBy && post.readBy[me])) return;
  var patch = {};
  patch["readBy." + me] = serverTimestamp();
  write("既読の記録", function(){ return updateDoc(doc(db, "boardPosts", id), patch); });
}

function submitSurvey(){
  var title = document.getElementById("surveyFormTitle").value.trim();
  var labels = Array.prototype.map.call(document.querySelectorAll(".survey-opt"), function(i){ return i.value.trim(); }).filter(Boolean);
  if(!refuse("surveyFormError", !title, "質問内容を入れてください")) return;
  if(!refuse("surveyFormError", labels.length < 2, "選択肢を2つ以上入れてください")) return;
  // 選択肢は id と label に分ける。label を直しても投票が失われないようにするため。
  var options = labels.map(function(label, i){ return { id: "o" + (i+1), label: label }; });
  var payload = baseFields();
  payload.title = title;
  payload.options = options;
  payload.multi = document.getElementById("surveyFormMulti").checked;
  payload.deadline = document.getElementById("surveyFormDeadline").value || null;
  payload.closed = false;
  payload.votes = {};
  state.surveyShowForm = false;
  write("アンケートの作成", function(){ return addDoc(collection(db, "surveys"), payload); }, true);
}

// ══════════════════════════════════════════════════════════════════
//  編集
//
//  更新日時（updatedAt）はデータとしては持つが画面には出さない。
//  出るのは「編集済み」の印だけ。改ざん感を避けつつ、
//  投稿の時系列は投稿日時のままにしておくため。
//
//  編集履歴は今回保存しない。必要になったら
//  feedPosts/{id}/revisions のようなサブコレクションを足せばよく、
//  既存ドキュメントの構造を変える必要はない。
// ══════════════════════════════════════════════════════════════════
function startEdit(kind, id, postId){
  state.editing = { kind:kind, id:id, postId:postId || null };
  state.notice = "";
  render();
}
function cancelEdit(){ state.editing = null; render(); }

function saveFeedEdit(id){
  var text = document.getElementById("editText").value.trim();
  if(!refuse("editFormError", !text, "内容を入れてください")) return;
  var patch = {
    text: text,
    type: document.getElementById("editType").value,
    toMemberId: document.getElementById("editTo").value || null,
    valueTag: document.getElementById("editVal").value || null,
    edited: true,
    updatedAt: serverTimestamp()
  };
  state.editing = null;
  write("編集", function(){ return updateDoc(doc(db, "feedPosts", id), patch); }, true);
}

function saveBoardEdit(id){
  var title = document.getElementById("editTitle").value.trim();
  var body  = document.getElementById("editBody").value.trim();
  if(!refuse("editFormError", !title, "タイトルを入れてください")) return;
  var task = readTaskFields("editBoard");
  var patch = {
    title: title,
    body: body,
    category: document.getElementById("editCat").value,
    pinned: document.getElementById("editPinned").checked,
    // 期日を消すとチェックリストではなくなるが、doneBy は残す。
    // 誰が終わらせたかの記録を、期日の消し忘れの直しで失わせない。
    dueDate: task.dueDate,
    checkTargets: task.checkTargets,
    edited: true,
    updatedAt: serverTimestamp()
  };
  state.editing = null;
  write("編集", function(){ return updateDoc(doc(db, "boardPosts", id), patch); }, true);
}

function saveSurveyEdit(id){
  var sv = state.surveys.filter(function(s){ return s.id===id; })[0];
  if(!sv) return;
  var title = document.getElementById("editTitle").value.trim();
  if(!refuse("editFormError", !title, "質問内容を入れてください")) return;
  // 選択肢は id を保ったままラベルだけ差し替える。
  // 追加・削除を許すと、既に入っている票の行き場が無くなるため。
  var labels = Array.prototype.map.call(document.querySelectorAll(".edit-opt"), function(i){ return i.value.trim(); });
  var options = sv.options.map(function(o, i){
    return { id: o.id, label: labels[i] || o.label };
  });
  var patch = {
    title: title,
    options: options,
    multi: document.getElementById("editMulti").checked,
    deadline: document.getElementById("editDeadline").value || null,
    closed: document.getElementById("editClosed").checked,
    edited: true,
    updatedAt: serverTimestamp()
  };
  state.editing = null;
  write("編集", function(){ return updateDoc(doc(db, "surveys", id), patch); }, true);
}

function saveCommentEdit(postId, commentId){
  var text = document.getElementById("editCommentText").value.trim();
  if(!text) return;
  var patch = { text: text, edited: true, updatedAt: serverTimestamp() };
  state.editing = null;
  write("編集", function(){
    return updateDoc(doc(db, "feedPosts", postId, "comments", commentId), patch);
  }, true);
}

// ══════════════════════════════════════════════════════════════════
//  削除（論理削除）
//
//  データは消さない。deleted を立て、誰がいつ消したかを必ず同時に記録する。
//  ルール側でも deletedBy が自分であること・deletedAt がサーバー時刻で
//  あることを強制しているので、記録を省いた削除はできない。
//
//  紐づくコメント・リアクション・既読には手を触れない（下の報告参照）。
// ══════════════════════════════════════════════════════════════════
function softDeletePatch(){
  return { deleted:true, deletedBy: currentUserId(), deletedAt: serverTimestamp() };
}

function askDelete(kind, id, postId){
  var target, title, body;
  if(kind==="feed"){
    target = state.feed.filter(function(p){ return p.id===id; })[0];
    if(!target) return;
    title = "この投稿を削除しますか？";
    body  = (target.commentCount ? "コメント"+target.commentCount+"件も一緒に見えなくなります。" : "") +
            "全員の画面からすぐに消えます。データ自体は残り、誰が削除したかが記録されます。";
  }else if(kind==="board"){
    target = state.board.filter(function(p){ return p.id===id; })[0];
    if(!target) return;
    title = "この共有事項を削除しますか？";
    body  = "既読 "+readCount(target)+"名の記録も一緒に見えなくなります。" +
            "全員の画面からすぐに消えます。データ自体は残ります。";
  }else if(kind==="survey"){
    target = state.surveys.filter(function(s){ return s.id===id; })[0];
    if(!target) return;
    var vc = voteCounts(target);
    title = "このアンケートを削除しますか？";
    body  = "集まった "+vc.total+"票も一緒に見えなくなります。" +
            "全員の画面からすぐに消えます。データ自体は残ります。";
  }else{
    target = state.comments.filter(function(c){ return c.id===id; })[0];
    if(!target) return;
    title = "このコメントを削除しますか？";
    body  = "全員の画面からすぐに消えます。データ自体は残ります。";
  }
  var notMine = target.authorId !== currentUserId();
  if(notMine) body += "\n\nこれは" + getM(target.authorId).displayName + "さんの投稿です。管理者権限で削除します。";

  state.confirm = {
    kind: kind, targetId: id, postId: postId || null,
    title: title, body: body, okLabel: "削除する"
  };
  render();
}

function runConfirmedDelete(){
  var c = state.confirm;
  if(!c) return;
  state.confirm = null;
  var patch = softDeletePatch();
  if(c.kind==="feed"){
    write("削除", function(){ return updateDoc(doc(db, "feedPosts", c.targetId), patch); }, true);
  }else if(c.kind==="board"){
    write("削除", function(){ return updateDoc(doc(db, "boardPosts", c.targetId), patch); }, true);
  }else if(c.kind==="survey"){
    write("削除", function(){ return updateDoc(doc(db, "surveys", c.targetId), patch); }, true);
  }else if(c.kind==="comment"){
    write("削除", async function(){
      await updateDoc(doc(db, "feedPosts", c.postId, "comments", c.targetId), patch);
      await updateDoc(doc(db, "feedPosts", c.postId), { commentCount: increment(-1) });
    }, true);
  }
}

function toggleVote(id, optId){
  var me = currentUserId();
  var sv = state.surveys.filter(function(s){ return s.id===id; })[0];
  if(!sv || sv.closed) return;
  var mine = (sv.votes && sv.votes[me]) || [];
  var next;
  if(mine.indexOf(optId)>=0){
    next = mine.filter(function(x){ return x!==optId; });
  }else{
    next = sv.multi ? mine.concat([optId]) : [optId];
  }
  var patch = {};
  patch["votes." + me] = next.length ? next : deleteField();
  write("投票", function(){ return updateDoc(doc(db, "surveys", id), patch); });
}

// ══════════════════════════════════════════════════════════════════
//  EVENTS
// ══════════════════════════════════════════════════════════════════
// ── リアクション者の表示 ─────────────────────────────────────
// PC はホバー、スマホは長押しで、押した人の名前を出す。
//
// ここだけは render() を呼ばずに DOM を直接書き換える。
// 画面全体を innerHTML で作り直す作りなので、hover で再描画すると
// カーソル下の要素が消えて mouseout → 再描画 → mouseover …
// と無限に往復してしまうため。
var peekTimer = null;
var suppressReactClick = false;

function peekBoxOf(btn){
  var row = btn.closest(".post-actions");
  return row ? row.querySelector(".react-peek") : null;
}
function showPeek(btn){
  hidePeek();                       // 直前の表示を必ず消してから出す
  var people = btn.getAttribute("data-people");
  if(!people) return;               // まだ誰も押していない絵文字なら何も出さない
  var box = peekBoxOf(btn);
  if(!box) return;
  box.textContent = btn.getAttribute("data-emoji") + "  " + people;
  box.hidden = false;
}
function hidePeek(){
  var boxes = document.querySelectorAll(".react-peek");
  Array.prototype.forEach.call(boxes, function(b){ b.hidden = true; });
}

function bindEvents(){
  var app = document.getElementById("app");

  // ---- PC: ホバー ----
  app.addEventListener("mouseover", function(e){
    if(!e.target.closest) return;
    var btn = e.target.closest(".react-btn");
    if(btn) showPeek(btn); else hidePeek();
  });
  app.addEventListener("mouseleave", hidePeek);

  // ---- スマホ: 長押し ----
  app.addEventListener("touchstart", function(e){
    if(!e.target.closest) return;
    // 新しい操作が始まったので、前回の長押しの痕跡を必ず消す。
    // ここでリセットしないと、長押しのあと別の場所を触ったときに
    // 打ち消しフラグが残り、次のリアクションが1回無視される。
    clearTimeout(peekTimer);
    suppressReactClick = false;
    hidePeek();
    var btn = e.target.closest(".react-btn");
    if(!btn) return;
    peekTimer = setTimeout(function(){
      // 長押しと判定。このあと発火する click は打ち消す
      // （名前を見ようとしただけでリアクションが付くのを防ぐ）
      suppressReactClick = true;
      showPeek(btn);
    }, 450);
  }, { passive:true });

  ["touchend","touchmove","touchcancel"].forEach(function(ev){
    app.addEventListener(ev, function(){ clearTimeout(peekTimer); }, { passive:true });
  });

  app.addEventListener("click", function(e){
    var el = e.target.closest("[data-act]");
    if(!el) return;
    var act = el.getAttribute("data-act"), id = el.getAttribute("data-id");

    // 認証系はログイン前でも動く必要がある
    if(act==="signin"){ doSignIn(); return; }
    if(act==="signout"){ doSignOut(); return; }

    // ここから先はログイン済みのときだけ
    if(session.status !== "ready") return;

    if(act==="tab"){
      state.tab = id;
      state.boardShowForm=false; state.surveyShowForm=false;
      // タブを離れたらコメントの購読だけ落とす。
      // 一覧の3本はログイン中つなぎっぱなし（張り直すと全件読み直しになるため）。
      state.feedOpenComment = null;
      detachComments();
      render();
    }
    else if(act==="shift-month"){ setShiftMonth(parseInt(id, 10)); }
    else if(act==="shift-view"){
      state.shiftView = id;
      state.shiftWeekStart = null;   // 月表示から戻ったら本日の週に合わせ直す
      render();
    }
    else if(act==="shift-mview"){
      state.shiftMobileView = id;
      state.shiftWeekStart = null;
      render();
    }
    else if(act==="shift-day"){ state.shiftDayIdx = parseInt(id, 10); render(); }
    else if(act==="shift-team"){ state.shiftTeam = id; render(); }
    else if(act==="shift-week"){
      if(id === "") return;          // 端まで来ている（ボタンは disabled）
      state.shiftWeekStart = parseInt(id, 10);
      render();
    }
    else if(act==="feed-sort"){ state.feedSort = id; render(); }
    else if(act==="feed-submit"){ submitFeedPost(); }
    else if(act==="react"){
      if(suppressReactClick){ suppressReactClick = false; return; }  // 長押し直後
      state.reactionPickerFor = null;
      toggleReaction(id, el.getAttribute("data-emoji"));
    }
    else if(act==="react-picker"){
      state.reactionPickerFor = state.reactionPickerFor===id ? null : id;
      render();
    }
    else if(act==="comment-toggle"){
      // コメントは投稿ごとのサブコレクション。開いている1件だけ購読する。
      state.feedOpenComment = state.feedOpenComment===id ? null : id;
      attachComments(state.feedOpenComment);
      render();
    }
    else if(act==="legacy-download"){ downloadLegacy(); }
    else if(act==="legacy-discard"){ discardLegacy(); }
    else if(act==="notice-close"){ state.notice = ""; render(); }
    else if(act==="modal-body"){ return; }   // ダイアログ本体のクリックは背景に伝えない
    else if(act==="avatar-open"){ state.avatarFor = id; state.avatarDraft = null; render(); }
    else if(act==="avatar-close"){ state.avatarFor = null; state.avatarDraft = null; render(); }
    else if(act==="avatar-save"){ saveAvatar(id); }
    else if(act==="avatar-clear"){ clearAvatar(id); }
    else if(act==="confirm-cancel"){ state.confirm = null; render(); }
    else if(act==="confirm-ok"){ runConfirmedDelete(); }
    else if(act==="trash-toggle"){ state.showTrash = !state.showTrash; render(); }
    else if(act==="onboard-done"){
      try{ localStorage.setItem("cc2:onboarded:" + (currentUserId()||""), "1"); }catch(e){}
      render();
    }
    else if(act==="edit-start"){
      startEdit(el.getAttribute("data-kind"), id, el.getAttribute("data-post"));
    }
    else if(act==="edit-cancel"){ cancelEdit(); }
    else if(act==="edit-save"){
      var k = el.getAttribute("data-kind");
      if(k==="feed")        saveFeedEdit(id);
      else if(k==="board")  saveBoardEdit(id);
      else if(k==="survey") saveSurveyEdit(id);
      else if(k==="comment")saveCommentEdit(el.getAttribute("data-post"), id);
    }
    else if(act==="delete-ask"){
      askDelete(el.getAttribute("data-kind"), id, el.getAttribute("data-post"));
    }
    else if(act==="board-open-form"){ state.boardShowForm = true; render(); }
    else if(act==="board-cancel"){ state.boardShowForm = false; render(); }
    else if(act==="board-submit"){ submitBoardPost(); }
    else if(act==="board-read"){ markBoardRead(id); }
    else if(act==="board-readers"){
      state.boardOpenReaders = state.boardOpenReaders===id ? null : id;
      render();
    }
    else if(act==="task-toggle"){ toggleTaskDone(id); }
    else if(act==="task-status"){
      state.boardOpenTask = state.boardOpenTask===id ? null : id;
      render();
    }
    else if(act==="survey-open-form"){ state.surveyShowForm = true; render(); }
    else if(act==="survey-cancel"){ state.surveyShowForm = false; render(); }
    else if(act==="survey-add-opt"){
      var container = document.getElementById("surveyOptsContainer");
      var n = container.querySelectorAll(".survey-opt").length + 1;
      var inp = document.createElement("input");
      inp.className = "input survey-opt"; inp.placeholder = "選択肢 " + n;
      container.appendChild(inp);
    }
    else if(act==="survey-submit"){ submitSurvey(); }
    else if(act==="survey-status"){
      state.surveyOpenStatus = state.surveyOpenStatus===id ? null : id;
      render();
    }
    else if(act==="vote"){ toggleVote(id, el.getAttribute("data-opt")); }
    else if(act==="vote-pick"){ pickVote(id, el.getAttribute("data-opt")); }
    else if(act==="vote-submit"){ submitVote(id); }
    else if(act==="vote-revote"){
      state.surveyRevote = id;
      state.surveyDraft[id] = ((state.surveys.filter(function(s){ return s.id===id; })[0]||{}).votes||{})[currentUserId()] || [];
      render();
    }
    else if(act==="mvv-toggle"){ state.mvvOpen = !state.mvvOpen; render(); }
    else if(act==="kpi-section-toggle"){ state.progressKpiOpen = !state.progressKpiOpen; render(); }
    else if(act==="kpi-clear"){ state.kpiSel = null; render(); }
    else if(act==="kpi-toggle"){ state.kpiSel = state.kpiSel===id ? null : id; render(); }
  });

  // ファイル選択は click ではなく change で拾う
  app.addEventListener("change", function(e){
    if(session.status !== "ready") return;
    var el = e.target.closest && e.target.closest('[data-act="avatar-file"]');
    if(!el) return;
    pickAvatarFile(el.files && el.files[0], el.getAttribute("data-id"));
  });

  app.addEventListener("keydown", function(e){
    if(session.status !== "ready") return;
    var el = e.target.closest('[data-act="comment-input"]');
    if(!el) return;
    if(e.key==="Enter"){
      var text = el.value.trim();
      if(!text) return;
      el.value = "";   // 送信は非同期。先に空にして二重送信を防ぐ
      submitComment(el.getAttribute("data-id"), text);
    }
  });
}

boot();
</script>
