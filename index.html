// ══════════════════════════════════════════════════════════════════
//  座席表
//
//  座席表は「どこに座るか」を位置そのもので表すので、行と列の並びを
//  崩さずに出す。空セルも詰めない（詰めると席の位置がずれる）。
//
//  背景色は原本の色をそのまま使う。「※遅番グレー」「※青PCなし」という
//  凡例が表の中にあり、色が意味を持っているため、こちらで色を
//  作り直すとその凡例が嘘になる。
//
//  名前はメンバーマスタと突き合わせない。原本の書き方が
//  「太田さん」「洸太朗さん」「前田C」「金兒L」と揺れていて、
//  機械的に対応付けると取り違える。出すのは原本の文字のまま。
//  自分の名前を目立たせるところだけ、後述の緩い判定で拾う。
// ══════════════════════════════════════════════════════════════════

/**
 * 背景色の相対輝度（0〜1）。判定できない書式なら null。
 *
 * 原本には黒に近い塗りのセルがあり、文字色を固定していると
 * 黒地に黒文字で名前が読めなくなる（実際にそうなっていた）。
 *
 * ガンマを戻してから重み付けする。人の目は緑を明るく感じるので、
 * RGB をそのまま平均すると緑や水色の上で判定を誤る。
 */
function seatLuminance(hex){
  var h = String(hex || "").replace("#", "").trim();
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h)) return null;
  function lin(v){
    var c = parseInt(v, 16) / 255;
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  }
  return 0.2126*lin(h.slice(0,2)) + 0.7152*lin(h.slice(2,4)) + 0.0722*lin(h.slice(4,6));
}

/**
 * その塗りの上に置く文字色。白と濃色のうち、読みやすいほうを返す。
 *
 * 「明るさが◯以下なら白」という一本のしきい値だと、境目付近の色
 * （原本で使われている青がまさにそれ）でどちらとも言えない結果になる。
 * 両方のコントラスト比を出して、大きいほうを選ぶ。
 */
var SEAT_DARK_INK = "#202124";
function seatInkOn(hex){
  var L = seatLuminance(hex);
  if(L === null) return "";                  // 判定できない書式は触らない
  var onWhite = 1.05 / (L + 0.05);           // 白文字にしたときの比
  var onDark  = (L + 0.05) / (0.0144 + 0.05); // 濃色文字にしたときの比
  return onWhite > onDark ? "#fff" : SEAT_DARK_INK;
}

/**
 * 原本でその文字が読める状態か。
 *
 * 座席表には「黒地に黒文字」のセルがある。座席のブロックの中に名前が
 * 残っているが、原本を見ている人には読めない——つまり**読ませない**ための
 * 書き方になっている。背景色だけを見て文字色をこちらで決めると、
 * 原本では見えない名前をアプリだけが表に出すことになる。
 *
 * 文字色と背景色にコントラストが無いに等しいときは、隠されているものと
 * みなして出さない。原本を見ている人とアプリを見ている人で、
 * 見えるものを一致させるため。
 *
 * 文字色を持たないセル（同期がこの対応より前のもの、既定の黒）は
 * 黒として扱う。黒地に黒＝隠す、が正しく効く。
 */
function seatTextVisible(cell){
  var bgL = seatLuminance(cell.b || "#ffffff");
  var fgL = seatLuminance(cell.f || "#000000");
  if(bgL === null || fgL === null) return true;   // 判定できない書式は出す
  var hi = Math.max(bgL, fgL), lo = Math.min(bgL, fgL);
  return (hi + 0.05) / (lo + 0.05) >= 1.6;
}

/** 表示中の座席表と、その日のラベル */
function displayedSeat(){
  return state.seatDay === "tomorrow"
    ? { data: state.seatTomorrow, label: "明日", offset: 1 }
    : { data: state.seatToday,    label: "本日", offset: 0 };
}

/**
 * そのセルが自分か。
 *
 * 原本の表記が揺れているので、姓・名・表示名のどれかが含まれていれば
 * 自分とみなす。「坂田 洸太朗」さんが「洸太朗さん」と書かれていても
 * 拾えるようにするため。
 *
 * 1文字の語は使わない。「守」「学」のような名前が、無関係な語に
 * 含まれて誤って光る（例:「守衛室」）のを避ける。
 */
function seatIsMe(text){
  var me = currentUser();
  if(!me || !text) return false;
  var tokens = [me.displayName].concat(String(me.fullName||"").split(/[\s　]+/));
  for(var i=0;i<tokens.length;i++){
    var t = String(tokens[i]||"").trim();
    if(t.length >= 2 && text.indexOf(t) >= 0) return true;
  }
  return false;
}

function renderSeatChart(){
  var view = displayedSeat();
  var other = view.offset === 0 ? state.seatTomorrow : state.seatToday;

  // 当日・翌日を行き来するボタン。相手側のデータが無いときは出さない
  // （押しても空を見せるだけのボタンを置かない）。
  var toggle = other
    ? '<div class="seat-toggle">' +
        ['today','tomorrow'].map(function(k){
          var on = state.seatDay === k;
          return '<button class="chip'+(on?" chip-active":"")+'" data-act="seat-day" data-id="'+k+'">' +
            (k==="today" ? "本日" : "明日") + '</button>';
        }).join("") +
      '</div>'
    : "";

  if(!view.data || !view.data.rows || !view.data.rows.length){
    // 座席表が無い日は普通にある（休業日、まだ作られていない翌日分）。
    // 同期の失敗と読み違えられないよう、理由の側を書く。
    return '<div class="card seat-card">' +
      '<div class="seat-head"><span class="seat-title">🪑 '+view.label+'の座席</span>'+toggle+'</div>' +
      '<div class="seat-empty">' +
        (view.offset === 1
          ? '明日の座席表はまだ取り込まれていません。前日の23時台に取り込みます。'
          : '本日の座席表はまだ取り込まれていません。') +
      '</div>' +
    '</div>';
  }

  var d = view.data;
  var meFound = 0;
  var body = d.rows.map(function(row){
    var cells = (row.cells || []).map(function(c){
      var raw = c.t || "";
      // 原本で読めない文字は、こちらでも出さない（黒地に黒文字など）。
      // 塗りは残す。座席のブロックそのものは配置の情報だから。
      var visible = raw && seatTextVisible(c);
      var mine = raw && seatIsMe(raw);
      if(mine) meFound++;

      // 隠れているのが**自分の名前**のときだけ、位置を示す。
      // 自分の名前は自分が知っているので、これで新しく漏れるものはない。
      // 逆にこれを出さないと、自分の席が黒いブロックに入っている人は
      // 「座席表を開いても自分の席が分からない」ことになる。
      var hiddenMine = mine && !visible;
      var t = visible ? raw : (hiddenMine ? "あなた" : "");

      // 名前の入ったセルと、塗りだけのセルを分けて扱う。
      // 塗りだけのセル（壁・通路・机の区切り）は配置を形づくる背景で、
      // 名前と同じ強さで出すと、肝心の名前が埋もれる。
      var cls = "seat-cell";
      cls += t ? " seat-cell-text" : " seat-cell-blank";
      if(c.b) cls += " seat-cell-fill";
      if(mine) cls += " seat-cell-me";
      if(hiddenMine) cls += " seat-cell-me-hidden";

      var style = "";
      if(c.b){
        style = "background:" + c.b;
        // 塗りに合わせて文字色を決める。固定していると黒地に黒文字になる。
        var ink = seatInkOn(c.b);
        if(ink) style += ";color:" + ink;
      }

      return '<td class="'+cls+'"'+(style?' style="'+esc(style)+'"':'')+'>' +
        (t ? '<span class="seat-name">'+esc(t)+'</span>' : '') +
      '</td>';
    }).join("");
    return '<tr>'+cells+'</tr>';
  }).join("");

  // 朝の再確認で中身が変わっていた日は、その旨を出す。
  // 前夜に見た配置を覚えている人が、古いまま動くのを防ぐため。
  var changed = d.changedAtCheck
    ? '<div class="seat-changed">⚠ 朝の再確認で前夜から変更がありました</div>'
    : "";

  return '<div class="card seat-card">' +
    '<div class="seat-head">' +
      '<span class="seat-title">🪑 '+view.label+'の座席</span>' +
      (d.label ? '<span class="seat-sub">'+esc(d.label)+'</span>' : '') +
      toggle +
    '</div>' +
    changed +
    // 自分の席が見つかったかどうかを言葉でも出す。枠だけだと、
    // 探しても見つからないときに「枠が無い」のか「自分がいない日」なのかが
    // 分からず、表を何度も往復することになる。
    '<div class="seat-hint">' +
      (meFound
        ? '<span class="seat-hint-me">青い枠</span>があなたの席です' +
          (meFound > 1 ? '（'+meFound+'か所に名前があります）' : '')
        : 'この座席表にあなたの名前は見当たりません') +
    '</div>' +
    '<div class="seat-scroll"><table class="seat-table"><tbody>'+body+'</tbody></table></div>' +
  '</div>';
}

/**
 * 1カラムのときだけ畳む。PC の2カラム表示ではそのまま返す。
 *
 * シフトタブは、シフト表にたどり着くまでに座席表（最大 58vh）と
 * 本日のシフトカード（約 309px）で 800px 以上を使っていた。スマホの
 * 表示領域は 650px 前後しかないため、「シフトタブを開いてもシフト表が
 * 一度も画面に入らない」状態だった（報告のあった「下にスクロールできなくて
 * シフト表が見れない」はこれ）。
 *
 * 判定に isNarrow()（640px以下）ではなく isWide()（900px以上）の否定を
 * 使っている。その間の 641〜899px も1カラムのままで、しかもスマホの
 * 横向き（例 844×390）がここに入る。横向きは表示領域の高さが 200px 前後
 * しかなく、畳まないと最も見えない。幅ではなく「1カラムかどうか」で
 * 決めるのが正しい。
 *
 * 見出しは先頭に残すので、座席表をシフトタブの先頭に置く設計は変えていない。
 *
 * 中身が空のときは見出しも出さない。開いても何も無いものを
 * 押させないため。
 */
function foldUnlessWide(open, act, title, sub, bodyHtml){
  if(!bodyHtml) return "";
  if(isWide()) return bodyHtml;
  return '<div class="fold">' +
    '<button class="fold-toggle" data-act="'+act+'">' +
      '<span>'+(open ? "▼" : "▶")+' '+esc(title)+'</span>' +
      '<span class="fold-toggle-sub">'+esc(sub)+'</span>' +
    '</button>' +
    (open ? bodyHtml : "") +
  '</div>';
}

/** 折りたたみ見出しに出す、開かなくても分かる一言 */
function seatFoldSub(){
  var view = displayedSeat();
  return (view.data && view.data.rows && view.data.rows.length) ? "タップで開く" : "未取り込み";
}
function todayShiftFoldSub(){
  var n = todayScheduledCount();
  return n === null ? "未同期" : "本日 " + n + "名";
}

function renderShift(){
  var sh = displayedShift();
  var off = state.shiftMonthOffset;

  if(!sh || !sh.dates || !sh.dates.length){
    var body;
    if(state.shiftOtherLoading){
      body = emptyState("🕐","読み込み中…","");
    }else if(off === 1){
      // 翌月分がまだ作られていないのは正常な状態。エラーとして見せない。
      body = emptyState("🗓","翌月のシフトは未作成です",
        "原本に翌月のシートが追加されると、次の同期で表示されます");
    }else if(off === -1){
      body = emptyState("🗓","前月のシフトが見つかりません",
        "原本に前月のシートが無いか、まだ同期されていません");
    }else{
      body = emptyState("🕐","この月のシフトはまだ同期されていません",
        "スプレッドシート同期が動くと表示されます");
    }
    return '<div class="tab-pad">' +
      renderSyncBar() +
      foldUnlessWide(state.seatOpen, "seat-fold", "🪑 " + displayedSeat().label + "の座席",
        seatFoldSub(), renderSeatChart()) +
      renderShiftMonthBar() +
      foldUnlessWide(state.todayShiftOpen, "todayshift-fold", "🕐 本日のシフト",
        todayShiftFoldSub(), renderTodayShiftCard()) +
      body +
    '</div>';
  }

  var todayIdx = sh.dates.indexOf(todayDateLabel());

  // 狭い画面は表ではなく、日付を縦軸にした別構造にする
  if(isNarrow()){
    return '<div class="tab-pad">' +
      renderSyncBar() +
      foldUnlessWide(state.seatOpen, "seat-fold", "🪑 " + displayedSeat().label + "の座席",
        seatFoldSub(), renderSeatChart()) +
      renderShiftMonthBar() +
      foldUnlessWide(state.todayShiftOpen, "todayshift-fold", "🕐 本日のシフト",
        todayShiftFoldSub(), renderTodayShiftCard()) +
      renderShiftControls() +
      (state.shiftMobileView === "week"
        ? renderShiftWeekMobile(sh, todayIdx)
        : renderShiftDayView(sh, todayIdx)) +
      renderShiftLegend() +
    '</div>';
  }

  var wide = state.shiftView === "week";

  // 表示する日付の範囲。月表示は全日、週表示は月曜起点の1週間。
  var from = 0, to = sh.dates.length, weekBar = "";
  if(wide){
    var r = shiftWeekRange(sh);
    from = r.start; to = r.end;
    var prev = shiftWeekStep(sh, -1), next = shiftWeekStep(sh, 1);
    weekBar = '<div class="shift-bar">' +
      '<button class="shift-nav-btn" data-act="shift-week" data-id="'+(prev===null?"":prev)+'"'+
        (prev===null?' disabled':'')+' aria-label="前の週">◀</button>' +
      '<div class="shift-bar-label">'+esc(sh.dates[from])+' 〜 '+esc(sh.dates[to-1])+'</div>' +
      '<button class="shift-nav-btn" data-act="shift-week" data-id="'+(next===null?"":next)+'"'+
        (next===null?' disabled':'')+' aria-label="次の週">▶</button>' +
    '</div>';
  }

  var idxs = [];
  for(var i = from; i < to; i++) idxs.push(i);

  var dateHeaderCells = idxs.map(function(i){
    return '<div class="shift-cell shift-date-head'+(i===todayIdx?" shift-today":"")+'">' +
      esc(String(sh.dates[i]).split("/")[1])+'<br>'+esc((sh.weekdays||[])[i]||"") +
    '</div>';
  }).join("");

  var members = shiftFilteredMembers();

  function shiftRowsFor(ms){
    return ms.map(function(m){
      var hasRow = hasShiftRow(sh, m.id);
      var data = hasRow ? sh.rows[m.id] : [];
      var cells = idxs.map(function(i){
        if(!hasRow){
          return '<div class="shift-cell shift-none'+(i===todayIdx?" shift-today":"")+'">未</div>';
        }
        var val = String(data[i] || "").trim();
        return '<div class="shift-cell '+shiftCellClass(val)+(i===todayIdx?" shift-today":"")+'">' +
          esc(shiftCellLabel(val, wide)) + '</div>';
      }).join("");
      return '<div class="shift-row">' +
        '<div class="shift-name-cell'+(hasRow?"":" shift-name-none")+'">' +
          avatar(m.id,24)+'<span>'+esc(m.displayName)+'</span>' +
        '</div>' +
        '<div class="shift-days">'+cells+'</div>' +
      '</div>';
    }).join("");
  }

  var placed = {};
  var teamsHtml = session.teams.map(function(team){
    var ms = members.filter(function(m){ return m.team===team.id; });
    ms.forEach(function(m){ placed[m.id] = true; });
    if(!ms.length) return "";
    return '<div class="team-block-title">'+esc(team.label)+'</div>' + shiftRowsFor(ms);
  }).join("");

  // チーム未設定のメンバーが表から抜け落ちないようにする。
  // 「載っていない人がいる」ことに気づけないのが一番まずいため。
  var orphans = members.filter(function(m){ return !placed[m.id]; });
  if(orphans.length){
    teamsHtml += '<div class="team-block-title">その他</div>' + shiftRowsFor(orphans);
  }

  // 日別の人数。絞り込み中はその範囲の人数になるので、見えている行と一致する。
  //
  // 人数が少ない日への警告色は入れていない。土日や、遅番を置かない曜日など
  // 「元々薄いのが正常」な日が実データに存在し、機械的に色を付けると
  // ノイズになって誰も見なくなるため。数字だけ出して判断は人に委ねる。
  var countCells = idxs.map(function(i){
    var e = 0, l = 0;
    members.forEach(function(m){
      if(!hasShiftRow(sh, m.id)) return;
      var v = String(sh.rows[m.id][i] || "").trim();
      if(v === "早番") e++;
      else if(v === "遅番") l++;
    });
    return '<div class="shift-cell shift-count-cell'+(i===todayIdx?" shift-today":"")+'">' +
      '<span class="shift-count-early">'+e+'</span>' +
      '<span class="shift-count-late">'+l+'</span>' +
    '</div>';
  }).join("");

  return '<div class="tab-pad">' +
    renderSyncBar() +
    foldUnlessWide(state.seatOpen, "seat-fold", "🪑 " + displayedSeat().label + "の座席",
      seatFoldSub(), renderSeatChart()) +
    renderShiftMonthBar() +
    foldUnlessWide(state.todayShiftOpen, "todayshift-fold", "🕐 本日のシフト",
      todayShiftFoldSub(), renderTodayShiftCard()) +
    renderShiftControls() +
    weekBar +
    '<div class="shift-scroll'+(wide?" shift-week":"")+'">' +
      '<div class="shift-row shift-header-row">' +
        '<div class="shift-name-cell shift-name-head">メンバー</div>' +
        '<div class="shift-days">'+dateHeaderCells+'</div>' +
      '</div>' +
      teamsHtml +
      '<div class="shift-row shift-count-row">' +
        '<div class="shift-name-cell">早番 / 遅番</div>' +
        '<div class="shift-days">'+countCells+'</div>' +
      '</div>' +
    '</div>' +
    renderShiftLegend() +
  '</div>';
}

// ══════════════════════════════════════════════════════════════════
//  RENDER: 目標進捗（旧・実績タブ）
//
//  「第二CC の目標達成まであとどれくらいか」を出すタブ。
//  シフトから残り稼働時間を積み上げ、必要ペースを円/時間で示す。
//
//  数値の定義（2026-08-11 に合意）
//    指標      手配粗利額（円）。月次の目標と実績が揃う唯一の指標。
//              生産性データ側（通話率・手配数）には月次目標が無いため使えない
//    月間目標  Σ dailyTarget
//    実績      Σ dailyActual（値が入っている日まで）
//    確定境界  dailyActual が入っている最後の日。それ以降は「残り」として扱う
//    実働時間  早番・遅番・21時 = 8時間 / AM・PM = 4時間
//              時間帯表記は差分から休憩1時間を引く
//              業務外・社外・記念 = 0時間、空欄（休み）= 0時間
//    対象日    dailyTarget > 0 の日（目標0の日は残り営業日に数えない）
//
//  【重要】原本の Monthly 結果（J列）は使っていない。
//  あれは28日間のローリング集計で、月末になると月初の実績が窓から外れる。
//  実測では 8/31 の値が 8/1〜8/3 を含んでおらず、月間実績として使うと
//  過小表示になる。実績は Daily 結果（D列）を自分で合計している。
// ══════════════════════════════════════════════════════════════════

// 1人1日あたりの実働時間。ここが必要ペースの分母になるので、
// 変更すると画面の数字が直接動く。運用が変わったらここを直す。
var SHIFT_HOURS = {
  "早番": 8, "遅番": 8, "21時": 8,
  "AM": 4, "PM": 4,
  "業務外": 0, "社外": 0, "記念": 0
};
var SHIFT_BREAK_HOURS = 1;   // 時間帯表記（10-18 など）から引く休憩

/** "9" "9.5" "0845" "1600" を時（小数）に直す */
function parseClock(s){
  if(/^\d{3,4}$/.test(s)){
    return parseInt(s.slice(0, s.length-2), 10) + parseInt(s.slice(-2), 10)/60;
  }
  var n = parseFloat(s);
  return isNaN(n) ? null : n;
}

/**
 * シフトの値から実働時間を出す。
 *
 * 対応表に無い値は 0 ではなく null を返す。原本には裸の数字（3 4 5 11 12）が
 * 混ざっているが、これは入力ミスで直さない方針が確認済みなので、稼働時間には
 * 数えず、画面にも出さない（出し続けても直らない警告はノイズになるため）。
 *
 * 0 と null を分けているのは、集計側で「休み（0時間）」と「区分不明（除外）」を
 * 別物として扱えるようにしておくため。結果として分母はその分だけ小さくなり、
 * 必要ペースはわずかに大きく出る。件数が増えて無視できなくなったときに
 * 気づけるよう、集計側では件数だけ数え続けている。
 */
function shiftHours(val){
  var v = String(val==null?"":val).trim();
  if(!v) return 0;                                   // 空欄＝休み
  if(SHIFT_HOURS[v] !== undefined) return SHIFT_HOURS[v];
  var m = v.match(/^([0-9.]+)\s*[-–〜~]\s*([0-9.]+)$/);
  if(m){
    var a = parseClock(m[1]), b = parseClock(m[2]);
    if(a !== null && b !== null && b > a){
      return Math.max(0, Math.round((b - a - SHIFT_BREAK_HOURS) * 100) / 100);
    }
  }
  return null;                                       // 不明
}

function yen(n){ return Math.round(n).toLocaleString("ja-JP") + "円"; }
// hoursText（「1,424時間」の表記）は目標進捗の整理で表示から外した。
// 稼働時間そのものは needPerHour の計算に使い続けているが、
// 画面には出さない（読んだ人が自分の行動に結び付けられない数字のため）。

/** 目標進捗の計算。画面はこの戻り値だけを見る。 */
/**
 * @param {string} [teamKey] 手配粗利額データのチームキー（"team_a" など）。
 *   省略時は "all"（センター全体）。目標進捗タブは全体、チーム実績タブは
 *   選択中のチームを渡す。
 *
 * 同じ計算をチームごとにもう一度書かないための引数。日次・週次の積み上げも
 * 達成率も、全体と1チームで意味は同じで、見る範囲だけが違う。
 */
function computeProgress(teamKey){
  var teams = (state.goals && state.goals.teams) || null;
  var team = teams && teams[teamKey || "all"];
  var days = team && team.days;
  if(!days || !days.length) return null;

  var sh = state.shiftCurrent;
  // シフトと目標が同じ月を指しているか。ずれていたら稼働時間は出さない
  // （前月の出勤日数で今月の必要ペースを割るのが一番まずい間違いになる）。
  var monthMatches = !!(sh && sh.dates && state.goals.monthId === currentMonthId());

  // 目標データそのものが何月のものか。
  //
  // 【goals.monthId は当てにならない】
  // あれは同期が走った時点の月を GAS が押しているだけで、
  // 中身が何月かは見ていない。原本のタブが月をまたいでいなければ、
  // 「monthId は9月なのに中身は8月」が普通に起きる（実際に起きた）。
  // 日付ラベル "M/D" の月を数えて、多数派をこのデータの月とする。
  var monthTally = {};
  days.forEach(function(d){
    var m = String(d.date || "").split("/")[0];
    if(m) monthTally[m] = (monthTally[m] || 0) + 1;
  });
  var dataMonth = null, best = 0;
  Object.keys(monthTally).forEach(function(m){
    if(monthTally[m] > best){ best = monthTally[m]; dataMonth = parseInt(m, 10); }
  });
  var thisMonth = new Date().getMonth() + 1;
  var staleMonth = (dataMonth !== null && dataMonth !== thisMonth) ? dataMonth : null;

  var shiftIdx = {};
  if(sh && sh.dates) sh.dates.forEach(function(d, i){ shiftIdx[d] = i; });

  // 区分不明だった値 → 出現回数。画面には出さない方針だが、
  // 件数が膨らんだときに調べられるよう戻り値には残してある。
  var unknown = {};

  function hoursOn(dateLabel){
    if(!monthMatches) return null;
    var i = shiftIdx[dateLabel];
    if(i === undefined) return null;
    var total = 0;
    shiftMembers().forEach(function(m){
      if(!hasShiftRow(sh, m.id)) return;
      var v = String(sh.rows[m.id][i] || "").trim();
      var h = shiftHours(v);
      if(h === null){ unknown[v] = (unknown[v] || 0) + 1; return; }
      total += h;
    });
    return total;
  }

  var monthTarget = 0, actual = 0, lastActualIdx = -1;
  days.forEach(function(d, i){
    monthTarget += (d.dailyTarget || 0);
    if(d.dailyActual !== null && d.dailyActual !== undefined){
      actual += d.dailyActual;
      lastActualIdx = i;
    }
  });

  var doneHours = 0, doneDays = 0, leftHours = 0, leftDays = 0, hoursUnavailable = false;
  days.forEach(function(d, i){
    var h = hoursOn(d.date);
    if(h === null && monthMatches) hoursUnavailable = true;
    if(i <= lastActualIdx){
      doneDays++;
      if(h !== null) doneHours += h;
    }else if((d.dailyTarget || 0) > 0){
      leftDays++;
      if(h !== null) leftHours += h;
    }
  });

  var remaining  = monthTarget - actual;
  var totalHours = doneHours + leftHours;
  var nowPerHour = doneHours > 0 ? actual / doneHours : null;

  // 月初は消化が薄く、そこから伸ばすと非現実的な着地になる。
  // 総稼働の1割を消化するまでは見込みを出さない。
  var enough   = totalHours > 0 && doneHours >= totalHours * 0.1;
  var forecast = (enough && nowPerHour !== null) ? nowPerHour * totalHours : null;

  // 想定ライン＝確定している最終日までの目標の積み上げ。
  // 「いま何%か」だけだと月初なら低くて当然で、遅れているのか判断できない。
  // 同じ日までの目標と並べて初めて、進み具合の意味が出る。
  var planned = 0;
  days.forEach(function(d, i){
    if(lastActualIdx >= 0 && i <= lastActualIdx) planned += (d.dailyTarget || 0);
  });

  // 週ごとの実績。月曜起点で、日付ラベルから週を切り出す。
  var weeks = [], cur = null;
  days.forEach(function(d, i){
    var wd = d.weekday;
    if(cur === null || wd === "月"){
      cur = { label: d.date, end: d.date, actual: 0, target: 0, hasActual: false };
      weeks.push(cur);
    }
    cur.end = d.date;
    cur.target += (d.dailyTarget || 0);
    if(d.dailyActual !== null && d.dailyActual !== undefined){
      cur.actual += d.dailyActual;
      cur.hasActual = true;
    }
  });
  // 達成率は「実績が入っている週」だけ意味を持つ。まだ来ていない週に
  // 0% と出すと、未達と区別が付かない（実績ゼロではなく未確定なので）。
  weeks.forEach(function(w){
    w.rate = (w.hasActual && w.target > 0) ? (w.actual / w.target * 100) : null;
  });

  // 日ごとの達成率。実績が入っていない日は rate を null にして、
  // 「0%だった日」と「まだ来ていない日」を混同させない。
  var dayRates = days.map(function(d){
    var t = d.dailyTarget || 0;
    var a = (d.dailyActual === null || d.dailyActual === undefined) ? null : d.dailyActual;
    return {
      date: d.date, weekday: d.weekday, target: t, actual: a,
      rate: (a !== null && t > 0) ? (a / t * 100) : null
    };
  });

  return {
    monthTarget: monthTarget,
    actual: actual,
    planned: planned,
    plannedPct: monthTarget > 0 ? (planned / monthTarget * 100) : 0,
    weeks: weeks,
    dayRates: dayRates,
    remaining: remaining,
    pct: monthTarget > 0 ? (actual / monthTarget * 100) : 0,
    lastActualDate: lastActualIdx >= 0 ? days[lastActualIdx].date : null,
    doneHours: doneHours, doneDays: doneDays,
    leftHours: leftHours, leftDays: leftDays,
    needPerHour: leftHours > 0 ? remaining / leftHours : null,
    nowPerHour: nowPerHour,
    forecast: forecast,
    gap: forecast !== null ? forecast - monthTarget : null,
    monthMatches: monthMatches,
    staleMonth: staleMonth,   // 前月のままなら、その月（例 8）。合っていれば null
    hoursUnavailable: hoursUnavailable,
    unknown: unknown
  };
}

/**
 * 見出しの一文。
 * 未達でも煽らず、必要な数字だけを出す（責める文言は入れない）。
 */
/**
 * 画面の先頭に出す1行。
 *
 * 以前は「あと 1,424時間 で／1時間あたり ¥X のペースが必要」を主役にしていたが、
 * 「1,424時間」はメンバー全員の残シフトを合計した数で、読んだ人が自分の行動に
 * 結び付けられない（見なくてよい数字だという指摘があった）。
 * 主役は「目標までいくら残っているか」の1つに絞り、
 * ペースの話は下のカードへ落としてある。
 */
function progressHeadline(p){
  if(p.remaining <= 0){
    return { lead:"月間目標を達成しています", main:"超過 " + yen(-p.remaining),
             sub:"残りは上積みになります" };
  }
  var sub = "達成 " + (Math.round(p.pct*10)/10) + "%";
  if(p.monthMatches && p.leftDays > 0) sub += " ・ 残り " + p.leftDays + "日";
  return { lead:"目標まで", main:yen(p.remaining), sub:sub };
}

function renderProgress(){
  var p = computeProgress();
  if(!p){
    return '<div class="tab-pad">' +
      renderSyncBar() +
      emptyState("🎯","目標データがまだ同期されていません",
        "スプレッドシート同期が動くと表示されます") +
      renderKpiSection() +
    '</div>';
  }

  var h = progressHeadline(p);
  var pct = Math.max(0, Math.min(100, p.pct));

  // 実績がどこまで確定しているかを必ず出す。
  // 日中に見ている数字が当日を含まないことが分からないと、
  // 未達に見えて誤った判断につながる。
  // 3行あった説明を1行に詰めた。読み飛ばされる長さになると、
  // 肝心の「当日分が入っていない」が伝わらなくなる。
  var confirmNote = p.lastActualDate
    ? '<div class="prog-note">📌 実績は <b>'+esc(p.lastActualDate)+'</b> 分まで。本日分は未集計です。</div>'
    : '<div class="prog-note">📌 今月はまだ実績が入っていません。</div>';

  // 先月のデータを今月として見せない。
  //
  // 同期は毎日動くので「最終更新 本日」と出る。それだけ見ると最新に
  // 見えるが、原本のタブが月をまたいでいないと中身は先月のままになる。
  // 数字が正しく見えてしまうぶん、黙って出すのが一番危ない。
  var staleNote = "";
  if(p.staleMonth){
    staleNote = '<div class="prog-stale">⚠️ ここに出ているのは <b>'+p.staleMonth+'月</b> の数字です。' +
      '同期は動いていますが、原本の「全体Daily集計」が'+p.staleMonth+'月のままです。' +
      '原本のタブを今月に切り替えると、ここも自動で今月になります。</div>';
  }

  function cell(label, value, sub, color){
    return '<div class="card prog-cell">' +
      '<div class="prog-cell-label">'+esc(label)+'</div>' +
      '<div class="prog-cell-value"'+(color?' style="color:var(--'+color+')"':'')+'>'+esc(value)+'</div>' +
      (sub ? '<div class="prog-cell-sub">'+esc(sub)+'</div>' : '') +
    '</div>';
  }

  // カードは3枚まで。以前は4枚あり、そのうち「残り稼働時間」は
  // 見出しと同じ数字の繰り返しだった。並べる数を減らして、
  // 着地見込みが最初に目に入るようにしてある。
  var cells = "";
  if(p.forecast !== null){
    cells += cell("着地見込み", yen(p.forecast), "現ペースが続いた場合");
    // 不足側を赤で出さない（デザイン指定）。
    // 足りていないことは符号と「不足の見込み」の文字で足りる。
    cells += cell("目標との差",
      (p.gap >= 0 ? "+" : "−") + yen(Math.abs(p.gap)),
      p.gap >= 0 ? "超過の見込み" : "不足の見込み",
      p.gap >= 0 ? "green" : "");
  }else{
    cells += cell("着地見込み", "算出前",
      "消化稼働が総稼働の1割に届くまでは出しません");
  }

  // 現ペースと必要ペースは1枚にまとめる。別々のカードに離すと、
  // 比べるために視線を往復させることになる（この2つは並べて初めて意味を持つ）。
  // 計算できない事情もここに集約する。以前は「残り稼働時間」のカードに
  // 出していたが、そのカードごと畳んだため。
  var paceSub;
  if(p.remaining <= 0)            paceSub = "目標は達成済みです";
  else if(!p.monthMatches)        paceSub = "シフトの月が一致せず算出できません";
  else if(p.needPerHour === null) paceSub = "残りのシフトに稼働予定がありません";
  else                            paceSub = "必要 " + yen(p.needPerHour) + " / 時";
  cells += cell("現ペース",
    p.nowPerHour !== null ? yen(p.nowPerHour)+" / 時" : "—",
    paceSub);

  var main = '' +
    '<div class="card prog-head'+(p.remaining <= 0 ? " prog-head-done" : "")+'">' +
      '<div class="prog-head-lead">'+esc(h.lead)+'</div>' +
      '<div class="prog-head-main">'+esc(h.main)+'</div>' +
      '<div class="prog-head-sub">'+esc(h.sub)+'</div>' +
    '</div>' +
    '<div class="card prog-bar-card">' +
      '<div class="prog-bar-top">' +
        '<span class="prog-bar-name">手配粗利額</span>' +
        '<span class="prog-bar-pct">'+(Math.round(p.pct*10)/10)+'%</span>' +
      '</div>' +
      // 想定ラインのマーカー。確定日までの目標の位置を重ねる。
      '<div class="prog-bar-bg prog-bar-marked">' +
        '<div class="prog-bar" style="width:'+pct+'%"></div>' +
        (p.lastActualDate && p.plannedPct > 0 && p.plannedPct < 100
          ? '<span class="prog-marker" style="left:'+Math.min(100, p.plannedPct)+'%" ' +
            'title="'+esc(p.lastActualDate)+' 時点の想定ライン"></span>' : '') +
      '</div>' +
      // 「−12.3pt」だけでは何のポイントか分からないので、金額でも出す。
      // 想定額 = 月間目標 × 想定進捗率。そこにいくら足りないかが本題。
      (p.lastActualDate && p.plannedPct > 0
        ? (function(){
            var needAmt = p.monthTarget * p.plannedPct / 100;
            var diff = needAmt - p.actual;
            return '<div class="prog-plan">想定 '+(Math.round(p.plannedPct*10)/10)+'% ・ '+
              (diff > 0 ? '目安まであと '+esc(yenShort(diff))
                        : '目安より '+esc(yenShort(-diff))+' 先行') +
            '</div>';
          })() : '') +
      '<div class="prog-bar-labels">' +
        '<span>実績 '+esc(yen(p.actual))+'</span>' +
        '<span>目標 '+esc(yen(p.monthTarget))+'</span>' +
      '</div>' +
    '</div>' +
    '<div class="prog-grid">'+cells+'</div>' +
    // 月間目標を達成したときだけ。未達のときに励ます演出は入れない（デザイン指定）。
    // 数字の隣ではなく、数字を読み終えた先に置く。
    (p.monthTarget > 0 && p.actual >= p.monthTarget
      ? '<div class="in-strip in-strip-happy">' + inChar("happy", "達成です！", 88) + '</div>'
      : "") +
    renderKpiSection();

  // 右カラム（狭い画面では本体の下）に並べる、推移を見るための3枚。
  // 積み上げ → 週の達成率 → 日ごとの達成率、と粒度を細かくしていく順に置く。
  var side = renderWeeklyChart(p) + renderWeekRates(p) + renderDayRates(p);

  if(isWide()){
    return '<div class="prog-cols">' +
      '<div class="prog-main">' + renderSyncBar() + staleNote + confirmNote + main + '</div>' +
      '<div class="prog-side">' + side + '</div>' +
    '</div>';
  }
  return '<div class="tab-pad">' + renderSyncBar() + staleNote + confirmNote + main + side + '</div>';
}

/**
 * 週ごとの積み上げ。棒の高さは実績、細い線がその週の目標。
 * 月の合計だけだと「どこで落ちたか」が分からないので、週単位で並べる。
 * 実績が入っていない週は薄いままにして、0件と未確定を混同させない。
 */
function renderWeeklyChart(p){
  var weeks = p.weeks || [];
  if(!weeks.length) return "";
  var max = 0;
  weeks.forEach(function(w){ max = Math.max(max, w.actual, w.target); });
  if(max <= 0) return "";

  var bars = weeks.map(function(w, i){
    var ah = Math.round(w.actual / max * 100);
    var th = Math.round(w.target / max * 100);
    return '<div class="wk">' +
      '<div class="wk-col">' +
        (w.target > 0 ? '<span class="wk-target" style="bottom:'+th+'%"></span>' : '') +
        '<div class="wk-bar'+(w.hasActual?"":" wk-bar-none")+'" style="height:'+ah+'%"></div>' +
      '</div>' +
      '<div class="wk-label">'+esc(w.label)+'〜</div>' +
      '<div class="wk-val">'+(w.hasActual ? esc(yenShort(w.actual)) : "—")+'</div>' +
    '</div>';
  }).join("");

  return '<div class="card wk-card">' +
    '<div class="side-title">週ごとの積み上げ</div>' +
    '<div class="wk-grid">'+bars+'</div>' +
    '<div class="wk-legend">棒＝実績　／　横線＝その週の目標</div>' +
  '</div>';
}

/**
 * 週ごとの達成率。
 *
 * 積み上げのグラフは「どれだけ積んだか」を見るもので、目標に届いていたかは
 * 棒の高さと横線の位置を見比べないと分からない。どの週で落としたのかは
 * 数字で並べたほうが早い。
 */
function renderWeekRates(p){
  var weeks = (p.weeks || []).filter(function(w){ return w.hasActual; });
  if(!weeks.length) return "";

  var rows = weeks.map(function(w){
    var r = w.rate;
    var cls = r === null ? "" : (r >= 100 ? " rate-ok" : (r >= 90 ? " rate-near" : " rate-low"));
    // 棒は100%を基準に伸ばす。超過分は目盛りの外に出るので、
    // 100%で頭打ちにして、実際の数字は右に出す。
    var w100 = r === null ? 0 : Math.max(0, Math.min(100, r));
    return '<div class="rate-row">' +
      '<span class="rate-label">'+esc(w.label)+'〜</span>' +
      '<span class="rate-track"><span class="rate-fill'+cls+'" style="width:'+w100+'%"></span></span>' +
      '<span class="rate-pct'+cls+'">'+(r === null ? "—" : Math.round(r)+"%")+'</span>' +
    '</div>';
  }).join("");

  return '<div class="card side-card">' +
    '<div class="side-title">週の達成率</div>' +
    '<div class="rate-list">'+rows+'</div>' +
    '<div class="wk-legend">実績が入っている週だけ出しています</div>' +
  '</div>';
}

/**
 * 日ごとの達成率。
 *
 * 月の合計や週の合計だけだと、「どの日が効いたのか」「崩れ始めたのはいつか」が
 * 見えない。1日単位で並べると、続けて落ちている区間が形として分かる。
 *
 * 表示は直近14日に絞る。月末まで並べると1本が細くなりすぎて形が読めない。
 */
function renderDayRates(p){
  var all = (p.dayRates || []).filter(function(d){ return d.rate !== null; });
  if(!all.length) return "";
  var shown = all.slice(-14);

  // 目盛りの上限。飛び抜けた日があると他が潰れるので、150%を基本にしつつ
  // それを超える日があるときだけ伸ばす。
  var top = 150;
  shown.forEach(function(d){ top = Math.max(top, Math.ceil(d.rate / 50) * 50); });

  // 棒と日付ラベルは別の行に分ける。同じ箱に入れると、棒はラベルを除いた
  // 高さを基準にするのに対し、100%の線は箱全体を基準にすることになり、
  // 両者の基準がずれる（達成している日の棒が線に届かない、が起きる）。
  var bars = shown.map(function(d){
    var h = Math.max(2, Math.round(d.rate / top * 100));
    var cls = d.rate >= 100 ? " rate-ok" : (d.rate >= 90 ? " rate-near" : " rate-low");
    return '<div class="dr" title="'+esc(d.date)+' '+Math.round(d.rate)+'%">' +
      '<div class="dr-bar'+cls+'" style="height:'+h+'%"></div>' +
    '</div>';
  }).join("");
  var labels = shown.map(function(d){
    return '<div class="dr-lb">'+esc(String(d.date).split("/")[1] || d.date)+'</div>';
  }).join("");

  // 100%の位置に線を引く。棒の高さだけでは達成しているかが読み取れない。
  var lineBottom = Math.round(100 / top * 100);

  var hit = all.filter(function(d){ return d.rate >= 100; }).length;
  var sumA = 0, sumT = 0;
  all.forEach(function(d){ sumA += (d.actual || 0); sumT += (d.target || 0); });
  var avgA = all.length ? sumA / all.length : 0;
  var avgT = all.length ? sumT / all.length : 0;

  return '<div class="card side-card">' +
    '<div class="side-title">日ごとの達成率</div>' +
    '<div class="dr-plot">' +
      '<span class="dr-line" style="bottom:'+lineBottom+'%"></span>' +
      '<div class="dr-cols">'+bars+'</div>' +
    '</div>' +
    '<div class="dr-labels">'+labels+'</div>' +
    // 線の意味はグラフの中ではなく凡例で書く。中に置くと背の高い棒に
    // 重なって、どちらも読みにくくなる（上の積み上げグラフと同じ形に揃えた）。
    '<div class="wk-legend">横線＝100%（目標どおりの日）</div>' +
    // 「1日あたりどれくらい来ているか」を金額でも出す。率だけだと、
    // 目標そのものが日によって違うこの表では、規模の感覚が掴めない。
    '<div class="dr-sum">' +
      '<div class="dr-sum-row"><span>1日平均の実績</span><b>'+esc(yen(avgA))+'</b></div>' +
      '<div class="dr-sum-row"><span>1日平均の目標</span><b>'+esc(yen(avgT))+'</b></div>' +
      '<div class="dr-sum-row"><span>目標に届いた日</span><b>'+hit+' / '+all.length+'日</b></div>' +
    '</div>' +
    (all.length > shown.length
      ? '<div class="wk-legend">グラフは直近'+shown.length+'日分（集計は'+all.length+'日すべて）</div>'
      : '') +
  '</div>';
}

/** グラフの脇に置く短い金額表記 */
function yenShort(n){
  if(n === null || n === undefined) return "—";
  if(Math.abs(n) >= 10000) return Math.round(n/10000*10)/10 + "万";
  return String(Math.round(n));
}

// ══════════════════════════════════════════════════════════════════
//  生産性KPI（目標進捗タブの下部。折りたたみ）
//  データは Firestore の metrics/latest（Phase 5 で GAS が書き込む）。
//  個人別ランキングは作らない方針なので、一覧と本人選択だけ。
// ══════════════════════════════════════════════════════════════════
function kSt(key,val){
  var t = KPI_DEF[key];
  // 基準ラインが無い指標は、達成も未達も判定しない。
  if(t.t === null || t.t === undefined) return "none";
  if(t.g==="high") return val>=t.t ? "success" : (val>=t.t*0.9 ? "warn" : "bad");
  if(t.g==="low") return val<=t.t ? "success" : (val<=t.t*1.1 ? "warn" : "bad");
  return Math.abs(val-t.t)<=0.5 ? "success" : (Math.abs(val-t.t)<=1 ? "warn" : "bad");
}
function renderKpiSection(){
  var byMember = (state.metrics && state.metrics.byMember) || null;
  var open = state.progressKpiOpen;

  var head = '<button class="prog-toggle" data-act="kpi-section-toggle">' +
    '<span>'+(open ? "▼" : "▶")+' 生産性KPI</span>' +
    '<span class="prog-toggle-sub">通話率・待機率など</span>' +
  '</button>';

  if(!open) return '<div class="prog-section">'+head+'</div>';

  if(!byMember){
    return '<div class="prog-section">'+head+
      '<div class="prog-note">生産性データはまだ同期されていません。</div></div>';
  }

  // 集計対象は「同期データに実績が入っているメンバー」。
  // role は権限区分（member/admin）であって職位ではないため、
  // 集計対象の判定には使わない。
  var agents = session.members.filter(function(m){ return !!byMember[m.id]; });
  var avg = {};
  Object.keys(KPI_DEF).forEach(function(k){
    var vals = []; agents.forEach(function(m){ if(byMember[m.id] && byMember[m.id][k]!=null) vals.push(byMember[m.id][k]); });
    // 値が1件も無い指標は 0 ではなく null。
    // 0 を入れると「0%・未達」として表示され、
    // データが無いことと成績が悪いことの区別が付かなくなる。
    avg[k] = vals.length ? Math.round(vals.reduce(function(a,b){return a+b;},0)/vals.length*10)/10 : null;
  });

  var disp = state.kpiSel ? byMember[state.kpiSel] : avg;
  var filterHtml = '<button class="chip'+(!state.kpiSel?" chip-active":"")+'" data-act="kpi-clear">全体</button>' +
    agents.map(function(m){ return '<button class="chip'+(state.kpiSel===m.id?" chip-active":"")+'" data-act="kpi-toggle" data-id="'+m.id+'">'+esc(m.displayName)+'</button>'; }).join("");

  // 日中は実績が入っている人が数名しかいない。全体＝その数名の平均に
  // なることを書いておかないと、センター全体の数字だと誤読される。
  var scopeNote = '<div class="prog-note">実績が入っているのは '+agents.length+
    '名分です。「全体」はその平均で、確定値ではありません。</div>';

  if(state.kpiSel && !byMember[state.kpiSel]){
    return '<div class="prog-section">'+head+
      '<div class="kpi-filter">'+filterHtml+'</div>' +
      '<div class="prog-note">'+esc(getM(state.kpiSel).displayName)+
        'さんは本日の生産性データがまだありません。</div>' +
    '</div>';
  }

  var gridHtml = Object.keys(KPI_DEF).map(function(key){
    var cfg = KPI_DEF[key]; var val = disp ? disp[key] : null;
    if(val==null) return "";
    // 目標進捗に赤は使わない（デザイン指定）。未達は煽らず、
    // 数字と目標を並べて出すだけにする。達成だけ緑で拾う。
    var st = kSt(key,val);
    var colorVar = st==="success" ? "color-grow-ink"
                 : st==="warn"    ? "color-dusk-ink"
                                  : "color-text-sub";
    // 基準ラインが無い指標は、目標の表記もバーも出さない。
    // 0 を目標として描くと、無い線に対して達成しているように見える。
    var hasTarget = cfg.t !== null && cfg.t !== undefined;
    var pct = !hasTarget ? 0
            : (cfg.g==="low" ? Math.min(100, Math.round(cfg.t/val*100))
                             : Math.min(100, Math.round(val/cfg.t*100)));
    return '<div class="card kpi-card">' +
      '<div class="kpi-label">'+cfg.l+'</div>' +
      '<div class="kpi-value-row"><span class="kpi-value" style="color:var(--'+colorVar+')">'+val+'</span><span class="kpi-unit">'+cfg.u+'</span>' +
        (hasTarget ? '<span class="kpi-target">目標'+cfg.t+'</span>'
                   : '<span class="kpi-target kpi-target-none">基準なし</span>') +
      '</div>' +
      (hasTarget
        ? '<div class="kpi-bar-bg"><div class="kpi-bar" style="width:'+pct+'%;background:var(--'+colorVar+')"></div></div>'
        : '') +
    '</div>';
  }).join("");

  // 出せる指標が1つも無いとき。以前はここが空白のまま残り、
  // 壊れているのか、まだデータが来ていないだけなのかが区別できなかった。
  // どの指標が来ていないのかまで書いて、原本のどこを見ればよいかを示す。
  if(!gridHtml){
    var missing = Object.keys(KPI_DEF).map(function(k){ return KPI_DEF[k].l; }).join("・");
    var who = state.kpiSel ? esc(getM(state.kpiSel).displayName) + "さんの" : "";
    return '<div class="prog-section">' + head +
      scopeNote +
      '<div class="kpi-filter">' + filterHtml + '</div>' +
      '<div class="prog-note">' +
        who + '生産性の数値がまだ入っていません（' + esc(missing) + '）。' +
        '同期は動いていますが、取り込み元にこれらの値が無い状態です。' +
      '</div>' +
    '</div>';
  }

  return '<div class="prog-section">'+head+
    scopeNote +
    '<div class="kpi-filter">'+filterHtml+'</div>' +
    '<div class="kpi-grid">'+gridHtml+'</div>' +
  '</div>';
}

//  RENDER: チーム実績
//
//  チーム別・メンバー別の主要KPIを出すタブ。見られるのは
//  canSeeTeamKpi を持つ人だけ（既定は誰も持っていない）。
//
//  【データの出どころが2つある】
//    対応数・手配率・手配粗利額 … memberKpi（Management Sheet 由来）
//    通話率・作業率             … metrics（生産性データ由来）
//  同じ「対応数」でも原本が違えば数字が食い違いうる。このタブでは
//  手配率の分母と揃える必要があるので、対応数は memberKpi 側を使う。
//
//  【チームは原本の括りを使わない】
//  原本にもチームの列があるが、そちらは向こうの都合で変わる。
//  チームの正解は Firestore の members.team ひとつにして、
//  束ねるのはここでやる。異動は members を直すだけで反映される。

/**
 * このタブで出す指標。
 *
 * 通話率・作業率の目標は KPI_DEF から引く。同じ指標なのに目標進捗タブと
 * 違う線を出すと、どちらが正しいのか分からなくなるため。
 *
 * 手配率の目標34%は「第二CC 金児チーム ダッシュボード」の基準ライン
 * （2026-08-21 時点。コード内の古いコメントには35%とあったが、現行の
 * ダッシュボードは34%以上を基準にしているのでそちらに合わせた）。
 * KPI_DEF には入れていない。あちらは生産性データ側に列が無く、
 * 0%として未達に見えてしまうため。
 */
/**
 * 月次で出す指標。Management Sheet の当月タブの並び順に合わせてある。
 *
 * src   … "kpi"=Management Sheet / "met"=生産性データ
 * agg   … チーム集計の出し方
 *           "sum"   件数。足す
 *           "ratio" 定義どおり「合計÷合計」で出す（num/den を指定）
 *           "avg"   分母が手元に無いので、値のある人の平均
 * t     … 基準ライン。無い指標には置かない（無い線で未達に見せないため）
 *
 * 【通話率・作業率・待機率の出どころ】
 * Management Sheet にも行はあるが、第二CCの列は 0.00% のままなので
 * 使えない。CC_アクション管理の月間列から取って、GAS 側で
 * Management Sheet の値に上書きしている（mergeProdKpi_）。
 * アプリから見ると memberKpi の一部なので src は "kpi"。
 *
 * 【ratio の分母を確かめてある】
 * 手配率＝手配数÷対応数、手配買取率＝買取数÷手配数、
 * ホットレート＝ホットリード÷手配数。いずれも原本の第二CC列の値と
 * 突き合わせて一致を確認した（37.5% / 79.7% / 14.7%）。
 * 買取粗利単価は原本の値と一致する割り算が見つからなかったので
 * 平均にしてある（推測で割り算を作らない）。
 */

 * 略した名前は原本と照合するときに毎回読み替えが必要で、それが事故のもとに
 * なる。グループで切り替える形にして、**原本どおりの名前**を出している。
 */

/**
 * 当月の経過ペース（0〜1）。
 *
 * 予算は月末までの目標なので、月の途中で達成率だけ見ても
 * 「遅れているのか、まだ日があるだけなのか」が分からない。
 * 件数・金額のバーには、今日時点であるべき位置を目印として出す。
 *
 * 営業日ではなく暦日で出している。営業日にするにはカレンダーが要り、
 * 祝日の扱いで揉める。暦日なら誰でも同じ数字を再現できる。
 * 率の指標にはペースの概念が無い（月初でも目標率には乗るべき）ので使わない。
 */
function monthPace(){
  var now = new Date();
  var days = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  return now.getDate() / days;
}

/** いま選ばれているグループの指標だけを返す */
function teamKpiDefs(){
  var g = state.teamKpiGroup || TEAM_KPI_GROUPS[0].id;
  return TEAM_KPI.filter(function(d){ return d.grp === g; });
}

/** "2026_8" → "2026年8月"。警告文で使う */
function monthIdLabel(id){
  var p = String(id || "").split("_");
  return (p.length === 2) ? (p[0] + "年" + Number(p[1]) + "月") : String(id || "");
}

/** memberId → このタブで使う5指標。無い値は undefined のままにする */
function teamKpiOf(memberId, which){
  // which に "budget" を渡すと予算ブロックの値を返す。
  // 実績と同じ形・同じキーで入っているので、読み出し先を変えるだけでよい。
  var src = (which === "budget") ? "budgetByMember" : "byMember";
  var k = ((state.memberKpi && state.memberKpi[src]) || {})[memberId] || {};
  var x = ((state.metrics && state.metrics.byMember) || {})[memberId] || {};
  var out = {};
  TEAM_KPI.forEach(function(def){
    var v = (def.src === "met") ? x[def.key] : k[def.key];
    if(typeof v === "number") out[def.key] = v;
  });
  // ratio の計算に使う値。表に出さなくても集計には要る
  ["arranged","handled","bought","hot_lead"].forEach(function(f){
    if(typeof k[f] === "number" && out[f] === undefined) out[f] = k[f];
  });
  return out;
}

/** そのメンバーに1つでも数字があるか（チップの出し分けと空表示の判定に使う） */
function hasTeamKpi(memberId){
  var v = teamKpiOf(memberId);
  for(var k in v) if(typeof v[k] === "number") return true;
  return false;
}

/**
 * チームの集計。
 *
 * 手配率だけは率の平均を取らない。合計手配数 ÷ 合計対応数 で出す。
 * 率の平均にすると、対応数が10件の人と600件の人の率が同じ重みで効き、
 * チームの実勢とずれる。
 */
function teamKpiRollup(members, which){
  var sum = {}, has = {}, bag = {};
  function add(f, v){ if(typeof v !== "number") return; sum[f] = (sum[f]||0) + v; has[f] = true; }

  // TEAM_KPI で既に合計している項目。ratio の材料を足すときに、
  // ここに載っているものを二度足さないための表。これが無いと
  // 対応数・手配数・買取数・ホットリードが2倍になる（実際なった）。
  var summed = {};
  TEAM_KPI.forEach(function(def){ if(def.agg === "sum") summed[def.key] = true; });

  members.forEach(function(m){
    var v = teamKpiOf(m.id, which);
    TEAM_KPI.forEach(function(def){
      if(def.agg === "sum") add(def.key, v[def.key]);
      else if(def.agg === "avg"){
        if(typeof v[def.key] === "number"){ (bag[def.key] = bag[def.key] || []).push(v[def.key]); }
      }
    });
    // ratio の分母・分子になる値。TEAM_KPI に出てこない項目があっても
    // 集計できるように別途足す。既に合計したものは飛ばす。
    ["arranged","handled","handled_valid","bought","hot_lead",
     "arranged_visit","hot_lead_visit"].forEach(function(f){
      if(!summed[f]) add(f, v[f]);
    });
  });

  function avg(a){
    if(!a || !a.length) return null;
    var t = 0; a.forEach(function(n){ t += n; });
    return Math.round(t / a.length * 10) / 10;
  }

  var out = {};
  TEAM_KPI.forEach(function(def){
    if(def.agg === "sum"){
      out[def.key] = has[def.key] ? sum[def.key] : null;
    }else if(def.agg === "ratio"){
      // 率の平均ではなく「合計 ÷ 合計」。対応数の少ない人の率が
      // 同じ重みで効くのを避ける。
      var n = has[def.num] ? sum[def.num] : null;
      var d = has[def.den] ? sum[def.den] : null;
      out[def.key] = (n !== null && d !== null && d > 0)
        ? Math.round(n / d * 1000) / 10 : null;
    }else{
      out[def.key] = avg(bag[def.key]);
    }
  });
  return out;
}

/** 指標1つの表示文字列 */
function teamKpiText(def, val){
  if(val === null || val === undefined) return "—";
  if(def.fmt === "yen") return yenShort(val);
  if(def.fmt === "int") return Math.round(val).toLocaleString("ja-JP");
  return val + "";
}

/** 達成の色。目標が無い指標は色を付けない（無い線で未達に見せないため） */
function teamKpiColor(def, val){
  if(def.t === null || def.t === undefined || val === null || val === undefined) return "color-text";
  var ok = def.g === "low" ? val <= def.t : val >= def.t;
  return ok ? "color-grow-ink" : "color-text-sub";
}

/** チーム実績タブで選べるチーム。数字が1つも無いチームは出さない */
function teamKpiTeams(){
  return session.teams.filter(function(t){
    return session.members.some(function(m){ return m.team === t.id && hasTeamKpi(m.id); });
  });
}

/** 選択中のチームのメンバー。"all" なら数字のある人すべて */
function teamKpiMembers(){
  return session.members.filter(function(m){
    if(!hasTeamKpi(m.id)) return false;
    return state.teamKpiTeam === "all" ? true : m.team === state.teamKpiTeam;
  });
}

// ══════════════════════════════════════════════════════════════════
//  日ごとの実績
//
//  出どころは各チームのダッシュボードの「今日の状況」。
//  9指標のうち **手配粗利だけは日次では出せない**（原本の列に無い）。
//  月次のメンバー別手配粗利は Management Sheet から取れるので、
//  下の「メンバー別」に出している。
// ══════════════════════════════════════════════════════════════════

/**
 * 日次で出す指標。
 *
 * 率は「合計 ÷ 合計」で出せるものと、平均するしかないものがある。
 *   agg:"sum"    … 件数。単純に足す
 *   agg:"ratio"  … 手配率。合計手配数 ÷ 合計対応数（率の平均にはしない）
 *   agg:"avg"    … 通話率など。分母が手元に無いので、値のある人の平均
 * ratio と avg を混ぜて同じ顔で出すが、意味が違うことはコード側で覚えておく。
 */
// 日付の帯にそのまま並べる日数。これより前は「過去の日」に畳む。
// 2週間あれば「先週と比べる」が帯の中で済む。
var DAILY_RECENT = 14;

var DAILY_VIEW = [
  { key:"handled",        l:"対応数",   u:"件", agg:"sum",   t:null, g:"high" },
  { key:"arranged",       l:"手配数",   u:"件", agg:"sum",   t:null, g:"high" },
  { key:"arrange_rate",   l:"手配率",   u:"%",  agg:"ratio", t:34,   g:"high" },
  { key:"call_rate",      l:"通話率",   u:"%",  agg:"avg",   t:45,   g:"high" },
  { key:"work_rate",      l:"作業率",   u:"%",  agg:"avg",   t:10,   g:"low"  },
  { key:"wait_rate",      l:"待機率",   u:"%",  agg:"avg",   t:null, g:"low"  },
  { key:"ancillary_rate", l:"付帯率",   u:"%",  agg:"avg",   t:25,   g:"low"  },
  { key:"avg_call",       l:"平均通話", u:"分", agg:"avg",   t:null, g:"high" }
];

/** 選択中の日のデータ。無ければ null */
function dailyPicked(){
  var days = state.memberKpiDaily || [];
  if(!days.length) return null;
  var i = Math.min(state.dailyDay, days.length - 1);
  return days[i];
}

/** 1日ぶんの集計。members に渡した人だけを対象にする */
function dailyRollup(day, members){
  var sum = { handled:0, arranged:0 };
  var has = { handled:false, arranged:false };
  var bag = {};
  DAILY_VIEW.forEach(function(d){ if(d.agg === "avg") bag[d.key] = []; });

  members.forEach(function(m){
    var v = (day.byMember || {})[m.id];
    if(!v) return;
    ["handled","arranged"].forEach(function(f){
      if(typeof v[f] === "number"){ sum[f] += v[f]; has[f] = true; }
    });
    for(var k in bag){ if(typeof v[k] === "number") bag[k].push(v[k]); }
  });

  var out = {
    handled: has.handled ? sum.handled : null,
    arranged: has.arranged ? sum.arranged : null,
    arrange_rate: (has.handled && has.arranged && sum.handled > 0)
      ? Math.round(sum.arranged / sum.handled * 1000) / 10 : null
  };
  for(var k2 in bag){
    var a = bag[k2];
    if(!a.length){ out[k2] = null; continue; }
    var t = 0; a.forEach(function(n){ t += n; });
    out[k2] = Math.round(t / a.length * 10) / 10;
  }
  return out;
}

/** 月次の1マス。集計カードとメンバー別カードで同じものを使う */
function teamKpiCell(def, val){
  var has = (val !== null && val !== undefined);
  // グループで絞るようにしたので、ラベルは原本どおりの名前をそのまま出す。
  // 略記（高額率B など）は原本と照合するとき読み替えが必要で事故のもとだった。
  return '<span class="tkpi-cell" title="'+esc(def.l)+'">' +
    '<i class="tkpi-cell-l">'+esc(def.l)+'</i>' +
    '<b class="tkpi-cell-v" style="color:var(--'+teamKpiColor(def, val)+')">' +
      esc(teamKpiText(def, val)) + (has && def.u ? esc(def.u) : '') +
    '</b>' +
  '</span>';
}

/**
 * 予算比の1マス。達成率とバーを出す。
 *
 * 【予算が 0 のときは「予算なし」】
 * 原本の予算ブロックには、通話率や IS追加数のように目標が置かれていない
 * 指標があり 0 で入っている。0 で割ると無限大になるし、0 を目標として
 * 「達成率∞%」と出すのは嘘になる。予算が無いことを、そう表示する。
 *
 * 【ペースの目印】
 * 件数・金額（合計する指標）は月末までの積み上げなので、今日時点で
 * あるべき位置に目印を置く。率は月初から目標率に乗っているべきなので
 * 目印は100%。この違いを出さないと、月半ばの達成率50%が
 * 「順調」なのか「遅れ」なのか読めない。
 */
// 課題として拾う最小の乖離。0 より大きい値にすると「予算に届いていない
// だけ」の指標を落とせる。いまは 0 にして、予算に届いていないものの中から
// 乖離の大きい順に ISSUE_MAX 件を必ず出す（上位3件を見たい、という運用）。
var ISSUE_GAP_MIN = 0;

// 課題から外す指標。
// 買取粗利額とその内訳は KGI（最終的な成果）であって、直接手を打つ対象では
// ない。ここが下がっているときに動かすのは手配数や手配率のほうなので、
// 課題として並べても「で、何をするのか」が出てこない。
// 買取粗利単価は1件あたりの質を示す KPI なので残してある。
var ISSUE_EXCLUDE = {
  buy_gross: true,            // 買取粗利額
  buy_gross_visit: true,      // 出張粗利額
  buy_gross_delivery: true,   // 宅配粗利額
  buy_gross_store: true       // 店頭粗利額
};

// 課題として拾うのに必要な対応数。これを下回る人は判定しない。
// 手配率や高額手配率は分母が小さいと1件の増減で大きく動くので、
// 少ない人を「課題あり」と並べると、運の範囲の話が課題に見えてしまう。
var ISSUE_MIN_HANDLED = 50;

// 1人あたりに出す課題の上限。全部出すと読まれない。
var ISSUE_MAX = 3;

/**
 * メンバーの課題を抽出する。
 *
 * 【拾う条件】
 * 予算に届いていない指標のうち、乖離の大きい順に最大 ISSUE_MAX 件。
 * 件数・金額は経過ペース比、率は予算そのものとの比で見る。
 *
 * チーム平均との比較はしない。チーム内の相対順位ではなく、
 * 会社が置いた予算に届いているかを見たいため。
 *
 * 予算に届いている指標は出さない。3件に満たない人は満たないまま出す。
 * 好調な人に無理やり3件並べると、赤が「課題」を意味しなくなる。
 *
 * 【低いほうが良い指標は逆に見る】
 * 作業率・待機率・不可率は、予算を超えているときが課題。
 *
 * 【KGI は外す】
 * 買取粗利額とその内訳（ISSUE_EXCLUDE）は結果であって打ち手ではない。
 *
 * 【同じ原因のものは1件にまとめる】
 * 手配数が遅れれば手配粗利額も出張手配粗利額も遅れる。3枠が1つの原因で
 * 埋まると、他の課題が押し出される。fam（原因のまとまり）ごとに
 * 最も差が大きい1件だけ残す。
 *
 *   volume  対応数まわり      arrange 手配数・手配率・手配粗利
 *   buy     買取・買取粗利     prod    通話率・作業率・待機率
 *   is      IS追加・ホット     quality 不可率
 *
 * 【並び順】
 * 達成率が目標からどれだけ離れているかの大きい順。件数と金額と率を
 * 同じ物差しで並べるために、比率で比べている（円と件を直接比べられない）。
 * 画面に出すのは比率ではなく「あと◯件」。並び順の根拠と表示は別物。
 */
function teamKpiIssues(v, b, member){
  // 管理職や他拠点扱いの人は判定しない。判定の条件は isKpiTarget にまとめてある
  //（role が admin ／ members.kpiIssueTarget が false ／ 所属チームの
  //   kpiTarget が false）。着地シナリオと同じ基準にしておかないと、
  // 片方には出て片方には出ない、という分かりにくい状態になる。
  if(member && !isKpiTarget(member)) return { off: true, few: false, list: [] };
  if(typeof v.handled !== "number" || v.handled < ISSUE_MIN_HANDLED){
    return { few: true, list: [] };
  }
  var pace = monthPace() * 100;
  var list = [];

  TEAM_KPI.forEach(function(def){
    if(ISSUE_EXCLUDE[def.key]) return;              // KGI は課題にしない
    var a = v[def.key], bg = b[def.key];
    if(typeof a !== "number") return;
    if(typeof bg !== "number" || bg <= 0) return;   // 予算が置かれていない指標

    var pct = a / bg * 100;
    var target = (def.agg === "sum") ? pace : 100;
    var low = (def.g === "low");

    var gap = low ? (pct - target) : (target - pct);   // 正の値 = 予算から離れている
    if(gap <= 0 || gap < ISSUE_GAP_MIN) return;   // 予算に届いているものは出さない

    // 【画面には「あと◯件」を出す】
    // 達成率の差（ポイント）は、それ自体が何を指すのか説明が要る。
    // 「あと71件」なら単位があり、そのまま行動に移せる。
    //
    // need … 今日時点で届いていてほしい量。
    //         件数・金額は 予算 × 経過ペース、率は 予算そのもの。
    // short … 不足量（低いほうが良い指標は超過量）。
    var need  = (def.agg === "sum") ? bg * target / 100 : bg;
    var short = low ? (a - need) : (need - a);

    list.push({
      def: def,
      gap: Math.round(gap * 10) / 10,   // 並び順にだけ使う
      need: need,
      short: short,
      actual: a,
      budget: bg,
      pace: pace
    });
  });

  list.sort(function(x, y){ return y.gap - x.gap; });

  // fam ごとに先頭（＝差が最大）の1件だけ残す
  var seenFam = {}, picked = [];
  list.forEach(function(x){
    var f = x.def.fam || x.def.key;
    if(seenFam[f]) return;
    seenFam[f] = true;
    picked.push(x);
  });
  return { few: false, list: picked.slice(0, ISSUE_MAX) };
}

/** 課題のチップ。メンバーカードの氏名の下に出す */
function teamKpiIssueChips(v, b, member){
  var r = teamKpiIssues(v, b, member);
  if(r.off) return "";        // 対象外の人は何も出さない
  if(r.few){
    return '<div class="tkpi-issues">' +
      '<span class="tkpi-issue is-few" title="対応数が' + ISSUE_MIN_HANDLED +
        '件に届かないため、率が安定せず判定していません">対応数が少なく判定対象外</span>' +
    '</div>';
  }
  if(!r.list.length) return "";
  return '<div class="tkpi-issues">' + r.list.map(function(x){
    return '<span class="tkpi-issue" title="'+esc(issueTip(x))+'">' +
      esc(x.def.l) + ' <b>' + esc(issueShortText(x)) + '</b></span>';
  }).join("") + '</div>';
}

/**
 * 不足量の表示。単位を付けて、そのまま読めるようにする。
 *
 *   件数   あと71件
 *   金額   あと420万
 *   率     目標まで3.1%
 *   低いほうが良い率  目標超過4.0%
 */
function issueShortText(x){
  var d = x.def, s = Math.abs(x.short);
  if(d.g === "low") return "目標超過" + (Math.round(s * 10) / 10) + "%";
  if(d.fmt === "yen") return "あと" + yenShort(s);
  if(d.fmt === "int") return "あと" + Math.round(s).toLocaleString("ja-JP") + "件";
  return "目標まで" + (Math.round(s * 10) / 10) + "%";
}

/** チップにマウスを置いたときの説明。数字の出どころを全部書く */
function issueTip(x){
  var d = x.def;
  var unit = (d.fmt === "yen") ? "" : (d.u || "");
  var actual = teamKpiText(d, x.actual) + unit;
  var need   = teamKpiText(d, Math.round(x.need * 10) / 10) + unit;
  var gapTxt = "（達成率が目安より " + x.gap + "ポイント低い状態）";
  if(d.agg === "sum"){
    return d.l + "は" + actual + "。今日時点の目安 " + need +
      "（予算 " + teamKpiText(d, x.budget) + unit + " × 経過 " + Math.round(x.pace) + "%）に届いていません" + gapTxt;
  }
  if(d.g === "low"){
    return d.l + "は" + actual + "で、予算 " + need + " を超えています（" + x.gap + "ポイント超過）";
  }
  return d.l + "は" + actual + "で、予算 " + need + " に届いていません" + gapTxt;
}
// ══════════════════════════════════════════════════════════════════
//  着地見込
//
//  チームダッシュボードの予実表の計算を、そのまま持ってきた。
//  検算した式は以下。すべて 2026/08/27 時点の原本と一致している。
//
//  【デジタル着見 ＝ 実績 ÷ 経過日数 × 総日数】
//    対応数      3,566 ÷ 27 × 31 = 4,094           （原本 4,094）
//    手配数      1,194 ÷ 27 × 31 = 1,371           （原本 1,371）
//    手配粗利額  26,877,295 ÷ 27 × 31 = 30,859,116 （原本 30,859,116）
//    買取数      899 ÷ 27 × 31 = 1,032             （原本 1,032）
//    買取粗利額  26,139,447 ÷ 27 × 31 = 30,011,958 （原本 30,011,958）
//
//  【率と単価は割り戻さない】
//  手配率・手配買取率・買取粗利単価は実績のまま横に流す。日数で伸ばすのは
//  積み上がる量だけ。率を日数で伸ばすのは意味を成さない。
//
//  【予算差異 ＝ 実績 ÷ 予算】
//  着見ではなく実績と比べる。原本もそうなっている
//  （対応数 3,566÷4,140＝86.1%、手配粗利額 72.8%、買取粗利額 70.8%）。
//
//  【メンバー別だけ基準が違う】
//  全体は暦日（27日→31日）で伸ばすが、メンバー別は工数と残日数で伸ばす。
//  人によって出勤日数が違うので、暦日で伸ばすと休みの多い人が過大に出る。
// ══════════════════════════════════════════════════════════════════

/** 当月の経過日数と総日数 */
function monthDays(){
  var now = new Date();
  return { passed: now.getDate(),
           total: new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate() };
}

/** 数値として使える値を返す。空文字・null・NaN は fallback を返す */
function numOr(v, fb){
  return (typeof v === "number" && isFinite(v)) ? v : fb;
}

// 原本の =IFERROR(a/b,"") と同じ。0除算と欠損は空にする。
function ldiv(a, b){
  return (typeof a === "number" && typeof b === "number" && b !== 0) ? a / b : null;
}
function lpct(a, b){
  var r = ldiv(a, b);
  return r === null ? null : r * 100;
}
function lmul(a, b){
  return (typeof a === "number" && typeof b === "number") ? a * b : null;
}

/**
 * メンバー1人ぶんの計算。
 *
 * 【実績】原本の1枚目
 *   工数・対応数・手配数・手配粗利 … 手入力（アプリでは工数だけ手入力、
 *   残り3つは Firestore から入る。値そのものは同じ）
 *   対応数/1Day  = 対応数 ÷ 工数
 *   手配率       = 手配数 ÷ 対応数
 *   手配粗利/1人  = 手配粗利 ÷ 工数
 *   手配粗利単価  = 手配粗利 ÷ 手配数
 *
 * 【これから】原本の2枚目
 *   残日数・1Day・手配率・手配粗利単価 … 手入力
 *   対応数 = 1Day × 残日数
 *   手配数 = 対応数 × 手配率
 *   手配粗利 = 手配数 × 手配粗利単価
 *   手配粗利/1人 = 手配粗利 ÷ 残日数
 *
 * これからの1Day・手配率・単価が未入力なら実績の値を使う。
 * ＝いまのペースのまま行った場合。
 */
function landCalcMember(v, s){
  s = s || {};
  var days = numOr(s.days, null);
  var A = { days:days, handled:v.handled, arranged:v.arranged, gross:v.gross_profit };
  A.perDay  = ldiv(A.handled, days);
  A.rate    = lpct(A.arranged, A.handled);
  A.perHead = ldiv(A.gross, days);
  A.unit    = ldiv(A.gross, A.arranged);

  var remain = numOr(s.remain, null);
  var F = { remain:remain,
            perDay: numOr(s.perDay,      A.perDay),
            rate:   numOr(s.arrangeRate, A.rate),
            unit:   numOr(s.unitPrice,   A.unit) };
  F.handled  = lmul(F.perDay, remain);
  F.arranged = (F.handled !== null && typeof F.rate === "number") ? F.handled * F.rate / 100 : null;
  F.gross    = lmul(F.arranged, F.unit);
  F.perHead  = ldiv(F.gross, remain);

  var landing = (typeof A.gross === "number")
    ? A.gross + (typeof F.gross === "number" ? F.gross : 0) : null;
  return { A:A, F:F, landing:landing };
}

/**
 * チーム行・全体行。
 *
 * 【メンバーの合計から作る】
 * 原本は 工数・対応数・手配数・手配粗利・残日数・これからの各数量・予算・着地を
 * すべて SUM している。チーム行の入力欄から計算し直すのではない。
 * 1Day をメンバーごとに変えたとき、合計が合わなくなるため。
 *
 * 率と単価だけは SUM できないので、合計どうしの割り算にする。
 *   実績 1Day    = 対応数計 ÷ 工数計
 *   実績 手配率   = 手配数計 ÷ 対応数計
 *   これから 1Day = これから対応数計 ÷ 残日数計
 *   単価         = 手配粗利計 ÷ 手配数計
 *
 *   これから 粗利/1人 = これから手配粗利計 ÷ 残日数計
 *
 * 率・単価・1人あたりは合計できないので、すべて合計どうしの割り算にする。
 * 個人の値を足し合わせると意味を成さない数字になる。
 */
function landAggregate(list){
  function sum(pick){
    var t = null;
    list.forEach(function(r){ var x = pick(r); if(typeof x === "number") t = (t||0) + x; });
    return t;
  }
  var A = { days:     sum(function(r){ return r.A.days; }),
            handled:  sum(function(r){ return r.A.handled; }),
            arranged: sum(function(r){ return r.A.arranged; }),
            gross:    sum(function(r){ return r.A.gross; }) };
  A.perDay  = ldiv(A.handled, A.days);
  A.rate    = lpct(A.arranged, A.handled);
  A.perHead = ldiv(A.gross, A.days);
  A.unit    = ldiv(A.gross, A.arranged);

  var F = { remain:   sum(function(r){ return r.F.remain; }),
            handled:  sum(function(r){ return r.F.handled; }),
            arranged: sum(function(r){ return r.F.arranged; }),
            gross:    sum(function(r){ return r.F.gross; }) };
  F.perDay  = ldiv(F.handled, F.remain);
  F.rate    = lpct(F.arranged, F.handled);
  F.perHead = ldiv(F.gross, F.remain);
  F.unit    = ldiv(F.gross, F.arranged);

  return { A:A, F:F,
           landing: sum(function(r){ return r.landing; }),
           bud:     sum(function(r){ return r.bud; }) };
}
// 入力のたびに書くと、1文字打つごとに Firestore へ行ってしまう。
// 手が止まってからまとめて1回書く。
var landSaveTimer = null;
var landPending = null;

/**
 * 着地シナリオの入力を保存する。
 *
 * 全員ぶんを1ドキュメントに入れている。メンバーごとに分けると、
 * 1人ぶん直すたびに人数分の書き込みが要る。同時編集は起きうるが、
 * 使うのはリーダーと管理職の数人で 1on1 の場なので、
 * 最後に保存した内容が残る形でよい（rules 側も同じ前提）。
 *
 * 空欄は「未入力」。0 とは区別する。0 を保存すると
 * 「0日で計算する」意味になってしまう。
 */
function landSave(memberId, field, raw){
  if(!canSeeTeamKpi()) return;
  var cur = (state.landing && state.landing.byMember) || {};
  if(!landPending){
    landPending = {};
    for(var k in cur) landPending[k] = Object.assign({}, cur[k]);
  }
  if(!landPending[memberId]) landPending[memberId] = {};

  var n = landParse(raw);
  if(n === undefined) return;                   // 数字にならない入力は捨てる
  if(n === null){
    delete landPending[memberId][field];        // 未入力に戻す
  }else{
    landPending[memberId][field] = n;
  }

  // 画面はすぐ更新する。保存の往復を待たせない。
  state.landing = Object.assign({}, state.landing || {}, { byMember: landPending });

  if(landSaveTimer) clearTimeout(landSaveTimer);
  landSaveTimer = setTimeout(function(){
    landSaveTimer = null;
    var payload = {
      monthId: monthOf(0).id,
      byMember: landPending,

      updatedAt: serverTimestamp(),
      updatedBy: currentUserId()
    };
    landPending = null;
    write("着地シナリオ", function(){
      return setDoc(doc(db, "landingScenario", payload.monthId), payload);
    }, false).then(function(ok){
      if(!ok) return;
      state.landingSavedAt = Date.now();
      render();
      setTimeout(function(){ state.landingSavedAt = 0; render(); }, 2500);
    });
  }, 700);
}
/**
 * KPIの測定対象か。
 *
 * 次のいずれかに当てはまる人は外す。
 *   ・role が admin
 *   ・members の kpiIssueTarget が false
 *   ・所属チームの kpiTarget が false（管理職チームなど）
 *
 * 役割の違う人を同じ予算で測っても、出てくるのは仕事の違いであって
 * 課題でも着地でもない。入力欄が並ぶだけ邪魔になる。
 */
function isKpiTarget(m){
  if(!m) return false;
  if(m.role === "admin") return false;
  if(m.kpiIssueTarget === false) return false;
  var t = (session.teams || []).filter(function(x){ return x.id === m.team; })[0];
  if(t && t.kpiTarget === false) return false;
  return true;
}

/** 入力欄と計算値で同じ書式を使う。kind: num / rate / yen */
function landFmt(x, kind){
  if(x === null || x === undefined || !isFinite(x)) return "";
  if(kind === "rate") return (Math.round(x*10)/10) + "%";
  if(kind === "yen")  return Math.round(x).toLocaleString("ja-JP");
  return (Math.round(x*10)/10) + "";
}

/**
 * 入力された文字から数値を取り出す。
 * 「39.3」「39.3%」「29,770」「２９７７０」のどれでも受ける。
 * 空文字は null（＝未入力に戻す）。
 */
function landParse(raw){
  var s = String(raw == null ? "" : raw).trim();
  // 全角数字・全角記号を半角に
  s = s.replace(/[０-９．－]/g, function(ch){
    return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0);
  });
  s = s.replace(/[,%\s円]/g, "");
  if(s === "") return null;
  var n = Number(s);
  return isFinite(n) ? n : undefined;   // undefined = 数字にならない（無視する）
}
/**
 * 着地シナリオの1行。
 * R は landCalcMember / landAggregate の戻り値。
 * mid が null の行（チーム・全体）は入力欄を出さず、計算値だけ見せる。
 */
function landRow(label, R, bud, s, mid, rowCls){
  var isGroup = (mid === null || mid === undefined);
  var A = R.A, F = R.F;
  var rate = lpct(R.landing, bud);
  // 着地見込差 ＝ 着地 − 予算。予算に届けばプラス、足りなければマイナス。
  // 達成率と同じ関係を「率」ではなく「金額」で見せる列。
  // あと何万足りないのか、が打ち手を決めるときに要る。
  var diff = (typeof R.landing === "number" && typeof bud === "number")
    ? R.landing - bud : null;

  function n(x){ return (typeof x === "number") ? Math.round(x).toLocaleString("ja-JP") : "—"; }
  function p(x){ return (typeof x === "number") ? (Math.round(x*10)/10)+"%" : "—"; }
  function y(x){ return (typeof x === "number") ? yenShort(x) : "—"; }

  // 入力できるマス。
  //
  // 【type="number" ではなく text】
  // number だと「39.3%」「29,770」のように単位や桁区切りを付けられず、
  // 計算値のマスと見た目が揃わない。text にして整形し、読むときは
  // 数字だけ取り出す。入力は「39.3」でも「39.3%」でも受ける。
  //
  // 【保存した値だけを value に入れる】
  // 実績から埋めた値を value に入れると、誰かが指定したように見えるし、
  // そのまま保存すると実績が動いても追従しなくなる。
  // 未入力は空欄にして、実際に使う値は placeholder で見せる。
  function inp(field, kind, eff, w, extra){
    var cls = "ln-fut" + (extra ? " " + extra : "");
    if(isGroup) return '<td class="ln-calc '+cls+'">'+esc(landFmt(eff, kind) || "—")+'</td>';
    var saved = numOr(s && s[field], null);
    // data-nokeep … render のたびに入力値を引き継ぐ仕組み（captureForms）から
    // 外す。引き継がれると、打った生の文字「45」がそのまま残り、
    // 整形した「45%」に置き換わらない。値は state に入っているので、
    // 引き継がなくても消えない。
    // 【placeholder は出さない】
    // 薄い文字で実績値を出していたが、入っていない欄に数字が見えるので
    // 「入力済み」と読み違える。実際そう指摘された。空欄は空欄のまま見せて、
    // 実際に使う値はマウスを乗せたときだけ出す。
    return '<td class="ln-in '+cls+'"><input type="text" inputmode="decimal" data-nokeep ' +
      'data-land="'+esc(field)+'" data-mid="'+esc(mid)+'" ' +
      'value="'+esc(landFmt(saved, kind))+'" ' +
      'title="'+esc(saved === null
        ? "未入力。いまは実績と同じ " + (landFmt(eff, kind) || "—") + " で計算しています"
        : "入力値 " + landFmt(saved, kind))+'" ' +
      'style="width:'+(w||58)+'px"></td>';
  }

  return '<tr class="'+(isGroup?"ln-group ":"")+esc(rowCls||"")+'">' +
    '<th class="ln-fix ln-l1">'+esc(label)+'</th>' +
    // ── 実績 ──
    inp("days","num",A.days,52,"ln-past") +
    '<td class="ln-calc">'+esc(n(A.handled))+'</td>' +
    '<td class="ln-calc">'+esc(n(A.perDay))+'</td>' +
    '<td class="ln-calc">'+esc(p(A.rate))+'</td>' +
    '<td class="ln-calc">'+esc(n(A.arranged))+'</td>' +
    '<td class="ln-calc">'+esc(y(A.gross))+'</td>' +
    '<td class="ln-calc">'+esc(n(A.perHead))+'</td>' +
    '<td class="ln-calc">'+esc(n(A.unit))+'</td>' +
    // ── これから ──
    // ln-fut … これからブロックの印。地色を少し変えて、実績との境目を出す。
    // 列名（手配粗利・粗利/1人・粗利単価）が実績側と同じなので、
    // 横にスクロールすると、いまどちらを見ているのか分からなくなる。
    inp("remain","num",F.remain,52,"ln-sep") +
    '<td class="ln-calc ln-fut">'+esc(n(F.handled))+'</td>' +
    inp("perDay","num",F.perDay,58) +
    inp("arrangeRate","rate",F.rate,62) +
    '<td class="ln-calc ln-fut">'+esc(n(F.arranged))+'</td>' +
    '<td class="ln-calc ln-fut">'+esc(y(F.gross))+'</td>' +
    '<td class="ln-calc ln-fut">'+esc(n(F.perHead))+'</td>' +
    inp("unitPrice","yen",F.unit,74) +
    // ── 着地 ──
    '<td class="ln-calc ln-sep ln-fix ln-r4">'+esc(y(bud))+'</td>' +
    '<td class="ln-land ln-fix ln-r3">'+esc(y(R.landing))+'</td>' +
    '<td class="ln-calc ln-fix ln-r2">'+esc(p(rate))+'</td>' +
    landDiffCell(diff) +
  '</tr>';
}

/**
 * 着地見込差のマス。
 *
 * 【増えた／減った／変わらない を色で分ける】
 * 以前はマイナスだけ赤で、プラスは本文色だった。増えたのか減ったのかを
 * 数字の符号だけで読ませることになり、ぱっと見で分からない。
 *
 * 【丸めて 0 になるものは ±0 にする】
 * 数円のマイナスが「−0」と出ていた。符号だけ残って値が消えるので、
 * 減ったのに 0、という読みにくい表示になる。丸めた結果が 0 なら
 * 増減なしとして扱う。
 */
function landDiffCell(diff){
  if(diff === null || diff === undefined)
    return '<td class="ln-fix ln-r1 ln-calc">—</td>';

  var av  = Math.abs(diff);
  var txt = yenShort(av);
  var zero = (av < 1 || txt === "0" || txt === "0円");

  if(zero) return '<td class="ln-fix ln-r1 ln-flat">±0</td>';
  var up = diff > 0;
  return '<td class="ln-fix ln-r1 '+(up ? "ln-up" : "ln-down")+'">' +
    esc((up ? "+" : "−") + txt) + '</td>';
}
/**
 * 着地シナリオの表。原本の予実シートと同じ列並び。
 *
 * 【着地見込差】
 * 原本は 'リユース1ON1 8/3'!V16 との差、つまり前回1on1シートの着地との差。
 * ただしアプリでは「着地 − 予算」に変えてある。予算に対して
 * あと何万足りないのかが、打ち手を決めるときに要るため。
 * 前週との比較が要るようになったら、月ごとの landingScenario を
 * 読み比べれば出せる。
 */
function renderLanding(members, teams){
  var sc = (state.landing && state.landing.byMember) || {};
  var wd = (state.memberKpi && state.memberKpi.workdaysByMember) || {};

  function inputsOf(id){
    var s = sc[id] || {}, w = wd[id] || {};
    // workdays タブの値は初期値。画面で保存した値があればそちらが勝つ。
    return { days:        numOr(s.days,   numOr(w.days, null)),
             remain:      numOr(s.remain, numOr(w.remain, null)),
             perDay:      numOr(s.perDay, null),
             arrangeRate: numOr(s.arrangeRate, null),
             unitPrice:   numOr(s.unitPrice, null) };
  }
  function calcOf(m){
    var v = teamKpiOf(m.id);
    var r = landCalcMember(v, inputsOf(m.id));
    r.bud = teamKpiOf(m.id, "budget").gross_profit;
    r.id = m.id;
    return r;
  }

  // 測定対象だけを並べる。管理職などは行ごと出さない。
  // 入力欄が並んでいると「入れなければいけない」と読めてしまう。
  members = members.filter(isKpiTarget);
  if(!members.length){
    return '<div class="side-title">着地シナリオ</div>' +
      '<div class="lnd-note">このチームに測定対象のメンバーがいません。</div>';
  }

  var body = "";
  var allCalc = members.map(calcOf);
  var g = landAggregate(allCalc);
  body += landRow("全体", g, g.bud, null, null, "ln-all");

  // チームごとに並べたあと、どのチームにも入らなかった人を拾う。
  //
  // 【なぜ受け皿が要るか】
  // 「全体」の行は members 全員を足している。一方この下はチームを回って
  // 出すので、team が空の人はどの塊にも入らず行が出ない。放っておくと
  // 「全体」と、下に並ぶチーム合計の和が合わなくなる。数字が合わない表は
  // それだけで信用されなくなるし、原因も追いにくい。
  // シフト表も同じ理由で「その他」を出している（そちらに合わせてある）。
  var placed = {};
  (teams || []).forEach(function(t){
    var list = members.filter(function(m){ return m.team === t.id; });
    list.forEach(function(m){ placed[m.id] = true; });
    if(!list.length) return;
    var cs = list.map(calcOf);
    var tg = landAggregate(cs);
    // チームごとの色。teamClass() は背景色まで持つクラスなので使わない
    // （行に付けると1チームぶん丸ごと塗られて、水色だらけになった）。
    // 線の色だけを変える専用クラスにする。
    var tc = "ln-team ln-t-" + (t.colorKey || "none");
    body += landRow(t.label, tg, tg.bud, null, null, tc + " ln-team-head");
    body += cs.map(function(r, i){
      return landRow(list[i].displayName, r, r.bud, inputsOf(r.id), r.id, tc);
    }).join("");
  });

  var orphans = members.filter(function(m){ return !placed[m.id]; });
  if(orphans.length){
    var ocs = orphans.map(calcOf);
    var og = landAggregate(ocs);
    var otc = "ln-team ln-t-none";
    body += landRow("その他", og, og.bud, null, null, otc + " ln-team-head");
    body += ocs.map(function(r, i){
      return landRow(orphans[i].displayName, r, r.bud, inputsOf(r.id), r.id, otc);
    }).join("");
  }


  var head =
    '<thead>' +
      '<tr class="ln-head2">' +
        '<th class="ln-fix ln-l1"></th><th colspan="8">実績</th>' +
        '<th colspan="8" class="ln-fut ln-sep">これから</th>' +
        '<th colspan="4" class="ln-fix ln-rall">着地</th>' +
      '</tr>' +
      '<tr>' +
        '<th class="ln-fix ln-l1"></th>' +
        '<th>工数</th><th>対応数</th><th>1Day</th><th>手配率</th><th>手配数</th>' +
        '<th>手配粗利</th><th>粗利/1人</th><th>粗利単価</th>' +
        '<th class="ln-fut ln-sep">残日数</th><th class="ln-fut">対応数</th>' +
        '<th class="ln-fut">1Day</th><th class="ln-fut">手配率</th><th class="ln-fut">手配数</th>' +
        '<th class="ln-fut">手配粗利</th><th class="ln-fut">粗利/1人</th><th class="ln-fut">粗利単価</th>' +
        '<th class="ln-sep ln-fix ln-r4">予算</th><th class="ln-fix ln-r3">着地</th>' +
        '<th class="ln-fix ln-r2">達成率</th><th class="ln-fix ln-r1">着地見込差</th>' +
      '</tr>' +
    '</thead>';

  var saved = state.landingSavedAt ? '<span class="ln-saved">保存しました</span>' : '';
  // 着地見込差が「着地 − 予算」になったので、比較の起点を控えるボタンは
  // 役目が無くなった。押しても何も変わらないボタンは置かない。
  var saveNote = '<span class="ln-savenote">入力は打った時点で自動保存され、' +
    'チームタブを見られる人に共有されます</span>';

  return '<div class="side-title">着地シナリオ'+saved+'</div>' +
    '<div class="lnd-note">' +
      '<b>色の付いたマスだけ入力</b>します。ほかは計算で出ます。' +
      'これからの1Day・手配率・粗利単価は、空欄なら実績と同じ値で計算します' +
      '（＝いまのペースのまま行った場合）。打ち替えるとその場で着地が動きます。' +
      '<br>着地 ＝ 実績の手配粗利 ＋ これからの手配粗利。達成率 ＝ 着地 ÷ 予算。' +
      'チーム行と全体行はメンバーの合計で、入力できません。' +
      '<br><b>着地見込差</b>は<b>着地 − 予算</b>です。予算に届けばプラス（緑）、' +
      '足りなければマイナス（赤）。達成率と同じ関係を、率ではなく金額で見ます。' +
      '<br>入力欄が<b>空欄のときは実績と同じ値</b>で計算します。' +
      'マウスを乗せると、いま何で計算しているかが出ます。' +
    '</div>' +
    '<div class="ln-bar">'+saveNote+'</div>' +
    '<div class="tbl-wrap"><table class="lnd-tbl ln-tbl">'+head+'<tbody>'+body+'</tbody></table></div>';
}
/** 予算比の1マス。達成率とバーを出す。
 *  赤くするのは、その人の課題上位3件に入っているマスだけ。 */
function teamKpiBudgetCell(def, actual, budget, badKeys){
  var hasB = (typeof budget === "number" && budget > 0);
  var hasA = (typeof actual === "number");

  if(!hasB){
    return '<span class="tkpi-cell" title="'+esc(def.l)+'（予算が設定されていません）">' +
      '<i class="tkpi-cell-l">'+esc(def.l)+'</i>' +
      '<b class="tkpi-cell-v tkpi-nob">予算なし</b>' +
    '</span>';
  }
  if(!hasA){
    return '<span class="tkpi-cell" title="'+esc(def.l)+'">' +
      '<i class="tkpi-cell-l">'+esc(def.l)+'</i>' +
      '<b class="tkpi-cell-v tkpi-nob">—</b>' +
    '</span>';
  }

  var pct  = actual / budget * 100;
  var isSum = (def.agg === "sum");
  var pace = isSum ? monthPace() * 100 : 100;

  // 低いほうが良い指標（作業率・待機率・不可率）は、予算を超えたら未達。
  var low = (def.g === "low");
  var good = low ? (pct <= pace) : (pct >= pace);
  // 赤くするのは「その人の課題上位3件」に入っているマスだけ。
  // チップと同じ集合を渡しているので、チップに出ている指標が
  // マスでも赤くなる。基準を2か所に書くと必ずずれるので集合で渡す。
  var bad = !!(badKeys && badKeys[def.key]);

  var bar = Math.max(0, Math.min(100, pct));
  var mark = Math.max(0, Math.min(100, pace));
  var tip = def.l + ' 実績 ' + teamKpiText(def, actual) + (def.u||'') +
            ' / 予算 ' + teamKpiText(def, budget) + (def.u||'') +
            (isSum ? '（今日時点の目安 ' + Math.round(pace) + '%）' : '');

  return '<span class="tkpi-cell" title="'+esc(tip)+'">' +
    '<i class="tkpi-cell-l">'+esc(def.l)+'</i>' +
    '<b class="tkpi-cell-v'+(bad?" is-bad":"")+'">'+ (Math.round(pct*10)/10) +'%</b>' +
    '<span class="tkpi-bar">' +
      '<i class="tkpi-bar-f'+(good?" is-good":(bad?" is-bad":""))+'" style="width:'+bar+'%"></i>' +
      '<i class="tkpi-bar-m" style="left:'+mark+'%"></i>' +
    '</span>' +
    '<i class="tkpi-sub">'+esc(teamKpiText(def, actual))+' / '+esc(teamKpiText(def, budget))+'</i>' +
  '</span>';
}

/** 日次の1マス。値が無ければ「—」 */
function dailyCell(def, val){
  var txt = (val === null || val === undefined) ? "—"
          : (def.u === "件" ? Math.round(val).toLocaleString("ja-JP") : val + "");
  var color = "color-text";
  if(val !== null && val !== undefined && def.t !== null && def.t !== undefined){
    color = (def.g === "low" ? val <= def.t : val >= def.t) ? "color-grow-ink" : "color-text-sub";
  }
  return '<span class="tkpi-cell">' +
    '<i class="tkpi-cell-l">'+esc(def.l)+'</i>' +
    '<b class="tkpi-cell-v" style="color:var(--'+color+')">' +
      esc(txt) + (val !== null && val !== undefined && def.u !== "件" ? esc(def.u) : "") +
    '</b>' +
  '</span>';
}

function renderDailyKpiTable(){
  var days = state.memberKpiDaily || [];
  if(!days.length) return "";
  var members = teamKpiMembers();
  if(!members.length) return "";

  // 選んでいる日が範囲外になったら最新に戻す（データが増減するため）
  if(state.dailyDay > days.length - 1) state.dailyDay = 0;
  var day = dailyPicked();
  if(!day) return "";

  function label(d){
    var p = String(d).split("-");
    return p.length === 3 ? (Number(p[1]) + "/" + Number(p[2])) : String(d);
  }

  // ── 日付を選ぶ帯 ──
  //
  // 直近 DAILY_RECENT 日はそのまま並べる。それより前は掲示板の
  // 「過去の投稿」と同じ作りで畳む。日が経つほどチップが横に伸びて
  // 目的の日を探せなくなるため。
  //
  // 畳んだ側も購読の対象としては読み続けている（表示を畳んでいるだけ）。
  // 掲示板のアーカイブと同じ割り切りで、判定の意味を揃えてある。
  function chip(d, i){
    return '<button class="chip'+(i === state.dailyDay ? " chip-active" : "")+
      '" data-act="daily-day" data-id="'+i+'">'+esc(label(d.date))+'</button>';
  }
  var picker = days.slice(0, DAILY_RECENT).map(chip).join("");

  // 直近より前の日を、月ごとにまとめる
  var older = [], seen = {}, groups = [];
  days.forEach(function(d, i){
    if(i < DAILY_RECENT) return;
    var p = String(d.date).split("-");
    var key = p[0] + "-" + Number(p[1]);
    if(!seen[key]){ seen[key] = { key:key, label:monthKeyLabel(key), items:[] }; groups.push(seen[key]); }
    seen[key].items.push({ d:d, i:i });
    older.push(d);
  });
  var archive = "";
  if(older.length){
    var aOpen = !!state.dailyArchiveOpen;
    archive = '<button class="archive-trigger'+(aOpen?" archive-trigger-open":"")+'" ' +
      'data-act="archive-toggle" data-id="dailyArchiveOpen" aria-expanded="'+(aOpen?"true":"false")+'">' +
      '🗂 過去の日 <span class="archive-count">'+older.length+'</span>' +
      '<span class="reader-caret">'+(aOpen?"▲":"▼")+'</span>' +
    '</button>';
    if(aOpen){
      archive += '<div class="archive-body">' + groups.map(function(g){
        return '<div class="archive-month">' +
          '<div class="archive-month-head">'+esc(g.label)+' · '+g.items.length+'日</div>' +
          '<div class="kpi-filter">' + g.items.map(function(x){ return chip(x.d, x.i); }).join("") + '</div>' +
        '</div>';
      }).join("") + '</div>';
    }
  }

  // ── チーム集計 ──
  var roll = dailyRollup(day, members);
  var teamCells = DAILY_VIEW.map(function(def){ return dailyCell(def, roll[def.key]); }).join("");

  // ── メンバー別 ──
  // その日データが1つも無い人は出さない（休みの人で埋めない）。
  var rows = members.map(function(m){
    var v = (day.byMember || {})[m.id];
    if(!v) return "";
    var any = false;
    DAILY_VIEW.forEach(function(def){ if(typeof v[def.key] === "number") any = true; });
    if(!any) return "";
    var cells = DAILY_VIEW.map(function(def){ return dailyCell(def, v[def.key]); }).join("");
    return '<div class="card tkpi-member">' +
      '<div class="tkpi-name">'+avatar(m.id,28)+'<span>'+esc(m.displayName)+'</span></div>' +
      '<div class="tkpi-cells">'+cells+'</div>' +
    '</div>';
  }).join("");

  var absent = members.filter(function(m){ return !(day.byMember || {})[m.id]; })
    .map(function(m){ return m.displayName; });

  return '<div class="side-title">日ごとの実績</div>' +
    (days.length > 1 ? '<div class="kpi-filter">'+picker+'</div>' : '') +
    archive +
    '<div class="card tkpi-member">' +
      '<div class="tkpi-name"><span>'+esc(label(day.date))+' チーム合計</span></div>' +
      '<div class="tkpi-cells">'+teamCells+'</div>' +
    '</div>' +
    (rows || '<div class="prog-note">この日はメンバーの数字がありません。</div>') +
    (absent.length ? '<div class="dk-note">この日データが無い人: '+esc(absent.join("、"))+
      '（休みか、生産性データが未取り込み）</div>' : '') +
    '<div class="dk-note">手配率は 合計手配数 ÷ 合計対応数。通話率・作業率・待機率・付帯率・' +
      '平均通話は、値のある人の平均です。手配粗利は原本の「今日の状況」に列が無いため日次では出せません。' +
      (days.length <= 1 ? '日次は取り込みを始めた日から1日ずつ増えます。' : '') + '</div>';
}
