<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第二CC Hub</title>
<!-- ファビコン。INさん（in-guide.webp）の頭部を切り出したもの。
     16pxのタブでは細部が潰れるので、顔が大きく入る位置で切っている。
     apple-touch-icon に地色を敷いているのは、iOS が透過を黒で塗るため
     （元画像の背景は白なので、ここも白で揃えてある）。
     Android は manifest が無い場合 apple-touch-icon を流用するので、
     192px 版は別に置いていない。 -->
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- デザイン指定のフォント。400と700の2ウェイトだけに絞ってある（日本語は重いため）。
     display=swap なので、届くまではOS標準の日本語フォントで表示される。 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<!-- 支給されたデザイントークン。他のどのCSSより先に読み込む（ハンドオフ指定）。
     トークン定義と共通コンポーネントのクラスが入っており、
     下の <style> はその上に重ねる差分として書いている。

     【ダークモード】
     支給されたデザインは暖色のライト1本で、ダークの指定は無い。
     依頼を受けて後から足したもので、支給デザインには含まれない。

     tokens.css には手を入れていない。ハンドオフされたファイルなので、
     原本を書き換えると次に支給されたときに差分が分からなくなる。
     下の <style> に :root[data-theme="dark"] を1ブロック置いて、
     --color-* を上書きするだけにしてある（エイリアスは var() 参照なので
     自動で追従する）。 -->
<link rel="stylesheet" href="./tokens.css">
<!-- 起動直後に data-theme を立てる。
     アプリ本体は <script type="module"> で、モジュールは defer 相当なので
     そこで立てると「一瞬明るい画面が出てから暗くなる」白い閃光が起きる。
     ここだけは同期スクリプトにして、最初の描画より先に決める。

     判定の規則は下の wantsDark() と同じにしてある（保存された選択 →
     無ければ OS の設定）。**両方を直すこと。** 片方だけ変えると、
     起動直後の色とボタンの状態が食い違う。 -->
<script>
(function(){
  try{
    var v = localStorage.getItem("dainiCcHub.theme");
    var dark = (v === "dark") ||
      (v !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  }catch(e){}
})();
</script>
<style>
*{box-sizing:border-box;}

/* ══════════════════════════════════════════════════════════════════
   ダークモード

   上書きするのは tokens.css の --color-* だけ。旧名エイリアス
   （--bg / --text / --accent など）は var() で --color-* を指しているので、
   ここを変えれば全部追従する。個別に足す必要はない。

   OS の設定に追従させる media query は置いていない。代わりに JS が
   起動時に「保存された選択 → 無ければ OS の設定」を見て data-theme を
   立てる。CSS を2重に書かずに、切り替えボタンと OS 追従の両方を
   成立させるため（同じ上書きを media query 側にも書くと、片方だけ
   直して食い違う事故が起きる）。

   色は元の意味を保つように選んである。粋の水色＝早番、夕暮れの橙＝遅番、
   江戸紫＝21時、緑＝達成、朱＝警告。暗い地の上で見えるように明度を
   上げてあるが、色相は動かしていない。
   ══════════════════════════════════════════════════════════════════ */
:root[data-theme="dark"]{
  color-scheme: dark;

  /* 面と文字 */
  --color-page:          #12161B;
  --color-bg:            #191E25;
  --color-surface:       #212832;
  --color-track:         #2A323D;
  --color-text:          #E7ECF2;
  --color-text-sub:      #A2ADB9;
  /* 12px の補助文字（投稿時刻など）に使う。暗い地では #7B8693 だと
     4.0:1 しか出ず小さい文字には足りないので、明度を上げてある。 */
  --color-text-mute:     #98A3AF;
  --color-border:        #313A46;
  --color-border-strong: #46515E;

  /* アクセントの「塗り」はライトと同じ値のまま動かさない。
     水色・朱・緑の上に白文字を置く指定がCSSに10か所ハードコードされて
     いて（.btn-post .btn-primary .nav-badge .task-box など）、ここを
     明るくすると白文字とのコントラストが落ちる。ライトでも白×水色は
     約2.6:1で、それが支給デザインの選択。暗くしても悪くしないために、
     塗りの色は据え置きにしてある。

     入れ替えるのは tint（淡い地色→暗い地色）と ink（濃い文字→明るい文字）
     の2つだけ。こちらは必ず「地」と「その上の文字」の対で使われる。 */
  --color-accent-tint: #12303F;
  --color-accent-ink:  #8FD3F5;
  --color-plum-tint:   #241F33;
  --color-plum-ink:    #BCAEE8;
  --color-dusk-tint:   #3A2513;
  --color-dusk-ink:    #F6B788;
  --color-grow-tint:   #10302A;
  --color-grow-ink:    #6FD9B6;
  --color-alert-tint:  #3A1B1E;
  --color-alert-ink:   #F49AA0;

  /* accent-deep は10か所が文字色、3か所だけが hover の塗り。
     文字として読める明るさを優先し、hover の塗りは下で個別に暗くする。 */
  --color-accent-deep: #8AD0F5;

  /* 影は暗い地では見えないので、黒を強めて輪郭を作る */
  --shadow-card: 0 1px 2px rgba(0,0,0,.35);
  --shadow-pop:  0 6px 24px rgba(0,0,0,.50);

  /* シフト状態。塗り・文字・枠の3点セットで意味を持つので3つとも入れ替える */
  --shift-early-bg:     #17384A;
  --shift-early-fg:     #9AD5F2;
  --shift-early-border: #235A75;
  --shift-late-bg:      #3E2716;
  --shift-late-fg:      #F5B98C;
  --shift-late-border:  #6A431F;
  --shift-night-bg:     #2A2340;
  --shift-night-fg:     #C0B2EC;
  --shift-night-border: #453A63;
  --shift-off-bg:       #262C34;
  --shift-off-fg:       #8B94A0;
  --shift-off-border:   #313A46;
}

/* accent-deep を文字向けに明るくした分、それを「塗り」に使う hover だけ
   個別に戻す。ここに白文字が乗るため、明るい地色では読めなくなる。 */
:root[data-theme="dark"] .btn-post:hover,
:root[data-theme="dark"] .btn-primary:hover,
:root[data-theme="dark"] .comment-send:hover{background:#2A87BA;}

/* 座席表は原本の背景色をそのまま出す（色が凡例の意味を持つため）。
   暗い地の上で白いマスが浮くが、こちらで塗り替えると
   「※遅番グレー」「※青PCなし」という原本の凡例が嘘になる。
   枠と余白だけを暗い地に合わせ、マスの色は触らない。 */
:root[data-theme="dark"] .seat-scroll{background:var(--color-page);}

/* INさんのイラストは白背景の webp。暗い地だと切り抜きの白が四角く出るので、
   角を丸めた白い台に乗っているように見せて、意図的な余白として扱う。 */
:root[data-theme="dark"] .in-art{border-radius:10px;}

/* tokens.css の .input は高さ44pxで固定される（押せる要素の最小寸法）。
   複数行入力はそれに縛られてはいけないので戻す。 */
.textarea{height:auto;}
body{margin:0;background:var(--color-page);}
.shell-outer{
  display:flex; justify-content:center; align-items:stretch;
  min-height:100vh; min-height:100dvh; background:var(--page-bg);
  /* Noto Sans JP が届くまでは各OSの標準日本語フォントで出す */
  font-family:"Noto Sans JP",-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  color:var(--color-text);
  /* 日本語主体なので行間は 1.8 を基準にする */
  line-height:1.8;
  -webkit-font-smoothing:antialiased;
}
.app{
  width:100%; max-width:640px; display:flex; flex-direction:column;
  /* スマホの 100vh は「URLバーが隠れているときの高さ」なので、実際に
     見えている領域より大きい。その差の分だけアプリの下端（ボトムナビと
     本文の末尾）が画面の外に出る。さらに .app は overflow:hidden で、
     外側も min-height:100vh のためページ自体もスクロールしない。
     結果、はみ出した分には永久に手が届かなかった。

     dvh は URLバーの出入りに追従する高さ。読めない古い端末では
     直前の 100vh がそのまま効くので、下げても壊れない。 */
  height:100vh; height:100dvh;
  background:var(--color-bg); overflow:hidden;
}
@media (min-width:641px){
  .shell-outer{padding:24px 16px;}
  .app{height:calc(100vh - 48px); height:calc(100dvh - 48px); max-height:900px; border-radius:var(--radius-lg);
    box-shadow:var(--shadow-pop); border:1px solid var(--color-border);}
}

.header{padding:14px 16px; background:var(--color-surface); border-bottom:1px solid var(--color-border);
  display:flex; align-items:center; gap:10px; flex-shrink:0;}
.header-info{flex:1; min-width:0;}
.header-title{font-weight:700; font-size:17px; color:var(--color-text); line-height:1.4;}
.header-online{font-size:13px; color:var(--color-grow-ink); font-weight:700; margin-top:1px; line-height:1.5;}
.header-me{display:flex; align-items:center; gap:8px; flex-shrink:0;}
.header-me-text{min-width:0; text-align:right;}
.header-me-name{font-size:13px; font-weight:700; color:var(--color-text); white-space:nowrap; line-height:1.5;}
.header-me-role{font-size:12px; font-weight:700; color:var(--color-dusk-ink); background:var(--color-dusk-tint);
  border-radius:var(--radius-sm); padding:0 6px; display:inline-block; line-height:20px;}
.signout-btn{background:var(--color-surface); border:1px solid var(--color-border-strong);
  border-radius:var(--radius-md); padding:0 10px; height:36px; font-size:13px; font-weight:700;
  color:var(--color-text-sub); cursor:pointer; font-family:inherit; white-space:nowrap;}
.signout-btn:hover{background:var(--color-bg);}

/* テーマ切り替え。押せる要素の最小寸法（36px）は守る。
   文字を入れず絵文字1つにしているのは、ヘッダーの幅が
   名前とサインアウトで既に埋まっているため。 */
.theme-btn{width:36px; height:36px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  background:var(--color-surface); border:1px solid var(--color-border-strong);
  border-radius:var(--radius-md); font-size:15px; line-height:1; cursor:pointer; font-family:inherit;
  color:var(--color-text-sub);}
.theme-btn:hover{background:var(--color-bg);}

.content{flex:1; overflow-y:auto;}
.tab-pad{padding:16px 16px 28px;}
.loading{display:flex; justify-content:center; align-items:center; height:100%; color:var(--text-4); font-size:14px;}

/* ── 認証まわりの画面 ───────────────────────────── */
.auth-wrap{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:24px; text-align:center; gap:14px;}
.auth-logo{font-size:34px;}
.auth-title{font-size:19px; font-weight:700; color:var(--text);}
.auth-desc{font-size:13px; color:var(--text-3); line-height:1.7; max-width:340px;}
.google-btn{display:inline-flex; align-items:center; justify-content:center; gap:10px;
  background:var(--color-surface); color:var(--color-text); border:1px solid var(--color-border-strong);
  border-radius:var(--radius-lg); height:52px; padding:0 20px; font-size:15px; font-weight:700;
  cursor:pointer; font-family:inherit; min-width:280px; line-height:1;}
.google-btn:hover{background:var(--color-bg);}
.google-btn:disabled{opacity:0.6; cursor:default;}
.google-mark{width:18px; height:18px; flex-shrink:0;}
.auth-note{font-size:11px; color:var(--text-4); line-height:1.7; max-width:340px;}
.auth-alert{background:color-mix(in srgb, var(--red) 12%, transparent); border:1px solid color-mix(in srgb, var(--red) 32%, transparent); color:var(--red); border-radius:10px; padding:12px 14px; font-size:13px; line-height:1.7; max-width:380px; text-align:left;}
.auth-alert-title{font-weight:700; margin-bottom:4px;}
.auth-mail{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; word-break:break-all;}
.auth-setup{background:var(--amber-bg); border:1px solid color-mix(in srgb, var(--amber) 40%, transparent); color:var(--amber-c); border-radius:10px; padding:14px; font-size:12px; line-height:1.8; max-width:420px; text-align:left;}
.auth-setup code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; background:color-mix(in srgb, var(--amber) 18%, transparent); border-radius:4px; padding:1px 4px;}

/* ボトムナビ。高さ72＋下8のセーフエリア余白は、指が届く帯を確保するための指定。 */
.nav{display:flex; background:var(--color-surface); border-top:1px solid var(--color-border);
  flex-shrink:0; height:72px; padding-bottom:8px;}
.nav-btn{flex:1; padding:0 4px; background:transparent; border:none; color:var(--color-text-sub);
  cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; position:relative; font-family:inherit; line-height:1.4;}
.nav-btn.active{color:var(--color-accent-deep);}
.nav-icon{font-size:20px; line-height:1;}
.nav-label{font-size:11px;}
.nav-btn.active .nav-label{font-weight:700;}
.nav-badge{position:absolute; top:10px; right:calc(50% - 22px); background:var(--color-alert); color:#fff;
  border-radius:var(--radius-pill); font-size:10px; font-weight:700; min-width:16px; height:16px;
  padding:0 4px; display:inline-flex; align-items:center; justify-content:center; line-height:1;}

.card{background:var(--color-surface); border:1px solid var(--color-border);
  border-radius:var(--radius-lg); padding:16px; margin-bottom:12px;}
/* 入力欄は高さ44。押せる・触れる要素の最小寸法を揃えるための指定。 */
.input{background:var(--color-surface); border:1px solid var(--color-border-strong);
  border-radius:var(--radius-md); padding:0 14px; height:44px; font-size:15px;
  color:var(--color-text); outline:none; width:100%; font-family:inherit; line-height:1.6;}
.input:focus{border-color:var(--color-accent); outline:2px solid var(--color-accent-tint); outline-offset:0;}
.input:focus-visible, .chip:focus-visible, button:focus-visible{outline:2px solid var(--color-accent); outline-offset:1px;}
select.input{padding-right:8px;}
.textarea{resize:vertical; height:auto; padding:12px 14px; line-height:1.8;}
.form-card{margin-bottom:12px;}
.form-col{display:flex; flex-direction:column; gap:8px;}
.form-col-tight{display:flex; flex-direction:column; gap:8px;}
.form-row{display:flex; gap:8px;}
.form-row-center{align-items:center;}
.input-strong{font-weight:700;}
.checkbox-label{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700;
  color:var(--color-text-sub); cursor:pointer; min-height:44px;}
.checkbox-label.nowrap{white-space:nowrap;}

/* ボタンは高さ44・角丸10・太字15で揃える。押せるものの寸法を一定にするため。 */
.btn-primary{flex:1; background:var(--color-accent); color:#fff; border:none;
  border-radius:var(--radius-md); height:44px; padding:0 20px; font-weight:700; font-size:15px;
  cursor:pointer; font-family:inherit; line-height:1;}
.btn-primary:hover{background:var(--color-accent-deep);}
.btn-primary:disabled{background:var(--color-border); color:#A5AEB8; cursor:default;}
.btn-primary.full{width:100%;}
.btn-ghost{height:44px; padding:0 20px; background:var(--color-surface);
  border:1px solid var(--color-border-strong); border-radius:var(--radius-md);
  color:var(--color-text); font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; line-height:1;}
.btn-ghost:hover{background:var(--color-bg);}
.btn-dash{background:var(--color-surface); border:1px dashed var(--color-border-strong);
  border-radius:var(--radius-md); height:44px; color:var(--color-text-sub); font-size:13px;
  font-weight:700; cursor:pointer; font-family:inherit;}
.dashed-trigger{width:100%; min-height:44px; padding:11px 14px; background:var(--color-surface);
  border:1px dashed var(--color-border-strong); border-radius:var(--radius-md); margin-bottom:12px;
  color:var(--color-text-sub); font-weight:700; cursor:pointer; font-family:inherit; font-size:13px;}
.dashed-trigger:hover{background:var(--color-bg);}

.empty{padding:32px 16px; text-align:center; color:var(--color-text-sub); font-size:15px; line-height:1.8;}
.empty-icon{font-size:32px; display:block; margin-bottom:8px;}
.empty-sub{font-size:13px; color:var(--color-text-sub); margin-top:6px;}

/* チップは高さ36の丸形。選択中はベタ塗りにせず、淡い面＋枠＋濃い文字にする。
   ベタ塗りを増やすと画面上の主役が増えて、白と余白が主体の設計が崩れるため。 */
.sortbar{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
.chip{height:36px; padding:0 14px; border-radius:var(--radius-pill); font-size:13px; font-weight:700;
  background:var(--color-surface); color:var(--color-text-sub); border:1px solid var(--color-border-strong);
  cursor:pointer; white-space:nowrap; font-family:inherit; line-height:1;}
.chip:hover{background:var(--color-bg);}
.chip-active{background:var(--color-accent-tint); color:var(--color-accent-ink); border-color:var(--color-accent);}
.kpi-filter{display:flex; gap:8px; overflow-x:auto; margin-bottom:14px; padding-bottom:2px;}


.avatar{border-radius:var(--radius-pill); display:flex; align-items:center; justify-content:center;
  font-weight:700; flex-shrink:0; line-height:1;}
.team-mgmt{background:var(--color-dusk-tint); color:var(--color-dusk-ink);}
.team-a{background:var(--color-accent-tint); color:var(--color-accent-ink);}
.team-b{background:var(--color-plum-tint); color:var(--color-plum-ink);}
.team-none{background:var(--color-bg); color:var(--color-text-sub); border:1px solid var(--color-border);}

/* バッジは淡い面＋濃い文字。角丸6で、丸ピルより情報寄りの見た目にする。 */
.badge{background:color-mix(in srgb, var(--bc) 14%, #fff); color:var(--bc);
  border-radius:var(--radius-sm); padding:0 9px; height:24px; font-size:12px; font-weight:700;
  white-space:nowrap; display:inline-flex; align-items:center; line-height:1;}

.post-card{}
.post-head{display:flex; gap:10px; margin-bottom:8px;}
.post-head-info{flex:1; min-width:0;}
.post-head-line{display:flex; flex-wrap:wrap; align-items:center; gap:6px;}
.post-name{font-weight:700; font-size:15px;}
.post-arrow{color:var(--text-4); font-size:12px;}
.post-to{font-weight:600; font-size:13px; color:var(--accent);}
/* 全員宛。個人宛の水色と同じ強さで出すと、名指しの投稿が埋もれる。
   誰か1人に向いていることのほうが目を引くべきなので、こちらは落とす。 */
.post-to-all{font-weight:400; color:var(--text-3);}
.post-time{color:var(--text-4); font-size:12px; margin-top:2px;}
.post-text{font-size:15px; color:var(--color-text); line-height:1.8; margin-bottom:10px; padding-left:48px; white-space:pre-wrap; word-break:break-word;}
.post-actions{display:flex; gap:5px; flex-wrap:wrap; padding-left:48px; position:relative;}
.react-peek{position:absolute; bottom:calc(100% + 6px); left:48px; max-width:calc(100% - 48px); z-index:20;
  background:var(--surface); border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow);
  padding:7px 10px; font-size:11px; color:var(--text-2); line-height:1.7; word-break:break-word;}
/* スタンプは高さ36の丸ボタン。自分が押したものだけ淡い水色の面＋枠で示す。 */
.react-btn{background:var(--color-surface); border:1px solid var(--color-border-strong);
  border-radius:var(--radius-pill); height:36px; padding:0 12px; font-size:14px;
  color:var(--color-text-sub); cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  font-family:inherit; font-weight:700; line-height:1;}
.react-btn:hover{background:var(--color-bg);}
.react-btn.react-mine{background:var(--color-accent-tint); border-color:var(--color-accent);
  color:var(--color-accent-ink);}
.react-count{font-size:13px;}
.comment-toggle-btn{background:var(--color-surface); border:1px solid var(--color-border-strong);
  border-radius:var(--radius-pill); height:36px; padding:0 12px; font-size:13px; font-weight:700;
  color:var(--color-text-sub); margin-left:auto; cursor:pointer; font-family:inherit; line-height:1;}
.comment-toggle-btn:hover{background:var(--color-bg);}
.comments{margin-top:12px; padding-left:48px;}
.comment-row{display:flex; gap:8px; margin-bottom:8px;}
.comment-bubble{background:var(--color-bg); border:1px solid var(--color-border);
  border-radius:var(--radius-md); padding:8px 12px; font-size:13px; line-height:1.8;}
.comment-name{font-weight:700;}
.comment-text{color:var(--color-text-sub);}
.comment-input-row{display:flex; gap:8px; margin-top:8px; align-items:center;}
.comment-input{font-size:13px;}

/* コメント欄。以前は投稿本文との境目が無く、どこからがコメントなのか、
   そもそも書けるのかが読み取れなかった。左に線を引いて一段下げる。 */
.comments{border-left:2px solid var(--color-border); padding-left:14px; margin-left:12px;}
.comments-label{font-size:12px; font-weight:700; color:var(--color-text-sub); margin-bottom:8px;}
.comment-empty{font-size:12px; color:var(--color-text-sub); opacity:0.75; padding:4px 0 8px;}
.comment-bubble-head{display:flex; align-items:baseline; gap:8px; margin-bottom:2px;}
.comment-time{font-size:11px; color:var(--color-text-sub); opacity:0.75;}
.comment-bubble .comment-text{color:var(--color-text);}
/* 送信ボタン。Enter だけだと、変換確定と区別が付かず送れないことがある */
.comment-send{flex-shrink:0; min-height:36px; padding:0 14px; border:none;
  border-radius:var(--radius-pill); background:var(--color-accent); color:#fff;
  font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; line-height:1;}
.comment-send:hover{background:var(--color-accent-deep);}
.comment-toggle-on{background:var(--color-accent-tint); border-color:var(--color-accent);
  color:var(--color-accent-ink);}

/* 過去の投稿。閉じているときは1行、開くと月ごとの見出しを挟んで並ぶ */
.archive-trigger{display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; min-height:44px; margin-top:16px; padding:11px 14px;
  background:var(--color-surface); border:1px solid var(--color-border-strong);
  border-radius:var(--radius-md); font-size:13px; font-weight:700;
  color:var(--color-text-sub); cursor:pointer; font-family:inherit;}
.archive-trigger:hover{background:var(--color-bg);}
.archive-trigger-open{border-color:color-mix(in srgb, var(--color-accent) 45%, transparent);
  color:var(--color-accent-ink); background:var(--color-accent-tint);}
.archive-count{background:var(--color-border); color:var(--color-text-sub);
  border-radius:var(--radius-pill); padding:1px 8px; font-size:12px;}
.archive-body{margin-top:10px;}
/* サンクスカードの補足。0件のときに「まだ無い」のか「壊れている」のかを
   数字の下で言い切るための行。 */
.side-note{margin-top:6px; font-size:11px; line-height:1.6; color:var(--color-text-sub);}
/* 月の一覧。件数を右端に寄せて、月の名前だけを縦に読めるようにする。 */
.side-months .side-link{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.side-months .side-due{flex:none; margin:0; font-variant-numeric:tabular-nums;}
.archive-month-head{position:sticky; top:0; z-index:1; padding:8px 2px; margin-bottom:6px;
  background:var(--color-bg); font-size:12px; font-weight:700; color:var(--color-text-sub);
  border-bottom:1px solid var(--color-border);}
/* 過去のものだと分かるよう、現行より一段落とす。押せば通常どおり操作できる */
.archive-month .card{opacity:0.9;}

/* 自分で決める期限 */
.task-plan{display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-top:10px;
  padding:10px 12px; background:var(--color-bg); border:1px solid var(--color-border);
  border-radius:var(--radius-md);}
.task-plan-label{font-size:12px; font-weight:700; color:var(--color-text-sub);}
.task-plan-input{flex:0 1 auto; font-size:13px;}
.task-plan-clear{background:none; border:none; padding:4px 6px; font-size:12px;
  color:var(--color-text-sub); text-decoration:underline; cursor:pointer; font-family:inherit;}
.task-plan-late{border-color:color-mix(in srgb, var(--amber) 50%, transparent);
  background:var(--color-dusk-tint);}
.task-plan-warn{flex-basis:100%; font-size:12px; font-weight:700; color:var(--color-dusk-ink);}
.reader-chip-note{font-size:11px; color:var(--color-text-sub); opacity:0.85;}
.mytask-plan{display:block; font-size:11px; font-weight:400; color:var(--color-text-sub);
  margin-top:1px;}
.mytask-plan-late{color:var(--color-dusk-ink); font-weight:700;}

/* 座席表。原本の格子をそのままの並びで出す */
.seat-card{padding:12px;}
.seat-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px;}
.seat-title{font-size:14px; font-weight:700; color:var(--color-text);}
.seat-sub{font-size:11px; color:var(--color-text-sub); opacity:0.8;}
.seat-toggle{display:flex; gap:6px; margin-left:auto;}
.seat-empty{font-size:13px; color:var(--color-text-sub); line-height:1.7; padding:6px 2px;}
.seat-hint{font-size:11px; color:var(--color-text-sub); margin-bottom:6px;}
.seat-hint-me{display:inline-block; border:2px solid var(--color-accent); border-radius:4px;
  padding:0 4px; color:var(--color-accent-deep); font-weight:700;}
.seat-changed{font-size:12px; font-weight:700; color:var(--color-dusk-ink);
  background:var(--color-dusk-tint); border-radius:var(--radius-md);
  padding:6px 10px; margin-bottom:8px;}
/* 席の並びは横に広い（実物で19列ある）。畳んで折り返すと配置の意味が
   壊れるので、横スクロールさせる（ページ全体ではなく、この箱の中だけ）。

   縦にも上限を置く。実物は21行あり、そのまま出すとスマホ画面をほぼ
   埋めてしまい、下のシフト表に届くまで1画面ぶんスクロールすることになる。
   座席表を一番上に置く判断と、シフト表が読めることは両立させたい。 */
/* -webkit-overflow-scrolling:touch は付けない。iOS でこれが付いた要素の上を
   スワイプすると、その要素が動かせない向きでもスクロールが親に伝わらず、
   ページごと止まって見えることがある。慣性スクロールは今の iOS では既定。 */
.seat-scroll{overflow:auto; max-height:58vh; max-height:58dvh;
  background:var(--color-bg); border:1px solid var(--color-border);
  border-radius:var(--radius-md); padding:6px;}

/* 罫線で全マスを囲むのはやめ、マスの間に隙間を空けて「席が並んでいる」
   形として見せる。原本をそのまま罫線で写すと、名前・塗り・空マスが
   すべて同じ強さで並び、どこに誰がいるのかを目で追えなかった。 */
.seat-table{border-collapse:separate; border-spacing:2px; table-layout:auto;}
.seat-cell{padding:5px 7px; font-size:11px; line-height:1.5; color:#202124;
  white-space:nowrap; text-align:center; min-width:54px;
  border-radius:5px; vertical-align:middle;}
.seat-name{display:block;}

/* 名前の入ったマスだけ、アプリのカードと同じ地色と枠を持たせて浮かせる */
.seat-cell-text{background:var(--color-surface); border:1px solid var(--color-border);
  color:var(--color-text); font-weight:500;}
/* 塗りだけのマス（壁・通路・机の区切り）。配置を形づくる背景として、
   名前より一段弱く出す。消すと席の位置が読めなくなるので残す。 */
.seat-cell-blank{border:none;}
/* 濃い塗りの空マスは、そのまま出すと黒い帯になって名前より目立つ。
   薄くして「そこに何かある」ことだけを残す。 */
.seat-cell-blank.seat-cell-fill{opacity:0.28;}
/* 原本の塗りが入るマスは、その色を活かすので枠を持たせない */
.seat-cell-fill{border-color:transparent;}

/* 自分の席。原本の背景色は塗り替えない（色が遅番などの意味を持つため）。
   枠と太字だけを重ねる。暗い塗りの上でも見えるよう、影で縁取る。 */
.seat-cell-me{outline:2px solid var(--color-accent); outline-offset:1px;
  box-shadow:0 0 0 3px color-mix(in srgb, var(--color-accent) 22%, transparent);
  font-weight:700;}
.seat-cell-me.seat-cell-text{color:var(--color-accent-deep);}
/* 原本では名前が隠れているが、そこが自分の席という場合。
   名前の代わりに「あなた」とだけ出す（他人の隠れた名前は出さない）。 */
.seat-cell-me-hidden .seat-name{font-size:10px; letter-spacing:0.04em; opacity:0.95;}

/* 掲示板の送信ボタン。フォーム内でいちばん大きく、迷わないようにする */
/* height を上書きしているのは、.btn-primary が 44px 固定のため
   （2行入れるので、内容に合わせて伸びる必要がある） */
.board-submit{display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2px; width:100%; height:auto; min-height:60px; padding:10px 14px; margin-top:4px;}
.board-submit-main{font-size:15px; font-weight:700; line-height:1.4;}
.board-submit-sub{font-size:11px; font-weight:400; opacity:0.85; line-height:1.4;}

.board-card{cursor:default;}
/* 投稿者はカードの先頭。誰の連絡かを読む前に分かるようにする */
.board-head{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
.board-head-who{display:flex; flex-direction:column; min-width:0;}
.board-author{font-size:14px; font-weight:700; color:var(--color-text);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.board-author-role{font-size:11px; color:var(--color-text-mute);}
.board-meta{display:flex; align-items:center; gap:6px; margin-bottom:6px;}
.board-time{margin-left:auto; flex:none; color:var(--text-4); font-size:11px;}
/* 掲示板のリアクションはアイコンぶんの字下げが要らない（本文が左端から始まる） */
.post-actions-board{padding-left:0; margin:2px 0 8px;}
.board-title{font-weight:700; font-size:17px; color:var(--text); margin-bottom:6px;}
.board-body{font-size:15px; color:var(--color-text); line-height:1.8; margin-bottom:8px; white-space:pre-wrap; word-break:break-word;}
.board-footer{display:flex; align-items:center; gap:6px;}
.board-footer-text{font-size:11px; color:var(--text-4);}
.reader-toggle{margin-left:auto; display:flex; align-items:center; gap:6px; background:transparent; border:1px solid var(--border); border-radius:99px; padding:3px 9px; font-size:11px; color:var(--text-3); cursor:pointer; font-family:inherit; white-space:nowrap;}
.reader-toggle-open{border-color:color-mix(in srgb, var(--accent) 40%, transparent); color:var(--accent);}
.reader-toggle-unread{background:color-mix(in srgb, var(--red) 14%, transparent); color:var(--red); border-radius:99px; padding:0 6px; font-weight:700;}
.reader-caret{font-size:8px; color:var(--text-4);}
.reader-panel{margin-top:10px; padding-top:10px; border-top:1px solid var(--border);}
.reader-group{margin-bottom:10px;}
.reader-group:last-child{margin-bottom:0;}
.reader-label{font-size:11px; font-weight:700; color:var(--text-4); margin-bottom:6px; letter-spacing:0.04em;}
.reader-label-unread{color:var(--red);}
.reader-label-done{color:var(--green);}
.reader-chips{display:flex; flex-wrap:wrap; gap:5px;}
.reader-chip{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--border); border-radius:99px; padding:2px 9px 2px 3px; font-size:12px; color:var(--text-2); background:var(--surface);}
.reader-chip-unread{border-color:color-mix(in srgb, var(--red) 35%, transparent); background:color-mix(in srgb, var(--red) 8%, var(--surface)); color:var(--text); font-weight:600;}
.reader-chips-muted .reader-chip{opacity:0.6; font-size:11px;}

/* ── 公開範囲（非公開の投稿） ─────────────────────────── */
.sbadge-private{background:color-mix(in srgb, var(--color-dusk) 18%, transparent);
  color:var(--color-dusk-ink);}
.vis-wrap{display:flex; flex-direction:column; gap:6px;}
.vis-toggle-label{font-weight:700;}
/* チェックが入っているときだけメンバー選択を出す。JS を挟まないので
   描き直しが起きず、入力途中の本文が消えない。 */
.vis-members{display:none; flex-direction:column; gap:6px;
  padding:8px; border-radius:var(--radius-md);
  background:var(--color-bg); border:1px solid var(--color-border);}
.vis-wrap:has(.vis-toggle:checked) .vis-members{display:flex;}
.vis-note{font-size:11px; color:var(--color-text-sub); line-height:1.6;}
.vis-note b{color:var(--red);}
.target-chip-fixed{opacity:0.7; cursor:default;}

/* ── 期日カレンダー ──────────────────────────────────── */
.cal-trigger{display:flex; align-items:center; justify-content:center; gap:6px;
  width:100%; min-height:40px; margin-bottom:10px; padding:0 12px;
  border:1px solid var(--color-border); border-radius:var(--radius-md);
  background:var(--color-surface); font-family:inherit; font-size:13px;
  font-weight:700; color:var(--color-text-sub); cursor:pointer;}
.cal-trigger-open{border-color:color-mix(in srgb, var(--color-accent) 45%, transparent);
  color:var(--color-accent-ink);}
.cal-card{padding:12px; margin-bottom:10px;}
.cal-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
.cal-title{flex:1; text-align:center; font-size:13px; font-weight:700; color:var(--color-text);}
.cal-nav{width:32px; height:32px; flex:none; border:1px solid var(--color-border);
  border-radius:var(--radius-sm); background:var(--color-surface);
  font-size:16px; line-height:1; color:var(--color-text-sub); cursor:pointer;}
.cal-grid{display:grid; grid-template-columns:repeat(7, 1fr); gap:2px;}
.cal-dow{text-align:center; font-size:10px; font-weight:700;
  color:var(--color-text-mute); padding-bottom:4px;}
/* 日付の枠は正方形に近づける。空いている日と詰まっている日を形で見せたいので、
   高さを内容任せにせず揃える。 */
.cal-cell{aspect-ratio:1/1; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:2px; border-radius:var(--radius-sm);
  background:var(--color-bg); font-size:11px; color:var(--color-text-sub);}
.cal-blank{background:transparent;}
.cal-sun{color:var(--red);}
.cal-sat{color:var(--color-accent-ink);}
.cal-today{outline:2px solid var(--color-accent); outline-offset:-2px; font-weight:700;}
.cal-has{background:var(--color-track);}
.cal-has-mine{background:color-mix(in srgb, var(--red) 12%, var(--color-track));}
.cal-day{line-height:1;}
.cal-pips{display:flex; align-items:center; gap:2px;}
.cal-pip{width:5px; height:5px; border-radius:50%; background:var(--color-text-mute);}
.cal-pip-mine{background:var(--red);}
.cal-more{font-size:8px; color:var(--color-text-mute);}
.cal-list{margin-top:10px; padding-top:10px; border-top:1px solid var(--color-border);
  display:flex; flex-direction:column;}
.cal-row{display:flex; align-items:center; gap:8px; min-height:32px; font-size:12px;}
.cal-row-date{flex:none; width:38px; font-weight:700; color:var(--color-text-sub);}
.cal-row-title{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; color:var(--color-text);}
.cal-row-mine{font-weight:700;}
.cal-row-left{flex:none; font-size:11px; color:var(--color-text-mute);}
.cal-none{margin-top:10px; padding-top:10px; border-top:1px solid var(--color-border);
  font-size:12px; color:var(--color-text-mute); text-align:center;}

/* ── 掲示板の添付画像 ────────────────────────────────── */
/* 読み込み前から縦横比どおりの箱を置く。あとから高さが決まると、
   読んでいる途中の文章が下にずれて視線が飛ぶ。 */
.post-img-box{display:block; width:100%; max-width:520px; margin:0 0 10px;
  padding:0; border:1px solid var(--color-border); border-radius:var(--radius-md);
  overflow:hidden; background:var(--color-track); cursor:zoom-in;}
.post-img{display:block; width:100%; height:100%; object-fit:cover;}
.post-img-empty{display:flex; align-items:center; justify-content:center; cursor:default;}
.post-img-note{font-size:12px; color:var(--color-text-mute); padding:0 12px; text-align:center;}
.post-img-spin{width:20px; height:20px; border-radius:50%;
  border:2px solid var(--color-border-strong); border-top-color:transparent;
  animation:img-spin 0.8s linear infinite;}
@keyframes img-spin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion: reduce){ .post-img-spin{animation:none;} }

/* 拡大表示。縮小済みなのでこれが原寸 */
.lightbox-img{max-width:min(96vw, 1280px); max-height:92vh; object-fit:contain;
  border-radius:var(--radius-md); background:var(--color-surface);}
.lightbox-close{position:fixed; top:12px; right:12px; width:40px; height:40px;
  border-radius:50%; border:none; background:rgba(0,0,0,0.55); color:#fff;
  font-size:22px; line-height:1; cursor:pointer;}

/* 添付欄（投稿フォーム・編集フォーム共用） */
.img-pick{display:flex; flex-direction:column; gap:8px; padding-top:10px;
  border-top:1px dashed var(--color-border);}
.img-pick-btn{align-self:flex-start; display:inline-flex; align-items:center;
  min-height:40px; padding:0 14px; border:1px dashed var(--color-border-strong);
  border-radius:var(--radius-md); background:var(--color-surface);
  font-size:13px; font-weight:700; color:var(--color-text-sub); cursor:pointer;}
.img-pick-preview{display:flex; flex-direction:column; gap:6px; align-items:flex-start;}
.img-pick-preview img{max-width:100%; max-height:200px; border-radius:var(--radius-md);
  border:1px solid var(--color-border);}
.img-pick-loading{width:160px; aspect-ratio:3/2; border:1px solid var(--color-border);
  border-radius:var(--radius-md);}
.img-pick-meta{font-size:11px; color:var(--color-text-mute);}
.img-pick-clear{align-self:flex-start; min-height:36px; font-size:12px;}

/* 送信できない理由。ボタンの直前に出して、押した場所の近くで読ませる */
.form-error{font-size:12px; font-weight:700; color:var(--red);
  background:color-mix(in srgb, var(--red) 8%, transparent);
  border:1px solid color-mix(in srgb, var(--red) 30%, transparent);
  border-radius:var(--radius-sm); padding:8px 10px;}
.form-error[hidden]{display:none;}

/* ── チェックリスト ──────────────────────────────────── */
/* 連絡事項の本文と地続きに見えないよう、面を一段落として囲む。
   「読むところ」と「押すところ」を目で分けるため。 */
.task-block{margin:10px 0; padding:10px; border-radius:var(--radius-md);
  background:var(--color-bg); border:1px solid var(--color-border);}
.task-head{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.task-head-label{font-size:11px; font-weight:700; color:var(--color-text-sub); letter-spacing:0.04em;}
.task-head .reader-toggle{margin-left:auto;}
/* 押し間違いが起きると他人の未完了リストが狂うので、指1本で確実に
   押せる高さを確保する（44px は tokens.css の最小タップ領域と同じ） */
.task-check{display:flex; align-items:center; gap:10px; width:100%; min-height:44px;
  padding:0 12px; border:1px solid var(--color-border-strong); border-radius:var(--radius-md);
  background:var(--color-surface); color:var(--color-text); font-family:inherit;
  font-size:14px; font-weight:700; cursor:pointer; text-align:left;}
.task-check-done{border-color:var(--green); color:var(--color-text-sub); font-weight:400;}
.task-box{flex:none; width:22px; height:22px; border-radius:var(--radius-sm);
  border:1px solid var(--color-border-strong); background:var(--color-surface);
  display:inline-flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:700;}
.task-check-done .task-box{background:var(--green); border-color:var(--green); color:#fff;}
.task-note{font-size:12px; color:var(--color-text-mute); padding:6px 2px;}

/* 人ごとの期日（カード内の「誰がいつまでに」） */
.perdue-summary{margin-top:10px; padding-top:10px; border-top:1px solid var(--color-border);}
.perdue-summary-label{font-size:11px; font-weight:700; color:var(--color-text-mute);
  letter-spacing:0.04em; margin-bottom:6px;}
.perdue-line{display:flex; gap:8px; align-items:flex-start; padding:3px 0;}
.perdue-date{flex:none; font-size:12px; font-weight:700; color:var(--color-text-sub);
  min-width:92px;}
.perdue-soon{color:var(--color-dusk-ink);}
.perdue-late{color:var(--red);}
.perdue-who{display:flex; flex-wrap:wrap; gap:4px;}
.perdue-chip{display:inline-flex; align-items:center; gap:4px; font-size:12px;
  border:1px solid var(--color-border); border-radius:var(--radius-pill);
  padding:1px 8px 1px 3px; background:var(--color-surface); color:var(--color-text-sub);}
.perdue-chip-me{border-color:var(--color-accent); font-weight:700; color:var(--color-accent-ink);}
.perdue-chip-done{opacity:0.55;}
.perdue-check{color:var(--green); font-weight:700;}

/* 人ごとの期日の入力欄 */
.perdue-list{display:flex; flex-direction:column; gap:4px; padding:6px 0 2px;}
.perdue-row{display:flex; align-items:center; gap:8px;}
.perdue-name{flex:1; min-width:0; font-size:12px; color:var(--color-text-sub);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.perdue-input{flex:none; height:36px; font-size:12px;}

/* 日付欄は中身の幅にとどめる。
   .input は width:100% なので、日付欄も欄いっぱいに伸びていた。
   その結果、日付の文字は左端、カレンダーを開くアイコンは右端に離れ、
   開くために毎回カードの端まで指を運ぶことになっていた（利用者からの指摘）。
   幅を内容に合わせると、アイコンが日付のすぐ隣に来る。 */
.input[type="date"]{width:auto; max-width:100%; min-width:0;}
/* 押せる幅を確保する。内容幅だけだと端末によっては窮屈になる */
.task-fields>.input[type="date"]{min-width:190px; align-self:flex-start;}

/* カレンダー一覧の名前 */
.cal-row-who{flex:none; display:flex; flex-wrap:wrap; gap:3px; justify-content:flex-end;
  max-width:52%;}
.cal-who{font-size:11px; color:var(--color-text-sub); background:var(--color-track);
  border-radius:var(--radius-pill); padding:0 6px;}
.cal-who-me{background:var(--color-accent-tint); color:var(--color-accent-ink); font-weight:700;}
.cal-who-done{opacity:0.5;}
.sbadge-late{background:color-mix(in srgb, var(--red) 14%, transparent); color:var(--red);}

/* 入力欄（投稿フォーム・編集フォーム共用） */
.task-fields{display:flex; flex-direction:column; gap:6px; padding-top:10px;
  border-top:1px dashed var(--color-border);}
.task-fields-label{font-size:12px; font-weight:700; color:var(--color-text-sub);}
.target-picker{font-size:12px;}
/* summary に display:flex を当てると、ブラウザ既定の開閉マーク（▶）が消える。
   その結果「対象者を選ぶ」「人ごとに期日を変える」が、押せると分からない
   ただの薄い文字になっていた。マークを自前で描いて押せることを示す。 */
.target-picker>summary{cursor:pointer; color:var(--color-text-sub); padding:6px 0;
  display:flex; align-items:center; gap:6px; min-height:32px;}
.target-picker>summary::-webkit-details-marker{display:none;}
.target-picker>summary::before{content:"▶"; font-size:9px; color:var(--color-text-mute);
  transition:transform 0.15s; flex:none;}
.target-picker[open]>summary::before{transform:rotate(90deg);}
.target-picker>summary:hover{color:var(--color-accent-ink);}
@media (prefers-reduced-motion: reduce){ .target-picker>summary::before{transition:none;} }
.target-hint{color:var(--color-text-mute); font-weight:400;}
.target-chips{display:flex; flex-wrap:wrap; gap:5px; padding:6px 0 2px;}
.target-chip{display:inline-flex; align-items:center; gap:5px; cursor:pointer;
  border:1px solid var(--color-border); border-radius:var(--radius-pill);
  padding:3px 9px 3px 5px; font-size:12px; color:var(--color-text-sub);
  background:var(--color-surface); min-height:32px;}
.target-chip:has(input:checked){border-color:var(--color-accent);
  background:var(--color-accent-tint); color:var(--color-accent-ink); font-weight:600;}

/* 自分の未完了だけを掲示板の先頭に出す小さな一覧 */
.mytask-card{padding:12px; border-color:color-mix(in srgb, var(--color-accent) 45%, transparent);}
.mytask-head{font-size:12px; font-weight:700; color:var(--color-accent-ink); margin-bottom:8px;}
.mytask-row{display:flex; align-items:center; gap:10px; width:100%; min-height:44px;
  padding:0 4px; background:transparent; border:none; border-top:1px solid var(--color-border);
  font-family:inherit; font-size:14px; color:var(--color-text); cursor:pointer; text-align:left;}
.mytask-row:first-of-type{border-top:none;}
.mytask-title{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.mytask-due{flex:none; font-size:11px; font-weight:700; color:var(--color-text-mute);}
.mytask-due-soon{color:var(--color-dusk-ink);}
.mytask-due-late{color:var(--red);}

.survey-head{display:flex; gap:8px; margin-bottom:10px; align-items:flex-start;}
.survey-title{font-weight:700; font-size:17px; color:var(--text);}
.survey-meta{font-size:11px; color:var(--text-4);}
.survey-opt-row{margin-bottom:8px; cursor:pointer;}
.survey-opt-line{display:flex; justify-content:space-between; margin-bottom:3px;}
.survey-opt-label{font-size:13px; color:var(--text-2);}
.survey-opt-label.voted{color:var(--accent); font-weight:700;}
.survey-opt-count{font-size:12px; color:var(--text-4);}
.bar-bg{height:6px; background:var(--color-track); border-radius:var(--radius-pill); overflow:hidden;}
.bar-fill{height:100%; border-radius:99px;}
@media (prefers-reduced-motion:no-preference){ .bar-fill{transition:width 0.3s;} }
.survey-total{margin-top:8px; text-align:right; font-size:12px; color:var(--text-4);}
.survey-foot{margin-top:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.survey-total-text{font-size:12px; color:var(--text-4);}
.survey-closed{color:var(--red); margin-left:8px; font-weight:700;}
.survey-privacy{margin-top:8px; font-size:10px; color:var(--text-4); line-height:1.6;}

.team-block{margin-bottom:14px;}
.team-block-title{font-size:12px; font-weight:700; color:var(--text-4); margin-bottom:8px; letter-spacing:0.05em; position:sticky; left:0; background:var(--bg); display:inline-block; padding:6px 0 2px;}

.shift-note{font-size:12px; color:var(--text-4); margin-bottom:10px;}
.sync-warn{border-radius:8px; padding:9px 12px; font-size:12px; line-height:1.7; margin-bottom:10px;}
.sync-warn-bad{background:color-mix(in srgb, var(--red) 12%, transparent); border:1px solid color-mix(in srgb, var(--red) 32%, transparent); color:var(--red); font-weight:600;}
.sync-warn-soft{background:color-mix(in srgb, var(--amber) 12%, transparent); border:1px solid color-mix(in srgb, var(--amber) 32%, transparent); color:var(--amber-c);}
.shift-scroll{overflow-x:auto; border:1px solid var(--border); border-radius:12px; background:var(--surface);}
.shift-row{display:flex; border-bottom:1px solid var(--border);}
.shift-row:last-child{border-bottom:none;}
.shift-header-row{background:var(--input-bg); position:sticky; top:0; z-index:2;}
.shift-name-cell{position:sticky; left:0; z-index:1; background:var(--surface); width:92px; flex-shrink:0; display:flex; align-items:center; gap:6px; padding:6px 8px; font-size:12px; font-weight:600; color:var(--text); border-right:1px solid var(--border); overflow:hidden; white-space:nowrap;}
.shift-header-row .shift-name-cell{background:var(--input-bg); font-weight:700; color:var(--text-3);}
.shift-name-head{justify-content:center;}
.shift-days{display:flex; flex:1;}
.shift-cell{width:28px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; padding:7px 0; color:var(--text-3); border-right:1px solid var(--border);}
.shift-cell:last-child{border-right:none;}
.shift-date-head{flex-direction:column; font-size:10px; line-height:1.3; font-weight:700; color:var(--text-4); gap:1px;}
/* 週表示は列が7つしかないので、セルを広げて「早番」まで書く。
   月表示は31列を詰めるので狭いまま「早」だけにする。 */
.shift-week .shift-cell{width:auto; flex:1; min-width:38px; font-size:11px;}
.shift-week .shift-date-head{font-size:11px;}
.shift-today{box-shadow:inset 0 0 0 2px var(--color-accent);}
.shift-date-head.shift-today{background:var(--color-accent-tint); color:var(--color-accent-deep);}
/* 区分は文字色ではなく背景で塗る。文字を読まずに早/遅が判別できるようにするため。
   色は必ず文字と併記する二重符号化。未提出だけは斜線＋破線枠にしてあり、
   色が見えない環境でも他と区別できる。 */
/* シフト区分の色は必ず --shift-* トークン経由で書く。
   以前ここは #DCEFFA のような直書きだった。トークンを用意してあるのに
   使っていなかったため、ダークモードで上書きが効かず、暗い地に淡い水色の
   マスがそのまま出ていた。塗り・文字・枠の3点セットで意味を持つので、
   3つとも同じ組から取ること。 */
.shift-early{background:var(--shift-early-bg); color:var(--shift-early-fg); border-color:var(--shift-early-border); font-weight:700;}
.shift-late{background:var(--shift-late-bg); color:var(--shift-late-fg); border-color:var(--shift-late-border); font-weight:700;}
.shift-night{background:var(--shift-night-bg); color:var(--shift-night-fg); border-color:var(--shift-night-border); font-weight:700; font-size:10px;}
.shift-other{background:var(--color-dusk-tint); color:var(--color-dusk-ink); font-weight:700;
  font-size:9px; line-height:1.2; text-align:center;}
.shift-off{background:var(--shift-off-bg); color:var(--shift-off-fg);}
/* 未提出＝シフト表にその人の行が無い。休み（行はあるが空欄）とは別物として出す。 */
.shift-none{background:repeating-linear-gradient(135deg,var(--color-surface),var(--color-surface) 5px,var(--color-track) 5px,var(--color-track) 10px);
  color:var(--color-text-mute); font-size:10px; border-color:var(--color-border-strong);}
.shift-name-cell.shift-name-none{color:var(--text-4);}
.shift-count-row{background:var(--input-bg); border-top:2px solid var(--border);}
.shift-count-row .shift-name-cell{background:var(--input-bg); font-weight:700; color:var(--text-3); font-size:11px;}
.shift-count-cell{flex-direction:column; gap:1px; font-size:10px; line-height:1.25; font-weight:700;}
.shift-count-early{color:var(--shift-early-fg);}
.shift-count-late{color:var(--shift-late-fg);}
.shift-legend{display:flex; gap:14px; margin-top:10px; font-size:11px; color:var(--text-4); flex-wrap:wrap;}

/* ── 投稿フォーム ── */
.composer{padding:14px 16px;}
.composer-row{display:flex; gap:12px; align-items:flex-start;}
.composer-input{flex:1; min-width:0; border:none; background:transparent; resize:none;
  font-family:inherit; font-size:15px; line-height:1.8; color:var(--color-text);
  padding:8px 0; outline:none;}
.composer-input::placeholder{color:var(--color-text-mute);}
.composer-foot{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:8px;}
.pickchip{height:36px; max-width:190px; padding:0 12px; border-radius:var(--radius-pill);
  border:1px dashed var(--color-border-strong); background:var(--color-surface);
  color:var(--color-text-sub); font-family:inherit; font-size:13px; cursor:pointer;}
.pickchip:focus-visible{outline:2px solid var(--color-accent); outline-offset:1px;}
.pickchip-type{border-style:solid;}
.btn-post{margin-left:auto; min-height:44px; padding:0 26px; border:none;
  border-radius:var(--radius-md); background:var(--color-accent); color:#fff;
  font-family:inherit; font-size:15px; font-weight:700; cursor:pointer;}
.btn-post:hover{background:var(--color-accent-deep);}

/* ── 目標進捗（広い画面） ── */
.prog-cols{display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:20px; align-items:start;}
.prog-main{min-width:0;}
.prog-side{display:flex; flex-direction:column; gap:12px;}
.prog-bar-marked{position:relative; overflow:visible;}
.prog-marker{position:absolute; top:-5px; width:2px; height:20px;
  background:var(--color-text); border-radius:1px;}
.prog-plan{margin-top:6px; font-size:12px; color:var(--color-text-sub);}

.wk-card{padding:14px 16px;}
/* 列は「上」で揃える。下端で揃えてはいけない。
   列の中身は 棒（高さ110px固定）→ 週ラベル → 実績値 の縦並びで、
   実績値だけが幅次第で1行にも2行にもなる（狭い端末では「251.1万」が
   「251.1」「万」に折り返す）。下端で揃えると、折り返した列だけ
   棒が 21px ぶん持ち上がり、グラフが階段状にずれる。
   棒の高さを比べるグラフなので、土台がずれるのは致命的。
   棒の高さは固定なので、上で揃えれば上端も下端も必ず一致する。 */
.wk-grid{display:flex; align-items:flex-start; gap:8px; margin:10px 0 6px;}
.wk{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:4px;}
.wk-col{position:relative; width:100%; height:110px; display:flex; align-items:flex-end;
  background:var(--color-track); border-radius:var(--radius-sm); overflow:visible;}
.wk-bar{width:100%; background:var(--color-accent); border-radius:var(--radius-sm); min-height:2px;}
.wk-bar-none{background:var(--color-border);}
/* 目標線。bottom:◯% は「線の下端」をその高さに置くので、線は常に目標より
   2px 上に出る。目標と実績が同じ週でも棒が線に届いていないように見え、
   目標がその月の最大値になる週（bottom:100%）では線がトラックの外に
   浮いてしまう。線の中心が目標の高さに来るよう半分ぶん下げる。 */
.wk-target{position:absolute; left:-2px; right:-2px; height:2px; background:var(--color-text);
  opacity:.55; transform:translateY(50%);}
.wk-label{font-size:11px; color:var(--color-text-sub); white-space:nowrap;}
.wk-val{font-size:12px; font-weight:700;}
.wk-legend{font-size:11px; color:var(--color-text-mute); line-height:1.7;}

/* ── 週の達成率 ──
   達成の色は3段。100%以上＝達成、90%以上＝あと少し、それ未満＝落ちている。
   目標進捗に赤は使わない方針なので、落ちている側も警告色（琥珀）までに留める。 */
.rate-ok   .rate-fill, .rate-fill.rate-ok  {background:var(--green);}
.rate-near .rate-fill, .rate-fill.rate-near{background:var(--color-accent);}
.rate-low  .rate-fill, .rate-fill.rate-low {background:var(--amber);}
.rate-list{display:flex; flex-direction:column; gap:7px; margin:10px 0 8px;}
.rate-row{display:flex; align-items:center; gap:8px;}
.rate-label{flex:none; width:52px; font-size:11px; color:var(--color-text-sub);
  white-space:nowrap;}
.rate-track{flex:1; min-width:0; height:8px; background:var(--color-track);
  border-radius:var(--radius-pill); overflow:hidden;}
.rate-fill{display:block; height:100%; border-radius:var(--radius-pill);
  background:var(--color-accent);}
.rate-pct{flex:none; width:42px; text-align:right; font-size:12px; font-weight:700;
  font-variant-numeric:tabular-nums; color:var(--color-text-sub);}
.rate-pct.rate-ok{color:var(--color-grow-ink);}
.rate-pct.rate-low{color:var(--color-dusk-ink);}

/* ── 日ごとの達成率 ──
   棒の領域（.dr-plot）と日付ラベル（.dr-labels）を分けている。
   同じ箱に入れると、棒はラベルを除いた高さを基準にするのに対し、
   100%の線は箱全体を基準にすることになり、両者の基準がずれる。 */
.dr-plot{position:relative; height:96px; margin:14px 0 0;}
.dr-cols{display:flex; align-items:flex-end; gap:3px; height:100%;}
.dr{flex:1; min-width:0; height:100%; display:flex; align-items:flex-end;}
.dr-bar{width:100%; border-radius:2px 2px 0 0; min-height:2px; background:var(--color-accent);}
.dr-labels{display:flex; gap:3px; margin-top:4px;}
.dr-lb{flex:1; min-width:0; text-align:center; font-size:9px; line-height:1;
  color:var(--color-text-mute);}
.dr-bar.rate-ok{background:var(--green);}
.dr-bar.rate-near{background:var(--color-accent);}
.dr-bar.rate-low{background:var(--amber);}
/* 100%の線。棒の高さだけでは達成しているかが読み取れない */
.dr-line{position:absolute; left:0; right:0; height:1px; background:var(--color-text);
  opacity:.45; pointer-events:none; z-index:1;}
.dr-sum{display:flex; flex-direction:column; gap:4px; margin-top:10px;
  padding-top:10px; border-top:1px solid var(--color-border);}
.dr-sum-row{display:flex; justify-content:space-between; align-items:baseline;
  font-size:11px; color:var(--color-text-sub);}
.dr-sum-row b{font-size:13px; color:var(--color-text); font-variant-numeric:tabular-nums;}

/* ── 本日のシフトサマリー（広い画面） ── */
.tsum{margin-bottom:14px;}
.tsum-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:10px;}
.tsum-total{font-size:20px; font-weight:700;}
.tsum-rest{font-size:13px; color:var(--color-text-sub); margin-left:auto;}
.tsum-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:12px;
  align-items:start;}
.tcard{padding:12px 14px;}
.tcard-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
.tcard-time{font-size:12px; color:var(--color-text-sub);}
.tcard-num{margin-left:auto; font-size:26px; font-weight:700; line-height:1;}
.shift-early-card{background:color-mix(in srgb, var(--shift-early-bg) 30%, var(--color-surface));
  border-color:var(--shift-early-border);}
.shift-late-card{background:color-mix(in srgb, var(--shift-late-bg) 30%, var(--color-surface));
  border-color:var(--shift-late-border);}
.shift-night-card{background:color-mix(in srgb, var(--shift-night-bg) 30%, var(--color-surface));
  border-color:var(--shift-night-border);}

/* ── アンケート ── */
.survey-cols{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:20px; align-items:start;}
.survey-main{min-width:0;}
.survey-todo{display:flex; flex-direction:column; gap:12px;}
.sbadges{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;}
.sbadge{display:inline-flex; align-items:center; height:24px; padding:0 9px;
  border-radius:var(--radius-sm); background:var(--color-track);
  color:var(--color-text-sub); font-size:12px; font-weight:700;}
.sbadge-soon{background:var(--color-dusk-tint); color:var(--color-dusk-ink);}
.sbadge-done{background:var(--color-track); color:var(--color-text-mute);}
.sbadge-mode{background:var(--color-accent-tint); color:var(--color-accent-ink);}

.vote-card{border-color:color-mix(in srgb, var(--color-accent) 45%, transparent);}
.vote-opts{display:flex; flex-direction:column; gap:8px; margin:10px 0 14px;}
.vote-opts .option{width:100%; text-align:left; background:var(--color-surface);
  font-family:inherit; cursor:pointer;}
.option-box{flex:none; width:20px; height:20px; border-radius:var(--radius-sm);
  border:1px solid var(--color-border-strong); display:inline-flex;
  align-items:center; justify-content:center; font-size:13px; font-weight:700;
  background:var(--color-surface);}
.option-box-round{border-radius:var(--radius-pill);}
.option--selected .option-box{background:var(--color-accent); border-color:var(--color-accent); color:#fff;}
.btn-vote{margin-left:0; width:100%;}
.btn-vote[disabled]{background:var(--color-border); color:#A5AEB8; cursor:default;}
.revote-btn{background:transparent; border:none; color:var(--color-accent-deep);
  font-family:inherit; font-size:13px; cursor:pointer; padding:8px; min-height:36px;}
.revote-btn:hover{text-decoration:underline;}

/* バリュータグ。#付きの短い表記にする（デザイン指定） */
.tag-value{display:inline-flex; align-items:center; height:26px; padding:0 10px;
  border-radius:var(--radius-sm); background:var(--color-plum-tint);
  color:var(--color-plum-ink); font-size:13px; font-weight:700;}

/* リアクション追加ボタン */
.react-add{border-style:dashed; color:var(--color-text-mute); min-width:38px; justify-content:center;}
.react-add-on{border-style:solid; border-color:var(--color-accent); color:var(--color-accent);}

/* パレットを開いている間。数が多いので詰めて並べ、
   選ぶための面であることが分かるよう地を敷く。 */
.post-actions-picking{background:var(--color-bg); border:1px solid var(--color-border);
  border-radius:var(--radius-md); padding:8px; margin-left:48px; gap:4px;}
.post-actions-picking .react-btn{padding:3px 8px; font-size:16px; min-height:36px;}
.post-actions-picking .comment-toggle-btn{margin-left:auto;}

/* ══════════════════════════════════════════════════════════════════
   PC レイアウト（900px 以上）
   狭い画面は下部タブの1カラムのまま。ここは広い画面専用の骨組み。
   ══════════════════════════════════════════════════════════════════ */
body.wide .app{max-width:1280px; height:calc(100vh - 48px); height:calc(100dvh - 48px); max-height:none;}

.pc-topbar{display:flex; align-items:center; gap:20px; padding:0 20px; height:60px; flex-shrink:0;
  background:var(--color-surface); border-bottom:1px solid var(--color-border);}
.pc-brand{font-size:17px; font-weight:700; white-space:nowrap;}
.pc-tabs{display:flex; align-items:stretch; gap:2px; height:100%; flex:1;}
.pctab{display:flex; align-items:center; gap:7px; padding:0 16px; height:100%;
  background:transparent; border:none; color:var(--color-text-sub);
  font-family:inherit; font-size:15px; cursor:pointer;}
.pctab:hover{color:var(--color-text);}
.pctab-on{color:var(--color-accent-deep); font-weight:700;
  box-shadow:inset 0 -3px 0 var(--color-accent);}
.pc-me{display:flex; align-items:center; gap:8px; flex-shrink:0;}
.pc-me-name{font-size:14px; font-weight:700; white-space:nowrap;}
.pc-me-role{font-size:10px; color:var(--color-dusk-ink); background:var(--color-dusk-tint);
  border-radius:var(--radius-pill); padding:1px 7px;}
.pc-signout{background:transparent; border:none; color:var(--color-text-sub);
  font-family:inherit; font-size:13px; cursor:pointer; padding:8px; min-height:36px;}
.pc-signout:hover{color:var(--color-text); text-decoration:underline;}

.infobar{display:flex; align-items:center; gap:16px; min-height:40px; padding:0 20px;
  background:var(--color-bg); border-bottom:1px solid var(--color-border);
  font-size:13px; color:var(--color-text-sub); flex-shrink:0; flex-wrap:wrap;}
.infobar-left{display:flex; align-items:center; gap:14px; flex:1; flex-wrap:wrap;}
.infobar-date{font-weight:700; color:var(--color-text);}
.infobar-total{font-weight:700; color:var(--color-text);}
.infobar-kind{display:inline-flex; align-items:center; gap:5px;}
.infobar .dot{width:8px; height:8px; border-radius:2px; display:inline-block;}
.infobar-unread{font-weight:700; color:var(--color-accent-deep);}
.infobar-mute{color:var(--color-text-mute);}

.pc-cols{display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:20px;
  align-items:start; padding:20px; max-width:1240px; margin:0 auto;}
body.wide .tab-pad{padding:0;}
.pc-main{min-width:0;}
.pc-side{display:flex; flex-direction:column; gap:12px; position:sticky; top:0;}
.side-card{padding:14px 16px;}
.side-title{font-size:13px; font-weight:700; margin-bottom:8px;}
.side-num{font-size:13px; color:var(--color-text-sub);}
.side-num b{font-size:32px; font-weight:700; color:var(--color-text); margin-right:2px;}
.side-sub{margin-left:6px;}
.side-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
.side-link{display:block; width:100%; text-align:left; background:transparent; border:none;
  padding:7px 0 7px 14px; position:relative; font-family:inherit; font-size:13px;
  color:var(--color-text); cursor:pointer; line-height:1.6; min-height:36px;}
.side-link::before{content:""; position:absolute; left:0; top:14px;
  width:7px; height:7px; border-radius:var(--radius-pill); background:var(--color-accent);}
.side-link:hover{color:var(--color-accent-deep);}
.side-due{display:block; font-size:11px; color:var(--color-text-sub);}
.side-card-pending{background:color-mix(in srgb, var(--color-dusk) 7%, var(--color-surface));
  border-color:color-mix(in srgb, var(--color-dusk) 32%, transparent);}
.side-card-pending .side-title{color:var(--color-dusk-ink);}
.side-card-pending .side-link::before{background:var(--color-dusk);}

/* サイドバーが無いタブは本文を全幅で使う */
body.wide .pc-cols:has(.pc-side:empty),
.pc-cols:not(:has(aside)){grid-template-columns:minmax(0,1fr);}

/* ── アイコン設定 ── */
.avatar-btn{background:transparent; border:none; padding:0; cursor:pointer; line-height:0;
  border-radius:var(--radius-pill);}
.avatar-btn:hover{opacity:.8;}
.avatar-btn:focus-visible{outline:2px solid var(--color-accent); outline-offset:2px;}
.avatar-preview{display:flex; flex-direction:column; align-items:center; gap:8px; margin:6px 0 14px;}
.avatar-hint{font-size:12px; color:var(--color-accent-deep); font-weight:700;}
.avatar-pick{display:inline-flex; align-items:center; justify-content:center; width:100%;
  min-height:44px; cursor:pointer; margin-bottom:10px;}
.avatar-note{font-size:12px; margin-bottom:12px;}
.avatar-who{display:flex; flex-wrap:wrap; gap:5px; margin:0 0 12px;}
.avatar-who .chip{cursor:pointer; height:32px; font-size:12px;}

/* 写真・イラストのアバター。頭文字版と同じ寸法・同じ丸みで置き換わる。 */
.avatar-img{object-fit:cover; border-radius:var(--radius-pill); flex:none;
  border:1px solid var(--color-border); background:var(--color-track);}

/* ── INさん ── */
.in-char{display:flex; flex-direction:column; align-items:center; gap:6px;}
.in-art{display:block; width:auto; height:auto; max-width:100%; object-fit:contain;}
.in-line{font-size:13px; font-weight:700; color:var(--color-text-sub); text-align:center;}
.in-strip{display:flex; justify-content:center; padding:14px 0 4px;}
.in-strip-happy .in-line{color:var(--color-grow-ink);}
.sync-warn-in{display:flex; align-items:center; gap:12px;}
.sync-warn-in .in-char{flex:0 0 auto;}
.sync-warn-in .in-line{display:none;}   /* 文言は警告文そのものに任せる */
.empty-text{margin-top:2px;}
.onboard-card{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;
  border-color:color-mix(in srgb, var(--color-accent) 40%, transparent);
  background:color-mix(in srgb, var(--color-accent) 5%, var(--color-surface));}
.onboard-body{font-size:13px; color:var(--color-text-sub); line-height:1.8;}
.onboard-ok{width:auto; min-width:160px; min-height:44px;}

/* ── スマホ用のシフト。横スクロールは日付の帯だけに閉じ込める ── */
.daystrip{display:flex; gap:6px; overflow-x:auto; padding:2px 0 8px; scroll-snap-type:x proximity;
  /* 横方向の行き止まりをページに伝えない。縦のスワイプは親に通す。 */
  overscroll-behavior-x:contain;}
.daystrip-btn{flex:0 0 auto; scroll-snap-align:center; width:46px; min-height:52px; display:flex;
  flex-direction:column; align-items:center; justify-content:center; gap:1px;
  background:var(--color-surface); border:1px solid var(--color-border);
  border-radius:var(--radius-md); color:var(--color-text-sub); font-family:inherit; cursor:pointer;}
.daystrip-btn-today{border-color:var(--color-accent);}
.daystrip-btn-on{background:var(--color-accent); border-color:var(--color-accent); color:#fff;}
.daystrip-d{font-size:15px; font-weight:700; line-height:1;}
.daystrip-w{font-size:11px;}

.daycard-date{font-size:15px; font-weight:700; margin:2px 0 10px; display:flex; align-items:center; gap:8px;}
.daycard{padding:12px 14px;}
.daycard-head{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.daycard-count{margin-left:auto; font-size:13px; font-weight:700; color:var(--color-text-sub);}
.daycard-empty{font-size:13px; color:var(--color-text-sub);}
.daycard-foot{font-size:13px; color:var(--color-text-sub); margin-top:2px;}
.shift-names{display:flex; flex-wrap:wrap; gap:6px;}
.shift-names .chip{cursor:default;}
/* 自分だけ塗る。アプリ側の .chip が後ろに来るので、勝てる詳細度で書く */
.chip.chip--self{background:var(--color-accent); border-color:var(--color-accent); color:#fff;}

.vblock-label{font-size:13px; font-weight:700; color:var(--color-text-sub); margin:14px 0 6px;}
.vblock{padding:2px 12px;}
.vrow{display:flex; align-items:center; gap:10px; min-height:44px;
  border-top:1px solid var(--color-border);}
.vblock .vrow:first-child{border-top:none;}
.vrow-today{background:var(--color-accent-tint); margin:0 -12px; padding:0 12px;}
.vrow-date{flex:0 0 62px; font-size:13px; font-weight:700; display:flex; align-items:baseline; gap:4px;}
.vrow-wd{font-size:11px; font-weight:400; color:var(--color-text-sub);}
.vrow .shift{flex:1; max-width:140px;}
.vcounts{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.vcount{font-size:12px; font-weight:700; padding:2px 8px; border-radius:var(--radius-sm);}
.vcount-total{font-size:12px; font-weight:700; color:var(--color-text-sub);}
.legend-item{display:flex; align-items:center; gap:5px;}
.legend-dot{display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:5px; background:var(--input-bg); font-size:10px; font-weight:700;}

/* 月・週の切り替えバー */
.shift-bar{display:flex; align-items:center; gap:6px; margin-bottom:10px;}
.shift-bar-label{flex:1; text-align:center; font-size:13px; font-weight:700; color:var(--text);}
.shift-bar-sub{font-size:11px; font-weight:400; color:var(--text-4); margin-left:4px;}
.shift-nav-btn{background:var(--color-surface); border:1px solid var(--color-border-strong); border-radius:var(--radius-md); width:40px; height:36px; color:var(--text-2); cursor:pointer; font-family:inherit; font-size:13px; flex-shrink:0;}
.shift-nav-btn:disabled{opacity:.35; cursor:default;}
.shift-controls{display:flex; gap:6px; align-items:center; margin-bottom:10px; flex-wrap:wrap;}
.shift-controls-spacer{flex:1;}

/* 本日のシフトサマリー */
.shift-today-card{margin-bottom:12px; background:color-mix(in srgb, var(--accent) 7%, var(--surface)); border-color:color-mix(in srgb, var(--accent) 28%, var(--border));}
.shift-today-head{display:flex; align-items:baseline; gap:8px; margin-bottom:10px;}
.shift-today-title{font-size:13px; font-weight:700; color:var(--text);}
.shift-today-date{font-size:11px; color:var(--text-4);}
.shift-today-group{display:flex; gap:8px; padding:6px 0; border-top:1px solid color-mix(in srgb, var(--border) 70%, transparent);}
.shift-today-group:first-of-type{border-top:none;}
.shift-today-tag{flex-shrink:0; width:56px; text-align:center; border-radius:6px; padding:3px 0; font-size:11px; font-weight:700; height:fit-content;}
.shift-today-names{flex:1; font-size:12px; color:var(--text-2); line-height:1.7;}
.shift-today-count{color:var(--text-4); font-size:11px; margin-left:4px;}
.shift-today-rest{font-size:11px; color:var(--text-4); padding-top:8px; border-top:1px solid color-mix(in srgb, var(--border) 70%, transparent); margin-top:2px;}

.kpi-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; margin-bottom:14px;}
.kpi-card{padding:10px 12px; margin-bottom:0;}
.kpi-label{font-size:11px; color:var(--text-4); margin-bottom:4px;}
.kpi-value-row{display:flex; align-items:baseline; gap:3px; margin-bottom:6px;}
.kpi-value{font-size:22px; font-weight:700; font-variant-numeric:tabular-nums;}
.kpi-unit{font-size:11px; color:var(--text-4);}
.kpi-target{margin-left:auto; font-size:11px; color:var(--text-4); white-space:nowrap;}
/* 原本に基準ラインが無い指標。目標と同じ強さで出すと、基準があるように読める */
.kpi-target-none{opacity:0.6;}

/* ── チーム実績のメンバー行 ──
   5つの指標を横に並べる。狭い画面では折り返させる（横スクロールは作らない）。
   1マスの最小幅は「39.4%」が1行に収まる幅にしてある。 */
.tkpi-member{padding:10px 12px;}
.tkpi-name{display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; margin-bottom:8px;}
.tkpi-cells{display:grid; grid-template-columns:repeat(auto-fit, minmax(112px, 1fr)); gap:14px 12px;}
/* 指標グループのタブ。チームの chips の下に置く */
/* 予算比のマス。
   達成率の数字は状況にかかわらず本文色で出す。未達を薄い色にすると、
   月半ばは大半が未達なので画面全体が読めなくなる（実際にそうなった）。
   達成しているかどうかはバーの色で示す。 */
.tkpi-bar{position:relative; display:block; height:6px; margin-top:5px;
  background:var(--color-border); border-radius:3px; overflow:visible;}
.tkpi-bar-f{position:absolute; left:0; top:0; height:100%; border-radius:3px;
  background:var(--color-accent-deep);}
.tkpi-bar-f.is-good{background:var(--color-grow-ink);}
.tkpi-bar-f.is-bad{background:var(--color-alert);}
.tkpi-cell-v.is-bad{color:var(--color-alert-ink);}
/* 今日時点であるべき位置。バーより上下に出して、塗りに埋もれないようにする */
.tkpi-bar-m{position:absolute; top:-3px; width:2px; height:12px; border-radius:1px;
  background:var(--color-text); opacity:0.7;}
.tkpi-sub{display:block; font-style:normal; font-size:11px; color:var(--color-text-sub);
  margin-top:4px; white-space:nowrap; font-variant-numeric:tabular-nums;}
.tkpi-nob{color:var(--color-text-sub); font-weight:400;}
/* 課題のチップ。氏名とマスの間に置く。
   予算から大きく離れている指標だけが出る（KGI の買取粗利額は除く）。 */
/* 着地シナリオの表。原本の予実シートと同じ列並び */
.ln-tbl{font-size:12px;}
.ln-tbl th,.ln-tbl td{padding:5px 7px;}
/* 見出しの色。
   .lnd-tbl thead th（詳細度 0,1,2）のほうが .ln-head2 th（0,1,1）より強く、
   そのままだと補助テキスト色に負けてライトで 4.4:1 になる。
   テーブルのクラスを足して詳細度で勝たせる。 */
.lnd-tbl thead tr.ln-head2 th{font-size:11px; font-weight:700; text-align:center;
  color:var(--color-text); border-bottom:2px solid var(--color-border-strong);
  padding-bottom:4px;}
.lnd-tbl.ln-tbl thead th{color:var(--color-text);}
/* ブロックの境目。地色をやめたぶん、線で見せる */
.ln-tbl .ln-sep{border-left:2px solid var(--color-border-strong);}
/* 【これからブロックは見出しだけ色を敷く】
   中身まで塗ると画面の半分が水色になり、入力できるマスが埋もれた。
   「色の付いたマスだけ入力」という手がかりが消えてしまうので、
   見出しの2行だけ色を付け、境目は罫線で示す。 */
.ln-tbl thead .ln-fut{background:var(--color-accent-tint);}
/* チーム行・全体行。--color-bg-sub は存在しないトークンで、指定しても
   無効値になり背景が消えていた（貼り付けた列が透けた）。 */
.ln-group>th,.ln-group>td{background:var(--color-surface); font-weight:700;}
.ln-group .ln-fut{background:var(--color-accent-tint);}
.ln-group th{font-weight:700;}
.ln-calc{color:var(--color-text);}
/* 入力できるマス。色が付いているところだけ触る、と一目で分かるようにする */
.ln-in{background:var(--color-accent-tint); padding:2px 4px;}
/* 計算値のマスと同じ字面にする。数字が縦に揃わないと表として読めない。 */
.ln-in input{width:58px; font-family:inherit; font-size:12px; font-weight:inherit;
  text-align:right; font-variant-numeric:tabular-nums; padding:3px 6px;
  border-radius:5px; border:1px solid var(--color-border-strong);
  background:var(--color-bg); color:var(--color-text); line-height:1.4;}
.ln-in input:focus{outline:2px solid var(--color-accent); outline-offset:1px;}
.ln-in input::placeholder{color:var(--color-text-sub); opacity:1;}
.ln-land{font-weight:700; color:var(--color-accent-ink);}
.ln-saved{margin-left:10px; font-size:11px; font-weight:400; color:var(--color-grow-ink);}
.ln-bar{display:flex; align-items:center; gap:10px; margin:0 0 10px;}
.ln-savenote{font-size:11px; color:var(--color-text-sub);}
/* 着地見込差（着地 − 予算）。予算超え＝緑、未達＝赤、ちょうど＝控えめ。
   色だけに頼らず符号（+ / − / ±）も残す。 */
.lnd-tbl .ln-down{color:var(--color-alert-ink); font-weight:700;}
.lnd-tbl .ln-up{color:var(--color-grow-ink); font-weight:700;}
/* 変化なしは本文色のまま太字にしない。補助テキスト色だとライトで 4.4:1 に
   なるので、色ではなく太さで増減と区別する。 */
.lnd-tbl .ln-flat{color:var(--color-text); font-weight:400;}

/* 【左右を貼り付ける】
   21列あって横スクロールが要る。誰の行かと、予算・着地・達成率は
   常に見えていないと使えないので、左端と右端4列を貼り付ける。
   幅は固定にしないと right のずらし量が計算できない。 */
.ln-tbl .ln-fix{position:sticky; z-index:2; background:var(--color-bg);}
.ln-tbl .ln-l1{left:0; box-shadow:1px 0 0 var(--color-border);}
.ln-tbl .ln-r1{right:0;    width:86px; min-width:86px;}
.ln-tbl .ln-r2{right:86px; width:58px; min-width:58px;}
.ln-tbl .ln-r3{right:144px;width:80px; min-width:80px;}
.ln-tbl .ln-r4{right:224px;width:80px; min-width:80px;
  box-shadow:-1px 0 0 var(--color-border-strong);}
.ln-tbl .ln-rall{right:0; width:304px; min-width:304px;
  box-shadow:-1px 0 0 var(--color-border-strong);}
/* 貼り付けたマスは地色が要る。透けると下の列が重なって読めなくなる */
.ln-tbl .ln-group .ln-fix{background:var(--color-surface);}
.ln-tbl thead .ln-fix{background:var(--color-bg); z-index:3;}
.ln-tbl tbody .ln-l1{font-weight:700;}

/* 【チームごとに区切る】
   チームが縦に続くと、どこからどこまでが1チームか分かりにくい。
   名前の左に色の帯を出し、チームの先頭行に太い罫線を引く。
   色は teamClass（アバターと同じ配色）を流用しているので、
   チームが増えても自動で付く。 */
.ln-tbl tr.ln-team .ln-l1{border-left:4px solid var(--color-border-strong);}
.ln-tbl tr.ln-t-a    .ln-l1{border-left-color:var(--color-accent);}
.ln-tbl tr.ln-t-b    .ln-l1{border-left-color:var(--color-plum);}
.ln-tbl tr.ln-t-mgmt .ln-l1{border-left-color:var(--color-dusk);}
/* チームの1行目。上に太い線を引いて、前のチームと切る */
.ln-tbl tr.ln-team-head td,.ln-tbl tr.ln-team-head th{
  border-top:2px solid var(--color-border-strong);}
.ln-tbl tr.ln-team-head .ln-l1{font-size:13px;}
/* メンバー名はチーム名より一段下げる。所属が目で追える */
.ln-tbl tr.ln-team:not(.ln-team-head) .ln-l1{padding-left:18px; font-weight:400;}
/* 全体行は一番上で、チームの色は付けない */
.ln-tbl tr.ln-all th,.ln-tbl tr.ln-all td{border-bottom:2px solid var(--color-border-strong);}

/* 【スマホでは右4列の固定を外す】
   予算〜着地見込差で 304px、名前列で 70px。画面幅が 400px 前後の端末では
   これだけで埋まってしまい、真ん中の列に指が届かない（横に動かせない）。
   狭い画面では名前列だけ残して、あとは普通に流す。 */
@media (max-width: 760px){
  .ln-tbl .ln-r1,.ln-tbl .ln-r2,.ln-tbl .ln-r3,.ln-tbl .ln-r4,.ln-tbl .ln-rall{
    position:static; width:auto; min-width:0; right:auto; box-shadow:none;}
  .ln-tbl .ln-r4{border-left:2px solid var(--color-border-strong);}
  /* 指で掴む余地を確保する */
  .ln-tbl th,.ln-tbl td{padding:6px 8px;}
  .ln-in input{width:52px;}
}
/* 着地見込の表 */
/* 横に広い表の枠。
   overflow-x だけ指定すると overflow-y も auto になり、縦横どちらにも
   スクロールできる箱になる。ノートPCのトラックパッドで表の上を縦に
   なぞると、ページが動かず表だけ横に流れる。縦は hidden にして、
   縦の操作はページに渡す。overscroll-behavior-x は、右端まで来たあと
   ブラウザの「戻る」が誤発火しないように。 */
.tbl-wrap{overflow-x:auto; overflow-y:hidden; overscroll-behavior-x:contain;
  margin:0 0 18px;}
.lnd-tbl{border-collapse:collapse; width:100%; font-size:13px;
  font-variant-numeric:tabular-nums; white-space:nowrap;}
.lnd-tbl th,.lnd-tbl td{padding:7px 10px; border-bottom:1px solid var(--color-border);
  text-align:right;}
.lnd-tbl thead th{font-size:11px; font-weight:700; color:var(--color-text-sub);
  text-align:right; border-bottom:1px solid var(--color-border-strong);}
.lnd-tbl tbody th{text-align:left; font-weight:700;}
.lnd-tbl thead th:first-child,.lnd-tbl tbody th{text-align:left;}
.lnd-em{font-weight:700; color:var(--color-accent-ink);}
.lnd-miss{color:var(--color-alert-ink); font-size:11px;}
.lnd-note{font-size:12px; color:var(--color-text-sub); line-height:1.7; margin:0 0 8px;}
.lnd-note code{font-family:ui-monospace,monospace; font-size:11px;
  background:var(--color-surface); padding:1px 5px; border-radius:4px;}
.tkpi-issues{display:flex; flex-wrap:wrap; gap:5px; margin:0 0 10px;}
.tkpi-issue{display:inline-flex; align-items:center; gap:5px; font-size:11px;
  padding:3px 9px; border-radius:999px; white-space:nowrap;
  background:var(--color-alert-tint); color:var(--color-alert-ink);
  border:1px solid var(--color-alert-tint);}
.tkpi-issue b{font-weight:700; font-variant-numeric:tabular-nums;}
.tkpi-issue.is-few{background:transparent; color:var(--color-text-sub);
  border-color:var(--color-border);}
.tkpi-modes{display:flex; gap:4px; margin-left:auto;}
.tkpi-grps{display:flex; flex-wrap:wrap; gap:4px; margin:0 0 12px;
  padding-bottom:8px; border-bottom:1px solid var(--color-border);}
.tkpi-grp{font:inherit; font-size:12px; font-weight:700; padding:5px 12px; cursor:pointer;
  border:1px solid var(--color-border); background:transparent; color:var(--color-text-sub);
  border-radius:999px; white-space:nowrap;}
.tkpi-grp:hover{color:var(--color-text); border-color:var(--color-text-mute);}
.tkpi-grp.is-on{background:var(--color-text); color:var(--color-bg); border-color:var(--color-text);}
.tkpi-grp:focus-visible{outline:2px solid var(--color-accent); outline-offset:2px;}
.tkpi-cell{display:flex; flex-direction:column; gap:1px; min-width:0;}
.tkpi-cell-l{font-style:normal; font-size:11px; color:var(--color-text-sub); white-space:nowrap;}
.tkpi-cell-v{font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}

/* ── 日ごとの実績（チーム集計） ──
   4列固定。日付だけ左寄せ、数字は右寄せにして桁を比べやすくする。 */
.dk-card{padding:8px 12px 10px;}
.dk-row{display:grid; grid-template-columns:1fr repeat(3, minmax(50px, 1fr)); gap:4px; align-items:center;
  padding:5px 0; border-bottom:1px solid var(--border);}
.dk-row:last-of-type{border-bottom:0;}
.dk-head, .dk-head .dk-date, .dk-head .dk-num{font-size:11px; color:var(--text-4); font-weight:700;}
.dk-date{font-size:12px; color:var(--text-3); white-space:nowrap;}
.dk-num{font-size:13px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
.dk-ok{color:var(--color-grow-ink);}
.dk-note{font-size:11px; color:var(--color-text-mute); line-height:1.7; margin-top:6px;}

/* 外部リンクのカード。押せる帯であることが分かるように、
   カードと同じ面の上に矢印を置く。 */
.extlink{display:flex; align-items:center; gap:10px; padding:14px 16px; text-decoration:none;
  color:var(--color-text); border:1px solid var(--color-border); border-radius:var(--radius-lg);
  background:var(--color-surface);}
.extlink:hover{background:var(--color-bg); text-decoration:none;}
.extlink-body{flex:1; min-width:0;}
.extlink-title{font-size:14px; font-weight:700; line-height:1.5;}
.extlink-note{font-size:11px; color:var(--color-text-mute); line-height:1.7; margin-top:2px;}
.extlink-arrow{flex-shrink:0; color:var(--color-text-mute); font-size:13px;}
.kpi-bar-bg{height:4px; background:var(--color-track); border-radius:var(--radius-pill);}
.kpi-bar{height:100%; border-radius:99px;}
.section-label{font-size:12px; font-weight:700; color:var(--text-4); margin-bottom:8px; letter-spacing:0.05em;}

/* ── 目標進捗 ───────────────────────────────────── */
/* 先月のデータが出ているときの警告。同期は成功しているので
   renderSyncBar は緑のまま出る。そこに紛れないよう、別の色で強く出す。 */
.prog-stale{background:color-mix(in srgb, var(--color-alert) 12%, var(--color-surface));
  border:1px solid color-mix(in srgb, var(--color-alert) 45%, transparent);
  border-radius:var(--radius-md); padding:11px 14px; margin:0 0 12px;
  font-size:13px; line-height:1.7; color:var(--color-text);}
.prog-stale b{color:var(--color-alert-ink);}
.prog-note{font-size:13px; color:var(--text-3); line-height:1.7; background:var(--input-bg);
  border:1px solid var(--border); border-radius:8px; padding:8px 10px; margin-bottom:10px;}
.prog-note b{color:var(--text); font-weight:700;}

/* ── Mission / Vision / Value ─────────────────────── */
.mvv{margin-bottom:12px;}
.mvv-toggle{width:100%; min-height:52px; display:flex; align-items:center; gap:8px; padding:10px 12px;
  background:var(--input-bg); border:1px solid var(--border); border-radius:10px;
  color:var(--text-2); font-size:13px; font-weight:700; cursor:pointer;
  font-family:inherit; margin-bottom:10px; text-align:left;}
.mvv-toggle-sub{margin-left:auto; font-size:11px; font-weight:400; color:var(--text-4); white-space:nowrap;}
.mvv-block{margin-bottom:10px;}
.mvv-kind{font-size:11px; font-weight:700; letter-spacing:0.12em; color:var(--accent);
  display:flex; align-items:baseline; gap:8px; margin-bottom:8px;}
.mvv-kind-ja{font-size:11px; font-weight:400; letter-spacing:0; color:var(--text-4);}
.mvv-kind-standalone{margin:14px 0 8px;}
.mvv-lead{font-size:15px; font-weight:700; color:var(--text); line-height:1.65; text-wrap:balance;}
.mvv-body{font-size:15px; color:var(--text-2); line-height:1.8; margin-top:4px;}
.mvv-note{font-size:12px; color:var(--accent); font-weight:600; margin-top:8px;}
.mvv-points{display:flex; flex-direction:column; gap:8px; margin-top:12px;
  padding-top:12px; border-top:1px solid var(--border);}
.mvv-point-t{font-size:12px; font-weight:700; color:var(--text);}
.mvv-point-d{font-size:11px; color:var(--text-3); line-height:1.7; margin-top:2px;}

.mvv-axis{margin-bottom:8px;}
.mvv-axis-head{display:flex; align-items:baseline; gap:8px; margin-bottom:10px;
  padding-bottom:8px; border-bottom:1px solid var(--border);}
.mvv-axis-no{font-size:11px; font-weight:700; color:var(--accent-fg);
  background:var(--accent); border-radius:5px; padding:1px 6px; font-variant-numeric:tabular-nums;}
.mvv-axis-title{font-size:13px; font-weight:700; color:var(--text);}
.mvv-value{padding:7px 0;}
.mvv-value + .mvv-value{border-top:1px dashed var(--border);}
.mvv-value-head{display:flex; align-items:baseline; gap:6px; flex-wrap:wrap;}
.mvv-value-no{font-size:10px; color:var(--text-4); font-variant-numeric:tabular-nums;}
.mvv-value-en{font-size:12px; font-weight:700; color:var(--text);}
.mvv-value-ja{font-size:11px; color:var(--text-3);}
.mvv-value-d{font-size:11px; color:var(--text-3); line-height:1.7; margin-top:3px;}
.mvv-closing{font-size:12px; color:var(--text-2); line-height:1.8; text-align:center;
  padding:12px 10px; margin-bottom:4px;}

/* 必要ペースの一文。ここだけ大きくして、開いた瞬間に目に入るようにする。 */
.prog-head{background:color-mix(in srgb, var(--accent) 8%, var(--surface));
  border-color:color-mix(in srgb, var(--accent) 30%, var(--border)); margin-bottom:10px;}
.prog-head-lead{font-size:12px; color:var(--text-3); margin-bottom:2px;}
/* 見出しは文章から金額1つに変わったので、その分だけ大きくする。
   このタブでいちばん見てほしい数字はこれ、と迷わせないため。 */
.prog-head-main{font-size:30px; font-weight:700; color:var(--text); line-height:1.3;
  text-wrap:balance; font-variant-numeric:tabular-nums;}
.prog-head-sub{font-size:12px; color:var(--text-3); margin-top:4px;}
/* 達成時は「超過 ¥X」と文字が付くぶん長くなるので、少し落とす */
.prog-head-done .prog-head-main{font-size:24px;}

.prog-bar-card{margin-bottom:10px;}
.prog-bar-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
.prog-bar-name{font-size:12px; font-weight:700; color:var(--text-2);}
.prog-bar-pct{font-size:16px; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums;}
.prog-bar-bg{height:10px; background:var(--color-track); border-radius:var(--radius-pill); overflow:hidden;}
.prog-bar{height:100%; border-radius:99px; background:var(--accent);}
@media (prefers-reduced-motion:no-preference){ .prog-bar{transition:width .3s;} }
.prog-bar-labels{display:flex; justify-content:space-between; margin-top:5px;
  font-size:11px; color:var(--text-4); font-variant-numeric:tabular-nums;}

.prog-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; margin-bottom:14px;}
/* カードが奇数枚のときは最後の1枚を横いっぱいに伸ばす。
   3枚のとき、右下だけ空いた不揃いな並びになるのを避けるため。 */
.prog-grid>.prog-cell:last-child:nth-child(odd){grid-column:1 / -1;}
.prog-cell{padding:10px 12px; margin-bottom:0;}
.prog-cell-label{font-size:11px; color:var(--text-4); margin-bottom:3px;}
.prog-cell-value{font-size:16px; font-weight:700; color:var(--text);
  font-variant-numeric:tabular-nums; line-height:1.35; word-break:break-all;}
.prog-cell-sub{font-size:10px; color:var(--text-4); margin-top:3px; line-height:1.5;}

.prog-section{margin-top:6px;}
.prog-toggle{width:100%; min-height:52px; display:flex; align-items:center; gap:8px; padding:10px 12px;
  background:var(--input-bg); border:1px solid var(--border); border-radius:10px;
  color:var(--text-2); font-size:13px; font-weight:700; cursor:pointer;
  font-family:inherit; margin-bottom:10px;}
.prog-toggle-sub{margin-left:auto; font-size:11px; font-weight:400; color:var(--text-4);}

/* 狭い画面でだけ畳むブロックの見出し。prog-toggle と同じ見た目にしてある
   （同じ操作なのに見た目が違うと、押せるものだと気づかれない）。 */
