<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第二CC Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- デザイン指定のフォント。400と700の2ウェイトだけに絞ってある（日本語は重いため）。
     display=swap なので、届くまではOS標準の日本語フォントで表示される。 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<!-- 支給されたデザイントークン。他のどのCSSより先に読み込む（ハンドオフ指定）。
     トークン定義と共通コンポーネントのクラスが入っており、
     下の <style> はその上に重ねる差分として書いている。

     【ダークモードは持たない】
     支給されたデザインは暖色のライト1本で、ダークの指定が無い。
     こちらで勝手に暗い配色を作ると意図から外れるため、
     media query も data-theme も置いていない。必要になったら
     --color-* を上書きするブロックを1つ足すだけで対応できる。 -->
<link rel="stylesheet" href="./tokens.css">
<style>
*{box-sizing:border-box;}

/* tokens.css の .input は高さ44pxで固定される（押せる要素の最小寸法）。
   複数行入力はそれに縛られてはいけないので戻す。 */
.textarea{height:auto;}
body{margin:0;background:var(--color-page);}
.shell-outer{
  display:flex; justify-content:center; align-items:stretch;
  min-height:100vh; background:var(--page-bg);
  /* Noto Sans JP が届くまでは各OSの標準日本語フォントで出す */
  font-family:"Noto Sans JP",-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  color:var(--color-text);
  /* 日本語主体なので行間は 1.8 を基準にする */
  line-height:1.8;
  -webkit-font-smoothing:antialiased;
}
.app{
  width:100%; max-width:640px; display:flex; flex-direction:column;
  height:100vh; background:var(--color-bg); overflow:hidden;
}
@media (min-width:641px){
  .shell-outer{padding:24px 16px;}
  .app{height:calc(100vh - 48px); max-height:900px; border-radius:var(--radius-lg);
    box-shadow:var(--shadow-pop); border:1px solid var(--color-border);}
}

.header{padding:14px 16px; background:var(--color-surface); border-bottom:1px solid var(--color-border);
  display:flex; align-items:center; gap:10px; flex-shrink:0;}
.header-info{flex:1; min-width:0;}
.header-title{font-weight:700; font-size:17px; color:var(--color-text); line-height:1.4;}
.header-online{font-size:13px; color:var(--color-grow-ink); font-weight:700; margin-top:1px; line-height:1.5;}
.header-me{display:flex; align-items:center; gap:8px; flex-shrink:0;}
.header-me-text{min-width:0; text-align:right;}
.header-me-name{font-size:13px; font-weight:700; color:var(--color-text); white-space:nowrap; line-height:1.5;}
.header-me-role{font-size:12px; font-weight:700; color:var(--color-dusk-ink); background:var(--color-dusk-tint);
  border-radius:var(--radius-sm); padding:0 6px; display:inline-block; line-height:20px;}
.signout-btn{background:var(--color-surface); border:1px solid var(--color-border-strong);
  border-radius:var(--radius-md); padding:0 10px; height:36px; font-size:13px; font-weight:700;
  color:var(--color-text-sub); cursor:pointer; font-family:inherit; white-space:nowrap;}
.signout-btn:hover{background:var(--color-bg);}

.content{flex:1; overflow-y:auto;}
.tab-pad{padding:16px 16px 28px;}
.loading{display:flex; justify-content:center; align-items:center; height:100%; color:var(--text-4); font-size:14px;}

/* ── 認証まわりの画面 ───────────────────────────── */
.auth-wrap{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:24px; text-align:center; gap:14px;}
.auth-logo{font-size:34px;}
.auth-title{font-size:19px; font-weight:700; color:var(--text);}
.auth-desc{font-size:13px; color:var(--text-3); line-height:1.7; max-width:340px;}
.google-btn{display:inline-flex; align-items:center; justify-content:center; gap:10px;
  background:var(--color-surface); color:var(--color-text); border:1px solid var(--color-border-strong);
  border-radius:var(--radius-lg); height:52px; padding:0 20px; font-size:15px; font-weight:700;
  cursor:pointer; font-family:inherit; min-width:280px; line-height:1;}
.google-btn:hover{background:var(--color-bg);}
.google-btn:disabled{opacity:0.6; cursor:default;}
.google-mark{width:18px; height:18px; flex-shrink:0;}
.auth-note{font-size:11px; color:var(--text-4); line-height:1.7; max-width:340px;}
.auth-alert{background:color-mix(in srgb, var(--red) 12%, transparent); border:1px solid color-mix(in srgb, var(--red) 32%, transparent); color:var(--red); border-radius:10px; padding:12px 14px; font-size:13px; line-height:1.7; max-width:380px; text-align:left;}
.auth-alert-title{font-weight:700; margin-bottom:4px;}
.auth-mail{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; word-break:break-all;}
.auth-setup{background:var(--amber-bg); border:1px solid color-mix(in srgb, var(--amber) 40%, transparent); color:var(--amber-c); border-radius:10px; padding:14px; font-size:12px; line-height:1.8; max-width:420px; text-align:left;}
.auth-setup code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; background:color-mix(in srgb, var(--amber) 18%, transparent); border-radius:4px; padding:1px 4px;}

/* ボトムナビ。高さ72＋下8のセーフエリア余白は、指が届く帯を確保するための指定。 */
.nav{display:flex; background:var(--color-surface); border-top:1px solid var(--color-border);
  flex-shrink:0; height:72px; padding-bottom:8px;}
.nav-btn{flex:1; padding:0 4px; background:transparent; border:none; color:var(--color-text-sub);
  cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; position:relative; font-family:inherit; line-height:1.4;}
.nav-btn.active{color:var(--color-accent-deep);}
.nav-icon{font-size:20px; line-height:1;}
.nav-label{font-size:11px;}
.nav-btn.active .nav-label{font-weight:700;}
.nav-badge{position:absolute; top:10px; right:calc(50% - 22px); background:var(--color-alert); color:#fff;
  border-radius:var(--radius-pill); font-size:10px; font-weight:700; min-width:16px; height:16px;
  padding:0 4px; display:inline-flex; align-items:center; justify-content:center; line-height:1;}

.card{background:var(--color-surface); border:1px solid var(--color-border);
  border-radius:var(--radius-lg); padding:16px; margin-bottom:12px;}
/* 入力欄は高さ44。押せる・触れる要素の最小寸法を揃えるための指定。 */
.input{background:var(--color-surface); border:1px solid var(--color-border-strong);
  border-radius:var(--radius-md); padding:0 14px; height:44px; font-size:15px;
  color:var(--color-text); outline:none; width:100%; font-family:inherit; line-height:1.6;}
.input:focus{border-color:var(--color-accent); outline:2px solid var(--color-accent-tint); outline-offset:0;}
.input:focus-visible, .chip:focus-visible, button:focus-visible{outline:2px solid var(--color-accent); outline-offset:1px;}
select.input{padding-right:8px;}
.textarea{resize:vertical; height:auto; padding:12px 14px; line-height:1.8;}
.form-card{margin-bottom:12px;}
.form-col{display:flex; flex-direction:column; gap:8px;}
.form-col-tight{display:flex; flex-direction:column; gap:8px;}
.form-row{display:flex; gap:8px;}
.form-row-center{align-items:center;}
.input-strong{font-weight:700;}
.checkbox-label{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700;
  color:var(--color-text-sub); cursor:pointer; min-height:44px;}
.checkbox-label.nowrap{white-space:nowrap;}

/* ボタンは高さ44・角丸10・太字15で揃える。押せるものの寸法を一定にするため。 */
.btn-primary{flex:1; background:var(--color-accent); color:#fff; border:none;
  border-radius:var(--radius-md); height:44px; padding:0 20px; font-weight:700; font-size:15px;
  cursor:pointer; font-family:inherit; line-height:1;}
.btn-primary:hover{background:var(--color-accent-deep);}
.btn-primary:disabled{background:var(--color-border); color:#A5AEB8; cursor:default;}
.btn-primary.full{width:100%;}
.btn-ghost{height:44px; padding:0 20px; background:var(--color-surface);
  border:1px solid var(--color-border-strong); border-radius:var(--radius-md);
  color:var(--color-text); font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; line-height:1;}
.btn-ghost:hover{background:var(--color-bg);}
.btn-dash{background:var(--color-surface); border:1px dashed var(--color-border-strong);
  border-radius:var(--radius-md); height:44px; color:var(--color-text-sub); font-size:13px;
  font-weight:700; cursor:pointer; font-family:inherit;}
.dashed-trigger{width:100%; min-height:44px; padding:11px 14px; background:var(--color-surface);
  border:1px dashed var(--color-border-strong); border-radius:var(--radius-md); margin-bottom:12px;
  color:var(--color-text-sub); font-weight:700; cursor:pointer; font-family:inherit; font-size:13px;}
.dashed-trigger:hover{background:var(--color-bg);}

.empty{padding:32px 16px; text-align:center; color:var(--color-text-sub); font-size:15px; line-height:1.8;}
.empty-icon{font-size:32px; display:block; margin-bottom:8px;}
.empty-sub{font-size:13px; color:var(--color-text-sub); margin-top:6px;}

/* チップは高さ36の丸形。選択中はベタ塗りにせず、淡い面＋枠＋濃い文字にする。
   ベタ塗りを増やすと画面上の主役が増えて、白と余白が主体の設計が崩れるため。 */
.sortbar{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
.chip{height:36px; padding:0 14px; border-radius:var(--radius-pill); font-size:13px; font-weight:700;
  background:var(--color-surface); color:var(--color-text-sub); border:1px solid var(--color-border-strong);
  cursor:pointer; white-space:nowrap; font-family:inherit; line-height:1;}
.chip:hover{background:var(--color-bg);}
.chip-active{background:var(--color-accent-tint); color:var(--color-accent-ink); border-color:var(--color-accent);}
.kpi-filter{display:flex; gap:8px; overflow-x:auto; margin-bottom:14px; padding-bottom:2px;}


.avatar{border-radius:var(--radius-pill); display:flex; align-items:center; justify-content:center;
  font-weight:700; flex-shrink:0; line-height:1;}
.team-mgmt{background:var(--color-dusk-tint); color:var(--color-dusk-ink);}
.team-a{background:var(--color-accent-tint); color:var(--color-accent-ink);}
.team-b{background:var(--color-plum-tint); color:var(--color-plum-ink);}
.team-none{background:var(--color-bg); color:var(--color-text-sub); border:1px solid var(--color-border);}

/* バッジは淡い面＋濃い文字。角丸6で、丸ピルより情報寄りの見た目にする。 */
.badge{background:color-mix(in srgb, var(--bc) 14%, #fff); color:var(--bc);
  border-radius:var(--radius-sm); padding:0 9px; height:24px; font-size:12px; font-weight:700;
  white-space:nowrap; display:inline-flex; align-items:center; line-height:1;}

.post-card{}
.post-head{display:flex; gap:10px; margin-bottom:8px;}
.post-head-info{flex:1; min-width:0;}
.post-head-line{display:flex; flex-wrap:wrap; align-items:center; gap:6px;}
.post-name{font-weight:700; font-size:15px;}
.post-arrow{color:var(--text-4); font-size:12px;}
.post-to{font-weight:600; font-size:13px; color:var(--accent);}
.post-time{color:var(--text-4); font-size:12px; margin-top:2px;}
.post-text{font-size:15px; color:var(--color-text); line-height:1.8; margin-bottom:10px; padding-left:48px; white-space:pre-wrap; word-break:break-word;}
.post-actions{display:flex; gap:5px; flex-wrap:wrap; padding-left:48px; position:relative;}
.react-peek{position:absolute; bottom:calc(100% + 6px); left:48px; max-width:calc(100% - 48px); z-index:20;
  background:var(--surface); border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow);
  padding:7px 10px; font-size:11px; color:var(--text-2); line-height:1.7; word-break:break-word;}
/* スタンプは高さ36の丸ボタン。自分が押したものだけ淡い水色の面＋枠で示す。 */
.react-btn{background:var(--color-surface); border:1px solid var(--color-border-strong);
  border-radius:var(--radius-pill); height:36px; padding:0 12px; font-size:14px;
  color:var(--color-text-sub); cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  font-family:inherit; font-weight:700; line-height:1;}
.react-btn:hover{background:var(--color-bg);}
.react-btn.react-mine{background:var(--color-accent-tint); border-color:var(--color-accent);
  color:var(--color-accent-ink);}
.react-count{font-size:13px;}
.comment-toggle-btn{background:var(--color-surface); border:1px solid var(--color-border-strong);
  border-radius:var(--radius-pill); height:36px; padding:0 12px; font-size:13px; font-weight:700;
  color:var(--color-text-sub); margin-left:auto; cursor:pointer; font-family:inherit; line-height:1;}
.comment-toggle-btn:hover{background:var(--color-bg);}
.comments{margin-top:12px; padding-left:48px;}
.comment-row{display:flex; gap:8px; margin-bottom:8px;}
.comment-bubble{background:var(--color-bg); border:1px solid var(--color-border);
  border-radius:var(--radius-md); padding:8px 12px; font-size:13px; line-height:1.8;}
.comment-name{font-weight:700;}
.comment-text{color:var(--color-text-sub);}
.comment-input-row{display:flex; gap:8px; margin-top:8px; align-items:center;}
.comment-input{font-size:13px;}

.board-card{cursor:default;}
.board-meta{display:flex; align-items:center; gap:6px; margin-bottom:6px;}
.board-time{margin-left:auto; color:var(--text-4); font-size:11px;}
.board-title{font-weight:700; font-size:17px; color:var(--text); margin-bottom:6px;}
.board-body{font-size:15px; color:var(--color-text); line-height:1.8; margin-bottom:8px; white-space:pre-wrap; word-break:break-word;}
.board-footer{display:flex; align-items:center; gap:6px;}
.board-footer-text{font-size:11px; color:var(--text-4);}
.reader-toggle{margin-left:auto; display:flex; align-items:center; gap:6px; background:transparent; border:1px solid var(--border); border-radius:99px; padding:3px 9px; font-size:11px; color:var(--text-3); cursor:pointer; font-family:inherit; white-space:nowrap;}
.reader-toggle-open{border-color:color-mix(in srgb, var(--accent) 40%, transparent); color:var(--accent);}
.reader-toggle-unread{background:color-mix(in srgb, var(--red) 14%, transparent); color:var(--red); border-radius:99px; padding:0 6px; font-weight:700;}
.reader-caret{font-size:8px; color:var(--text-4);}
.reader-panel{margin-top:10px; padding-top:10px; border-top:1px solid var(--border);}
.reader-group{margin-bottom:10px;}
.reader-group:last-child{margin-bottom:0;}
.reader-label{font-size:11px; font-weight:700; color:var(--text-4); margin-bottom:6px; letter-spacing:0.04em;}
.reader-label-unread{color:var(--red);}
.reader-label-done{color:var(--green);}
.reader-chips{display:flex; flex-wrap:wrap; gap:5px;}
.reader-chip{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--border); border-radius:99px; padding:2px 9px 2px 3px; font-size:12px; color:var(--text-2); background:var(--surface);}
.reader-chip-unread{border-color:color-mix(in srgb, var(--red) 35%, transparent); background:color-mix(in srgb, var(--red) 8%, var(--surface)); color:var(--text); font-weight:600;}
.reader-chips-muted .reader-chip{opacity:0.6; font-size:11px;}

/* 送信できない理由。ボタンの直前に出して、押した場所の近くで読ませる */
.form-error{font-size:12px; font-weight:700; color:var(--red);
  background:color-mix(in srgb, var(--red) 8%, transparent);
  border:1px solid color-mix(in srgb, var(--red) 30%, transparent);
  border-radius:var(--radius-sm); padding:8px 10px;}
.form-error[hidden]{display:none;}

/* ── チェックリスト ──────────────────────────────────── */
/* 連絡事項の本文と地続きに見えないよう、面を一段落として囲む。
   「読むところ」と「押すところ」を目で分けるため。 */
.task-block{margin:10px 0; padding:10px; border-radius:var(--radius-md);
  background:var(--color-bg); border:1px solid var(--color-border);}
.task-head{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.task-head-label{font-size:11px; font-weight:700; color:var(--color-text-sub); letter-spacing:0.04em;}
.task-head .reader-toggle{margin-left:auto;}
/* 押し間違いが起きると他人の未完了リストが狂うので、指1本で確実に
   押せる高さを確保する（44px は tokens.css の最小タップ領域と同じ） */
.task-check{display:flex; align-items:center; gap:10px; width:100%; min-height:44px;
  padding:0 12px; border:1px solid var(--color-border-strong); border-radius:var(--radius-md);
  background:var(--color-surface); color:var(--color-text); font-family:inherit;
  font-size:14px; font-weight:700; cursor:pointer; text-align:left;}
.task-check-done{border-color:var(--green); color:var(--color-text-sub); font-weight:400;}
.task-box{flex:none; width:22px; height:22px; border-radius:var(--radius-sm);
  border:1px solid var(--color-border-strong); background:var(--color-surface);
  display:inline-flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:700;}
.task-check-done .task-box{background:var(--green); border-color:var(--green); color:#fff;}
.task-note{font-size:12px; color:var(--color-text-mute); padding:6px 2px;}
.sbadge-late{background:color-mix(in srgb, var(--red) 14%, transparent); color:var(--red);}

/* 入力欄（投稿フォーム・編集フォーム共用） */
.task-fields{display:flex; flex-direction:column; gap:6px; padding-top:10px;
  border-top:1px dashed var(--color-border);}
.task-fields-label{font-size:12px; font-weight:700; color:var(--color-text-sub);}
.target-picker{font-size:12px;}
.target-picker>summary{cursor:pointer; color:var(--color-text-sub); padding:4px 0;
  display:flex; align-items:center; gap:6px;}
.target-hint{color:var(--color-text-mute); font-weight:400;}
.target-chips{display:flex; flex-wrap:wrap; gap:5px; padding:6px 0 2px;}
.target-chip{display:inline-flex; align-items:center; gap:5px; cursor:pointer;
  border:1px solid var(--color-border); border-radius:var(--radius-pill);
  padding:3px 9px 3px 5px; font-size:12px; color:var(--color-text-sub);
  background:var(--color-surface); min-height:32px;}
.target-chip:has(input:checked){border-color:var(--color-accent);
  background:var(--color-accent-tint); color:var(--color-accent-ink); font-weight:600;}

/* 自分の未完了だけを掲示板の先頭に出す小さな一覧 */
.mytask-card{padding:12px; border-color:color-mix(in srgb, var(--color-accent) 45%, transparent);}
.mytask-head{font-size:12px; font-weight:700; color:var(--color-accent-ink); margin-bottom:8px;}
.mytask-row{display:flex; align-items:center; gap:10px; width:100%; min-height:44px;
  padding:0 4px; background:transparent; border:none; border-top:1px solid var(--color-border);
  font-family:inherit; font-size:14px; color:var(--color-text); cursor:pointer; text-align:left;}
.mytask-row:first-of-type{border-top:none;}
.mytask-title{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.mytask-due{flex:none; font-size:11px; font-weight:700; color:var(--color-text-mute);}
.mytask-due-soon{color:var(--color-dusk-ink);}
.mytask-due-late{color:var(--red);}

.survey-head{display:flex; gap:8px; margin-bottom:10px; align-items:flex-start;}
.survey-title{font-weight:700; font-size:17px; color:var(--text);}
.survey-meta{font-size:11px; color:var(--text-4);}
.survey-opt-row{margin-bottom:8px; cursor:pointer;}
.survey-opt-line{display:flex; justify-content:space-between; margin-bottom:3px;}
.survey-opt-label{font-size:13px; color:var(--text-2);}
.survey-opt-label.voted{color:var(--accent); font-weight:700;}
.survey-opt-count{font-size:12px; color:var(--text-4);}
.bar-bg{height:6px; background:var(--color-track); border-radius:var(--radius-pill); overflow:hidden;}
.bar-fill{height:100%; border-radius:99px;}
@media (prefers-reduced-motion:no-preference){ .bar-fill{transition:width 0.3s;} }
.survey-total{margin-top:8px; text-align:right; font-size:12px; color:var(--text-4);}
.survey-foot{margin-top:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.survey-total-text{font-size:12px; color:var(--text-4);}
.survey-closed{color:var(--red); margin-left:8px; font-weight:700;}
.survey-privacy{margin-top:8px; font-size:10px; color:var(--text-4); line-height:1.6;}

.team-block{margin-bottom:14px;}
.team-block-title{font-size:12px; font-weight:700; color:var(--text-4); margin-bottom:8px; letter-spacing:0.05em; position:sticky; left:0; background:var(--bg); display:inline-block; padding:6px 0 2px;}

.shift-note{font-size:12px; color:var(--text-4); margin-bottom:10px;}
.sync-warn{border-radius:8px; padding:9px 12px; font-size:12px; line-height:1.7; margin-bottom:10px;}
.sync-warn-bad{background:color-mix(in srgb, var(--red) 12%, transparent); border:1px solid color-mix(in srgb, var(--red) 32%, transparent); color:var(--red); font-weight:600;}
.sync-warn-soft{background:color-mix(in srgb, var(--amber) 12%, transparent); border:1px solid color-mix(in srgb, var(--amber) 32%, transparent); color:var(--amber-c);}
.shift-scroll{overflow-x:auto; border:1px solid var(--border); border-radius:12px; background:var(--surface);}
.shift-row{display:flex; border-bottom:1px solid var(--border);}
.shift-row:last-child{border-bottom:none;}
.shift-header-row{background:var(--input-bg); position:sticky; top:0; z-index:2;}
.shift-name-cell{position:sticky; left:0; z-index:1; background:var(--surface); width:92px; flex-shrink:0; display:flex; align-items:center; gap:6px; padding:6px 8px; font-size:12px; font-weight:600; color:var(--text); border-right:1px solid var(--border); overflow:hidden; white-space:nowrap;}
.shift-header-row .shift-name-cell{background:var(--input-bg); font-weight:700; color:var(--text-3);}
.shift-name-head{justify-content:center;}
.shift-days{display:flex; flex:1;}
.shift-cell{width:28px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; padding:7px 0; color:var(--text-3); border-right:1px solid var(--border);}
.shift-cell:last-child{border-right:none;}
.shift-date-head{flex-direction:column; font-size:10px; line-height:1.3; font-weight:700; color:var(--text-4); gap:1px;}
/* 週表示は列が7つしかないので、セルを広げて「早番」まで書く。
   月表示は31列を詰めるので狭いまま「早」だけにする。 */
.shift-week .shift-cell{width:auto; flex:1; min-width:38px; font-size:11px;}
.shift-week .shift-date-head{font-size:11px;}
.shift-today{box-shadow:inset 0 0 0 2px var(--color-accent);}
.shift-date-head.shift-today{background:var(--color-accent-tint); color:var(--color-accent-deep);}
/* 区分は文字色ではなく背景で塗る。文字を読まずに早/遅が判別できるようにするため。
   色は必ず文字と併記する二重符号化。未提出だけは斜線＋破線枠にしてあり、
   色が見えない環境でも他と区別できる。 */
.shift-early{background:#DCEFFA; color:#1F6E96; border-color:#BEE0F5; font-weight:700;}
.shift-late{background:#FBE7D3; color:#A85A1C; border-color:#F5D2B0; font-weight:700;}
.shift-night{background:#EDE8F7; color:#54467D; border-color:#DCD4EE; font-weight:700; font-size:10px;}
.shift-other{background:var(--color-dusk-tint); color:var(--color-dusk-ink); font-weight:700;
  font-size:9px; line-height:1.2; text-align:center;}
.shift-off{background:#F4F2ED; color:var(--color-text-sub);}
/* 未提出＝シフト表にその人の行が無い。休み（行はあるが空欄）とは別物として出す。 */
.shift-none{background:repeating-linear-gradient(135deg,#FFF,#FFF 5px,var(--color-track) 5px,var(--color-track) 10px);
  color:#8C959E; font-size:10px; border-color:var(--color-border-strong);}
.shift-name-cell.shift-name-none{color:var(--text-4);}
.shift-count-row{background:var(--input-bg); border-top:2px solid var(--border);}
.shift-count-row .shift-name-cell{background:var(--input-bg); font-weight:700; color:var(--text-3); font-size:11px;}
.shift-count-cell{flex-direction:column; gap:1px; font-size:10px; line-height:1.25; font-weight:700;}
.shift-count-early{color:#1F6E96;}
.shift-count-late{color:#A85A1C;}
.shift-legend{display:flex; gap:14px; margin-top:10px; font-size:11px; color:var(--text-4); flex-wrap:wrap;}

/* ── 投稿フォーム ── */
.composer{padding:14px 16px;}
.composer-row{display:flex; gap:12px; align-items:flex-start;}
.composer-input{flex:1; min-width:0; border:none; background:transparent; resize:none;
  font-family:inherit; font-size:15px; line-height:1.8; color:var(--color-text);
  padding:8px 0; outline:none;}
.composer-input::placeholder{color:var(--color-text-mute);}
.composer-foot{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:8px;}
.pickchip{height:36px; max-width:190px; padding:0 12px; border-radius:var(--radius-pill);
  border:1px dashed var(--color-border-strong); background:var(--color-surface);
  color:var(--color-text-sub); font-family:inherit; font-size:13px; cursor:pointer;}
.pickchip:focus-visible{outline:2px solid var(--color-accent); outline-offset:1px;}
.pickchip-type{border-style:solid;}
.btn-post{margin-left:auto; min-height:44px; padding:0 26px; border:none;
  border-radius:var(--radius-md); background:var(--color-accent); color:#fff;
  font-family:inherit; font-size:15px; font-weight:700; cursor:pointer;}
.btn-post:hover{background:var(--color-accent-deep);}

/* ── 目標進捗（広い画面） ── */
.prog-cols{display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:20px; align-items:start;}
.prog-main{min-width:0;}
.prog-side{display:flex; flex-direction:column; gap:12px;}
.prog-bar-marked{position:relative; overflow:visible;}
.prog-marker{position:absolute; top:-5px; width:2px; height:20px;
  background:var(--color-text); border-radius:1px;}
.prog-plan{margin-top:6px; font-size:12px; color:var(--color-text-sub);}

.wk-card{padding:14px 16px;}
.wk-grid{display:flex; align-items:flex-end; gap:8px; margin:10px 0 6px;}
.wk{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:4px;}
.wk-col{position:relative; width:100%; height:110px; display:flex; align-items:flex-end;
  background:var(--color-track); border-radius:var(--radius-sm); overflow:visible;}
.wk-bar{width:100%; background:var(--color-accent); border-radius:var(--radius-sm); min-height:2px;}
.wk-bar-none{background:var(--color-border);}
.wk-target{position:absolute; left:-2px; right:-2px; height:2px; background:var(--color-text);
  opacity:.55;}
.wk-label{font-size:11px; color:var(--color-text-sub); white-space:nowrap;}
.wk-val{font-size:12px; font-weight:700;}
.wk-legend{font-size:11px; color:var(--color-text-mute); line-height:1.7;}

/* ── 本日のシフトサマリー（広い画面） ── */
.tsum{margin-bottom:14px;}
.tsum-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:10px;}
.tsum-total{font-size:20px; font-weight:700;}
.tsum-rest{font-size:13px; color:var(--color-text-sub); margin-left:auto;}
.tsum-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:12px;
  align-items:start;}
.tcard{padding:12px 14px;}
.tcard-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
.tcard-time{font-size:12px; color:var(--color-text-sub);}
.tcard-num{margin-left:auto; font-size:26px; font-weight:700; line-height:1;}
.shift-early-card{background:color-mix(in srgb, var(--shift-early-bg) 30%, var(--color-surface));
  border-color:var(--shift-early-border);}
.shift-late-card{background:color-mix(in srgb, var(--shift-late-bg) 30%, var(--color-surface));
  border-color:var(--shift-late-border);}
.shift-night-card{background:color-mix(in srgb, var(--shift-night-bg) 30%, var(--color-surface));
  border-color:var(--shift-night-border);}

/* ── アンケート ── */
.survey-cols{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:20px; align-items:start;}
.survey-main{min-width:0;}
.survey-todo{display:flex; flex-direction:column; gap:12px;}
.sbadges{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;}
.sbadge{display:inline-flex; align-items:center; height:24px; padding:0 9px;
  border-radius:var(--radius-sm); background:var(--color-track);
  color:var(--color-text-sub); font-size:12px; font-weight:700;}
.sbadge-soon{background:var(--color-dusk-tint); color:var(--color-dusk-ink);}
.sbadge-done{background:var(--color-track); color:var(--color-text-mute);}
.sbadge-mode{background:var(--color-accent-tint); color:var(--color-accent-ink);}

.vote-card{border-color:color-mix(in srgb, var(--color-accent) 45%, transparent);}
.vote-opts{display:flex; flex-direction:column; gap:8px; margin:10px 0 14px;}
.vote-opts .option{width:100%; text-align:left; background:var(--color-surface);
  font-family:inherit; cursor:pointer;}
.option-box{flex:none; width:20px; height:20px; border-radius:var(--radius-sm);
  border:1px solid var(--color-border-strong); display:inline-flex;
  align-items:center; justify-content:center; font-size:13px; font-weight:700;
  background:var(--color-surface);}
.option-box-round{border-radius:var(--radius-pill);}
.option--selected .option-box{background:var(--color-accent); border-color:var(--color-accent); color:#fff;}
.btn-vote{margin-left:0; width:100%;}
.btn-vote[disabled]{background:var(--color-border); color:#A5AEB8; cursor:default;}
.revote-btn{background:transparent; border:none; color:var(--color-accent-deep);
  font-family:inherit; font-size:13px; cursor:pointer; padding:8px; min-height:36px;}
.revote-btn:hover{text-decoration:underline;}

/* バリュータグ。#付きの短い表記にする（デザイン指定） */
.tag-value{display:inline-flex; align-items:center; height:26px; padding:0 10px;
  border-radius:var(--radius-sm); background:var(--color-plum-tint);
  color:var(--color-plum-ink); font-size:13px; font-weight:700;}

/* リアクション追加ボタン */
.react-add{border-style:dashed; color:var(--color-text-mute); min-width:38px; justify-content:center;}
.react-add-on{border-style:solid; border-color:var(--color-accent); color:var(--color-accent);}

/* パレットを開いている間。数が多いので詰めて並べ、
   選ぶための面であることが分かるよう地を敷く。 */
.post-actions-picking{background:var(--color-bg); border:1px solid var(--color-border);
  border-radius:var(--radius-md); padding:8px; margin-left:48px; gap:4px;}
.post-actions-picking .react-btn{padding:3px 8px; font-size:16px; min-height:36px;}
.post-actions-picking .comment-toggle-btn{margin-left:auto;}

/* ══════════════════════════════════════════════════════════════════
   PC レイアウト（900px 以上）
   狭い画面は下部タブの1カラムのまま。ここは広い画面専用の骨組み。
   ══════════════════════════════════════════════════════════════════ */
body.wide .app{max-width:1280px; height:calc(100vh - 48px); max-height:none;}

.pc-topbar{display:flex; align-items:center; gap:20px; padding:0 20px; height:60px; flex-shrink:0;
  background:var(--color-surface); border-bottom:1px solid var(--color-border);}
.pc-brand{font-size:17px; font-weight:700; white-space:nowrap;}
.pc-tabs{display:flex; align-items:stretch; gap:2px; height:100%; flex:1;}
.pctab{display:flex; align-items:center; gap:7px; padding:0 16px; height:100%;
  background:transparent; border:none; color:var(--color-text-sub);
  font-family:inherit; font-size:15px; cursor:pointer;}
.pctab:hover{color:var(--color-text);}
.pctab-on{color:var(--color-accent-deep); font-weight:700;
  box-shadow:inset 0 -3px 0 var(--color-accent);}
.pc-me{display:flex; align-items:center; gap:8px; flex-shrink:0;}
.pc-me-name{font-size:14px; font-weight:700; white-space:nowrap;}
.pc-me-role{font-size:10px; color:var(--color-dusk-ink); background:var(--color-dusk-tint);
  border-radius:var(--radius-pill); padding:1px 7px;}
.pc-signout{background:transparent; border:none; color:var(--color-text-sub);
  font-family:inherit; font-size:13px; cursor:pointer; padding:8px; min-height:36px;}
.pc-signout:hover{color:var(--color-text); text-decoration:underline;}

.infobar{display:flex; align-items:center; gap:16px; min-height:40px; padding:0 20px;
  background:var(--color-bg); border-bottom:1px solid var(--color-border);
  font-size:13px; color:var(--color-text-sub); flex-shrink:0; flex-wrap:wrap;}
.infobar-left{display:flex; align-items:center; gap:14px; flex:1; flex-wrap:wrap;}
.infobar-date{font-weight:700; color:var(--color-text);}
.infobar-total{font-weight:700; color:var(--color-text);}
.infobar-kind{display:inline-flex; align-items:center; gap:5px;}
.infobar .dot{width:8px; height:8px; border-radius:2px; display:inline-block;}
.infobar-unread{font-weight:700; color:var(--color-accent-deep);}
.infobar-mute{color:var(--color-text-mute);}

.pc-cols{display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:20px;
  align-items:start; padding:20px; max-width:1240px; margin:0 auto;}
body.wide .tab-pad{padding:0;}
.pc-main{min-width:0;}
.pc-side{display:flex; flex-direction:column; gap:12px; position:sticky; top:0;}
.side-card{padding:14px 16px;}
.side-title{font-size:13px; font-weight:700; margin-bottom:8px;}
.side-num{font-size:13px; color:var(--color-text-sub);}
.side-num b{font-size:32px; font-weight:700; color:var(--color-text); margin-right:2px;}
.side-sub{margin-left:6px;}
.side-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
.side-link{display:block; width:100%; text-align:left; background:transparent; border:none;
  padding:7px 0 7px 14px; position:relative; font-family:inherit; font-size:13px;
  color:var(--color-text); cursor:pointer; line-height:1.6; min-height:36px;}
.side-link::before{content:""; position:absolute; left:0; top:14px;
  width:7px; height:7px; border-radius:var(--radius-pill); background:var(--color-accent);}
.side-link:hover{color:var(--color-accent-deep);}
.side-due{display:block; font-size:11px; color:var(--color-text-sub);}
.side-card-pending{background:color-mix(in srgb, var(--color-dusk) 7%, var(--color-surface));
  border-color:color-mix(in srgb, var(--color-dusk) 32%, transparent);}
.side-card-pending .side-title{color:var(--color-dusk-ink);}
.side-card-pending .side-link::before{background:var(--color-dusk);}

/* サイドバーが無いタブは本文を全幅で使う */
body.wide .pc-cols:has(.pc-side:empty),
.pc-cols:not(:has(aside)){grid-template-columns:minmax(0,1fr);}

/* ── アイコン設定 ── */
.avatar-btn{background:transparent; border:none; padding:0; cursor:pointer; line-height:0;
  border-radius:var(--radius-pill);}
.avatar-btn:hover{opacity:.8;}
.avatar-btn:focus-visible{outline:2px solid var(--color-accent); outline-offset:2px;}
.avatar-preview{display:flex; flex-direction:column; align-items:center; gap:8px; margin:6px 0 14px;}
.avatar-hint{font-size:12px; color:var(--color-accent-deep); font-weight:700;}
.avatar-pick{display:inline-flex; align-items:center; justify-content:center; width:100%;
  min-height:44px; cursor:pointer; margin-bottom:10px;}
.avatar-note{font-size:12px; margin-bottom:12px;}
.avatar-who{display:flex; flex-wrap:wrap; gap:5px; margin:0 0 12px;}
.avatar-who .chip{cursor:pointer; height:32px; font-size:12px;}

/* 写真・イラストのアバター。頭文字版と同じ寸法・同じ丸みで置き換わる。 */
.avatar-img{object-fit:cover; border-radius:var(--radius-pill); flex:none;
  border:1px solid rgba(28,42,56,.08); background:var(--color-track);}

/* ── INさん ── */
.in-char{display:flex; flex-direction:column; align-items:center; gap:6px;}
.in-art{display:block; width:auto; height:auto; max-width:100%; object-fit:contain;}
.in-line{font-size:13px; font-weight:700; color:var(--color-text-sub); text-align:center;}
.in-strip{display:flex; justify-content:center; padding:14px 0 4px;}
.in-strip-happy .in-line{color:var(--color-grow-ink);}
.sync-warn-in{display:flex; align-items:center; gap:12px;}
.sync-warn-in .in-char{flex:0 0 auto;}
.sync-warn-in .in-line{display:none;}   /* 文言は警告文そのものに任せる */
.empty-text{margin-top:2px;}
.onboard-card{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;
  border-color:color-mix(in srgb, var(--color-accent) 40%, transparent);
  background:color-mix(in srgb, var(--color-accent) 5%, var(--color-surface));}
.onboard-body{font-size:13px; color:var(--color-text-sub); line-height:1.8;}
.onboard-ok{width:auto; min-width:160px; min-height:44px;}

/* ── スマホ用のシフト。横スクロールは日付の帯だけに閉じ込める ── */
.daystrip{display:flex; gap:6px; overflow-x:auto; padding:2px 0 8px; scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;}
.daystrip-btn{flex:0 0 auto; scroll-snap-align:center; width:46px; min-height:52px; display:flex;
  flex-direction:column; align-items:center; justify-content:center; gap:1px;
  background:var(--color-surface); border:1px solid var(--color-border);
  border-radius:var(--radius-md); color:var(--color-text-sub); font-family:inherit; cursor:pointer;}
.daystrip-btn-today{border-color:var(--color-accent);}
.daystrip-btn-on{background:var(--color-accent); border-color:var(--color-accent); color:#fff;}
.daystrip-d{font-size:15px; font-weight:700; line-height:1;}
.daystrip-w{font-size:11px;}

.daycard-date{font-size:15px; font-weight:700; margin:2px 0 10px; display:flex; align-items:center; gap:8px;}
.daycard{padding:12px 14px;}
.daycard-head{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.daycard-count{margin-left:auto; font-size:13px; font-weight:700; color:var(--color-text-sub);}
.daycard-empty{font-size:13px; color:var(--color-text-sub);}
.daycard-foot{font-size:13px; color:var(--color-text-sub); margin-top:2px;}
.shift-names{display:flex; flex-wrap:wrap; gap:6px;}
.shift-names .chip{cursor:default;}
/* 自分だけ塗る。アプリ側の .chip が後ろに来るので、勝てる詳細度で書く */
.chip.chip--self{background:var(--color-accent); border-color:var(--color-accent); color:#fff;}

.vblock-label{font-size:13px; font-weight:700; color:var(--color-text-sub); margin:14px 0 6px;}
.vblock{padding:2px 12px;}
.vrow{display:flex; align-items:center; gap:10px; min-height:44px;
  border-top:1px solid var(--color-border);}
.vblock .vrow:first-child{border-top:none;}
.vrow-today{background:var(--color-accent-tint); margin:0 -12px; padding:0 12px;}
.vrow-date{flex:0 0 62px; font-size:13px; font-weight:700; display:flex; align-items:baseline; gap:4px;}
.vrow-wd{font-size:11px; font-weight:400; color:var(--color-text-sub);}
.vrow .shift{flex:1; max-width:140px;}
.vcounts{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.vcount{font-size:12px; font-weight:700; padding:2px 8px; border-radius:var(--radius-sm);}
.vcount-total{font-size:12px; font-weight:700; color:var(--color-text-sub);}
.legend-item{display:flex; align-items:center; gap:5px;}
.legend-dot{display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:5px; background:var(--input-bg); font-size:10px; font-weight:700;}

/* 月・週の切り替えバー */
.shift-bar{display:flex; align-items:center; gap:6px; margin-bottom:10px;}
.shift-bar-label{flex:1; text-align:center; font-size:13px; font-weight:700; color:var(--text);}
.shift-bar-sub{font-size:11px; font-weight:400; color:var(--text-4); margin-left:4px;}
.shift-nav-btn{background:var(--color-surface); border:1px solid var(--color-border-strong); border-radius:var(--radius-md); width:40px; height:36px; color:var(--text-2); cursor:pointer; font-family:inherit; font-size:13px; flex-shrink:0;}
.shift-nav-btn:disabled{opacity:.35; cursor:default;}
.shift-controls{display:flex; gap:6px; align-items:center; margin-bottom:10px; flex-wrap:wrap;}
.shift-controls-spacer{flex:1;}

/* 本日のシフトサマリー */
.shift-today-card{margin-bottom:12px; background:color-mix(in srgb, var(--accent) 7%, var(--surface)); border-color:color-mix(in srgb, var(--accent) 28%, var(--border));}
.shift-today-head{display:flex; align-items:baseline; gap:8px; margin-bottom:10px;}
.shift-today-title{font-size:13px; font-weight:700; color:var(--text);}
.shift-today-date{font-size:11px; color:var(--text-4);}
.shift-today-group{display:flex; gap:8px; padding:6px 0; border-top:1px solid color-mix(in srgb, var(--border) 70%, transparent);}
.shift-today-group:first-of-type{border-top:none;}
.shift-today-tag{flex-shrink:0; width:56px; text-align:center; border-radius:6px; padding:3px 0; font-size:11px; font-weight:700; height:fit-content;}
.shift-today-names{flex:1; font-size:12px; color:var(--text-2); line-height:1.7;}
.shift-today-count{color:var(--text-4); font-size:11px; margin-left:4px;}
.shift-today-rest{font-size:11px; color:var(--text-4); padding-top:8px; border-top:1px solid color-mix(in srgb, var(--border) 70%, transparent); margin-top:2px;}

.kpi-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; margin-bottom:14px;}

function ymdLabel(s){
  var d = ymdToDate(s);
  if(!d) return "";
  return (d.getMonth()+1)+"/"+d.getDate()+"（"+["日","月","火","水","木","金","土"][d.getDay()]+"）";
}
function currentMonthId(){ var d=new Date(); return d.getFullYear()+"_"+(d.getMonth()+1); }

/**
 * 当月から offset か月ずらした月。ドキュメントIDの規則は GAS の monthIdOf_ と揃えてある。
 * new Date(年, 月+offset, 1) は月をまたぐ繰り上がり・繰り下がりを自分で処理してくれるので、
 * 12月→1月や年替わりを個別に書く必要がない。
 */
function monthOf(offset){
  var n = new Date();
  var d = new Date(n.getFullYear(), n.getMonth() + offset, 1);
  return {
    id:    d.getFullYear()+"_"+(d.getMonth()+1),
    label: (d.getMonth()+1)+"月",
    year:  d.getFullYear(),
    month: d.getMonth()+1
  };
}

function getM(id){
  for(var i=0;i<session.members.length;i++) if(session.members[i].id===id) return session.members[i];
  return { id:id, displayName:"?", initial:"?", team:null };
}
function getTeam(teamId){
  for(var i=0;i<session.teams.length;i++) if(session.teams[i].id===teamId) return session.teams[i];
  return null;
}
function teamClass(teamId){
  var t = getTeam(teamId);
  return (t && TEAM_COLOR_CLASS[t.colorKey]) || "team-none";
}
/**
 * アバターに使う画像のファイル名。
 *
 * 値はメンバーマスタから来るので、そのまま src に入れない。
 * assets/ 配下の単純なファイル名だけを通し、`../` や外部URLは弾く。
 * 画像を外部から読ませると、誰がいつ画面を開いたかが
 * その配信元に伝わってしまうため、自前配信に限っている。
 */
function avatarFile(m){
  var f = (m && m.avatar) ? String(m.avatar) : "";
  return /^[A-Za-z0-9][A-Za-z0-9._-]*\.(webp|png|jpg|jpeg)$/i.test(f) ? f : "";
}

function avatar(id,size){
  size = size || 36;
  var m = getM(id);

  // 本人が設定した画像を最優先。次に assets/ に置いたファイル、
  // どちらも無ければ頭文字。混在していても崩れない順番にしている。
  var uploaded = session.avatars[id];
  if(uploaded){
    return '<img class="avatar avatar-img" src="'+esc(uploaded)+'"' +
      ' width="'+size+'" height="'+size+'" alt="" decoding="async"' +
      ' style="width:'+size+'px;height:'+size+'px">';
  }

  var file = avatarFile(m);
  if(file){
    // alt は空にしている。隣に必ず表示名が出るので、
    // 読み上げで名前が二重になるのを避ける。
    // 遅延読み込みはしない。小さい画像が最初から見える位置に並ぶので、
    // 後から差し込まれると名前の隣がちらついて読みにくくなる。
    return '<img class="avatar avatar-img" src="./assets/'+esc(file)+'"' +
      ' width="'+size+'" height="'+size+'" alt="" decoding="async"' +
      ' style="width:'+size+'px;height:'+size+'px">';
  }
  // 画像が無い人は今までどおり頭文字。全員分の画像が揃わなくても混在で成立する。
  return '<div class="avatar '+teamClass(m.team)+'" style="width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*0.38)+'px">'+esc(m.initial)+'</div>';
}

// ══════════════════════════════════════════════════════════════════
//  Firestore ドキュメントの読み替え
// ══════════════════════════════════════════════════════════════════
/**
 * serverTimestamp() はサーバー確定までローカルでは null になる。
 * そのままだと投稿直後に時刻が消え、並び順も崩れるため、
 * "estimate" でローカル時刻を推定値として埋めてもらう。
 */
function mapDoc(d){
  var v = d.data({ serverTimestamps: "estimate" });
  var o = { id: d.id, pending: d.metadata.hasPendingWrites };
  for(var k in v) o[k] = v[k];
  o.createdAtMs = v.createdAt && v.createdAt.toMillis ? v.createdAt.toMillis() : Date.now();
  o.deletedAtMs = v.deletedAt && v.deletedAt.toMillis ? v.deletedAt.toMillis() : null;
  return o;
}
function byNewest(a,b){ return b.createdAtMs - a.createdAtMs; }
function notDeleted(d){ return d.deleted !== true; }
function isDeleted(d){ return d.deleted === true; }

// ── 権限判定 ──────────────────────────────────────────────
// ここは画面の出し分けのためだけのもの。
// 実際の可否は firestore.rules 側で同じ条件を独立に検証している。
// 開発者ツールから直接 update を投げられても、そちらで止まる。
function canEdit(d){   return !!d && d.authorId === currentUserId() && !d.deleted; }
function canDelete(d){ return !!d && !d.deleted && (d.authorId === currentUserId() || isAdmin()); }

// ══════════════════════════════════════════════════════════════════
//  リアルタイム購読
//
//  ログイン中は3本を張りっぱなしにする。
//  onSnapshot はアタッチ時に全件、以降は差分だけを読む。
//  タブ切り替えのたびに解除・再アタッチすると毎回全件読み直しになり、
//  かえって読み取り課金が増える。掲示板の未読バッジも、他タブを
//  見ている間の更新を拾えなくなる。
//
//  解除はこの配列だけを見ればよいようにして、漏れを構造的に防ぐ。
// ══════════════════════════════════════════════════════════════════
var unsubscribers = [];
var commentUnsub = null;
var shiftOtherUnsub = null;   // 前月/翌月を見ているあいだだけ張る

// 鮮度の警告は時間の経過だけで状態が変わる（データは動かない）。
// アプリを開きっぱなしにしていても警告が出るよう、定期的に描き直す。
var freshnessTimer = null;
function startFreshnessTimer(){
  if(freshnessTimer) return;
  var last = "";
  freshnessTimer = setInterval(function(){
    if(session.status !== "ready") return;
    var lv = syncHealth().level;
    if(lv !== last){ last = lv; render(); }
  }, 5 * 60 * 1000);
}
function stopFreshnessTimer(){
  if(freshnessTimer){ clearInterval(freshnessTimer); freshnessTimer = null; }
}

function detachAll(){
  unsubscribers.forEach(function(u){ try{ u(); }catch(e){} });
  unsubscribers = [];
  detachComments();
  detachShiftOther();
  stopFreshnessTimer();
}
function detachComments(){
  if(commentUnsub){ try{ commentUnsub(); }catch(e){} commentUnsub = null; }
  state.comments = [];
}
function detachShiftOther(){
  if(shiftOtherUnsub){ try{ shiftOtherUnsub(); }catch(e){} shiftOtherUnsub = null; }
  state.shiftOther = null;
  state.shiftOtherLoading = false;
}

function subscribe(colName, orderField, onData){
  var q = query(collection(db, colName), orderBy(orderField, "desc"), limit(200));
  unsubscribers.push(onSnapshot(q,
    function(snap){
      // orderBy はサーバー側の順序。未確定の serverTimestamp は null 扱いで
      // 末尾に回ってしまうため、推定値で並べ直す。
      var all = snap.docs.map(mapDoc).sort(byNewest);
      onData(all.filter(notDeleted), all.filter(isDeleted));
      reconcileOpenState();
      render();
    },
    function(err){
      state.notice = colName + " の購読に失敗しました（" + err.code + "）";
      render();
    }
  ));
}

function attachAll(){
  detachAll();   // 二重アタッチ防止
  subscribe("feedPosts",  "createdAt", function(live, gone){ state.feed = live;    state.trash.feed = gone; });
  subscribe("boardPosts", "createdAt", function(live, gone){ state.board = live;   state.trash.board = gone; });
  subscribe("surveys",    "createdAt", function(live, gone){ state.surveys = live; state.trash.surveys = gone; });
}

/**
 * 別の人が削除した投稿を、こちらが開いていた／編集していた場合の後始末。
 * リアルタイム同期なので、操作中に対象が消えることが普通に起きる。
 * 消えたまま参照を持ち続けると、空のパネルが residual に残ったり
 * 保存時に理由の分からないエラーになる。
 */
function has(list, id){
  for(var i=0;i<list.length;i++) if(list[i].id===id) return true;
  return false;
}
function reconcileOpenState(){
  var lost = "";

  if(state.editing){
    var e = state.editing;
    if(e.kind==="feed"   && !has(state.feed, e.id))      lost = "編集していた投稿は削除されました";
    if(e.kind==="board"  && !has(state.board, e.id))     lost = "編集していた掲示板の投稿は削除されました";
    if(e.kind==="survey" && !has(state.surveys, e.id))   lost = "編集していたアンケートは削除されました";
    if(e.kind==="comment"&& !has(state.feed, e.postId))  lost = "コメント先の投稿は削除されました";
    if(lost) state.editing = null;
  }

  if(state.feedOpenComment && !has(state.feed, state.feedOpenComment)){
    state.feedOpenComment = null;
    detachComments();
  }
  if(state.boardOpenReaders && !has(state.board, state.boardOpenReaders)) state.boardOpenReaders = null;
  if(state.boardOpenTask && !has(state.board, state.boardOpenTask)) state.boardOpenTask = null;
  if(state.surveyOpenStatus && !has(state.surveys, state.surveyOpenStatus)) state.surveyOpenStatus = null;

  if(state.confirm && state.confirm.targetId){
    var pool = state.confirm.kind==="feed" ? state.feed
             : state.confirm.kind==="board" ? state.board
             : state.confirm.kind==="survey" ? state.surveys : null;
    if(pool && !has(pool, state.confirm.targetId)){
      state.confirm = null;
      lost = lost || "対象の投稿は、ほかの人がすでに削除しました";
    }
  }

  if(lost) state.notice = lost;
}

function attachComments(postId){
  detachComments();
  if(!postId) return;
  var q = query(collection(db, "feedPosts", postId, "comments"), orderBy("createdAt", "asc"), limit(200));
  commentUnsub = onSnapshot(q,
    function(snap){
      state.comments = snap.docs.map(mapDoc).filter(notDeleted)
        .sort(function(a,b){ return a.createdAtMs - b.createdAtMs; });
      // 編集中のコメントが他の人に消された場合
      if(state.editing && state.editing.kind==="comment" && !has(state.comments, state.editing.id)){
        state.editing = null;
        state.notice = "編集していたコメントは削除されました";
      }
      render();
    },
    function(err){ state.notice = "コメントの購読に失敗しました（" + err.code + "）"; render(); }
  );
}

window.addEventListener("beforeunload", detachAll);

// ══════════════════════════════════════════════════════════════════
//  旧データ（localStorage）の退避と削除
//
//  移行はしない。旧アプリは「投稿者を選ぶプルダウン」で誰にでも
//  なりすませたため、記録されている作成者が実際の書き手と一致しない。
//  セキュリティルールは authorId == 自分 を強制するので、
//  他人名義の投稿はそもそも作成できない（これは正しい動作）。
//  中身を確認できるようダウンロードだけ用意して、あとは消す。
// ══════════════════════════════════════════════════════════════════
var LEGACY_KEYS = ["cc2:feed", "cc2:board", "cc2:surveys"];

function loadLegacy(){
  var found = null;
  LEGACY_KEYS.forEach(function(k){
    try{
      var raw = localStorage.getItem(k);
      if(!raw) return;
      var parsed = JSON.parse(raw);
      if(!parsed || !parsed.length) return;
      found = found || {};
      found[k] = parsed;
    }catch(e){}
  });
  state.legacy = found;
}
function legacyCount(){
  if(!state.legacy) return 0;
  var n = 0;
  for(var k in state.legacy) n += state.legacy[k].length;
  return n;
}
function downloadLegacy(){
  var blob = new Blob([JSON.stringify(state.legacy, null, 2)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "daini-cc-hub-legacy-backup.json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function discardLegacy(){
  LEGACY_KEYS.forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} });
  state.legacy = null;
  render();
}

// ══════════════════════════════════════════════════════════════════
//  認証
// ══════════════════════════════════════════════════════════════════
function configLooksUnset(){
  return !FIREBASE_CONFIG
      || !FIREBASE_CONFIG.apiKey
      || String(FIREBASE_CONFIG.apiKey).indexOf("PASTE_") === 0;
}

function boot(){
  bindEvents();
  if(configLooksUnset()){
    session.status = "config";
    render();
    return;
  }
  var fbApp = initializeApp(FIREBASE_CONFIG);
  auth = getAuth(fbApp);
  db = getFirestore(fbApp);
  auth.useDeviceLanguage();
  onAuthStateChanged(auth, onAuthChanged);
  render();
}

async function doSignIn(){
  if(session.signingIn || !auth) return;
  session.signingIn = true;
  session.deniedEmail = "";
  session.errorMessage = "";
  if(session.status === "denied") session.status = "signedOut";
  render();
  try{
    var provider = new GoogleAuthProvider();
    // 毎回アカウント選択を出す。共用PCで前の人のアカウントに
    // そのまま入ってしまうのを防ぐため。
    var params = { prompt: "select_account" };
    if(SIGN_IN_HINT_DOMAIN) params.hd = SIGN_IN_HINT_DOMAIN;
    provider.setCustomParameters(params);
    await signInWithPopup(auth, provider);
  }catch(e){
    var code = e && e.code ? e.code : "";
    if(code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request"){
      // ユーザーが自分で閉じただけなので何も出さない
    }else if(code === "auth/popup-blocked"){
      session.errorMessage = "ポップアップがブロックされました。ブラウザの設定でこのサイトのポップアップを許可してください。";
    }else{
      session.errorMessage = "ログインに失敗しました（" + (code || "unknown") + "）";
    }
    render();
  }finally{
    session.signingIn = false;
    render();
  }
}

async function doSignOut(){
  if(!auth) return;
  session.deniedEmail = "";
  session.errorMessage = "";
  await signOut(auth);
}

async function onAuthChanged(user){
  if(!user){
    detachAll();
    session.authUser = null;
    session.member = null;
    session.members = [];
    session.teams = [];
    state.feed = []; state.board = []; state.surveys = [];
    // 「利用権限がありません」を表示した直後はサインアウトが走るが、
    // その通知でログイン画面に戻してしまうとメッセージが読めないため、
    // denied のときだけは状態を維持する。
    if(session.status !== "denied") session.status = "signedOut";
    render();
    return;
  }

  session.authUser = user;
  session.status = "loading";
  render();

  var email = String(user.email || "").toLowerCase();
  try{
    // 許可リストの突き合わせ。
    // セキュリティルール上、ここで読めるのは「自分宛の1件」だけ。
    var snap = await getDoc(doc(db, "members", email));
    if(!snap.exists() || snap.data().active !== true){
      await denyAccess(user.email || "");
      return;
    }
    var m = snap.data();
    session.member = {
      id: m.memberId,
      email: email,
      displayName: m.displayName || m.fullName || "?",
      fullName: m.fullName || "",
      initial: m.initial || String(m.displayName || "?").charAt(0),
      team: m.team || null,
      jobTitle: m.jobTitle || "",
      role: m.role === "admin" ? "admin" : "member",
      order: m.order || 0,
      avatar: m.avatar || ""
    };
    await loadMasters();
    loadLegacy();
    session.status = "ready";
    render();
    attachAll();
    attachSyncedData();
    attachAvatars();
    startFreshnessTimer();
  }catch(e){
    if(e && e.code === "permission-denied"){
      await denyAccess(user.email || "");
      return;
    }
    session.errorMessage = (e && e.message) ? e.message : String(e);
    session.status = "error";
    render();
  }
}

async function denyAccess(email){
  detachAll();
  session.deniedEmail = email;
  session.member = null;
  session.status = "denied";
  render();
  try{ await signOut(auth); }catch(e){}
  render();
}

async function loadMasters(){
  var tsnap = await getDocs(query(collection(db, "teams"), orderBy("order")));
  session.teams = tsnap.docs.map(function(d){
    var v = d.data();
    return { id:d.id, label:v.label || d.id, order:v.order || 0, colorKey:v.colorKey || "none" };
  });

  var msnap = await getDocs(query(collection(db, "members"), orderBy("order")));
  session.members = msnap.docs.map(function(d){
    var v = d.data();
    return {
      id: v.memberId,
      displayName: v.displayName || v.fullName || "?",
      fullName: v.fullName || "",
      initial: v.initial || String(v.displayName || "?").charAt(0),
      team: v.team || null,
      jobTitle: v.jobTitle || "",
      role: v.role === "admin" ? "admin" : "member",
      order: v.order || 0,
      // assets/ 配下のファイル名。空なら頭文字のアバターになる。
      avatar: v.avatar || "",
      active: v.active !== false,
      // シフト表に載せるか。未設定なら載せる（既存メンバーの挙動を変えないため）。
      inShift: v.inShift !== false
    };
  }).filter(function(m){ return m.active; });
}

/**
 * シフト関連の集計・表示に載せるメンバー。
 *
 * シフト表・本日のサマリー・ヘッダーの人数・残り稼働時間の4つは、
 * すべてここを通す。片方だけ除外すると「表には出ないのに稼働時間には
 * 数えられている」という追いにくい食い違いになるため。
 *
 * 除外はコードではなく Firestore のメンバーマスタ側で行う（inShift: false）。
 */
function shiftMembers(){
  return session.members.filter(function(m){ return m.inShift !== false; });
}

// シフト・実績・目標はスプレッドシートから GAS が1時間おきに書き込む。
// 単発の getDoc ではなく購読にしてあるのは、同期が走った直後に
// 「最終更新」の表示と鮮度の警告が自動で切り替わるようにするため。
// いずれも1ドキュメントなので、変化がなければ読み取りは発生しない。
function subscribeDoc(path, id, onData){
  unsubscribers.push(onSnapshot(doc(db, path, id),
    function(snap){ onData(snap.exists() ? snap.data() : null); render(); },
    function(){ onData(null); render(); }
  ));
}

/**
 * アイコン。memberId をキーにした小さなドキュメントを購読する。
 * 誰かが変えたら全員の画面ですぐ差し替わる。
 */
function attachAvatars(){
  unsubscribers.push(onSnapshot(collection(db, "avatars"),
    function(snap){
      var map = {};
      snap.docs.forEach(function(d){
        var v = d.data();
        if(v && typeof v.dataUrl === "string") map[d.id] = v.dataUrl;
      });
      session.avatars = map;
      render();
    },
    function(){ session.avatars = {}; }
  ));
}

function attachSyncedData(){

 * 2本目を張って、離れたら必ず落とす（張りっぱなしは読み取り課金の無駄になる）。
 */
function setShiftMonth(offset){
  if(offset === state.shiftMonthOffset) return;
  state.shiftMonthOffset = offset;
  state.shiftWeekStart = null;          // 月が変わったら週の位置は選び直す
  detachShiftOther();
  if(offset !== 0){
    state.shiftOtherLoading = true;
    shiftOtherUnsub = onSnapshot(doc(db, "shifts", monthOf(offset).id),
      function(snap){
        state.shiftOther = snap.exists() ? snap.data() : null;
        state.shiftOtherLoading = false;
        render();
      },
      function(){ state.shiftOther = null; state.shiftOtherLoading = false; render(); }
    );
  }
  render();
}

// ══════════════════════════════════════════════════════════════════
//  同期の鮮度
//
//  一番危ないのは、同期が止まっているのに古い数字が最新の顔で
//  出ていることなので、疑わしい状態は必ず画面に出す。
//
//  ただし深夜は同期しない設計なので、単純な経過時間だけで判定すると
//  毎朝かならず誤検知する。稼働時間帯かどうかで分けている。
// ══════════════════════════════════════════════════════════════════
var SYNC_HOUR_FROM = 10;   // GAS 側と同じ値
var SYNC_HOUR_TO   = 22;
var STALE_HOURS    = 3;

function sameLocalDay(a, b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

// now を引数で受けられるようにしてあるのは、深夜・早朝の分岐を
// 実時刻に頼らず確かめられるようにするため。通常は省略して呼ぶ。
function syncHealth(now){
  var ms = state.syncedAtMs;
  if(!ms) return { level:"never" };

  now = now || new Date();
  var hour = now.getHours();
  var inHours = hour >= SYNC_HOUR_FROM && hour <= SYNC_HOUR_TO;
  var ageH = (now.getTime() - ms) / 3600000;
  var today = sameLocalDay(new Date(ms), now);

  if(state.syncStatus && state.syncStatus.lastResult === "error"){
    return { level:"error", message:"前回の同期が失敗しています。数字が古いままの可能性があります" };
  }
  if(!inHours) return { level:"ok" };                 // 深夜・早朝は警告しない
  if(!today && hour === SYNC_HOUR_FROM){
    return { level:"yesterday", message:"前日の数字を表示中です。本日分の同期はこれから行われます" };
  }
  if(!today){
    return { level:"stale", message:"本日まだ一度も同期されていません。数字は前日のものです" };
  }
  if(ageH >= STALE_HOURS){
    return { level:"stale", message:"最終更新から"+Math.floor(ageH)+"時間が経過しています。同期が止まっている可能性があります" };
  }
  return { level:"ok" };
}

function syncedAtLabel(){
  if(state.syncedAtMs){
    var d = new Date(state.syncedAtMs);
    return (d.getMonth()+1)+"月"+d.getDate()+"日 "+d.getHours()+"時"+("0"+d.getMinutes()).slice(-2)+"分";
  }
  if(state.syncStatus && state.syncStatus.lastSyncedAtLabel) return state.syncStatus.lastSyncedAtLabel;
  return null;
}

/** シフトタブ・実績タブの先頭に出す最終更新と警告 */
function renderSyncBar(){
  var label = syncedAtLabel();
  var h = syncHealth();
  var warn = "";
  if(h.level === "error"){
    // 同期そのものが失敗した場合だけ INさんを出す。
    // 「3時間更新がない」だけの状態は失敗とは限らないので出さない。
    warn = '<div class="sync-warn sync-warn-bad sync-warn-in">' +
      inChar("trouble", "データが取れませんでした", 56) +
      '<span>'+esc(h.message)+'</span></div>';
  }else if(h.level === "stale"){
    warn = '<div class="sync-warn sync-warn-bad">⚠️ '+esc(h.message)+'</div>';
  }else if(h.level === "yesterday"){
    warn = '<div class="sync-warn sync-warn-soft">🕙 '+esc(h.message)+'</div>';
  }
  return warn + '<div class="shift-note">' +
    (label ? '最終更新 '+esc(label) : 'まだ一度も同期されていません') +
  '</div>';
}

/** 月曜起点の週の開始時刻 */
function weekStartMs(offsetWeeks){
  var d = new Date();
  d.setHours(0,0,0,0);
  var dow = (d.getDay() + 6) % 7;            // 月曜=0
  d.setDate(d.getDate() - dow + (offsetWeeks||0) * 7);
  return d.getTime();
}
/** 今週と先週の Thanks 件数 */
function thanksCounts(){
  var thisStart = weekStartMs(0), lastStart = weekStartMs(-1);
  var now = 0, prev = 0;
  state.feed.forEach(function(p){
    if(p.type !== "Thanks") return;
    if(p.createdAtMs >= thisStart) now++;
    else if(p.createdAtMs >= lastStart) prev++;
  });
  return { now: now, prev: prev };
}

/**
 * 所属チーム順にグルーピングしたメンバーの <option> 群。
 * 既存の「投稿者を選ぶプルダウン」は認証の導入で廃止したが、
 * チーム順グルーピングはフィードの宛先選択で流用する。
 */
function memberOptionsGrouped(excludeSelf, selectedId){
  var meId = currentUserId();
  var used = {};
  var html = "";
  function opt(m){
    return '<option value="'+esc(m.id)+'"'+(m.id===selectedId?" selected":"")+'>'+esc(m.displayName)+'</option>';
  }
  session.teams.forEach(function(t){
    var ms = session.members.filter(function(m){
      return m.team === t.id && !(excludeSelf && m.id === meId);
    });
    if(!ms.length) return;
    html += '<optgroup label="'+esc(t.label)+'">';
    ms.forEach(function(m){ used[m.id] = true; html += opt(m); });
    html += '</optgroup>';
  });
  var rest = session.members.filter(function(m){
    return !used[m.id] && !(excludeSelf && m.id === meId);
  });
  if(rest.length){
    html += '<optgroup label="その他">';
    rest.forEach(function(m){ html += opt(m); });
    html += '</optgroup>';
  }
  return html;
}

  var sortDefs = [["new","✨ 新着"],["react","🔥 スタンプ"],["comment","💬 コメント"]];

    ? sorted.map(renderFeedPost).join("")

    renderLegacyCard() +
    renderMvvPanel() +
    '<div class="sortbar">'+sortHtml+'</div>' +
    formHtml +
    body +
    renderTrash("feed") +
  '</div>';
}

/** reactions は {memberId: [emoji]} なので、絵文字ごとの人数はここで数える */
function reactionsByEmoji(post){
  var byEmoji = {};
  var r = post.reactions || {};
  for(var memberId in r){
    (r[memberId] || []).forEach(function(e){
      (byEmoji[e] = byEmoji[e] || []).push(memberId);
    });
  }
  return byEmoji;
}

function renderFeedPost(post){
  if(state.editing && state.editing.kind==="feed" && state.editing.id===post.id && canEdit(post)){
    return renderFeedEditForm(post);
  }
  var me = currentUserId();
  var from = getM(post.authorId);
  var to = post.toMemberId ? getM(post.toMemberId) : null;
  var byEmoji = reactionsByEmoji(post);
  var mine = (post.reactions && post.reactions[me]) || [];
  var isOpen = state.feedOpenComment===post.id;

  // 押された絵文字だけ出し、追加は「＋」から。
  // 5種を常時並べると、0件のボタンが場所を取って
  // 「何件付いているか」が読み取りにくくなる。
  var picking = state.reactionPickerFor === post.id;
  var shown;
  if(picking){
    shown = REACTIONS;
  }else{
    // 一覧の順で押されたものを出し、そのあとに
    // 一覧から外れた絵文字（過去に押されたもの）を続ける。
    // 絵文字を整理しても、押した記録が画面から消えないようにするため。
    shown = REACTIONS.filter(function(e){ return (byEmoji[e]||[]).length > 0; });
    Object.keys(byEmoji).forEach(function(e){
      if(byEmoji[e].length > 0 && REACTIONS.indexOf(e) < 0) shown.push(e);
    });
  }

  var reactHtml = shown.map(function(emoji){
    var who = (byEmoji[emoji]||[]);
    var cnt = who.length;
    var isMine = mine.indexOf(emoji)>=0;
    // 押した人の名前は属性に持たせておき、ホバー／長押し時に
    // DOM を直接書き換えて出す（後述のとおり render() は呼ばない）
    var names = who.map(function(mid){ return getM(mid).displayName; }).join("、");
    return '<button class="react-btn'+(isMine?" react-mine":"")+'"' +
      ' data-act="react" data-id="'+post.id+'" data-emoji="'+emoji+'"' +
      ' data-people="'+esc(names)+'"' +
      ' aria-label="'+emoji+' '+cnt+'人'+(names?'：'+esc(names):'')+'">' +
      emoji + (cnt>0?'<span class="react-count">'+cnt+'</span>':'') +
    '</button>';
  }).join("");

  reactHtml += '<button class="react-btn react-add'+(picking?" react-add-on":"")+'"' +
    ' data-act="react-picker" data-id="'+post.id+'"' +
    ' aria-label="'+(picking?"リアクションの選択を閉じる":"リアクションを追加")+'">' +
    (picking ? '×' : '＋') + '</button>';

  var commentsHtml = "";
  if(isOpen){
    commentsHtml = '<div class="comments">' +
      state.comments.map(function(c){
        if(state.editing && state.editing.kind==="comment" && state.editing.id===c.id && canEdit(c)){
          return '<div class="comment-edit-row">' + avatar(c.authorId,22) +
            '<input id="editCommentText" class="input comment-input" value="'+esc(c.text)+'">' +
            '<button class="tool-btn" data-act="edit-save" data-kind="comment" data-id="'+c.id+'" data-post="'+post.id+'">保存</button>' +
            '<button class="tool-btn" data-act="edit-cancel">中止</button>' +
          '</div>';
        }
        return '<div class="comment-row">'+avatar(c.authorId,22) +
          '<div class="comment-bubble">' +
            '<span class="comment-name">'+esc(getM(c.authorId).displayName)+' </span>' +
            '<span class="comment-text">'+esc(c.text)+'</span>' +
            editedMark(c) +
          '</div>' +
          renderTools("comment", c, post.id) +
        '</div>';
      }).join("") +
      '<div class="comment-input-row">' + avatar(me,22) +
        '<input class="input comment-input" placeholder="コメントを入力... (Enter で送信)" data-act="comment-input" data-id="'+post.id+'">' +
      '</div>' +
    '</div>';
  }

  return '<div class="card post-card">' +
    '<div class="post-head">' + avatar(post.authorId,38) +
      '<div class="post-head-info">' +
        '<div class="post-head-line">' +
          '<span class="post-name">'+esc(from.displayName)+'</span>' +
          (to ? '<span class="post-arrow">→</span><span class="post-to">'+esc(to.displayName)+'</span>' : '') +
          badge(post.type, CT[post.type]||"blue") +
          (post.valueTag ? '<span class="tag-value">#'+esc(post.valueTag)+'</span>' : "") +
        '</div>' +
        '<div class="post-time">'+tAgo(post.createdAtMs)+editedMark(post)+(post.pending?' <span class="pending-mark">送信中</span>':'')+'</div>' +
      '</div>' +
      renderTools("feed", post) +
    '</div>' +
    '<div class="post-text">'+esc(post.text)+'</div>' +
    '<div class="post-actions'+(picking?" post-actions-picking":"")+'">' + reactHtml +
      '<button class="comment-toggle-btn" data-act="comment-toggle" data-id="'+post.id+'">💬 '+(post.commentCount||0)+'</button>' +
      '<div class="react-peek" hidden></div>' +
    '</div>' +
    commentsHtml +
  '</div>';
}

// ══════════════════════════════════════════════════════════════════
//  チェックリスト（掲示板投稿に期日と完了チェックを付けたもの）
//
//  独立したタブやコレクションにはしていない。連絡事項と「やること」は
//  現場では同じ流れで出てくるもので、置き場所を分けると
//  「掲示板に書いたのに気づかれない／タスクに入れ忘れた」が起きる。
//
//  既存の投稿には dueDate も doneBy も無い。読む側は必ず
//  「無い」場合を通常の状態として扱うこと（過去データを壊さない）。
// ══════════════════════════════════════════════════════════════════

/**
 * チェックリストとして扱う投稿か。
 * 期日が入っているものをチェックリストとみなす。フラグを別に持たないのは、
 * 「フラグは立っているが期日が無い」ようなずれた状態を作らないため。
 */
function isTask(post){ return !!post.dueDate; }

/**
 * チェックの対象になるメンバー。
 * checkTargets が空（または無い）なら全員が対象。
 * 「全員」を memberId の列挙で保存しないのは、あとから人が増えたときに
 * 過去のタスクの対象者が自動で追いつかないから。
 */
function taskTargets(post){
  var t = post.checkTargets;
  if(!t || !t.length) return session.members.slice();
  return session.members.filter(function(m){ return t.indexOf(m.id) >= 0; });
}
function isTaskTarget(post, memberId){
  var t = post.checkTargets;
  if(!t || !t.length) return true;
  return t.indexOf(memberId) >= 0;
}
function taskDone(post, memberId){ return !!(post.doneBy && post.doneBy[memberId]); }
function taskPendingList(post){
  return taskTargets(post).filter(function(m){ return !taskDone(post, m.id); });
}
function taskDoneList(post){
  return taskTargets(post).filter(function(m){ return taskDone(post, m.id); });
}

/** 自分がまだ終わっていないタスクか。期限切れも「未完了」として残す */
function taskNeedsMe(post){
  return isTask(post)
      && isTaskTarget(post, currentUserId())
      && !taskDone(post, currentUserId());
}

/** 期日の近い順に並べるためのキー。日付が壊れているものは末尾へ */
function dueMs(post){
  var d = ymdToDate(post.dueDate);
  return d ? d.getTime() : 8.64e15;
}

/** 期日のバッジ。残り2日以内は色を変える（当日に初めて気づく事態を避ける） */
function taskBadge(post){
  var d = ymdDaysLeft(post.dueDate);
  if(d === null) return "";
  var label = ymdLabel(post.dueDate);
  var cls = "", text;
  if(d < 0){        cls = " sbadge-late"; text = "期限切れ"; }
  else if(d === 0){ cls = " sbadge-soon"; text = "本日まで"; }
  else {            cls = (d <= 2 ? " sbadge-soon" : ""); text = "残り"+d+"日"; }
  return '<span class="sbadge'+cls+'">📅 '+text+' · '+esc(label)+'</span>';
}

/**
 * 期日と対象者の入力欄。投稿フォームと編集フォームで共用する。
 *
 * <details> と素の <input type="checkbox"> で組んでいるのは、開閉と
 * チェックの状態をブラウザ側に持たせるため。state に持たせると
 * 1つ押すたびに全体を描き直すことになり、入力途中の本文が消える。
 */
function renderTaskFields(prefix, post){
  var due = (post && post.dueDate) || "";
  var sel = (post && post.checkTargets) || null;
  var all = !sel || !sel.length;
  var chips = session.members.map(function(m){
    var on = all || sel.indexOf(m.id) >= 0;
    return '<label class="target-chip">' +
      '<input type="checkbox" class="'+prefix+'Target" value="'+esc(m.id)+'"'+(on?" checked":"")+'>' +
      avatar(m.id, 18) + '<span>'+esc(m.displayName)+'</span>' +
    '</label>';
  }).join("");
  return '<div class="task-fields">' +
    '<label class="task-fields-label" for="'+prefix+'Due">📅 期日（入れるとチェックリストになります）</label>' +
    '<input type="date" id="'+prefix+'Due" class="input" value="'+esc(due)+'">' +
    '<details class="target-picker"'+(all?"":" open")+'>' +
      '<summary>対象者を選ぶ<span class="target-hint">既定は全員</span></summary>' +
      '<div class="target-chips">'+chips+'</div>' +
    '</details>' +
  '</div>';
}

/** 入力欄から値を取り出す。期日が空ならチェックリストにしない */
function readTaskFields(prefix){
  var el = document.getElementById(prefix + "Due");
  var due = (el && el.value ? el.value : "").trim() || null;
  var picked = [], total = 0;
  Array.prototype.forEach.call(document.querySelectorAll("." + prefix + "Target"), function(b){
    total++;
    if(b.checked) picked.push(b.value);
  });
  // 全員選ばれている／誰も選ばれていないときは null（＝全員）で保存する。
  // 全員を列挙して残すと、あとから入った人が過去のタスクの対象から抜け落ちる。
  var targets = (picked.length === 0 || picked.length === total) ? null : picked;
  return { dueDate: due, checkTargets: due ? targets : null };
}

/** 投稿カードの中のチェックリスト部分 */
function renderTaskBlock(post){
  if(!isTask(post)) return "";
  var me = currentUserId();
  var targets = taskTargets(post);
  var pending = taskPendingList(post);
  var done    = taskDoneList(post);
  var isOpen  = state.boardOpenTask === post.id;
  var iAmDone = taskDone(post, me);

  var mine = isTaskTarget(post, me)
    ? '<button class="task-check'+(iAmDone?" task-check-done":"")+'" ' +
        'data-act="task-toggle" data-id="'+post.id+'" ' +
        'role="checkbox" aria-checked="'+(iAmDone?"true":"false")+'">' +
        '<span class="task-box">'+(iAmDone?"✓":"")+'</span>' +
        '<span>'+(iAmDone?"完了しました（取り消す）":"完了にする")+'</span>' +
      '</button>'
    : '<div class="task-note">あなたはこのチェックリストの対象者ではありません</div>';

  return '<div class="task-block">' +
    '<div class="task-head">' +
      '<span class="task-head-label">✅ チェックリスト</span>' +
      '<button class="reader-toggle'+(isOpen?" reader-toggle-open":"")+'" ' +
        'data-act="task-status" data-id="'+post.id+'" aria-expanded="'+(isOpen?"true":"false")+'">' +
        '完了 '+done.length+'/'+targets.length+'名' +
        (pending.length ? '<span class="reader-toggle-unread">未完了 '+pending.length+'</span>' : '') +
        '<span class="reader-caret">'+(isOpen?"▲":"▼")+'</span>' +
      '</button>' +
    '</div>' +
    mine +
    (isOpen ? renderPeoplePanel({
      pendingLabel:"未完了", pending:pending,
      doneLabel:"完了",     done:done,
      allDoneText:"全員が完了しました"
    }) : "") +
  '</div>';
}

/**
 * 自分の未完了タスクだけを掲示板の先頭に出す。
 * 掲示板は投稿日時順なので、期日が迫っているものが下に埋もれる。
 * ここには「何を・いつまでに」だけを置き、期日の近い順に並べる。
 */
function renderMyTasks(){
  var mine = state.board.filter(taskNeedsMe).sort(function(a,b){ return dueMs(a) - dueMs(b); });
  if(!mine.length) return "";
  var rows = mine.map(function(p){
    var d = ymdDaysLeft(p.dueDate);
    var cls = d === null ? "" : (d < 0 ? " mytask-due-late" : (d <= 2 ? " mytask-due-soon" : ""));
    var text = d === null ? "" : (d < 0 ? "期限切れ" : (d === 0 ? "本日" : "残り"+d+"日"));
    return '<button class="mytask-row" data-act="task-toggle" data-id="'+p.id+'">' +
      '<span class="task-box"></span>' +
      '<span class="mytask-title">'+esc(p.title)+'</span>' +
      '<span class="mytask-due'+cls+'">'+esc(text)+'</span>' +
    '</button>';
  }).join("");
  return '<div class="card mytask-card">' +
    '<div class="mytask-head">✅ あなたの未完了 '+mine.length+'件</div>' +
    rows +
  '</div>';
}

/** 名前チップ1つ。未読側は色を強めて目に入るようにする */
function memberChip(m, emphasize){
  return '<span class="reader-chip'+(emphasize?" reader-chip-unread":"")+'">' +
    avatar(m.id,18) + '<span>'+esc(m.displayName)+'</span></span>';
}

/**
 * 「まだの人」を主、「済んだ人」を従として出す共通パネル。
 * この規模ではまだの人のほうが短く、そのまま声かけの対象になるため、
 * 常にそちらを上に置いて色を強める。
 */
function renderPeoplePanel(cfg){
  var html = '<div class="reader-panel">';
  if(cfg.pending.length){
    html += '<div class="reader-group">' +
      '<div class="reader-label reader-label-unread">'+esc(cfg.pendingLabel)+' '+cfg.pending.length+'名</div>' +
      '<div class="reader-chips">' + cfg.pending.map(function(m){ return memberChip(m, true); }).join("") + '</div>' +
    '</div>';
  }else{
    html += '<div class="reader-group"><div class="reader-label reader-label-done">✓ '+esc(cfg.allDoneText)+'</div></div>';
  }
  if(cfg.done.length){
    html += '<div class="reader-group">' +
      '<div class="reader-label">'+esc(cfg.doneLabel)+' '+cfg.done.length+'名</div>' +
      '<div class="reader-chips reader-chips-muted">' + cfg.done.map(function(m){ return memberChip(m, false); }).join("") + '</div>' +
    '</div>';
  }
  return html + '</div>';
}

//  RENDER: SURVEY
