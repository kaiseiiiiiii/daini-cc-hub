/**
 * votes は {memberId: [optionId]} なので、選択肢ごとの票数はここで数える。
 * 「誰がどれに入れたか」は画面には一切出さない（設計上の約束）。
 */
function voteCounts(sv){
  var counts = {}, total = 0;
  var v = sv.votes || {};
  (sv.options || []).forEach(function(o){ counts[o.id] = 0; });
  for(var memberId in v){
    (v[memberId] || []).forEach(function(optId){
      if(counts[optId] === undefined) counts[optId] = 0;
      counts[optId]++; total++;
    });
  }
  return { counts: counts, total: total };
}

function renderSurveyEditForm(sv){
  var optRows = (sv.options||[]).map(function(o, i){
    return '<input class="input edit-opt" value="'+esc(o.label)+'" aria-label="選択肢 '+(i+1)+'">';
  }).join("");
  return '<div class="card form-card edit-card">' +
    '<div class="edit-head">アンケートを編集</div>' +
    '<div class="form-col">' +
      '<input id="editTitle" class="input" value="'+esc(sv.title)+'">' +
      '<div class="form-col-tight">'+optRows+'</div>' +
      '<div class="edit-note">選択肢の文言だけ直せます。追加・削除はできません（すでに入っている票の行き場が無くなるため）。</div>' +
      '<div class="form-row form-row-center">' +
        '<label class="checkbox-label nowrap"><input type="checkbox" id="editMulti"'+(sv.multi?" checked":"")+'> 複数選択可</label>' +
        '<input type="date" id="editDeadline" class="input" style="flex:1" value="'+esc(sv.deadline||"")+'">' +
      '</div>' +
      '<label class="checkbox-label"><input type="checkbox" id="editClosed"'+(sv.closed?" checked":"")+'> 締め切る（投票を止める）</label>' +
      '<div class="form-row">' +
        '<button class="btn-primary" data-act="edit-save" data-kind="survey" data-id="'+sv.id+'">保存する</button>' +
        '<button class="btn-ghost" data-act="edit-cancel">キャンセル</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function renderSurveyCard(sv){
  if(state.editing && state.editing.kind==="survey" && state.editing.id===sv.id && canEdit(sv)){
    return renderSurveyEditForm(sv);
  }
  var me = currentUserId();
  var c = voteCounts(sv);
  var myV = (sv.votes && sv.votes[me]) || [];

  var optsHtml = (sv.options || []).map(function(opt){
    var cnt = c.counts[opt.id] || 0;
    var pct = c.total>0 ? Math.round(cnt/c.total*100) : 0;
    var voted = myV.indexOf(opt.id)>=0;
    return '<div class="survey-opt-row"'+(sv.closed?"":' data-act="vote" data-id="'+sv.id+'" data-opt="'+esc(opt.id)+'"')+'>' +
      '<div class="survey-opt-line">' +
        '<span class="survey-opt-label'+(voted?" voted":"")+'">'+(voted?"✓ ":"")+esc(opt.label)+'</span>' +
        '<span class="survey-opt-count">'+cnt+'票 ('+pct+'%)</span>' +
      '</div>' +
      '<div class="bar-bg"><div class="bar-fill" style="width:'+pct+'%;background:'+(voted?"var(--accent)":"var(--text-4)")+'"></div></div>' +
    '</div>';
  }).join("");

  // 回答状況。誰が何に入れたかは出さず、「回答したかどうか」だけを見る。
  var done    = session.members.filter(function(m){ return !!(sv.votes && sv.votes[m.id]); });
  var pending = session.members.filter(function(m){ return !(sv.votes && sv.votes[m.id]); });
  var isOpen  = state.surveyOpenStatus === sv.id;

  return '<div class="card">' +
    '<div class="survey-head">' + avatar(sv.authorId,28) +
      '<div class="survey-head-info">' +
        '<div class="survey-title">'+esc(sv.title)+editedMark(sv)+'</div>' +
        '<div class="survey-meta">'+esc(getM(sv.authorId).displayName)+' · '+(sv.multi?"複数選択可":"単一選択")+(sv.deadline?' · 期限: '+esc(sv.deadline):"")+'</div>' +
      '</div>' +
      renderTools("survey", sv) +
    '</div>' +
    optsHtml +
    '<div class="survey-foot">' +
      '<span class="survey-total-text">合計 '+c.total+'票'+(sv.closed?'<span class="survey-closed">終了</span>':'')+'</span>' +
      '<button class="reader-toggle'+(isOpen?" reader-toggle-open":"")+'" data-act="survey-status" data-id="'+sv.id+'" aria-expanded="'+(isOpen?"true":"false")+'">' +
        '回答 '+done.length+'名' +
        (pending.length ? '<span class="reader-toggle-unread">未回答 '+pending.length+'</span>' : '') +
        '<span class="reader-caret">'+(isOpen?"▲":"▼")+'</span>' +
      '</button>' +
    '</div>' +
    (isOpen ? renderPeoplePanel({
      pendingLabel:"未回答", pending:pending,
      doneLabel:"回答済み", done:done,
      allDoneText:"全員が回答済みです"
    }) : "") +
    (isOpen ? '<div class="survey-privacy">※ 誰がどの選択肢を選んだかは表示しません</div>' : "") +
  '</div>';
}

// ══════════════════════════════════════════════════════════════════
//  RENDER: SHIFT
//  データは Firestore の shifts/{YYYY_M}（Phase 5 で GAS が書き込む）。
// ══════════════════════════════════════════════════════════════════
// 「休み」と「未提出」の区別について。
//
// 原本のセルは、休みでも未提出でも同じ空欄なので、セル単体では区別できない。
// ただし「その人の行がシフト表に無い」ことは区別できる（GAS が氏名で照合して
// 一致した行だけ rows に入れるため）。そこで、
//
//   行が無い          → 未提出（表に載っていない）
//   行はあるが空欄    → 休み
//
// とした。行の中の空欄をさらに分けたい場合は、原本側に「休」などの明示的な
// 記号を入れてもらう必要がある。それ以外に判別材料は無い。
function shiftCellClass(val){
  if(val==="早番") return "shift-early";
  if(val==="遅番") return "shift-late";
  if(val) return "shift-other";
  return "shift-off";
}
function shiftCellLabel(val, wide){
  if(val==="早番") return wide ? "早番" : "早";
  if(val==="遅番") return wide ? "遅番" : "遅";
  if(val) return val;
  return "–";
}

/** 表示中の月のシフト表に、その人の行があるか */
function hasShiftRow(sh, memberId){
  return !!(sh && sh.rows && sh.rows[memberId]);
}

/** 絞り込み後のメンバー。チームセレクタと連動する。 */
function shiftFilteredMembers(){
  if(state.shiftTeam === "all") return session.members;
  return session.members.filter(function(m){ return m.team === state.shiftTeam; });
}

/**
 * 週表示で出す日付の範囲を決める。
 *
 * 週の始まりは月曜。手配粗利額シートの Weekly 集計が月曜起点なので、
 * そちらに合わせておかないと「今週の実績」と見比べたときにズレる。
 */
function shiftWeekRange(sh){
  var dates = sh.dates || [];
  var wds = sh.weekdays || [];
  if(!dates.length) return { start:0, end:0 };

  var start = state.shiftWeekStart;
  if(start === null || start === undefined){
    // 本日を含む週。本日が別の月なら、その月の最初の週。
    var t = dates.indexOf(todayDateLabel());
    start = t >= 0 ? t : 0;
    while(start > 0 && String(wds[start]).trim() !== "月") start--;
  }
  start = Math.max(0, Math.min(start, dates.length - 1));

  // 月曜から次の月曜の手前まで。月初・月末は7日に満たないこともある。
  var end = start + 1;
  while(end < dates.length && String(wds[end]).trim() !== "月" && end - start < 7) end++;
  return { start:start, end:end };
}

/** その週の1つ前・1つ後の月曜の index（無ければ null） */
function shiftWeekStep(sh, dir){
  var dates = sh.dates || [], wds = sh.weekdays || [];
  var r = shiftWeekRange(sh);
  if(dir > 0){
    return r.end < dates.length ? r.end : null;
  }
  if(r.start === 0) return null;
  var i = r.start - 1;
  while(i > 0 && String(wds[i]).trim() !== "月") i--;
  return i;
}

/**
 * 本日のシフトを区分ごとにまとめる。
 * 「早番が誰か」を名前で知りたいのが第一の用途なので、区分→氏名の配列にする。
 * どの月を見ていても本日を出すため、当月の購読だけを見る。
 */
function todayShiftGroups(){
  var sh = state.shiftCurrent;
  if(!sh || !sh.dates || !sh.rows) return null;
  var idx = sh.dates.indexOf(todayDateLabel());
  if(idx < 0) return null;

  var order = [], byKind = {}, restCount = 0, unsubmitted = 0;
  session.members.forEach(function(m){
    if(!hasShiftRow(sh, m.id)){ unsubmitted++; return; }
    var v = String(sh.rows[m.id][idx] || "").trim();
    if(!v){ restCount++; return; }
    if(!byKind[v]){ byKind[v] = []; order.push(v); }
    byKind[v].push(m.displayName);
  });

  // 早番・遅番を先に、残りは人数の多い順。運用上その2つを最初に見るため。
  order.sort(function(a,b){
    var rank = function(k){ return k==="早番" ? 0 : k==="遅番" ? 1 : 2; };
    if(rank(a) !== rank(b)) return rank(a) - rank(b);
    return byKind[b].length - byKind[a].length;
  });
  return { order:order, byKind:byKind, rest:restCount, unsubmitted:unsubmitted };
}

function renderTodayShiftCard(){
  var g = todayShiftGroups();
  if(!g) return "";
  var d = new Date();
  var wd = ["日","月","火","水","木","金","土"][d.getDay()];

  var groups = g.order.map(function(k){
    var cls = k==="早番" ? "shift-early" : k==="遅番" ? "shift-late" : "shift-other";
    return '<div class="shift-today-group">' +
      '<span class="shift-today-tag '+cls+'">'+esc(k)+'</span>' +
      '<div class="shift-today-names">'+esc(g.byKind[k].join("、")) +
        '<span class="shift-today-count">'+g.byKind[k].length+'名</span>' +
      '</div>' +
    '</div>';
  }).join("");

  if(!groups){
    groups = '<div class="shift-today-names">本日シフトに入っているメンバーはいません</div>';
  }

  var foot = [];
  if(g.rest) foot.push("休み "+g.rest+"名");
  if(g.unsubmitted) foot.push("未提出 "+g.unsubmitted+"名");

  return '<div class="card shift-today-card">' +
    '<div class="shift-today-head">' +
      '<span class="shift-today-title">本日のシフト</span>' +
      '<span class="shift-today-date">'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+wd+'）</span>' +
    '</div>' +
    groups +
    (foot.length ? '<div class="shift-today-rest">'+esc(foot.join(" / "))+'</div>' : '') +
  '</div>';
}
/** 月切替バー。翌月は原本に無いことが普通にあるので、無いこと自体を表示する。 */
function renderShiftMonthBar(){
  var off = state.shiftMonthOffset;
  var m = monthOf(off);
  return '<div class="shift-bar">' +
    '<button class="shift-nav-btn" data-act="shift-month" data-id="'+(off-1)+'"'+
      (off <= -1 ? ' disabled' : '')+' aria-label="前の月">◀</button>' +
    '<div class="shift-bar-label">'+m.year+'年'+m.label +
      (off===0 ? '<span class="shift-bar-sub">当月</span>' :
       off===-1 ? '<span class="shift-bar-sub">前月</span>' :
                  '<span class="shift-bar-sub">翌月</span>') +
    '</div>' +
    '<button class="shift-nav-btn" data-act="shift-month" data-id="'+(off+1)+'"'+
      (off >= 1 ? ' disabled' : '')+' aria-label="次の月">▶</button>' +
  '</div>';
}

/** 週/月の切り替えとチーム絞り込み */
function renderShiftControls(){
  var chips = [["week","週"],["month","月"]].map(function(v){
    return '<button class="chip'+(state.shiftView===v[0]?" chip-active":"")+'" '+
      'data-act="shift-view" data-id="'+v[0]+'">'+v[1]+'</button>';
  }).join("");

  var teamChips = '<button class="chip'+(state.shiftTeam==="all"?" chip-active":"")+'" '+
    'data-act="shift-team" data-id="all">全体</button>' +
    session.teams.map(function(t){
      return '<button class="chip'+(state.shiftTeam===t.id?" chip-active":"")+'" '+
        'data-act="shift-team" data-id="'+esc(t.id)+'">'+esc(t.label)+'</button>';
    }).join("");

  return '<div class="shift-controls">'+chips+
    '<span class="shift-controls-spacer"></span>'+teamChips+'</div>';
}

function renderShift(){
  var sh = displayedShift();
  var off = state.shiftMonthOffset;

  if(!sh || !sh.dates || !sh.dates.length){
    var body;
    if(state.shiftOtherLoading){
      body = emptyState("🕐","読み込み中…","");
    }else if(off === 1){
      // 翌月分がまだ作られていないのは正常な状態。エラーとして見せない。
      body = emptyState("🗓","翌月のシフトは未作成です",
        "原本に翌月のシートが追加されると、次の同期で表示されます");
    }else if(off === -1){
      body = emptyState("🗓","前月のシフトが見つかりません",
        "原本に前月のシートが無いか、まだ同期されていません");
    }else{
      body = emptyState("🕐","この月のシフトはまだ同期されていません",
        "スプレッドシート同期が動くと表示されます");
    }
    return '<div class="tab-pad">' +
      renderSyncBar() + renderShiftMonthBar() + renderTodayShiftCard() + body +
    '</div>';
  }

  var todayIdx = sh.dates.indexOf(todayDateLabel());
  var wide = state.shiftView === "week";

  // 表示する日付の範囲。月表示は全日、週表示は月曜起点の1週間。
  var from = 0, to = sh.dates.length, weekBar = "";
  if(wide){
    var r = shiftWeekRange(sh);
    from = r.start; to = r.end;
    var prev = shiftWeekStep(sh, -1), next = shiftWeekStep(sh, 1);
    weekBar = '<div class="shift-bar">' +
      '<button class="shift-nav-btn" data-act="shift-week" data-id="'+(prev===null?"":prev)+'"'+
        (prev===null?' disabled':'')+' aria-label="前の週">◀</button>' +
      '<div class="shift-bar-label">'+esc(sh.dates[from])+' 〜 '+esc(sh.dates[to-1])+'</div>' +
      '<button class="shift-nav-btn" data-act="shift-week" data-id="'+(next===null?"":next)+'"'+
        (next===null?' disabled':'')+' aria-label="次の週">▶</button>' +
    '</div>';
  }

  var idxs = [];
  for(var i = from; i < to; i++) idxs.push(i);

  var dateHeaderCells = idxs.map(function(i){
    return '<div class="shift-cell shift-date-head'+(i===todayIdx?" shift-today":"")+'">' +
      esc(String(sh.dates[i]).split("/")[1])+'<br>'+esc((sh.weekdays||[])[i]||"") +
    '</div>';
  }).join("");

  var members = shiftFilteredMembers();

  function shiftRowsFor(ms){
    return ms.map(function(m){
      var hasRow = hasShiftRow(sh, m.id);
      var data = hasRow ? sh.rows[m.id] : [];
      var cells = idxs.map(function(i){
        if(!hasRow){
          return '<div class="shift-cell shift-none'+(i===todayIdx?" shift-today":"")+'">未</div>';
        }
        var val = String(data[i] || "").trim();
        return '<div class="shift-cell '+shiftCellClass(val)+(i===todayIdx?" shift-today":"")+'">' +
          esc(shiftCellLabel(val, wide)) + '</div>';
      }).join("");
      return '<div class="shift-row">' +
        '<div class="shift-name-cell'+(hasRow?"":" shift-name-none")+'">' +
          avatar(m.id,24)+'<span>'+esc(m.displayName)+'</span>' +
        '</div>' +
        '<div class="shift-days">'+cells+'</div>' +
      '</div>';
    }).join("");
  }

  var placed = {};
  var teamsHtml = session.teams.map(function(team){
    var ms = members.filter(function(m){ return m.team===team.id; });
    ms.forEach(function(m){ placed[m.id] = true; });
    if(!ms.length) return "";
    return '<div class="team-block-title">'+esc(team.label)+'</div>' + shiftRowsFor(ms);
  }).join("");

  // チーム未設定のメンバーが表から抜け落ちないようにする。
  // 「載っていない人がいる」ことに気づけないのが一番まずいため。
  var orphans = members.filter(function(m){ return !placed[m.id]; });
  if(orphans.length){
    teamsHtml += '<div class="team-block-title">その他</div>' + shiftRowsFor(orphans);
  }

  // 日別の人数。絞り込み中はその範囲の人数になるので、見えている行と一致する。
  //
  // 人数が少ない日への警告色は入れていない。土日や、遅番を置かない曜日など
  // 「元々薄いのが正常」な日が実データに存在し、機械的に色を付けると
  // ノイズになって誰も見なくなるため。数字だけ出して判断は人に委ねる。
  var countCells = idxs.map(function(i){
    var e = 0, l = 0;
    members.forEach(function(m){
      if(!hasShiftRow(sh, m.id)) return;
      var v = String(sh.rows[m.id][i] || "").trim();
      if(v === "早番") e++;
      else if(v === "遅番") l++;
    });
    return '<div class="shift-cell shift-count-cell'+(i===todayIdx?" shift-today":"")+'">' +
      '<span class="shift-count-early">'+e+'</span>' +
      '<span class="shift-count-late">'+l+'</span>' +
    '</div>';
  }).join("");

  return '<div class="tab-pad">' +
    renderSyncBar() +
    renderShiftMonthBar() +
    renderTodayShiftCard() +
    renderShiftControls() +
    weekBar +
    '<div class="shift-scroll'+(wide?" shift-week":"")+'">' +
      '<div class="shift-row shift-header-row">' +
        '<div class="shift-name-cell shift-name-head">メンバー</div>' +
        '<div class="shift-days">'+dateHeaderCells+'</div>' +
      '</div>' +
      teamsHtml +
      '<div class="shift-row shift-count-row">' +
        '<div class="shift-name-cell">早番 / 遅番</div>' +
        '<div class="shift-days">'+countCells+'</div>' +
      '</div>' +
    '</div>' +
    '<div class="shift-legend">' +
      '<span class="legend-item"><span class="legend-dot shift-early">早</span>早番</span>' +
      '<span class="legend-item"><span class="legend-dot shift-late">遅</span>遅番</span>' +
      '<span class="legend-item"><span class="legend-dot shift-other">他</span>21時など</span>' +
      '<span class="legend-item"><span class="legend-dot shift-off">–</span>休み</span>' +
      '<span class="legend-item"><span class="legend-dot shift-none">未</span>未提出</span>' +
    '</div>' +
  '</div>';
}

// ══════════════════════════════════════════════════════════════════
//  RENDER: KPI（Phase 7 で「目標進捗」に置き換え予定）
//  データは Firestore の metrics/latest（Phase 5 で GAS が書き込む）。
// ══════════════════════════════════════════════════════════════════
function kSt(key,val){
  var t = KPI_DEF[key];
  if(t.g==="high") return val>=t.t ? "success" : (val>=t.t*0.9 ? "warn" : "bad");
  if(t.g==="low") return val<=t.t ? "success" : (val<=t.t*1.1 ? "warn" : "bad");
  return Math.abs(val-t.t)<=0.5 ? "success" : (Math.abs(val-t.t)<=1 ? "warn" : "bad");
}
function renderKpi(){
  var byMember = (state.metrics && state.metrics.byMember) || null;
  if(!byMember){
    return '<div class="tab-pad">' +
      renderSyncBar() +
      emptyState("📈","実績はまだ同期されていません",
        "スプレッドシート同期が動くと表示されます") +
    '</div>';
  }

  // 集計対象は「同期データに実績が入っているメンバー」。
  // role は権限区分（member/admin）であって職位ではないため、
  // 集計対象の判定には使わない。
  var agents = session.members.filter(function(m){ return !!byMember[m.id]; });
  var avg = {};
  Object.keys(KPI_DEF).forEach(function(k){
    var vals = []; agents.forEach(function(m){ if(byMember[m.id] && byMember[m.id][k]!=null) vals.push(byMember[m.id][k]); });
    avg[k] = vals.length ? Math.round(vals.reduce(function(a,b){return a+b;},0)/vals.length*10)/10 : 0;
  });
  var ranks = agents.map(function(m){
    var sc=0, tot=0;
    Object.keys(KPI_DEF).forEach(function(k){
      if(byMember[m.id][k]==null) return;
      var st = kSt(k, byMember[m.id][k]);
      sc += st==="success"?3:(st==="warn"?1:0); tot += 3;
    });
    return { m:m, pct: tot ? Math.round(sc/tot*100) : 0 };
  }).sort(function(a,b){ return b.pct-a.pct; });

  var disp = state.kpiSel ? byMember[state.kpiSel] : avg;
  var filterHtml = '<button class="chip'+(!state.kpiSel?" chip-active":"")+'" data-act="kpi-clear">全体</button>' +
    agents.map(function(m){ return '<button class="chip'+(state.kpiSel===m.id?" chip-active":"")+'" data-act="kpi-toggle" data-id="'+m.id+'">'+esc(m.displayName)+'</button>'; }).join("");

  if(state.kpiSel && !byMember[state.kpiSel]){
    return '<div class="tab-pad">' +
      '<div class="kpi-filter">'+filterHtml+'</div>' +
      '<div class="notice">'+esc(getM(state.kpiSel).displayName)+'さんは本日の生産性データがまだありません。</div>' +
    '</div>';
  }

  var gridHtml = Object.keys(KPI_DEF).map(function(key){
    var cfg = KPI_DEF[key]; var val = disp ? disp[key] : null;
    if(val==null) return "";
    var st = kSt(key,val); var colorVar = st==="success"?"green":(st==="warn"?"amber":"red");
    var pct = cfg.g==="low" ? Math.min(100, Math.round(cfg.t/val*100)) : Math.min(100, Math.round(val/cfg.t*100));
    return '<div class="card kpi-card">' +
      '<div class="kpi-label">'+cfg.l+'</div>' +
      '<div class="kpi-value-row"><span class="kpi-value" style="color:var(--'+colorVar+')">'+val+'</span><span class="kpi-unit">'+cfg.u+'</span><span class="kpi-target">目標'+cfg.t+'</span></div>' +
      '<div class="kpi-bar-bg"><div class="kpi-bar" style="width:'+pct+'%;background:var(--'+colorVar+')"></div></div>' +
    '</div>';
  }).join("");

  var rankHtml = "";
  if(!state.kpiSel){
    rankHtml = '<div><div class="section-label">メンバーランキング</div>' +
      ranks.map(function(r,i){
        var color = r.pct>=70?"var(--green)":(r.pct>=40?"var(--amber)":"var(--red)");
        var numColor = i===0?"var(--amber)":(i<3?"var(--text-3)":"var(--border)");
        return '<div class="card rank-card" data-act="kpi-select" data-id="'+r.m.id+'">' +
          '<div class="rank-row">' +
            '<div class="rank-num" style="color:'+numColor+'">'+(i+1)+'</div>' +
            avatar(r.m.id,34) +
            '<div class="rank-info"><div class="rank-name">'+esc(r.m.displayName)+'</div><div class="rank-bar-bg"><div class="rank-bar" style="width:'+r.pct+'%;background:'+color+'"></div></div></div>' +
            '<div class="rank-pct-col"><div class="rank-pct" style="color:'+color+'">'+r.pct+'%</div><div class="rank-pct-label">KPI達成</div></div>' +
          '</div>' +
        '</div>';
      }).join("") +
    '</div>';
  }

  return '<div class="tab-pad">' +
    renderSyncBar() +
    '<div class="kpi-filter">'+filterHtml+'</div>' +
    '<div class="kpi-grid">'+gridHtml+'</div>' +
    rankHtml +
  '</div>';
}

// ══════════════════════════════════════════════════════════════════
//  MAIN RENDER
// ══════════════════════════════════════════════════════════════════
function render(){
  var app = document.getElementById("app");

  // ログインしていない／許可されていない間は、アプリの中身を一切描画しない。
  if(session.status === "config")    { app.innerHTML = renderConfigNotice(); return; }
  if(session.status === "loading")   { app.innerHTML = renderSplash("読み込み中..."); return; }
  if(session.status === "signedOut") { app.innerHTML = renderLogin(); return; }
  if(session.status === "denied")    { app.innerHTML = renderDenied(); return; }
  if(session.status === "error")     { app.innerHTML = renderErrorScreen(); return; }

  var body =
    state.tab==="feed"   ? renderFeed() :
    state.tab==="board"  ? renderBoard() :
    state.tab==="survey" ? renderSurvey() :
    state.tab==="shift"  ? renderShift() :
    renderKpi();
  var noticeHtml = state.notice
    ? '<div class="notice notice-error">'+esc(state.notice)+
      '<button class="notice-close" data-act="notice-close" aria-label="閉じる">×</button></div>'
    : '';
  app.innerHTML = renderHeader() + noticeHtml +
    '<div class="content" id="content">'+body+'</div>' + renderNav() +
    renderConfirmDialog();
}

// ══════════════════════════════════════════════════════════════════
//  ACTIONS
// ══════════════════════════════════════════════════════════════════
/**
 * 楽観的更新は自前で持たない。
 * Firestore SDK のレイテンシ補償が、書き込んだ瞬間にローカルキャッシュを
 * 更新して onSnapshot を発火させ、サーバー確定後にもう一度発火して整合を取る。
 * 失敗すれば自動でロールバックされ、ここの catch に来る。
 * 二重管理を避けるため、画面の状態は常に onSnapshot 由来のものだけを使う。
 */
async function write(label, fn, exclusive){
  // exclusive はフォーム送信用の二重送信よけ。
  // リアクションや投票は連打されうるので、ここでは弾かない
  // （弾くと押したのに反映されない、という分かりにくい挙動になる）。
  if(exclusive && state.busy) return;
  if(exclusive) state.busy = true;
  state.notice = "";
  try{
    await fn();
  }catch(e){
    var code = (e && e.code) ? e.code : String(e);
    state.notice = label + "に失敗しました（" + code + "）" +
      (code === "permission-denied" ? " — 権限がないか、ログインが切れています" : "");
  }finally{
    state.busy = false;
    render();
  }
}

/** 投稿・コメントに共通で載せるフィールド（Phase 4 の編集・削除で使う） */
function baseFields(){
  return {
    authorId: currentUserId(),
    createdAt: serverTimestamp(),
    updatedAt: serverTimestamp(),
    edited: false,
    deleted: false,
    deletedBy: null,
    deletedAt: null
  };
}

function submitFeedPost(){
  var text = document.getElementById("feedFormText").value.trim();
  if(!text) return;
  var type = document.getElementById("feedFormType").value;
  var to = document.getElementById("feedFormTo").value;
  var val = document.getElementById("feedFormVal").value;
  var payload = baseFields();
  payload.toMemberId = to || null;
  payload.type = type;
  payload.valueTag = val || null;
  payload.text = text;
  payload.reactions = {};
  payload.commentCount = 0;
  state.feedShowForm = false;
  write("投稿", function(){ return addDoc(collection(db, "feedPosts"), payload); }, true);
}

function toggleReaction(id, emoji){
  var me = currentUserId();
  var post = state.feed.filter(function(p){ return p.id===id; })[0];
  if(!post) return;
  var mine = (post.reactions && post.reactions[me]) || [];
  var next = mine.indexOf(emoji)>=0
    ? mine.filter(function(x){ return x!==emoji; })
    : mine.concat([emoji]);
  // 自分のキーだけを指定して更新する。ルール側も
  // 「reactions の変更キーが自分だけ」であることを検証している。
  var patch = {};
  patch["reactions." + me] = next.length ? next : deleteField();
  write("リアクション", function(){ return updateDoc(doc(db, "feedPosts", id), patch); });
}

function submitComment(postId, text){
  var payload = baseFields();
  payload.text = text;
  write("コメント", async function(){
    await addDoc(collection(db, "feedPosts", postId, "comments"), payload);
    // 一覧に「💬 N」を出すための非正規化値。ルールで ±1 しか許していない。
    await updateDoc(doc(db, "feedPosts", postId), { commentCount: increment(1) });
  });
}

function submitBoardPost(){
  var title = document.getElementById("boardFormTitle").value.trim();
  var body = document.getElementById("boardFormBody").value.trim();
  if(!title || !body) return;
  var payload = baseFields();
  payload.title = title;
  payload.body = body;
  payload.category = document.getElementById("boardFormCat").value;
  payload.pinned = document.getElementById("boardFormPinned").checked;
  // 書いた本人は既読扱いにしておく。そうしないと自分の投稿で
  // 自分が未読者リストに並び、声かけ対象が水増しされる。
  payload.readBy = {};
  payload.readBy[currentUserId()] = serverTimestamp();
  state.boardShowForm = false;
  write("投稿", function(){ return addDoc(collection(db, "boardPosts"), payload); }, true);
}

function markBoardRead(id){
  var me = currentUserId();
  var post = state.board.filter(function(p){ return p.id===id; })[0];
  if(!post || (post.readBy && post.readBy[me])) return;
  var patch = {};
  patch["readBy." + me] = serverTimestamp();
  write("既読の記録", function(){ return updateDoc(doc(db, "boardPosts", id), patch); });
}

function submitSurvey(){
  var title = document.getElementById("surveyFormTitle").value.trim();
  var labels = Array.prototype.map.call(document.querySelectorAll(".survey-opt"), function(i){ return i.value.trim(); }).filter(Boolean);
  if(!title || labels.length<2) return;
  // 選択肢は id と label に分ける。label を直しても投票が失われないようにするため。
  var options = labels.map(function(label, i){ return { id: "o" + (i+1), label: label }; });
  var payload = baseFields();
  payload.title = title;
  payload.options = options;
  payload.multi = document.getElementById("surveyFormMulti").checked;
  payload.deadline = document.getElementById("surveyFormDeadline").value || null;
  payload.closed = false;
  payload.votes = {};
  state.surveyShowForm = false;
  write("アンケートの作成", function(){ return addDoc(collection(db, "surveys"), payload); }, true);
}

// ══════════════════════════════════════════════════════════════════
//  編集
//
//  更新日時（updatedAt）はデータとしては持つが画面には出さない。
//  出るのは「編集済み」の印だけ。改ざん感を避けつつ、
//  投稿の時系列は投稿日時のままにしておくため。
//
//  編集履歴は今回保存しない。必要になったら
//  feedPosts/{id}/revisions のようなサブコレクションを足せばよく、
//  既存ドキュメントの構造を変える必要はない。
// ══════════════════════════════════════════════════════════════════
function startEdit(kind, id, postId){
  state.editing = { kind:kind, id:id, postId:postId || null };
  state.notice = "";
  render();
}
function cancelEdit(){ state.editing = null; render(); }

function saveFeedEdit(id){
  var text = document.getElementById("editText").value.trim();
  if(!text) return;
  var patch = {
    text: text,
    type: document.getElementById("editType").value,
    toMemberId: document.getElementById("editTo").value || null,
    valueTag: document.getElementById("editVal").value || null,
    edited: true,
    updatedAt: serverTimestamp()
  };
  state.editing = null;
  write("編集", function(){ return updateDoc(doc(db, "feedPosts", id), patch); }, true);
}

function saveBoardEdit(id){
  var title = document.getElementById("editTitle").value.trim();
  var body  = document.getElementById("editBody").value.trim();
  if(!title || !body) return;
  var patch = {
    title: title,
    body: body,
    category: document.getElementById("editCat").value,
    pinned: document.getElementById("editPinned").checked,
    edited: true,
    updatedAt: serverTimestamp()
  };
  state.editing = null;
  write("編集", function(){ return updateDoc(doc(db, "boardPosts", id), patch); }, true);
}

function saveSurveyEdit(id){
  var sv = state.surveys.filter(function(s){ return s.id===id; })[0];
  if(!sv) return;
  var title = document.getElementById("editTitle").value.trim();
  if(!title) return;
  // 選択肢は id を保ったままラベルだけ差し替える。
  // 追加・削除を許すと、既に入っている票の行き場が無くなるため。
  var labels = Array.prototype.map.call(document.querySelectorAll(".edit-opt"), function(i){ return i.value.trim(); });
  var options = sv.options.map(function(o, i){
    return { id: o.id, label: labels[i] || o.label };
  });
  var patch = {
    title: title,
    options: options,
    multi: document.getElementById("editMulti").checked,
    deadline: document.getElementById("editDeadline").value || null,
    closed: document.getElementById("editClosed").checked,
    edited: true,
    updatedAt: serverTimestamp()
  };
  state.editing = null;
  write("編集", function(){ return updateDoc(doc(db, "surveys", id), patch); }, true);
}

function saveCommentEdit(postId, commentId){
  var text = document.getElementById("editCommentText").value.trim();
  if(!text) return;
  var patch = { text: text, edited: true, updatedAt: serverTimestamp() };
  state.editing = null;
  write("編集", function(){
    return updateDoc(doc(db, "feedPosts", postId, "comments", commentId), patch);
  }, true);
}

// ══════════════════════════════════════════════════════════════════
//  削除（論理削除）
//
//  データは消さない。deleted を立て、誰がいつ消したかを必ず同時に記録する。
//  ルール側でも deletedBy が自分であること・deletedAt がサーバー時刻で
//  あることを強制しているので、記録を省いた削除はできない。
//
//  紐づくコメント・リアクション・既読には手を触れない（下の報告参照）。
// ══════════════════════════════════════════════════════════════════
function softDeletePatch(){
  return { deleted:true, deletedBy: currentUserId(), deletedAt: serverTimestamp() };
}

function askDelete(kind, id, postId){
  var target, title, body;
  if(kind==="feed"){
    target = state.feed.filter(function(p){ return p.id===id; })[0];
    if(!target) return;
    title = "この投稿を削除しますか？";
    body  = (target.commentCount ? "コメント"+target.commentCount+"件も一緒に見えなくなります。" : "") +
            "全員の画面からすぐに消えます。データ自体は残り、誰が削除したかが記録されます。";
  }else if(kind==="board"){
    target = state.board.filter(function(p){ return p.id===id; })[0];
    if(!target) return;
    title = "この共有事項を削除しますか？";
    body  = "既読 "+readCount(target)+"名の記録も一緒に見えなくなります。" +
            "全員の画面からすぐに消えます。データ自体は残ります。";
  }else if(kind==="survey"){
    target = state.surveys.filter(function(s){ return s.id===id; })[0];
    if(!target) return;
    var vc = voteCounts(target);
    title = "このアンケートを削除しますか？";
    body  = "集まった "+vc.total+"票も一緒に見えなくなります。" +
            "全員の画面からすぐに消えます。データ自体は残ります。";
  }else{
    target = state.comments.filter(function(c){ return c.id===id; })[0];
    if(!target) return;
    title = "このコメントを削除しますか？";
    body  = "全員の画面からすぐに消えます。データ自体は残ります。";
  }
  var notMine = target.authorId !== currentUserId();
  if(notMine) body += "\n\nこれは" + getM(target.authorId).displayName + "さんの投稿です。管理者権限で削除します。";

  state.confirm = {
    kind: kind, targetId: id, postId: postId || null,
    title: title, body: body, okLabel: "削除する"
  };
  render();
}

function runConfirmedDelete(){
  var c = state.confirm;
  if(!c) return;
  state.confirm = null;
  var patch = softDeletePatch();
  if(c.kind==="feed"){
    write("削除", function(){ return updateDoc(doc(db, "feedPosts", c.targetId), patch); }, true);
  }else if(c.kind==="board"){
    write("削除", function(){ return updateDoc(doc(db, "boardPosts", c.targetId), patch); }, true);
  }else if(c.kind==="survey"){
    write("削除", function(){ return updateDoc(doc(db, "surveys", c.targetId), patch); }, true);
  }else if(c.kind==="comment"){
    write("削除", async function(){
      await updateDoc(doc(db, "feedPosts", c.postId, "comments", c.targetId), patch);
      await updateDoc(doc(db, "feedPosts", c.postId), { commentCount: increment(-1) });
    }, true);
  }
}

function toggleVote(id, optId){
  var me = currentUserId();
  var sv = state.surveys.filter(function(s){ return s.id===id; })[0];
  if(!sv || sv.closed) return;
  var mine = (sv.votes && sv.votes[me]) || [];
  var next;
  if(mine.indexOf(optId)>=0){
    next = mine.filter(function(x){ return x!==optId; });
  }else{
    next = sv.multi ? mine.concat([optId]) : [optId];
  }
  var patch = {};
  patch["votes." + me] = next.length ? next : deleteField();
  write("投票", function(){ return updateDoc(doc(db, "surveys", id), patch); });
}

// ══════════════════════════════════════════════════════════════════
//  EVENTS
// ══════════════════════════════════════════════════════════════════
// ── リアクション者の表示 ─────────────────────────────────────
// PC はホバー、スマホは長押しで、押した人の名前を出す。
//
// ここだけは render() を呼ばずに DOM を直接書き換える。
// 画面全体を innerHTML で作り直す作りなので、hover で再描画すると
// カーソル下の要素が消えて mouseout → 再描画 → mouseover …
// と無限に往復してしまうため。
var peekTimer = null;
var suppressReactClick = false;

function peekBoxOf(btn){
  var row = btn.closest(".post-actions");
  return row ? row.querySelector(".react-peek") : null;
}
function showPeek(btn){
  hidePeek();                       // 直前の表示を必ず消してから出す
  var people = btn.getAttribute("data-people");
  if(!people) return;               // まだ誰も押していない絵文字なら何も出さない
  var box = peekBoxOf(btn);
  if(!box) return;
  box.textContent = btn.getAttribute("data-emoji") + "  " + people;
  box.hidden = false;
}
function hidePeek(){
  var boxes = document.querySelectorAll(".react-peek");
  Array.prototype.forEach.call(boxes, function(b){ b.hidden = true; });
}

function bindEvents(){
  var app = document.getElementById("app");

  // ---- PC: ホバー ----
  app.addEventListener("mouseover", function(e){
    if(!e.target.closest) return;
    var btn = e.target.closest(".react-btn");
    if(btn) showPeek(btn); else hidePeek();
  });
  app.addEventListener("mouseleave", hidePeek);

  // ---- スマホ: 長押し ----
  app.addEventListener("touchstart", function(e){
    if(!e.target.closest) return;
    // 新しい操作が始まったので、前回の長押しの痕跡を必ず消す。
    // ここでリセットしないと、長押しのあと別の場所を触ったときに
    // 打ち消しフラグが残り、次のリアクションが1回無視される。
    clearTimeout(peekTimer);
    suppressReactClick = false;
    hidePeek();
    var btn = e.target.closest(".react-btn");
    if(!btn) return;
    peekTimer = setTimeout(function(){
      // 長押しと判定。このあと発火する click は打ち消す
      // （名前を見ようとしただけでリアクションが付くのを防ぐ）
      suppressReactClick = true;
      showPeek(btn);
    }, 450);
  }, { passive:true });

  ["touchend","touchmove","touchcancel"].forEach(function(ev){
    app.addEventListener(ev, function(){ clearTimeout(peekTimer); }, { passive:true });
  });

  app.addEventListener("click", function(e){
    var el = e.target.closest("[data-act]");
    if(!el) return;
    var act = el.getAttribute("data-act"), id = el.getAttribute("data-id");

    // 認証系はログイン前でも動く必要がある
    if(act==="signin"){ doSignIn(); return; }
    if(act==="signout"){ doSignOut(); return; }

    // ここから先はログイン済みのときだけ
    if(session.status !== "ready") return;

    if(act==="tab"){
      state.tab = id;
      state.feedShowForm=false; state.boardShowForm=false; state.surveyShowForm=false;
      // タブを離れたらコメントの購読だけ落とす。
      // 一覧の3本はログイン中つなぎっぱなし（張り直すと全件読み直しになるため）。
      state.feedOpenComment = null;
      detachComments();
      render();
    }
    else if(act==="shift-month"){ setShiftMonth(parseInt(id, 10)); }
    else if(act==="shift-view"){
      state.shiftView = id;
      state.shiftWeekStart = null;   // 月表示から戻ったら本日の週に合わせ直す
      render();
    }
    else if(act==="shift-team"){ state.shiftTeam = id; render(); }
    else if(act==="shift-week"){
      if(id === "") return;          // 端まで来ている（ボタンは disabled）
      state.shiftWeekStart = parseInt(id, 10);
      render();
    }
    else if(act==="feed-sort"){ state.feedSort = id; render(); }
    else if(act==="feed-open-form"){ state.feedShowForm = true; render(); }
    else if(act==="feed-cancel"){ state.feedShowForm = false; render(); }
    else if(act==="feed-submit"){ submitFeedPost(); }
    else if(act==="react"){
      if(suppressReactClick){ suppressReactClick = false; return; }  // 長押し直後
      toggleReaction(id, el.getAttribute("data-emoji"));
    }
    else if(act==="comment-toggle"){
      // コメントは投稿ごとのサブコレクション。開いている1件だけ購読する。
      state.feedOpenComment = state.feedOpenComment===id ? null : id;
      attachComments(state.feedOpenComment);
      render();
    }
    else if(act==="legacy-download"){ downloadLegacy(); }
    else if(act==="legacy-discard"){ discardLegacy(); }
    else if(act==="notice-close"){ state.notice = ""; render(); }
    else if(act==="modal-body"){ return; }   // ダイアログ本体のクリックは背景に伝えない
    else if(act==="confirm-cancel"){ state.confirm = null; render(); }
    else if(act==="confirm-ok"){ runConfirmedDelete(); }
    else if(act==="trash-toggle"){ state.showTrash = !state.showTrash; render(); }
    else if(act==="edit-start"){
      startEdit(el.getAttribute("data-kind"), id, el.getAttribute("data-post"));
    }
    else if(act==="edit-cancel"){ cancelEdit(); }
    else if(act==="edit-save"){
      var k = el.getAttribute("data-kind");
      if(k==="feed")        saveFeedEdit(id);
      else if(k==="board")  saveBoardEdit(id);
      else if(k==="survey") saveSurveyEdit(id);
      else if(k==="comment")saveCommentEdit(el.getAttribute("data-post"), id);
    }
    else if(act==="delete-ask"){
      askDelete(el.getAttribute("data-kind"), id, el.getAttribute("data-post"));
    }
    else if(act==="board-open-form"){ state.boardShowForm = true; render(); }
    else if(act==="board-cancel"){ state.boardShowForm = false; render(); }
    else if(act==="board-submit"){ submitBoardPost(); }
    else if(act==="board-read"){ markBoardRead(id); }
    else if(act==="board-readers"){
      state.boardOpenReaders = state.boardOpenReaders===id ? null : id;
      render();
    }
    else if(act==="survey-open-form"){ state.surveyShowForm = true; render(); }
    else if(act==="survey-cancel"){ state.surveyShowForm = false; render(); }
    else if(act==="survey-add-opt"){
      var container = document.getElementById("surveyOptsContainer");
      var n = container.querySelectorAll(".survey-opt").length + 1;
      var inp = document.createElement("input");
      inp.className = "input survey-opt"; inp.placeholder = "選択肢 " + n;
      container.appendChild(inp);
    }
    else if(act==="survey-submit"){ submitSurvey(); }
    else if(act==="survey-status"){
      state.surveyOpenStatus = state.surveyOpenStatus===id ? null : id;
      render();
    }
    else if(act==="vote"){ toggleVote(id, el.getAttribute("data-opt")); }
    else if(act==="kpi-clear"){ state.kpiSel = null; render(); }
    else if(act==="kpi-toggle"){ state.kpiSel = state.kpiSel===id ? null : id; render(); }
    else if(act==="kpi-select"){ state.kpiSel = id; render(); }
  });

  app.addEventListener("change", function(e){
    if(session.status !== "ready") return;
    var el = e.target.closest("[data-act]");
    if(!el) return;
    if(el.getAttribute("data-act")==="feed-type-change"){
      var valSel = document.getElementById("feedFormVal");
      if(valSel) valSel.style.display = el.value==="Thanks" ? "block" : "none";
    }
  });

  app.addEventListener("keydown", function(e){
    if(session.status !== "ready") return;
    var el = e.target.closest('[data-act="comment-input"]');
    if(!el) return;
    if(e.key==="Enter"){
      var text = el.value.trim();
      if(!text) return;
      el.value = "";   // 送信は非同期。先に空にして二重送信を防ぐ
      submitComment(el.getAttribute("data-id"), text);
    }
  });
}

boot();
</script>
</body>
</html>
