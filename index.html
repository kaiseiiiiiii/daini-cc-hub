function renderTeamKpi(){
  var teams = teamKpiTeams();
  // 選んでいたチームが消えた（異動などで数字が無くなった）ときは全体に戻す
  if(state.teamKpiTeam !== "all" && !teams.some(function(t){ return t.id === state.teamKpiTeam; })){
    state.teamKpiTeam = "all";
  }

  if(!state.memberKpi){
    return '<div class="tab-pad">' + renderSyncBar() +
      emptyState("👥","メンバー別の実績はまだ同期されていません",
        "同期用スプレッドシートに mgmt_kpi タブを作ると表示されます") +
    '</div>';
  }

  var chips = '<button class="chip'+(state.teamKpiTeam==="all"?" chip-active":"")+
      '" data-act="tkpi-team" data-id="all">全体</button>' +
    teams.map(function(t){
      return '<button class="chip'+(state.teamKpiTeam===t.id?" chip-active":"")+
        '" data-act="tkpi-team" data-id="'+esc(t.id)+'">'+esc(t.label)+'</button>';
    }).join("");

  // 指標グループのタブ。チームの chips とは別の行に置く。
  // 同じ行に混ぜると「全体」と「対応」が並んで、何を選んでいるのか
  // 分からなくなる。
  var curGrp = state.teamKpiGroup || TEAM_KPI_GROUPS[0].id;
  var curMode = state.teamKpiMode || "actual";
  // 予算が1件も来ていなければ切り替えを出さない。押しても何も変わらない
  // ボタンがあるほうが分かりにくい。
  var hasBudget = Object.keys((state.memberKpi && state.memberKpi.budgetByMember) || {}).length > 0;
  if(!hasBudget) curMode = "actual";

  var grpTabs = '<div class="tkpi-grps">' + TEAM_KPI_GROUPS.map(function(g){
      return '<button class="tkpi-grp'+(curGrp===g.id?" is-on":"")+
        '" data-act="tkpi-grp" data-id="'+esc(g.id)+'">'+esc(g.label)+'</button>';
    }).join("") +
    (hasBudget
      ? '<span class="tkpi-modes">' +
        '<button class="tkpi-grp'+(curMode==="actual"?" is-on":"")+
          '" data-act="tkpi-mode" data-id="actual">実績</button>' +
        '<button class="tkpi-grp'+(curMode==="budget"?" is-on":"")+
          '" data-act="tkpi-mode" data-id="budget">予算比</button>' +
        '</span>'
      : '') +
    '</div>';

  var members = teamKpiMembers();
  var roll = teamKpiRollup(members);

  // 35指標を1枚に並べると1マスが潰れてラベルを略すことになるので、
  // グループのタブで絞る。集計もメンバー別も同じ並びにして見比べやすくする。
  var defs = teamKpiDefs();
  var budgetMode = (curMode === "budget");
  // 予算の集計は着地見込セクションでも使うので、モードに関係なく作る。
  var rollB = hasBudget ? teamKpiRollup(members, "budget") : null;

  var gridHtml = defs.map(function(def){
    // チーム計に赤は付けない。課題は個人ごとの上位3件という定義なので、
    // 集計行に同じ色を出すと意味が変わってしまう。
    return budgetMode ? teamKpiBudgetCell(def, roll[def.key], rollB[def.key], null)
                      : teamKpiCell(def, roll[def.key]);
  }).join("");

  var rows = members.map(function(m){
    var v = teamKpiOf(m.id);
    // 予算は課題の判定に常に要るので、表示モードに関係なく取る。
    var b = teamKpiOf(m.id, "budget");
    // 課題は35指標すべてから拾う。いま開いているグループには限らない
    //（「対応」を見ているときに粗利の課題を見落とすのを防ぐ）。
    var ir = hasBudget ? teamKpiIssues(v, b, m) : { list: [] };
    var badKeys = {};
    (ir.list || []).forEach(function(x){ badKeys[x.def.key] = true; });

    var cells = defs.map(function(def){
      return budgetMode ? teamKpiBudgetCell(def, v[def.key], b[def.key], badKeys)
                        : teamKpiCell(def, v[def.key]);
    }).join("");
    var issues = hasBudget ? teamKpiIssueChips(v, b, m) : "";
    return '<div class="card tkpi-member">' +
      '<div class="tkpi-name">'+avatar(m.id,28)+'<span>'+esc(m.displayName)+'</span></div>' +
      issues +
      '<div class="tkpi-cells">'+cells+'</div>' +
    '</div>';
  }).join("");

  // 当月のデータかどうかを2通りで照合する。片方だけでは抜けるため。
  //
  //   ① monthId … 書き込んだ時点の月。原本の月タブがまだ無い月初は
  //      同期が中断して書き込まれないので、先月のドキュメントが残る。
  //      これは原本の中身を見なくても判定できる。
  //   ② periodLabel … 原本の中にあった期間の表記。誰かがフィルタや
  //      参照月を動かした場合は、こちらだけがずれる。
  var warn = "";
  var now = new Date();
  var expect = now.getFullYear() + "年" + (now.getMonth()+1) + "月";

  if(state.memberKpi.monthId && state.memberKpi.monthId !== currentMonthId()){
    warn += '<div class="sync-warn sync-warn-bad">⚠️ 当月分がまだ取り込まれていません。' +
      '出ているのは ' + esc(monthIdLabel(state.memberKpi.monthId)) +
      ' の数字です。原本に当月のシートがあるか確認してください。</div>';
  }
  var pl = state.memberKpi.periodLabel;
  if(pl && pl !== expect){
    warn += '<div class="sync-warn sync-warn-bad">⚠️ 原本の期間が「'+esc(pl)+
      '」になっています（当月は '+esc(expect)+'）。数字は当月のものではありません。</div>';
  }
  var miss = state.memberKpi.missingRows || [];
  if(miss.length){
    warn += '<div class="sync-warn sync-warn-soft">🕙 原本に見つからなかった指標: '+
      esc(miss.join("・"))+'</div>';
  }

  // ── 週ごと・日ごとの手配粗利 ──
  // 手配粗利額データには、はじめから日単位の目標と実績が入っている
  // （goals/current.teams.<チーム>.days）。週次はそこから積み上げれば出るので、
  // 新しいデータ源は要らない。目標進捗タブと同じ計算・同じ見た目を使う。
  //
  // 対応数・手配数・手配率の週次／日次はここには出せない。あちらの原本
  // （Management Sheet）が月単位の集計しか持っていないため。
  var trend = "";
  var p = computeProgress(state.teamKpiTeam === "all" ? "all" : state.teamKpiTeam);
  if(p){
    // 見出しは renderWeeklyChart / renderDayRates が自分で出すので、ここでは付けない
    trend = renderWeeklyChart(p) + renderDayRates(p);
  }else{
    // 目標データが無いチームもある（手配粗利額データにそのタブが無い場合）。
    // 黙って何も出さないと壊れて見えるので、理由の側を書く。
    trend = '<div class="prog-note">このチームの手配粗利額データ（日別の目標・実績）が' +
      'まだ同期されていません。週ごと・日ごとの推移はそれが入ると出ます。</div>';
  }

  return '<div class="tab-pad">' +
    renderSyncBar() + warn +
    '<div class="kpi-filter">'+chips+'</div>' +
    grpTabs +
    '<div class="side-title">チーム集計'+(pl ? '（'+esc(pl)+'）' : '')+'</div>' +
    '<div class="card tkpi-member">' +
      '<div class="tkpi-name"><span>チーム計</span></div>' +
      '<div class="tkpi-cells">'+gridHtml+'</div>' +
    '</div>' +
    renderDailyKpiTable() +
    trend +
    '<div class="side-title">メンバー別（'+members.length+'名）</div>' +
    (rows || emptyState("👥","このチームの数字がありません","")) +
    (hasBudget ? renderLanding(members, teams) : "") +
    '<div class="wk-legend">月次の出どころは Management Sheet の当月タブ。' +
      'ただし<b>通話率・作業率・待機率は CC_アクション管理の月間列</b>です' +
      '（Management Sheet 側は第二CCが 0.00% のままのため）。' +
      '手配率・手配買取率・ホットレートのチーム計は、率の平均ではなく合計どうしの割り算です。' +
      '<br><b>赤いチップ</b>は、その人が<b>予算に最も届いていない指標の上位3件</b>です' +
      '（35指標すべてから、原因のまとまりごとに1件）。同じ指標は予算比のマスも赤くなります。' +
      '予算に届いている指標は出しません。買取粗利額とその内訳はKGI（結果）なので対象外です。' +
      '管理職と、Firestore で kpiIssueTarget を false にした人は判定しません。' +
      '「あと◯件」は<b>今日時点の目安</b>（予算×経過日数の割合）までの不足で、月末までの不足ではありません。' +
      '率は予算そのものとの差です。マウスを置くと計算の内訳が出ます。' +
      '対応数が' + ISSUE_MIN_HANDLED + '件に届かない人は、率が安定しないため判定していません。</div>' +
    renderDashboardLink() +
  '</div>';
}

// ══════════════════════════════════════════════════════════════════
//  MAIN RENDER
// ══════════════════════════════════════════════════════════════════
// ── 描き直しをまたいで入力を保つ ──────────────────────────
//
// フォームの入力は state ではなく DOM に値を持っている。画像を選んだ、
// 対象者を変えた、送信を断られた——フォームを開いたまま描き直す操作は
// いくつもあり、そのたびに入力途中の本文が消えていた。
// 個別に「ここでは描き直さない」と対処すると必ず漏れるので、
// 描き直しの前後で値を運ぶ形に一本化する。
//
// ただし、別のフォームに値を移してはいけない（編集対象を A から B に
// 変えたとき、id は同じ editTitle なので A の文字が B に入ってしまう）。
// 開いているフォームの組み合わせが前回と同じときだけ復元する。
var lastFormSig = null;

function formSignature(){
  var e = state.editing;
  return [state.tab,
          state.boardShowForm ? 1 : 0,
          state.surveyShowForm ? 1 : 0,
          // 開いているコメント欄も組み合わせに入れる。入れないと、書きかけの
          // コメントが、別の投稿のコメント欄を開いたときにそちらへ移る。
          state.feedOpenComment || "-",
          state.boardOpenComment || "-",
          e ? e.kind+":"+e.id+":"+(e.postId||"") : "-"].join("|");
}

/** id があれば id、無ければ「同じclassの何番目か」で値を覚える */
function formFieldKey(el, seen){
  if(el.id) return "#" + el.id;
  var cls = el.className || el.tagName;
  seen[cls] = (seen[cls] || 0) + 1;
  return "." + cls + ":" + seen[cls];
}

/**
 * 引き継ぎの対象外にする入力か。
 *
 * 対象にしてよいのは「値が DOM にしか無い」下書きだけ。
 * すでに保存された値を描き直しているだけの欄まで運ぶと、
 * 消した直後の描き直しで古い値が書き戻される
 * （「自分の期限」を取り消したのに、日付が入ったまま見える）。
 */
function skipKeep(el){
  return el.type === "file"          // ファイル入力の値は代入できない
      || el.hasAttribute("data-nokeep");
}

function captureForms(){
  var keep = {}, seen = {};
  Array.prototype.forEach.call(
    document.querySelectorAll("#app input, #app select, #app textarea"),
    function(el){
      if(skipKeep(el)) return;
      keep[formFieldKey(el, seen)] = (el.type === "checkbox" || el.type === "radio")
        ? el.checked : el.value;
    }
  );
  return keep;
}

function restoreForms(keep){
  var seen = {};
  Array.prototype.forEach.call(
    document.querySelectorAll("#app input, #app select, #app textarea"),
    function(el){
      if(skipKeep(el)) return;
      var k = formFieldKey(el, seen);
      if(!(k in keep)) return;
      if(el.type === "checkbox" || el.type === "radio") el.checked = keep[k];
      else el.value = keep[k];
    }
  );
}

// ── スクロール位置の引き継ぎ ────────────────────────────────
//
// render() は #app の中身を丸ごと入れ替える。スクロールしているのは
// その内側の #content なので、入れ替えた瞬間に位置が 0 に戻る。
// つまり「リアクションの＋を押す」「既読の一覧を開く」「並べ替える」など、
// 状態が変わる操作すべてで画面が先頭まで飛んでいた。
// （報告のあった「＋を押すと上に飛ぶ」は、これが原因）
//
// 直前の描画と同じタブなら、位置を測っておいて入れ替えのあとに戻す。
// タブが変わったときは戻さない（別の画面を途中から見せない）。
var renderedTab = null;

function render(){
  var app = document.getElementById("app");

  // 前回と同じフォームが開いていれば、入力を引き継ぐ
  var sig = formSignature();
  var keep = (sig === lastFormSig) ? captureForms() : null;
  lastFormSig = sig;

  var contentEl = document.getElementById("content");
  var keepScroll = (contentEl && renderedTab === state.tab) ? contentEl.scrollTop : 0;
  // 横に広い表（着地シナリオ）のスクロール位置。
  // 再描画で 0 に戻ると、数字を1つ入れるたびに左端まで飛ばされる。
  // スマホでは「入力したら戻った」としか見えない。
  var keepScrollX = [];
  document.querySelectorAll(".tbl-wrap").forEach(function(el, i){
    keepScrollX[i] = el.scrollLeft;
  });

  // ログインしていない／許可されていない間は、アプリの中身を一切描画しない。
  // 画面が入れ替わるので、覚えている位置は捨てる。
  if(session.status !== "ready") renderedTab = null;
  if(session.status === "config")    { app.innerHTML = renderConfigNotice(); return; }
  if(session.status === "loading")   { app.innerHTML = renderSplash("読み込み中..."); return; }
  if(session.status === "signedOut") { app.innerHTML = renderLogin(); return; }
  if(session.status === "denied")    { app.innerHTML = renderDenied(); return; }
  if(session.status === "error")     { app.innerHTML = renderErrorScreen(); return; }

  // 権限を外された人がチーム実績タブを開いたままでも、そこに留まらせない。
  // 中身は firestore.rules 側で読めなくなっているが、空の画面に
  // 取り残されるより、既定のタブに戻すほうが親切。
  if(state.tab === "teamkpi" && !canSeeTeamKpi()) state.tab = "feed";
  // アンケートを隠したあと、そのタブを開いたままの人が空白に取り残されないように
  if(state.tab === "survey" && !SHOW_SURVEY) state.tab = "feed";

  var body =
    state.tab==="feed"    ? renderFeed() :
    state.tab==="board"   ? renderBoard() :
    state.tab==="survey"  ? renderSurvey() :
    state.tab==="shift"   ? renderShift() :
    state.tab==="teamkpi" ? renderTeamKpi() :
    renderProgress();
  var noticeHtml = state.notice
    ? '<div class="notice notice-error">'+esc(state.notice)+
      '<button class="notice-close" data-act="notice-close" aria-label="閉じる">×</button></div>'
    : '';

  // 広い画面は上部タブ＋2カラム、狭い画面は今までどおり下部タブの1カラム。
  // 中身（各タブの描画）は共通で、外側の骨組みだけを差し替えている。
  document.body.classList.toggle("wide", isWide());
  if(isWide()){
    app.innerHTML =
      renderTopbar() +
      renderInfobar() +
      noticeHtml +
      '<div class="content" id="content">' +
        '<div class="pc-cols">' +
          '<div class="pc-main">'+body+'</div>' +
          renderSidebar() +
        '</div>' +
      '</div>' +
      renderConfirmDialog() + renderAvatarDialog() + renderLightbox();
    if(keep) restoreForms(keep);
    afterRender(keepScroll, keepScrollX);
    return;
  }

  app.innerHTML = renderHeader() + noticeHtml +
    '<div class="content" id="content">'+body+'</div>' + renderNav() +
    renderConfirmDialog() + renderAvatarDialog() + renderLightbox();
  if(keep) restoreForms(keep);
  afterRender(keepScroll, keepScrollX);
}

/**
 * 描き直したあとの後始末。2か所（広い画面／狭い画面）から呼ぶので
 * まとめてある。片方だけに書くと、画面幅によって挙動が変わる。
 */
function afterRender(keepScroll, keepScrollX){
  if(keepScrollX && keepScrollX.length){
    document.querySelectorAll(".tbl-wrap").forEach(function(el, i){
      if(keepScrollX[i]) el.scrollLeft = keepScrollX[i];
    });
  }
  renderedTab = state.tab;
  var el = document.getElementById("content");
  if(el && keepScroll) el.scrollTop = keepScroll;
  // 監視は描き直すたびに置き直す。innerHTML の差し替えで前の要素は捨てられている。
  observeImages();
  observeUnread();
}

/**
 * #content の中の要素を、その上端まで寄せる。
 * 見つからなければ何もしない（描き直しで消えている場合がある）。
 */
function scrollContentTo(target){
  var box = document.getElementById("content");
  if(!box || !target) return;
  // 【なめらかスクロールにしない】
  // scrollTo({behavior:"smooth"}) はこの入れ子の容器では何も起きなかった
  // （scroll-behavior は auto、上限内の値なのに 0 のまま動かない）。
  // 効いたり効かなかったりする指定に頼ると、押しても無反応に見える。
  // scrollTop への代入は必ず効くので、そちらだけを使う。
  box.scrollTop = box.scrollTop +
    (target.getBoundingClientRect().top - box.getBoundingClientRect().top);
}

/** 画像の拡大表示。縮小してあるので、これが原寸 */
function renderLightbox(){
  if(!state.lightbox) return "";
  var got = state.images[state.lightbox];
  if(!got || typeof got !== "object") return "";
  return '<div class="modal" data-act="lightbox-close">' +
    '<img class="lightbox-img" src="'+got.dataUrl+'" alt="添付画像">' +
    '<button class="lightbox-close" data-act="lightbox-close" aria-label="閉じる">×</button>' +
  '</div>';
}

// ══════════════════════════════════════════════════════════════════
//  ACTIONS
// ══════════════════════════════════════════════════════════════════
/**
 * 楽観的更新は自前で持たない。
 * Firestore SDK のレイテンシ補償が、書き込んだ瞬間にローカルキャッシュを
 * 更新して onSnapshot を発火させ、サーバー確定後にもう一度発火して整合を取る。
 * 失敗すれば自動でロールバックされ、ここの catch に来る。
 * 二重管理を避けるため、画面の状態は常に onSnapshot 由来のものだけを使う。
 */
/** 書き込めたかどうかを返す。フォームを閉じる判断に使う */
async function write(label, fn, exclusive){
  // exclusive はフォーム送信用の二重送信よけ。
  // リアクションや投票は連打されうるので、ここでは弾かない
  // （弾くと押したのに反映されない、という分かりにくい挙動になる）。
  if(exclusive && state.busy) return false;
  if(exclusive) state.busy = true;
  state.notice = "";
  var ok = false;
  try{
    await fn();
    ok = true;
  }catch(e){
    var code = (e && e.code) ? e.code : String(e);
    state.notice = label + "に失敗しました（" + code + "）" +
      (code === "permission-denied" ? " — 権限がないか、ログインが切れています" : "");
  }finally{
    state.busy = false;
    render();
  }
  return ok;
}

/**
 * フォームの送信。**成功したときだけ**フォームを閉じる。
 *
 * 先に閉じてから書き込むと、失敗したときに入力していた内容ごと消える。
 * 権限エラーや電波切れは実際に起きるもので、そのたびに書き直させるのは
 * 許容できない（画像を選び直すところまで巻き戻る）。
 */
async function submitForm(label, fn, closeForm){
  if(await write(label, fn, true)){
    closeForm();
    render();
  }
}

/** 投稿・コメントに共通で載せるフィールド（Phase 4 の編集・削除で使う） */
/**
 * 送信をやめる理由をフォームの中に出す。返り値は「続けてよいか」。
 *
 *   if(!refuse("boardFormError", !title, "タイトルを入れてください")) return;
 *
 * 以前は入力が足りないと黙って return していた。押しても何も起きず、
 * 何が足りないのかも分からないので、壊れているのと区別が付かなかった。
 *
 * ここで render() を呼ばないのは、フォームの入力欄が state ではなく
 * DOM に値を持っているため。描き直すと、理由を出すために
 * 入力途中の本文を消してしまう。差し込み先だけを直接書き換える。
 *
 * 差し込み先のIDをフォームごとに分けているのは、投稿フォームと編集フォームが
 * 同時に開いていることがあり、共通のIDだと違うフォームに理由が出るため。
 */
function refuse(slotId, bad, message){
  if(!bad) return true;
  var slot = document.getElementById(slotId);
  if(slot){
    slot.textContent = message;
    slot.hidden = false;
    slot.scrollIntoView({ block:"nearest" });
  }else{
    // 差し込み先が無いフォームからの呼び出し。消えるものが無いので描き直してよい。
    state.notice = message;
    render();
  }
  return false;
}

/** refuse() が書き込む空の差し込み先 */
function errorSlot(slotId){
  return '<div class="form-error" id="'+slotId+'" role="alert" hidden></div>';
}

function baseFields(){
  return {
    authorId: currentUserId(),
    createdAt: serverTimestamp(),
    updatedAt: serverTimestamp(),
    edited: false,
    deleted: false,
    deletedBy: null,
    deletedAt: null
  };
}

function submitFeedPost(){
  var text = document.getElementById("feedFormText").value.trim();
  if(!refuse("feedFormError", !text, "内容を入れてください")) return;
  var type = document.getElementById("feedFormType").value;
  var to = document.getElementById("feedFormTo").value;
  var val = document.getElementById("feedFormVal").value;
  var payload = baseFields();
  payload.toMemberId = to || null;
  payload.type = type;
  payload.valueTag = val || null;
  payload.text = text;
  payload.reactions = {};
  payload.commentCount = 0;
  submitForm("投稿",
    function(){ return addDoc(collection(db, "feedPosts"), payload); },
    function(){
      // フィードの入力欄は開閉しないので、消すのはここでやる。
      // 描き直しで空に戻ることを頼りにはできない（入力は描き直しをまたいで
      // 引き継ぐようにしてあるため、放っておくと投稿した文章が残る）。
      ["feedFormText","feedFormType","feedFormTo","feedFormVal"].forEach(function(fid){
        var el = document.getElementById(fid);
        if(!el) return;
        if(el.tagName === "SELECT") el.selectedIndex = 0;
        else el.value = "";
      });
    });
}

function toggleReaction(kind, id, emoji){
  var me = currentUserId();
  var col = kind === "board" ? "boardPosts" : "feedPosts";
  var pool = kind === "board" ? state.board : state.feed;
  var post = pool.filter(function(p){ return p.id===id; })[0];
  if(!post) return;
  var mine = (post.reactions && post.reactions[me]) || [];
  var next = mine.indexOf(emoji)>=0
    ? mine.filter(function(x){ return x!==emoji; })
    : mine.concat([emoji]);
  // 自分のキーだけを指定して更新する。ルール側も
  // 「reactions の変更キーが自分だけ」であることを検証している。
  var patch = {};
  patch["reactions." + me] = next.length ? next : deleteField();
  write("リアクション", function(){ return updateDoc(doc(db, col, id), patch); });
}

function submitComment(kind, postId, text){
  var col = kind === "board" ? "boardPosts" : "feedPosts";
  var payload = baseFields();
  payload.text = text;
  write("コメント", async function(){
    await addDoc(collection(db, col, postId, "comments"), payload);
    // 一覧に件数を出すための非正規化値。ルールで ±1 しか許していない。
    // 掲示板にはこの機能より前の投稿があり commentCount を持たない。
    // increment は「無ければ 0 から」で動くので、ここは同じ書き方でよい
    // （ルール側にも、フィールドが無い状態から 1 になる場合を足してある）。
    await updateDoc(doc(db, col, postId), { commentCount: increment(1) });
  });
}

function submitBoardPost(){
  var title = document.getElementById("boardFormTitle").value.trim();
  var body = document.getElementById("boardFormBody").value.trim();
  // 本文は任意。「8月アップデート・8/21」のように、タイトルと期日だけで
  // 用が済むタスクがある（もとのスプレッドシートも項目と期日だけだった）。
  if(!refuse("boardFormError", !title, "タイトルを入れてください")) return;
  var payload = baseFields();
  payload.title = title;
  payload.body = body;
  payload.category = document.getElementById("boardFormCat").value;
  payload.pinned = document.getElementById("boardFormPinned").checked;
  // 書いた本人は既読扱いにしておく。そうしないと自分の投稿で
  // 自分が未読者リストに並び、声かけ対象が水増しされる。
  payload.readBy = {};
  payload.readBy[currentUserId()] = serverTimestamp();
  // 期日が入っていればチェックリストになる。入っていなければ
  // dueDate は null で、これまでどおりの連絡事項として扱われる。
  var task = readTaskFields("boardForm");
  payload.dueDate = task.dueDate;
  payload.checkTargets = task.checkTargets;
  payload.dueBy = task.dueBy;
  payload.visibleTo = readVisibility("boardForm", null);
  // 既読とは違い、作成者も未完了から始める。作った本人が
  // やらなくていいとは限らない（自分にも課すのが普通の運用）。
  payload.doneBy = {};
  payload.reactions = {};
  payload.imageId = null;
  payload.imageW = null;
  payload.imageH = null;
  var img = state.boardImageDraft;
  submitForm("投稿", async function(){
    // 画像を先に作る。逆順にすると、画像の作成だけ失敗したときに
    // 「画像が出ない投稿」が残ってしまう。こちらの順なら、
    // 最悪でも誰にも見えない画像が1件余るだけで済む。
    if(img) await attachImage(payload, img);
    return addDoc(collection(db, "boardPosts"), payload);
  }, function(){
    state.boardShowForm = false;
    state.boardImageDraft = null;
  });
}

/** 画像を boardImages に作り、投稿側に ID と縦横を書き込む */
async function attachImage(target, img){
  var ref = await addDoc(collection(db, "boardImages"), {
    authorId: currentUserId(),
    dataUrl: img.dataUrl,
    width: img.width,
    height: img.height,
    createdAt: serverTimestamp()
  });
  target.imageId = ref.id;
  target.imageW = img.width;
  target.imageH = img.height;
  // 取りに行かずに済むよう、自分の画面用には手元のものを入れておく
  state.images[ref.id] = { dataUrl: img.dataUrl, width: img.width, height: img.height };
}

/**
 * 自分の完了チェックを付け外しする。
 * 「完了にする」を押した時点で読んだことは確実なので、既読も一緒に付ける
 * （ボタンを押すとカード全体の board-read は発火しないため）。
 */
function toggleTaskDone(id){
  var me = currentUserId();
  var post = state.board.filter(function(p){ return p.id===id; })[0];
  if(!post || !isTask(post) || !isTaskTarget(post, me)) return;
  var patch = {};
  patch["doneBy." + me] = taskDone(post, me) ? deleteField() : serverTimestamp();
  write("完了の記録", function(){ return updateDoc(doc(db, "boardPosts", id), patch); });
  markBoardRead(id);
}

/**
 * 「自分はいつまでにやる」を置く／消す。
 *
 * 触れるのは自分のキーだけ（ルール側でも同じ条件で止めている）。
 * 空文字が来たら消す。日付欄は × で空にできるので、その操作を
 * 「宣言を取り消した」として扱う。
 */
function setMyPlan(id, ymd){
  var me = currentUserId();
  var post = state.board.filter(function(p){ return p.id===id; })[0];
  if(!post || !isTask(post) || !isTaskTarget(post, me)) return;
  // 壊れた日付は送らない。ルールでは中身の形を検証できないので、
  // ここで止めないと表示側が黙って無視するだけのゴミが残る。
  if(ymd && !/^\d{4}-\d{2}-\d{2}$/.test(ymd)) return;
  var patch = {};
  patch["planBy." + me] = ymd ? ymd : deleteField();
  write("予定日の記録", function(){ return updateDoc(doc(db, "boardPosts", id), patch); });
}

function markBoardRead(id){
  var me = currentUserId();
  var post = state.board.filter(function(p){ return p.id===id; })[0];
  if(!post || (post.readBy && post.readBy[me])) return;
  var patch = {};
  patch["readBy." + me] = serverTimestamp();
  write("既読の記録", function(){ return updateDoc(doc(db, "boardPosts", id), patch); });
}

function submitSurvey(){
  var title = document.getElementById("surveyFormTitle").value.trim();
  var labels = Array.prototype.map.call(document.querySelectorAll(".survey-opt"), function(i){ return i.value.trim(); }).filter(Boolean);
  if(!refuse("surveyFormError", !title, "質問内容を入れてください")) return;
  if(!refuse("surveyFormError", labels.length < 2, "選択肢を2つ以上入れてください")) return;
  // 選択肢は id と label に分ける。label を直しても投票が失われないようにするため。
  var options = labels.map(function(label, i){ return { id: "o" + (i+1), label: label }; });
  var payload = baseFields();
  payload.title = title;
  payload.options = options;
  payload.multi = document.getElementById("surveyFormMulti").checked;
  payload.deadline = document.getElementById("surveyFormDeadline").value || null;
  payload.closed = false;
  payload.votes = {};
  submitForm("アンケートの作成",
    function(){ return addDoc(collection(db, "surveys"), payload); },
    function(){ state.surveyShowForm = false; });
}

// ══════════════════════════════════════════════════════════════════
//  編集
//
//  更新日時（updatedAt）はデータとしては持つが画面には出さない。
//  出るのは「編集済み」の印だけ。改ざん感を避けつつ、
//  投稿の時系列は投稿日時のままにしておくため。
//
//  編集履歴は今回保存しない。必要になったら
//  feedPosts/{id}/revisions のようなサブコレクションを足せばよく、
//  既存ドキュメントの構造を変える必要はない。
// ══════════════════════════════════════════════════════════════════
function startEdit(kind, id, postId){
  state.editing = { kind:kind, id:id, postId:postId || null };
  state.editImageDraft = null;
  state.editImageRemove = false;
  state.notice = "";
  render();
}
function cancelEdit(){
  state.editing = null;
  state.editImageDraft = null;
  state.editImageRemove = false;
  render();
}

function saveFeedEdit(id){
  var text = document.getElementById("editText").value.trim();
  if(!refuse("editFormError", !text, "内容を入れてください")) return;
  var patch = {
    text: text,
    type: document.getElementById("editType").value,
    toMemberId: document.getElementById("editTo").value || null,
    valueTag: document.getElementById("editVal").value || null,
    edited: true,
    updatedAt: serverTimestamp()
  };
  state.editing = null;
  write("編集", function(){ return updateDoc(doc(db, "feedPosts", id), patch); }, true);
}

function saveBoardEdit(id){
  var post = state.board.filter(function(p){ return p.id===id; })[0];
  var title = document.getElementById("editTitle").value.trim();
  var body  = document.getElementById("editBody").value.trim();
  if(!refuse("editFormError", !title, "タイトルを入れてください")) return;
  var task = readTaskFields("editBoard");
  var patch = {
    title: title,
    body: body,
    category: document.getElementById("editCat").value,
    pinned: document.getElementById("editPinned").checked,
    // 期日を消すとチェックリストではなくなるが、doneBy は残す。
    // 誰が終わらせたかの記録を、期日の消し忘れの直しで失わせない。
    dueDate: task.dueDate,
    checkTargets: task.checkTargets,
    dueBy: task.dueBy,
    visibleTo: readVisibility("editBoard", post),
    edited: true,
    updatedAt: serverTimestamp()
  };
  // 画像は差し替え・取り外しのときだけ触る。
  // 何もしていないときに patch へ入れないのは、既に付いている画像を
  // 消してしまう事故を、書き込む値の形として起こせなくするため。
  var img = state.editImageDraft;
  var removing = state.editImageRemove;
  submitForm("編集", async function(){
    if(img){
      await attachImage(patch, img);
    }else if(removing){
      // 画像そのものは残す（誰が何を貼ったかを追えるようにするため）。
      // 投稿からの参照だけを外す。
      patch.imageId = null;
      patch.imageW = null;
      patch.imageH = null;
    }
    return updateDoc(doc(db, "boardPosts", id), patch);
  }, function(){
    state.editing = null;
    state.editImageDraft = null;
    state.editImageRemove = false;
  });
}

function saveSurveyEdit(id){
  var sv = state.surveys.filter(function(s){ return s.id===id; })[0];
  if(!sv) return;
  var title = document.getElementById("editTitle").value.trim();
  if(!refuse("editFormError", !title, "質問内容を入れてください")) return;
  // 選択肢は id を保ったままラベルだけ差し替える。
  // 追加・削除を許すと、既に入っている票の行き場が無くなるため。
  var labels = Array.prototype.map.call(document.querySelectorAll(".edit-opt"), function(i){ return i.value.trim(); });
  var options = sv.options.map(function(o, i){
    return { id: o.id, label: labels[i] || o.label };
  });
  var patch = {
    title: title,
    options: options,
    multi: document.getElementById("editMulti").checked,
    deadline: document.getElementById("editDeadline").value || null,
    closed: document.getElementById("editClosed").checked,
    edited: true,
    updatedAt: serverTimestamp()
  };
  state.editing = null;
  write("編集", function(){ return updateDoc(doc(db, "surveys", id), patch); }, true);
}

function saveCommentEdit(postId, commentId){
  var text = document.getElementById("editCommentText").value.trim();
  if(!text) return;
  var patch = { text: text, edited: true, updatedAt: serverTimestamp() };
  // 開いているコメント欄がどちら側のものかで、書き込み先が変わる
  var col = state.commentKind === "board" ? "boardPosts" : "feedPosts";
  state.editing = null;
  write("編集", function(){
    return updateDoc(doc(db, col, postId, "comments", commentId), patch);
  }, true);
}

// ══════════════════════════════════════════════════════════════════
//  削除（論理削除）
//
//  データは消さない。deleted を立て、誰がいつ消したかを必ず同時に記録する。
//  ルール側でも deletedBy が自分であること・deletedAt がサーバー時刻で
//  あることを強制しているので、記録を省いた削除はできない。
//
//  紐づくコメント・リアクション・既読には手を触れない（下の報告参照）。
// ══════════════════════════════════════════════════════════════════
function softDeletePatch(){
  return { deleted:true, deletedBy: currentUserId(), deletedAt: serverTimestamp() };
}

function askDelete(kind, id, postId){
  var target, title, body;
  if(kind==="feed"){
    target = state.feed.filter(function(p){ return p.id===id; })[0];
    if(!target) return;
    title = "この投稿を削除しますか？";
    body  = (target.commentCount ? "コメント"+target.commentCount+"件も一緒に見えなくなります。" : "") +
            "全員の画面からすぐに消えます。データ自体は残り、誰が削除したかが記録されます。";
  }else if(kind==="board"){
    target = state.board.filter(function(p){ return p.id===id; })[0];
    if(!target) return;
    title = "この共有事項を削除しますか？";
    body  = "既読 "+readCount(target)+"名の記録も一緒に見えなくなります。" +
            "全員の画面からすぐに消えます。データ自体は残ります。";
  }else if(kind==="survey"){
    target = state.surveys.filter(function(s){ return s.id===id; })[0];
    if(!target) return;
    var vc = voteCounts(target);
    title = "このアンケートを削除しますか？";
    body  = "集まった "+vc.total+"票も一緒に見えなくなります。" +
            "全員の画面からすぐに消えます。データ自体は残ります。";
  }else{
    target = state.comments.filter(function(c){ return c.id===id; })[0];
    if(!target) return;
    title = "このコメントを削除しますか？";
    body  = "全員の画面からすぐに消えます。データ自体は残ります。";
  }
  var notMine = target.authorId !== currentUserId();
  if(notMine) body += "\n\nこれは" + getM(target.authorId).displayName + "さんの投稿です。管理者権限で削除します。";

  state.confirm = {
    kind: kind, targetId: id, postId: postId || null,
    commentKind: state.commentKind,   // コメントの削除先（feed / board）を確定させておく
    title: title, body: body, okLabel: "削除する"
  };
  render();
}

function runConfirmedDelete(){
  var c = state.confirm;
  if(!c) return;
  state.confirm = null;
  var patch = softDeletePatch();
  if(c.kind==="feed"){
    write("削除", function(){ return updateDoc(doc(db, "feedPosts", c.targetId), patch); }, true);
  }else if(c.kind==="board"){
    write("削除", function(){ return updateDoc(doc(db, "boardPosts", c.targetId), patch); }, true);
  }else if(c.kind==="survey"){
    write("削除", function(){ return updateDoc(doc(db, "surveys", c.targetId), patch); }, true);
  }else if(c.kind==="comment"){
    // 確認ダイアログを出したときに開いていた側へ書く。
    // 確認中にコメント欄を切り替えることはできない（ダイアログが前に出る）。
    var ccol = c.commentKind === "board" ? "boardPosts" : "feedPosts";
    write("削除", async function(){
      await updateDoc(doc(db, ccol, c.postId, "comments", c.targetId), patch);
      await updateDoc(doc(db, ccol, c.postId), { commentCount: increment(-1) });
    }, true);
  }
}

function toggleVote(id, optId){
  var me = currentUserId();
  var sv = state.surveys.filter(function(s){ return s.id===id; })[0];
  if(!sv || sv.closed) return;
  var mine = (sv.votes && sv.votes[me]) || [];
  var next;
  if(mine.indexOf(optId)>=0){
    next = mine.filter(function(x){ return x!==optId; });
  }else{
    next = sv.multi ? mine.concat([optId]) : [optId];
  }
  var patch = {};
  patch["votes." + me] = next.length ? next : deleteField();
  write("投票", function(){ return updateDoc(doc(db, "surveys", id), patch); });
}

// ══════════════════════════════════════════════════════════════════
//  EVENTS
// ══════════════════════════════════════════════════════════════════
// ── リアクション者の表示 ─────────────────────────────────────
// PC はホバー、スマホは長押しで、押した人の名前を出す。
//
// ここだけは render() を呼ばずに DOM を直接書き換える。
// 画面全体を innerHTML で作り直す作りなので、hover で再描画すると
// カーソル下の要素が消えて mouseout → 再描画 → mouseover …
// と無限に往復してしまうため。
var peekTimer = null;
var suppressReactClick = false;

function peekBoxOf(btn){
  var row = btn.closest(".post-actions");
  return row ? row.querySelector(".react-peek") : null;
}
function showPeek(btn){
  hidePeek();                       // 直前の表示を必ず消してから出す
  var people = btn.getAttribute("data-people");
  if(!people) return;               // まだ誰も押していない絵文字なら何も出さない
  var box = peekBoxOf(btn);
  if(!box) return;
  box.textContent = btn.getAttribute("data-emoji") + "  " + people;
  box.hidden = false;
}
function hidePeek(){
  var boxes = document.querySelectorAll(".react-peek");
  Array.prototype.forEach.call(boxes, function(b){ b.hidden = true; });
}

function bindEvents(){
  var app = document.getElementById("app");

  // ---- PC: ホバー ----
  app.addEventListener("mouseover", function(e){
    if(!e.target.closest) return;
    var btn = e.target.closest(".react-btn");
    if(btn) showPeek(btn); else hidePeek();
  });
  app.addEventListener("mouseleave", hidePeek);

  // ---- スマホ: 長押し ----
  app.addEventListener("touchstart", function(e){
    if(!e.target.closest) return;
    // 新しい操作が始まったので、前回の長押しの痕跡を必ず消す。
    // ここでリセットしないと、長押しのあと別の場所を触ったときに
    // 打ち消しフラグが残り、次のリアクションが1回無視される。
    clearTimeout(peekTimer);
    suppressReactClick = false;
    hidePeek();
    var btn = e.target.closest(".react-btn");
    if(!btn) return;
    peekTimer = setTimeout(function(){
      // 長押しと判定。このあと発火する click は打ち消す
      // （名前を見ようとしただけでリアクションが付くのを防ぐ）
      suppressReactClick = true;
      showPeek(btn);
    }, 450);
  }, { passive:true });

  ["touchend","touchmove","touchcancel"].forEach(function(ev){
    app.addEventListener(ev, function(){ clearTimeout(peekTimer); }, { passive:true });
  });

  app.addEventListener("click", function(e){
    var el = e.target.closest("[data-act]");
    if(!el) return;
    var act = el.getAttribute("data-act"), id = el.getAttribute("data-id");

    // 認証系はログイン前でも動く必要がある
    if(act==="signin"){ doSignIn(); return; }
    if(act==="signout"){ doSignOut(); return; }
    // テーマの切り替えはセッションの状態に依らない。
    // 認証系と同じくここに置いて、ログイン前でも動くようにしておく
    // （いまボタンはヘッダーにしか無いが、後で別の画面に置いたときに
    //   「押しても動かない」を作らないため）。
    if(act==="theme-toggle"){ toggleTheme(); return; }

    // ここから先はログイン済みのときだけ
    if(session.status !== "ready") return;

    if(act==="tab"){
      state.tab = id;
      state.boardShowForm=false; state.surveyShowForm=false;
      state.boardImageDraft=null; state.editImageDraft=null; state.editImageRemove=false;
      state.lightbox=null;
      // タブを離れたらコメントの購読だけ落とす。
      // 一覧の3本はログイン中つなぎっぱなし（張り直すと全件読み直しになるため）。
      state.feedOpenComment = null;
      state.boardOpenComment = null;
      detachComments();
      render();
    }
    else if(act==="shift-month"){ setShiftMonth(parseInt(id, 10)); }
    else if(act==="shift-view"){
      state.shiftView = id;
      state.shiftWeekStart = null;   // 月表示から戻ったら本日の週に合わせ直す
      render();
    }
    else if(act==="shift-mview"){
      state.shiftMobileView = id;
      state.shiftWeekStart = null;
      render();
    }
    else if(act==="shift-day"){ state.shiftDayIdx = parseInt(id, 10); render(); }
    else if(act==="shift-team"){ state.shiftTeam = id; render(); }
    else if(act==="seat-day"){ state.seatDay = id; render(); }
    else if(act==="seat-fold"){ state.seatOpen = !state.seatOpen; render(); }
    else if(act==="todayshift-fold"){ state.todayShiftOpen = !state.todayShiftOpen; render(); }
    else if(act==="shift-week"){
      if(id === "") return;          // 端まで来ている（ボタンは disabled）
      state.shiftWeekStart = parseInt(id, 10);
      render();
    }
    else if(act==="feed-sort"){ state.feedSort = id; render(); }
    else if(act==="feed-submit"){ submitFeedPost(); }
    else if(act==="react"){
      if(suppressReactClick){ suppressReactClick = false; return; }  // 長押し直後
      state.reactionPickerFor = null;
      toggleReaction(el.getAttribute("data-kind") || "feed", id, el.getAttribute("data-emoji"));
    }
    else if(act==="react-picker"){
      var rk = (el.getAttribute("data-kind") || "feed") + ":" + id;
      state.reactionPickerFor = state.reactionPickerFor===rk ? null : rk;
      render();
    }
    else if(act==="comment-toggle"){
      // コメントは投稿ごとのサブコレクション。開いている1件だけ購読する。
      // フィードと掲示板をまたいで同時には開かない（購読は1本だけ）。
      var ck = el.getAttribute("data-kind") || "feed";
      var already = (ck==="board" ? state.boardOpenComment : state.feedOpenComment) === id;
      state.feedOpenComment = null;
      state.boardOpenComment = null;
      if(!already){
        if(ck==="board") state.boardOpenComment = id; else state.feedOpenComment = id;
      }
      attachComments(ck, already ? null : id);
      render();
    }
    else if(act==="comment-send"){
      var box = document.querySelector('.comment-input[data-act="comment-input"][data-id="'+id+'"]');
      if(!box) return;
      var msg = box.value.trim();
      if(!msg) return;
      box.value = "";   // 送信は非同期。先に空にして二重送信を防ぐ
      submitComment(el.getAttribute("data-kind") || "feed", id, msg);
    }
    else if(act==="archive-toggle"){ state[id] = !state[id]; render(); }
    // 月の一覧から飛ぶ。折りたたみを開いてから描き直し、その後で見出しへ寄せる。
    // 開く前にスクロールしようとしても、飛び先はまだ画面上に無い。
    //
    // 【scrollIntoView を使わない】
    // 動くのは window ではなく #content で、見出し自身が position:sticky。
    // この組み合わせだと scrollIntoView({behavior:"smooth"}) が数十pxで
    // 止まってしまう（実際そうなった）。上端との差を自分で測って
    // scrollTop に入れる。sticky でも余白があっても、必ず狙った位置に着く。
    else if(act==="archive-jump"){
      var mk = el.getAttribute("data-key");
      state[id] = true;
      render();
      scrollContentTo(document.getElementById(id + "-" + mk));
    }
    else if(act==="legacy-download"){ downloadLegacy(); }
    else if(act==="legacy-discard"){ discardLegacy(); }
    else if(act==="notice-close"){ state.notice = ""; render(); }
    else if(act==="modal-body"){ return; }   // ダイアログ本体のクリックは背景に伝えない
    else if(act==="avatar-open"){ state.avatarFor = id; state.avatarDraft = null; render(); }
    else if(act==="avatar-close"){ state.avatarFor = null; state.avatarDraft = null; render(); }
    else if(act==="avatar-save"){ saveAvatar(id); }
    else if(act==="avatar-clear"){ clearAvatar(id); }
    else if(act==="confirm-cancel"){ state.confirm = null; render(); }
    else if(act==="confirm-ok"){ runConfirmedDelete(); }
    else if(act==="trash-toggle"){ state.showTrash = !state.showTrash; render(); }
    else if(act==="onboard-done"){
      try{ localStorage.setItem("cc2:onboarded:" + (currentUserId()||""), "1"); }catch(e){}
      render();
    }
    else if(act==="edit-start"){
      startEdit(el.getAttribute("data-kind"), id, el.getAttribute("data-post"));
    }
    else if(act==="edit-cancel"){ cancelEdit(); }
    else if(act==="edit-save"){
      var k = el.getAttribute("data-kind");
      if(k==="feed")        saveFeedEdit(id);
      else if(k==="board")  saveBoardEdit(id);
      else if(k==="survey") saveSurveyEdit(id);
      else if(k==="comment")saveCommentEdit(el.getAttribute("data-post"), id);
    }
    else if(act==="delete-ask"){
      askDelete(el.getAttribute("data-kind"), id, el.getAttribute("data-post"));
    }
    else if(act==="board-open-form"){ state.boardShowForm = true; state.boardImageDraft = null; render(); }
    else if(act==="board-cancel"){ state.boardShowForm = false; state.boardImageDraft = null; render(); }
    else if(act==="board-submit"){ submitBoardPost(); }
    else if(act==="board-readers"){
      state.boardOpenReaders = state.boardOpenReaders===id ? null : id;
      render();
    }
    else if(act==="cal-toggle"){ state.calOpen = !state.calOpen; state.calMonth = 0; render(); }
    else if(act==="cal-month"){ state.calMonth = parseInt(id, 10) || 0; render(); }
    else if(act==="img-clear"){
      if(el.getAttribute("data-which")==="editBoard") state.editImageDraft = null;
      else state.boardImageDraft = null;
      render();
    }
    else if(act==="img-remove"){ state.editImageRemove = true; state.editImageDraft = null; render(); }
    else if(act==="img-undo"){ state.editImageRemove = false; render(); }
    else if(act==="lightbox"){ state.lightbox = id; render(); }
    else if(act==="lightbox-close"){ state.lightbox = null; render(); }
    else if(act==="task-toggle"){ toggleTaskDone(id); }
    else if(act==="plan-clear"){ setMyPlan(id, ""); }
    else if(act==="task-status"){
      state.boardOpenTask = state.boardOpenTask===id ? null : id;
      render();
    }
    else if(act==="survey-open-form"){ state.surveyShowForm = true; render(); }
    else if(act==="survey-cancel"){ state.surveyShowForm = false; render(); }
    else if(act==="survey-add-opt"){
      var container = document.getElementById("surveyOptsContainer");
      var n = container.querySelectorAll(".survey-opt").length + 1;
      var inp = document.createElement("input");
      inp.className = "input survey-opt"; inp.placeholder = "選択肢 " + n;
      container.appendChild(inp);
    }
    else if(act==="survey-submit"){ submitSurvey(); }
    else if(act==="survey-status"){
      state.surveyOpenStatus = state.surveyOpenStatus===id ? null : id;
      render();
    }
    else if(act==="vote"){ toggleVote(id, el.getAttribute("data-opt")); }
    else if(act==="vote-pick"){ pickVote(id, el.getAttribute("data-opt")); }
    else if(act==="vote-submit"){ submitVote(id); }
    else if(act==="vote-revote"){
      state.surveyRevote = id;
      state.surveyDraft[id] = ((state.surveys.filter(function(s){ return s.id===id; })[0]||{}).votes||{})[currentUserId()] || [];
      render();
    }
    else if(act==="mvv-toggle"){ state.mvvOpen = !state.mvvOpen; render(); }
    else if(act==="kpi-section-toggle"){ state.progressKpiOpen = !state.progressKpiOpen; render(); }
    else if(act==="tkpi-team"){ state.teamKpiTeam = id; render(); }
    else if(act==="tkpi-grp"){ state.teamKpiGroup = id; render(); }
    else if(act==="tkpi-mode"){ state.teamKpiMode = id; render(); }
    else if(act==="daily-day"){ state.dailyDay = parseInt(id, 10) || 0; render(); }
    else if(act==="kpi-clear"){ state.kpiSel = null; render(); }
    else if(act==="kpi-toggle"){ state.kpiSel = state.kpiSel===id ? null : id; render(); }
  });

  // ファイル選択は click ではなく change で拾う
  // 整形済みの文字が入っているので、触ったら全部選ぶ。
  // 「39.3%」の % を消してから打ち直す、という手間をなくす。
  app.addEventListener("focusin", function(e){
    if(!e.target.closest) return;
    var li = e.target.closest("input[data-land]");
    if(li) setTimeout(function(){ try{ li.select(); }catch(_){ } }, 0);
  });

  app.addEventListener("change", function(e){
    if(session.status !== "ready") return;
    if(!e.target.closest) return;
    // 着地シナリオの入力。input ではなく change で拾う。
    // 1文字ごとに再描画すると、打っている最中にフォーカスが飛ぶ。
    // 表示は「39.3%」のように整形してあるので、触ったら全選択して
    // そのまま打ち替えられるようにする（focusin は下で拾う）。
    var ln = e.target.closest("[data-land]");
    if(ln){
      landSave(ln.getAttribute("data-mid"), ln.getAttribute("data-land"), ln.value);
      render();
      return;
    }
    var av = e.target.closest('[data-act="avatar-file"]');
    if(av){ pickAvatarFile(av.files && av.files[0], av.getAttribute("data-id")); return; }
    var bi = e.target.closest('[data-act="board-img-file"]');
    if(bi){ pickBoardImage(bi.files && bi.files[0], bi.getAttribute("data-which")); return; }
    // 自分の期限は、日付を選んだ時点で記録する。
    // 別に保存ボタンを置くと「選んだのに保存を押していない」状態が生まれる。
    var pd = e.target.closest('[data-act="plan-date"]');
    if(pd){ setMyPlan(pd.getAttribute("data-id"), pd.value); return; }
  });

  // 拡大表示は Esc でも閉じられるようにする
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && state.lightbox){ state.lightbox = null; render(); }
  });

  app.addEventListener("keydown", function(e){
    if(session.status !== "ready") return;
    var el = e.target.closest('[data-act="comment-input"]');
    if(!el) return;
    // 日本語入力の変換確定の Enter で送信しない。
    // isComposing が true のあいだは、まだ文字を選んでいる最中。
    if(e.key==="Enter" && !e.isComposing){
      var text = el.value.trim();
      if(!text) return;
      el.value = "";   // 送信は非同期。先に空にして二重送信を防ぐ
      submitComment(el.getAttribute("data-kind") || "feed", el.getAttribute("data-id"), text);
    }
  });
}

boot();
</script>
