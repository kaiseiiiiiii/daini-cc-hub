 * 送信は Enter だけにしていたが、スマホの日本語入力では変換確定の
 * Enter と送信の Enter が区別しづらく、押せるボタンが要る。
 * Enter でも送れる挙動は残してある（PC ではそちらが速いため）。
 */
function renderComments(kind, post){
  var me = currentUserId();
  var rows = state.comments.map(function(c){
    if(state.editing && state.editing.kind==="comment" && state.editing.id===c.id && canEdit(c)){
      return '<div class="comment-edit-row">' + avatar(c.authorId,22) +
        '<input id="editCommentText" class="input comment-input" value="'+esc(c.text)+'">' +
        '<button class="tool-btn" data-act="edit-save" data-kind="comment" data-id="'+c.id+'" data-post="'+post.id+'">保存</button>' +
        '<button class="tool-btn" data-act="edit-cancel">中止</button>' +
      '</div>';
    }
    return '<div class="comment-row">'+avatar(c.authorId,22) +
      '<div class="comment-bubble">' +
        '<div class="comment-bubble-head">' +
          '<span class="comment-name">'+esc(getM(c.authorId).displayName)+'</span>' +
          '<span class="comment-time">'+tAgo(c.createdAtMs)+'</span>' +
          editedMark(c) +
        '</div>' +
        '<div class="comment-text">'+esc(c.text)+'</div>' +
      '</div>' +
      renderTools("comment", c, post.id) +
    '</div>';
  }).join("");

  return '<div class="comments">' +
    '<div class="comments-label">💬 コメント'+(state.comments.length?' '+state.comments.length:'')+'</div>' +
    (state.comments.length ? rows
      : '<div class="comment-empty">まだコメントはありません</div>') +
    '<div class="comment-input-row">' + avatar(me,22) +
      '<input class="input comment-input" placeholder="コメントを書く..." ' +
        'data-act="comment-input" data-kind="'+kind+'" data-id="'+post.id+'">' +
      '<button class="comment-send" data-act="comment-send" data-kind="'+kind+'" data-id="'+post.id+'">送信</button>' +
    '</div>' +
  '</div>';
}

/**
 * リアクションの行。フィードと掲示板で同じものを使う。
 *
 * kind でどのコレクションを更新するかが決まる。パレットの開閉は
 * kind と ID を組にして覚える（別のタブの同じ位置の投稿とID衝突しても、
 * 意図しない側が開かないようにするため）。
 *
 * 押された絵文字だけを出し、追加は「＋」から。全種を常時並べると
 * 0件のボタンが場所を取って「何件付いているか」が読み取りにくくなる。
 */
function renderReactionRow(kind, post, extraHtml){
  var me = currentUserId();
  var byEmoji = reactionsByEmoji(post);
  var mine = (post.reactions && post.reactions[me]) || [];
  var key = kind + ":" + post.id;
  var picking = state.reactionPickerFor === key;

  var shown;
  if(picking){
    shown = REACTIONS;
  }else{
    // 一覧の順で押されたものを出し、そのあとに
    // 一覧から外れた絵文字（過去に押されたもの）を続ける。
    // 絵文字を整理しても、押した記録が画面から消えないようにするため。
    shown = REACTIONS.filter(function(e){ return (byEmoji[e]||[]).length > 0; });
    Object.keys(byEmoji).forEach(function(e){
      if(byEmoji[e].length > 0 && REACTIONS.indexOf(e) < 0) shown.push(e);
    });
  }

  var html = shown.map(function(emoji){
    var who = (byEmoji[emoji]||[]);
    var cnt = who.length;
    var isMine = mine.indexOf(emoji)>=0;
    // 押した人の名前は属性に持たせておき、ホバー／長押し時に
    // DOM を直接書き換えて出す（後述のとおり render() は呼ばない）
    var names = who.map(function(mid){ return getM(mid).displayName; }).join("、");
    return '<button class="react-btn'+(isMine?" react-mine":"")+'"' +
      ' data-act="react" data-kind="'+kind+'" data-id="'+post.id+'" data-emoji="'+emoji+'"' +
      ' data-people="'+esc(names)+'"' +
      ' aria-label="'+emoji+' '+cnt+'人'+(names?'：'+esc(names):'')+'">' +
      emoji + (cnt>0?'<span class="react-count">'+cnt+'</span>':'') +
    '</button>';
  }).join("");

  html += '<button class="react-btn react-add'+(picking?" react-add-on":"")+'"' +
    ' data-act="react-picker" data-kind="'+kind+'" data-id="'+post.id+'"' +
    ' aria-label="'+(picking?"リアクションの選択を閉じる":"リアクションを追加")+'">' +
    (picking ? '×' : '＋') + '</button>';

  return '<div class="post-actions post-actions-'+kind+(picking?" post-actions-picking":"")+'">' +
    html + (extraHtml || "") +
    '<div class="react-peek" hidden></div>' +
  '</div>';
}

// ══════════════════════════════════════════════════════════════════
//  RENDER: BOARD
// ══════════════════════════════════════════════════════════════════
function renderBoard(){
  var sorted = state.board.slice().sort(function(a,b){
    if(a.pinned && !b.pinned) return -1;
    if(!a.pinned && b.pinned) return 1;
    return b.createdAtMs-a.createdAtMs;
  });
  var formHtml = state.boardShowForm ? renderBoardForm() : "";
  // 先月以前の投稿は畳む。固定（📌）は月をまたいでも現行に残るので、
  // 並べ替えで先頭に来た固定投稿はそのまま先頭に残る。
  var split = splitArchive(sorted);
  var body = split.live.length
    ? split.live.map(renderBoardPost).join("")
    : (split.count
        ? emptyState("📋","今月の共有事項はまだありません","過去の投稿は下にまとまっています")
        : emptyState("📋","まだ共有事項がありません"));

  // 未読ゼロのときだけ出す。掲示板を全部読み終えた状態は
  // わざわざ知らせる価値があるので、ここだけ INさんを出す。
  // 見るのは現行分だけ。畳まれて画面に出ていない過去の投稿を
  // 未読として数えると、開きようのないものが理由で永久に出なくなる。
  var me = currentUserId();
  var allRead = split.live.length > 0 && split.live.every(function(p){
    return !!(p.readBy && p.readBy[me]);
  });
  var readAllHtml = allRead
    ? '<div class="in-strip">' + inChar("satisfied", "全部見ましたね", 64) + '</div>'
    : "";

  // カレンダーは畳んでおく。期日を持つ投稿が1件も無ければ出さない
  // （空のカレンダーは場所を取るだけ）。
  var hasTasks = state.board.some(isTask);
  var calHtml = hasTasks
    ? '<button class="cal-trigger'+(state.calOpen?" cal-trigger-open":"")+'" data-act="cal-toggle" aria-expanded="'+(state.calOpen?"true":"false")+'">' +
        '📅 期日をカレンダーで見る<span class="reader-caret">'+(state.calOpen?"▲":"▼")+'</span>' +
      '</button>' + (state.calOpen ? renderTaskCalendar() : "")
    : "";

  return '<div class="tab-pad">' +
    renderOnboarding() +
    renderMyTasks() +
    calHtml +
    '<button class="dashed-trigger" data-act="'+(state.boardShowForm?"board-cancel":"board-open-form")+'">'+(state.boardShowForm?"× 閉じる":"+ 掲示板に投稿する")+'</button>' +
    formHtml +
    body +
    readAllHtml +
    renderArchive(split, "boardArchiveOpen", renderBoardPost) +
    renderTrash("board") +
  '</div>';
}

/**
 * 初回だけ出す案内。デザイン指定の「ここが第二CCの掲示板です」。
 * 閉じたことは localStorage に持つ（人ごと・端末ごとで十分な性質のため、
 * Firestore には置かない）。
 */
function renderOnboarding(){
  var key = "cc2:onboarded:" + (currentUserId() || "");
  var done = true;
  try{ done = !!localStorage.getItem(key); }catch(e){}
  if(done) return "";
  return '<div class="card onboard-card">' +
    inChar("guide", "ここが第二CCの掲示板です", 88) +
    '<div class="onboard-body">連絡事項はここに残ります。' +
      '未読には NEW が付き、画面に出して少し経つと自動で既読になります。' +
      '「既読◯名」を押すと、まだ読んでいない人が分かります。' +
      '月が変わった投稿は「過去の投稿」にまとまります（📌 固定したものは残ります）。</div>' +
    '<button class="btn-primary onboard-ok" data-act="onboard-done">わかりました</button>' +
  '</div>';
}

function renderBoardForm(){
  var catOpts = BOARD_CATEGORIES.map(function(c){ return "<option>"+esc(c)+"</option>"; }).join("");
  return '<div class="card form-card">' +
    '<div class="form-col">' +
      '<input id="boardFormTitle" class="input input-strong" placeholder="タイトル">' +
      '<div class="form-row form-row-center">' +
        '<select id="boardFormCat" class="input" style="flex:1">'+catOpts+'</select>' +
        '<label class="checkbox-label nowrap"><input type="checkbox" id="boardFormPinned"> 📌 固定</label>' +
      '</div>' +
      '<textarea id="boardFormBody" class="input textarea" placeholder="内容（任意）..." rows="3"></textarea>' +
      renderVisibilityField("boardForm", null) +
      renderImageField("boardForm", null) +
      renderTaskFields("boardForm", null) +
      errorSlot("boardFormError") +
      // 送信ボタンは、フォームの中でいちばん目立つ要素にしておく。
      // 以前はほかの入力欄と同じ幅・同じ高さで最下段に置いていたため、
      // 公開範囲や画像の欄と区別が付かず、押す場所が分からないという
      // 報告が出ていた。何が起きるか（全員に見えること）も添える。
      '<button class="btn-primary board-submit" data-act="board-submit">' +
        '<span class="board-submit-main">📋 掲示板に投稿する</span>' +
        '<span class="board-submit-sub">投稿するとメンバー全員の掲示板に出ます</span>' +
      '</button>' +
    '</div>' +
  '</div>';
}

function readCount(post){ return Object.keys(post.readBy || {}).length; }

// ══════════════════════════════════════════════════════════════════
//  チェックリスト（掲示板投稿に期日と完了チェックを付けたもの）
//
//  独立したタブやコレクションにはしていない。連絡事項と「やること」は
//  現場では同じ流れで出てくるもので、置き場所を分けると
//  「掲示板に書いたのに気づかれない／タスクに入れ忘れた」が起きる。
//
//  既存の投稿には dueDate も doneBy も無い。読む側は必ず
//  「無い」場合を通常の状態として扱うこと（過去データを壊さない）。
// ══════════════════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════════════════
//  公開範囲（非公開の掲示板投稿）
//
//  visibleTo は文字列の配列。
//    ["*"]                        … 全員が見られる（既定）
//    [作成者, ...指定されたID]     … その人たちだけが見られる
//
//  「見えないように隠す」ではなく、Firestore のルールで**読み取り自体を
//  拒否**している。リポジトリが公開されているので、画面に出さないだけでは
//  開発者ツールから取得できてしまう。
//
//  管理者（admin）も対象外の投稿は読めない。人事や健康面のように
//  上長にも見せたくない話を扱えるようにするため、という合意による。
//  代償として、作成者が退職した非公開投稿は誰も開けなくなる。
//
//  配列にしているのは、ルールで「自分が入っているか」を1行で書けて、
//  かつクエリ側で array-contains-any で同じ条件を表現できる形が
//  これしかないため（マップだと動的キーの照合ができない）。
// ══════════════════════════════════════════════════════════════════
var VISIBLE_ALL = "*";

function isPrivatePost(post){
  var v = post.visibleTo;
  return !!(v && v.length && v.indexOf(VISIBLE_ALL) < 0);
}

/** 自分がこの投稿を見てよいか。ルール側の canSeeBoardPost と同じ条件 */
function canSeeHere(post){
  return !isPrivatePost(post)
      || (post.visibleTo || []).indexOf(currentUserId()) >= 0;
}

/** その投稿を見られるメンバー。公開なら全員 */
function visibleMembers(post){
  if(!isPrivatePost(post)) return session.members.slice();
  var v = post.visibleTo || [];
  return session.members.filter(function(m){ return v.indexOf(m.id) >= 0; });
}

/**
 * チェックリストとして扱う投稿か。
 * 期日が入っているものをチェックリストとみなす。フラグを別に持たないのは、
 * 「フラグは立っているが期日が無い」ようなずれた状態を作らないため。
 */
function isTask(post){ return !!post.dueDate; }

/**
 * チェックの対象になるメンバー。
 * checkTargets が空（または無い）なら全員が対象。
 * 「全員」を memberId の列挙で保存しないのは、あとから人が増えたときに
 * 過去のタスクの対象者が自動で追いつかないから。
 */
function taskTargets(post){
  // 非公開の投稿では、見られる人だけが対象になりうる。
  // 見られない人を未完了として並べると、声のかけようがない相手が
  // 名簿に出続けることになる。
  var pool = visibleMembers(post);
  var t = post.checkTargets;
  if(!t || !t.length) return pool;
  return pool.filter(function(m){ return t.indexOf(m.id) >= 0; });
}
function isTaskTarget(post, memberId){
  if(isPrivatePost(post) && (post.visibleTo||[]).indexOf(memberId) < 0) return false;
  var t = post.checkTargets;
  if(!t || !t.length) return true;
  return t.indexOf(memberId) >= 0;
}
function taskDone(post, memberId){ return !!(post.doneBy && post.doneBy[memberId]); }
function taskPendingList(post){
  return taskTargets(post).filter(function(m){ return !taskDone(post, m.id); });
}
function taskDoneList(post){
  return taskTargets(post).filter(function(m){ return taskDone(post, m.id); });
}

/** 自分がまだ終わっていないタスクか。期限切れも「未完了」として残す */
function taskNeedsMe(post){
  return isTask(post)
      && isTaskTarget(post, currentUserId())
      && !taskDone(post, currentUserId());
}

/**
 * その人の期日。
 *
 * dueBy に本人の分が入っていればそれ、無ければ全体の期日（dueDate）。
 * 「全員 8/18、ただし1人だけ 8/21」のような割り振りを、
 * 例外だけ持つ形で表す。全員分を dueBy に並べると、あとから
 * 全体の期日を直したときに誰にも反映されない。
 */
function memberDue(post, memberId){
  var by = post.dueBy || {};
  return by[memberId] || post.dueDate || null;
}

// ══════════════════════════════════════════════════════════════════
//  自分で決める期限（planBy）
//
//  dueBy とは別物なので混ぜないこと。
//    dueDate / dueBy … 出した人が決めた期日。動かせるのは作成者だけ。
//    planBy          … 受けた人が「自分はここまでにやります」と自分で置く日。
//                      本人しか書けない（ルール側で自分のキーだけに制限）。
//
//  分けている理由は、この2つが食い違うこと自体が見たい情報だから。
//  作成者の期日に本人の宣言を上書きさせると、「間に合わないと本人は
//  思っている」という状態が消えて、遅れが期日当日まで表に出てこない。
// ══════════════════════════════════════════════════════════════════

/** その人が自分で宣言した期限。無ければ null */
function memberPlan(post, memberId){
  var by = post.planBy || {};
  return by[memberId] || null;
}

/** 宣言した期限が、割り当てられた期日より後になっているか */
function planIsLate(post, memberId){
  var plan = memberPlan(post, memberId);
  var due  = memberDue(post, memberId);
  if(!plan || !due) return false;
  return plan > due;      // どちらも "YYYY-MM-DD" なので文字列比較でよい
}

/** 未完了者パネルに添える一言。「この人はいつやると言っているか」 */
function planNote(post, m){
  var plan = memberPlan(post, m.id);
  if(!plan) return "";
  return (planIsLate(post, m.id) ? "⚠ " : "") + ymdLabel(plan) + "予定";
}

/** 人ごとの期日が1件でも入っているか */
function hasPerMemberDue(post){
  var by = post.dueBy;
  if(!by) return false;
  for(var k in by) if(by[k]) return true;
  return false;
}

/**
 * 期日ごとに、その日が締め切りの対象者をまとめる。
 * カレンダーは「日付 → 誰」で見るものなので、この向きに直しておく。
 */
function taskDueGroups(post){
  var byDate = {};
  taskTargets(post).forEach(function(m){
    var d = memberDue(post, m.id);
    if(!d) return;
    (byDate[d] = byDate[d] || []).push(m);
  });
  return byDate;
}

/** 自分の期日の近い順に並べるためのキー。日付が壊れているものは末尾へ */
function dueMs(post){
  var d = ymdToDate(memberDue(post, currentUserId()));
  return d ? d.getTime() : 8.64e15;
}

/**
 * 期日のバッジ。残り2日以内は色を変える（当日に初めて気づく事態を避ける）。
 * 人ごとに期日が違う場合は自分の期日を出す。全体の期日を出しても
 * 自分が動く日付が分からず、判断の材料にならない。
 */
function taskBadge(post){
  var mine = memberDue(post, currentUserId());
  var d = ymdDaysLeft(mine);
  if(d === null) return "";
  var label = ymdLabel(mine);
  var cls = "", text;
  if(d < 0){        cls = " sbadge-late"; text = "期限切れ"; }
  else if(d === 0){ cls = " sbadge-soon"; text = "本日まで"; }
  else {            cls = (d <= 2 ? " sbadge-soon" : ""); text = "残り"+d+"日"; }
  // 自分の分だけ別日になっているときは、そうと分かるようにしておく
  var own = hasPerMemberDue(post) && (post.dueBy||{})[currentUserId()] ? "あなたの期日 " : "";
  return '<span class="sbadge'+cls+'">📅 '+own+text+' · '+esc(label)+'</span>';
}

/**
 * 期日と対象者の入力欄。投稿フォームと編集フォームで共用する。
 *
 * <details> と素の <input type="checkbox"> で組んでいるのは、開閉と
 * チェックの状態をブラウザ側に持たせるため。state に持たせると
 * 1つ押すたびに全体を描き直すことになり、入力途中の本文が消える。
 */
function renderTaskFields(prefix, post){
  var due = (post && post.dueDate) || "";
  var sel = (post && post.checkTargets) || null;
  var all = !sel || !sel.length;
  var chips = session.members.map(function(m){
    var on = all || sel.indexOf(m.id) >= 0;
    return '<label class="target-chip">' +
      '<input type="checkbox" class="'+prefix+'Target" value="'+esc(m.id)+'"'+(on?" checked":"")+'>' +
      avatar(m.id, 18) + '<span>'+esc(m.displayName)+'</span>' +
    '</label>';
  }).join("");
  // 人ごとの期日。空欄なら全体の期日に従う。
  // 全員分の欄を出すのは、対象者のチェックを触っても描き直さない作りのため
  // （対象者に合わせて欄を出し入れすると、状態がずれる）。
  var by = (post && post.dueBy) || {};
  var perRows = session.members.map(function(m){
    return '<label class="perdue-row">' +
      avatar(m.id, 20) +
      '<span class="perdue-name">'+esc(m.displayName)+'</span>' +
      '<input type="date" class="input perdue-input '+prefix+'PerDue" ' +
        'data-member="'+esc(m.id)+'" value="'+esc(by[m.id] || "")+'" ' +
        'aria-label="'+esc(m.displayName)+'の期日">' +
    '</label>';
  }).join("");
  var anyPer = Object.keys(by).length > 0;

  return '<div class="task-fields">' +
    '<label class="task-fields-label" for="'+prefix+'Due">📅 期日（入れるとチェックリストになります）</label>' +
    '<input type="date" id="'+prefix+'Due" class="input" value="'+esc(due)+'">' +
    '<details class="target-picker"'+(all?"":" open")+'>' +
      '<summary>対象者を選ぶ<span class="target-hint">既定は全員</span></summary>' +
      '<div class="target-chips">'+chips+'</div>' +
    '</details>' +
    '<details class="target-picker"'+(anyPer?" open":"")+'>' +
      '<summary>人ごとに期日を変える<span class="target-hint">空欄なら上の期日</span></summary>' +
      '<div class="perdue-list">'+perRows+'</div>' +
    '</details>' +
  '</div>';
}

/**
 * 公開範囲の入力欄。投稿フォームと編集フォームで共用する。
 *
 * チェックボックスと :has() で出し入れしていて JS を挟んでいない。
 * 描き直さずに済むので、入力途中の本文が消える心配がない。
 */
function renderVisibilityField(prefix, post){
  var priv = post ? isPrivatePost(post) : false;
  var v = (post && post.visibleTo) || [];
  var me = currentUserId();
  var chips = session.members.map(function(m){
    // 作成者は必ず見られる（自分の投稿が自分から見えなくなるのを防ぐ）
    var isAuthor = post ? (m.id === post.authorId) : (m.id === me);
    var on = isAuthor || (priv && v.indexOf(m.id) >= 0);
    return '<label class="target-chip'+(isAuthor?" target-chip-fixed":"")+'">' +
      '<input type="checkbox" class="'+prefix+'Vis" value="'+esc(m.id)+'"'+
        (on?" checked":"")+(isAuthor?" disabled":"")+'>' +
      avatar(m.id, 18) + '<span>'+esc(m.displayName)+(isAuthor?"（作成者）":"")+'</span>' +
    '</label>';
  }).join("");

  return '<div class="vis-wrap">' +
    '<label class="checkbox-label vis-toggle-label">' +
      '<input type="checkbox" class="vis-toggle '+prefix+'Private"'+(priv?" checked":"")+'>' +
      ' 🔒 非公開にする（指定した人だけが見られます）' +
    '</label>' +
    '<div class="vis-members">' +
      '<div class="vis-note">ここで選んだ人以外は、この投稿を<b>一切読めません</b>。' +
        '管理者も対象外なら読めません。</div>' +
      '<div class="target-chips">'+chips+'</div>' +
    '</div>' +
  '</div>';
}

/** 公開範囲を読み出す。非公開でなければ ["*"] */
function readVisibility(prefix, post){
  var toggle = document.querySelector("." + prefix + "Private");
  if(!toggle || !toggle.checked) return [VISIBLE_ALL];
  var authorId = post ? post.authorId : currentUserId();
  var out = [authorId];
  Array.prototype.forEach.call(document.querySelectorAll("." + prefix + "Vis"), function(b){
    if(b.checked && out.indexOf(b.value) < 0) out.push(b.value);
  });
  return out;
}

/** 入力欄から値を取り出す。期日が空ならチェックリストにしない */
function readTaskFields(prefix){
  var el = document.getElementById(prefix + "Due");
  var due = (el && el.value ? el.value : "").trim() || null;
  var picked = [], total = 0;
  Array.prototype.forEach.call(document.querySelectorAll("." + prefix + "Target"), function(b){
    total++;
    if(b.checked) picked.push(b.value);
  });
  // 全員選ばれている／誰も選ばれていないときは null（＝全員）で保存する。
  // 全員を列挙して残すと、あとから入った人が過去のタスクの対象から抜け落ちる。
  var targets = (picked.length === 0 || picked.length === total) ? null : picked;

  // 人ごとの期日は「全体と違うものだけ」を残す。全体と同じ値まで書き込むと、
  // あとから全体の期日を直したときに、その人だけ古い日付のまま取り残される。
  var dueBy = {};
  Array.prototype.forEach.call(document.querySelectorAll("." + prefix + "PerDue"), function(inp){
    var v = (inp.value || "").trim();
    if(v && v !== due) dueBy[inp.getAttribute("data-member")] = v;
  });

  return {
    dueDate: due,
    checkTargets: due ? targets : null,
    dueBy: due ? dueBy : {}
  };
}

/**
 * 「誰がいつまでか」の一覧。期日の早い順に並べる。
 * 終わった人は薄くするだけで消さない（割り振り自体は残す）。
 */
function renderPerDueList(post){
  var groups = taskDueGroups(post);
  var dates = Object.keys(groups).sort();
  var me = currentUserId();
  var rows = dates.map(function(ymd){
    var left = ymdDaysLeft(ymd);
    var cls = left === null ? "" : (left < 0 ? " perdue-late" : (left <= 2 ? " perdue-soon" : ""));
    var who = groups[ymd].map(function(m){
      var isDone = taskDone(post, m.id);
      return '<span class="perdue-chip'+(isDone?" perdue-chip-done":"")+
        (m.id===me?" perdue-chip-me":"")+'">' +
        avatar(m.id, 16) + '<span>'+esc(m.displayName)+'</span>' +
        (isDone ? '<span class="perdue-check">✓</span>' : '') +
      '</span>';
    }).join("");
    return '<div class="perdue-line">' +
      '<span class="perdue-date'+cls+'">'+esc(ymdLabel(ymd))+'まで</span>' +
      '<span class="perdue-who">'+who+'</span>' +
    '</div>';
  }).join("");
  return '<div class="perdue-summary">' +
    '<div class="perdue-summary-label">誰がいつまでに</div>' + rows +
  '</div>';
}

/** 投稿カードの中のチェックリスト部分 */
function renderTaskBlock(post){
  if(!isTask(post)) return "";
  var me = currentUserId();
  var targets = taskTargets(post);
  var pending = taskPendingList(post);
  var done    = taskDoneList(post);
  var isOpen  = state.boardOpenTask === post.id;
  var iAmDone = taskDone(post, me);

  var iAmTarget = isTaskTarget(post, me);
  var mine = iAmTarget
    ? '<button class="task-check'+(iAmDone?" task-check-done":"")+'" ' +
        'data-act="task-toggle" data-id="'+post.id+'" ' +
        'role="checkbox" aria-checked="'+(iAmDone?"true":"false")+'">' +
        '<span class="task-box">'+(iAmDone?"✓":"")+'</span>' +
        '<span>'+(iAmDone?"完了しました（取り消す）":"完了にする")+'</span>' +
      '</button>'
    : '<div class="task-note">あなたはこのチェックリストの対象者ではありません</div>';

  // 自分の期限の宣言。終わっていない対象者にだけ出す。
  // 終わった人に予定日を聞いても意味がなく、欄が残っていると
  // 「まだ何かやることがある」と読めてしまう。
  var planHtml = "";
  if(iAmTarget && !iAmDone){
    var myPlan = memberPlan(post, me) || "";
    var myDue  = memberDue(post, me);
    var late   = planIsLate(post, me);
    planHtml = '<div class="task-plan'+(late?" task-plan-late":"")+'">' +
      '<label class="task-plan-label" for="plan-'+post.id+'">🗓 自分はいつまでにやる</label>' +
      // data-nokeep: この欄の値は Firestore 側が持っている。描き直しの
      // 引き継ぎ対象に入れると、取り消した直後に古い日付が書き戻される。
      '<input type="date" id="plan-'+post.id+'" class="input task-plan-input" data-nokeep ' +
        'data-act="plan-date" data-id="'+post.id+'" value="'+esc(myPlan)+'">' +
      (myPlan
        ? '<button class="task-plan-clear" data-act="plan-clear" data-id="'+post.id+'">取り消す</button>'
        : '') +
      // 期日より後ろの日を置いたことは、その場で言う。あとから
      // 「間に合っていない」と気づくより、置いた瞬間に分かるほうがよい。
      (late ? '<div class="task-plan-warn">期日（'+esc(ymdLabel(myDue))+'）より後です</div>'
            : '') +
    '</div>';
  }

  return '<div class="task-block">' +
    '<div class="task-head">' +
      '<span class="task-head-label">✅ チェックリスト</span>' +
      '<button class="reader-toggle'+(isOpen?" reader-toggle-open":"")+'" ' +
        'data-act="task-status" data-id="'+post.id+'" aria-expanded="'+(isOpen?"true":"false")+'">' +
        '完了 '+done.length+'/'+targets.length+'名' +
        (pending.length ? '<span class="reader-toggle-unread">未完了 '+pending.length+'</span>' : '') +
        '<span class="reader-caret">'+(isOpen?"▲":"▼")+'</span>' +
      '</button>' +
    '</div>' +
    mine +
    planHtml +
    // 人ごとに期日が違うときは、誰がいつまでなのかを並べる。
    // カードの中で分かるようにしておかないと、割り振った本人以外は
    // カレンダーを開くまで自分の日付を知る手段がない。
    (hasPerMemberDue(post) ? renderPerDueList(post) : "") +
    (isOpen ? renderPeoplePanel({
      pendingLabel:"未完了", pending:pending,
      doneLabel:"完了",     done:done,
      allDoneText:"全員が完了しました",
      // 未完了の人が自分で置いた予定日を並べる。「まだの人」の一覧が、
      // 声をかける先の一覧から「いつやると言っているかの一覧」になる。
      noteOf: function(m){ return planNote(post, m); }
    }) : "") +
  '</div>';
}

/**
 * 期日の月カレンダー。どの日に何の期日があるかを一目で見せる。
 *
 * 掲示板は投稿日時順に並ぶので、「今週なにが締め切りか」は
 * カードを上から読まないと分からない。日付の枠に置き直すと、
 * 空いている日と詰まっている日が形として見える。
 *
 * 出すのは期日のあるものだけ。ふつうの連絡事項は日付を持たないので
 * ここには現れない。
 */
function renderTaskCalendar(){
  var tasks = state.board.filter(isTask);
  if(!tasks.length) return "";

  // 当月から state.calMonth か月ずらした月。new Date(年, 月+n, 1) が
  // 年をまたぐ繰り上がり・繰り下がりを処理してくれる。
  var now = new Date();
  var shown = new Date(now.getFullYear(), now.getMonth() + (state.calMonth || 0), 1);
  var year = shown.getFullYear(), month = shown.getMonth();

  // 「タスク×その日が期日の人」を1件として集める。
  // タスク単位にすると、人ごとに期日が違うときに1つの日付しか置けない。
  var entries = [];
  tasks.forEach(function(p){
    var groups = taskDueGroups(p);
    Object.keys(groups).forEach(function(ymd){
      var d = ymdToDate(ymd);
      if(!d || d.getFullYear() !== year || d.getMonth() !== month) return;
      var who = groups[ymd];
      entries.push({
        post: p, ymd: ymd, day: d.getDate(), who: who,
        pending: who.filter(function(m){ return !taskDone(p, m.id); }),
        // 人ごとの期日が入っていれば名前を出す。全員同じ期日なら人数で足りる。
        named: hasPerMemberDue(p),
        mine: who.some(function(m){ return m.id === currentUserId(); }) && taskNeedsMe(p)
      });
    });
  });

  var byDay = {};
  entries.forEach(function(e){ (byDay[e.day] = byDay[e.day] || []).push(e); });

  var todayY = new Date(); todayY.setHours(0,0,0,0);
  var isThisMonth = todayY.getFullYear() === year && todayY.getMonth() === month;

  var firstDow = new Date(year, month, 1).getDay();
  var days = new Date(year, month + 1, 0).getDate();

  var cells = "";
  for(var b = 0; b < firstDow; b++) cells += '<div class="cal-cell cal-blank"></div>';
  for(var day = 1; day <= days; day++){
    var list = byDay[day] || [];
    var isToday = isThisMonth && todayY.getDate() === day;
    var dow = new Date(year, month, day).getDay();
    // その日に自分の締め切りがあるか。声をかけられる側の視点で色を変える。
    var mineLeft = list.some(function(e){ return e.mine; });
    var cls = "cal-cell";
    if(isToday) cls += " cal-today";
    if(dow === 0) cls += " cal-sun";
    if(dow === 6) cls += " cal-sat";
    if(list.length) cls += mineLeft ? " cal-has cal-has-mine" : " cal-has";

    var pips = list.slice(0, 3).map(function(e){
      return '<span class="cal-pip'+(e.mine?" cal-pip-mine":"")+'" title="'+esc(e.post.title)+'"></span>';
    }).join("");
    var more = list.length > 3 ? '<span class="cal-more">+'+(list.length-3)+'</span>' : '';

    cells += '<div class="'+cls+'">' +
      '<span class="cal-day">'+day+'</span>' +
      (list.length ? '<span class="cal-pips">'+pips+more+'</span>' : '') +
    '</div>';
  }

  // 表示している月の期日を日付順で下に並べる。点だけでは何の期日か分からない。
  // 人ごとに期日を割り振ってあるものは「誰が」まで出す
  //（「◯◯さんは8/21まで」が読み取れる形にする）。
  var rows = entries.slice().sort(function(a, b){
    if(a.ymd !== b.ymd) return a.ymd < b.ymd ? -1 : 1;
    return a.post.title < b.post.title ? -1 : 1;
  }).map(function(e){
    var d = ymdToDate(e.ymd);
    var right;
    if(e.named){
      // 終わった人は薄く、残っている人はそのまま出す
      right = '<span class="cal-row-who">' + e.who.map(function(m){
        var isDone = taskDone(e.post, m.id);
        return '<span class="cal-who'+(isDone?" cal-who-done":"")+
          (m.id===currentUserId()?" cal-who-me":"")+'">'+esc(m.displayName)+
          (isDone?"✓":"")+'</span>';
      }).join("") + '</span>';
    }else{
      right = '<span class="cal-row-left">' +
        (e.pending.length ? '未完了 '+e.pending.length+'名' : '完了') + '</span>';
    }
    return '<div class="cal-row">' +
      '<span class="cal-row-date">'+(d.getMonth()+1)+'/'+d.getDate()+'</span>' +
      '<span class="cal-row-title'+(e.mine?" cal-row-mine":"")+'">'+esc(e.post.title)+'</span>' +
      right +
    '</div>';
  }).join("");

  var dows = ["日","月","火","水","木","金","土"].map(function(w, i){
    return '<div class="cal-dow'+(i===0?" cal-sun":(i===6?" cal-sat":""))+'">'+w+'</div>';
  }).join("");

  return '<div class="card cal-card">' +
    '<div class="cal-head">' +
      '<button class="cal-nav" data-act="cal-month" data-id="'+((state.calMonth||0)-1)+'" aria-label="前の月">‹</button>' +
      '<span class="cal-title">'+year+'年'+(month+1)+'月の期日</span>' +
      '<button class="cal-nav" data-act="cal-month" data-id="'+((state.calMonth||0)+1)+'" aria-label="次の月">›</button>' +
    '</div>' +
    '<div class="cal-grid">'+dows+cells+'</div>' +
    (rows ? '<div class="cal-list">'+rows+'</div>'
          : '<div class="cal-none">この月に期日はありません</div>') +
  '</div>';
}

/**
 * 自分の未完了タスクだけを掲示板の先頭に出す。
 * 掲示板は投稿日時順なので、期日が迫っているものが下に埋もれる。
 * ここには「何を・いつまでに」だけを置き、期日の近い順に並べる。
 */
function renderMyTasks(){
  var mine = state.board.filter(taskNeedsMe).sort(function(a,b){ return dueMs(a) - dueMs(b); });
  if(!mine.length) return "";
  var rows = mine.map(function(p){
    // 自分の期日で数える。全体の期日で出すと、自分だけ別日を割り振られた人に
    // 間違った残り日数を見せることになる。
    var d = ymdDaysLeft(memberDue(p, currentUserId()));
    var cls = d === null ? "" : (d < 0 ? " mytask-due-late" : (d <= 2 ? " mytask-due-soon" : ""));
    var text = d === null ? "" : (d < 0 ? "期限切れ" : (d === 0 ? "本日" : "残り"+d+"日"));
    // 自分で置いた予定日があれば添える。期日と自分の宣言がずれている場合、
    // 動く日として意味があるのは宣言のほう。
    var plan = memberPlan(p, currentUserId());
    var planHtml = plan
      ? '<span class="mytask-plan'+(planIsLate(p, currentUserId())?" mytask-plan-late":"")+'">' +
          '🗓 '+esc(ymdLabel(plan)) + '</span>'
      : '';
    return '<button class="mytask-row" data-act="task-toggle" data-id="'+p.id+'">' +
      '<span class="task-box"></span>' +
      '<span class="mytask-title">'+esc(p.title)+planHtml+'</span>' +
      '<span class="mytask-due'+cls+'">'+esc(text)+'</span>' +
    '</button>';
  }).join("");
  return '<div class="card mytask-card">' +
    '<div class="mytask-head">✅ あなたの未完了 '+mine.length+'件</div>' +
    rows +
  '</div>';
}

/** 名前チップ1つ。未読側は色を強めて目に入るようにする */
function memberChip(m, emphasize, note){
  return '<span class="reader-chip'+(emphasize?" reader-chip-unread":"")+'">' +
    avatar(m.id,18) + '<span>'+esc(m.displayName)+'</span>' +
    (note ? '<span class="reader-chip-note">'+esc(note)+'</span>' : '') +
  '</span>';
}

/**
 * 「まだの人」を主、「済んだ人」を従として出す共通パネル。
 * この規模ではまだの人のほうが短く、そのまま声かけの対象になるため、
 * 常にそちらを上に置いて色を強める。
 */
function renderPeoplePanel(cfg){
  var html = '<div class="reader-panel">';
  if(cfg.pending.length){
    html += '<div class="reader-group">' +
      '<div class="reader-label reader-label-unread">'+esc(cfg.pendingLabel)+' '+cfg.pending.length+'名</div>' +
      '<div class="reader-chips">' + cfg.pending.map(function(m){
        return memberChip(m, true, cfg.noteOf ? cfg.noteOf(m) : "");
      }).join("") + '</div>' +
    '</div>';
  }else{
    html += '<div class="reader-group"><div class="reader-label reader-label-done">✓ '+esc(cfg.allDoneText)+'</div></div>';
  }
  if(cfg.done.length){
    html += '<div class="reader-group">' +
      '<div class="reader-label">'+esc(cfg.doneLabel)+' '+cfg.done.length+'名</div>' +
      '<div class="reader-chips reader-chips-muted">' + cfg.done.map(function(m){ return memberChip(m, false); }).join("") + '</div>' +
    '</div>';
  }
  return html + '</div>';
}

function renderBoardEditForm(post){
  // 一覧から外したカテゴリが付いた古い投稿も、そのカテゴリのまま保存できるように
  // 選択肢へ足しておく。足さないと、開いた時点で先頭の「重要」が選ばれた状態になり、
  // 本文だけ直したつもりの保存でカテゴリが勝手に変わる。
  var cats = BOARD_CATEGORIES.slice();
  if(post.category && cats.indexOf(post.category) < 0) cats.push(post.category);
  var catOpts = cats.map(function(c){
    return '<option'+(c===post.category?" selected":"")+'>'+esc(c)+'</option>';
  }).join("");
  return '<div class="card form-card edit-card">' +
    '<div class="edit-head">共有事項を編集</div>' +
    '<div class="form-col">' +
      '<input id="editTitle" class="input input-strong" value="'+esc(post.title)+'">' +
      '<div class="form-row form-row-center">' +
        '<select id="editCat" class="input" style="flex:1">'+catOpts+'</select>' +
        '<label class="checkbox-label nowrap"><input type="checkbox" id="editPinned"'+(post.pinned?" checked":"")+'> 📌 固定</label>' +
      '</div>' +
      '<textarea id="editBody" class="input textarea" rows="3">'+esc(post.body)+'</textarea>' +
      renderVisibilityField("editBoard", post) +
      renderImageField("editBoard", post) +
      renderTaskFields("editBoard", post) +
      errorSlot("editFormError") +
      '<div class="form-row">' +
        '<button class="btn-primary" data-act="edit-save" data-kind="board" data-id="'+post.id+'">保存する</button>' +
        '<button class="btn-ghost" data-act="edit-cancel">キャンセル</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function renderBoardPost(post){
  if(state.editing && state.editing.kind==="board" && state.editing.id===post.id && canEdit(post)){
    return renderBoardEditForm(post);
  }
  var me = currentUserId();
  var readBy = post.readBy || {};
  var isRead = !!readBy[me];
  var catColor = CT[post.category]||"blue";
  var readers = session.members.filter(function(m){ return !!readBy[m.id]; });
  var unread  = session.members.filter(function(m){ return !readBy[m.id]; });
  var isOpen  = state.boardOpenReaders === post.id;

  var author = getM(post.authorId);

  // 未読のカードには data-unread を付けるだけ。既読にするのはクリックではなく、
  // カードが画面に入ったことを見ている IntersectionObserver（observeUnread）。
  return '<div class="card board-card" style="border-left:3px solid var(--'+catColor+')"'+(isRead?"":' data-unread="'+post.id+'"')+'>' +
    // 投稿者を先頭に、名前をはっきり出す。以前は 18px のアイコンと
    // 薄い小さな文字でカードの一番下に置いていて、誰の連絡なのかが
    // 読み終わるまで分からなかった。「誰が言っているか」は
    // 連絡事項では中身と同じくらい重要な情報。
    '<div class="board-head">' +
      avatar(post.authorId, 32) +
      '<div class="board-head-who">' +
        '<span class="board-author">'+esc(author.displayName)+'</span>' +
        (author.jobTitle ? '<span class="board-author-role">'+esc(author.jobTitle)+'</span>' : '') +
      '</div>' +
      '<span class="board-time">'+tAgo(post.createdAtMs)+(post.pending?' · 送信中':'')+'</span>' +
    '</div>' +
    '<div class="board-meta">' +
      (post.pinned?"<span>📌</span>":"") +
      badge(post.category, catColor) +
      (!isRead?badge("NEW","red"):"") +
      // 非公開であることは書いた側にも読んだ側にも見えている必要がある。
      // 「全員に流れていると思って書いた」を防ぐため、人数まで出す。
      (isPrivatePost(post)
        ? '<span class="sbadge sbadge-private">🔒 非公開 '+visibleMembers(post).length+'名</span>'
        : "") +
      taskBadge(post) +
    '</div>' +
    '<div class="board-title">'+esc(post.title)+editedMark(post)+'</div>' +
    // 本文は任意。空のまま出すと、余白だけの行が入って間延びする。
    (post.body ? '<div class="board-body">'+esc(post.body)+'</div>' : "") +
    renderBoardImage(post) +
    renderTaskBlock(post) +
    renderReactionRow("board", post, commentToggleBtn("board", post)) +
    (state.boardOpenComment===post.id ? renderComments("board", post) : "") +
    renderTools("board", post) +
    '<div class="board-footer">' +
      '<button class="reader-toggle'+(isOpen?" reader-toggle-open":"")+'" data-act="board-readers" data-id="'+post.id+'" aria-expanded="'+(isOpen?"true":"false")+'">' +
        '既読 '+readers.length+'名' +
        (unread.length ? '<span class="reader-toggle-unread">未読 '+unread.length+'</span>' : '') +
        '<span class="reader-caret">'+(isOpen?"▲":"▼")+'</span>' +
      '</button>' +
    '</div>' +
    (isOpen ? renderPeoplePanel({
      pendingLabel:"未読", pending:unread,
      doneLabel:"既読",   done:readers,
      allDoneText:"全員が既読です"
    }) : "") +
  '</div>';
}

// ══════════════════════════════════════════════════════════════════
//  RENDER: SURVEY
// ══════════════════════════════════════════════════════════════════
function deadlineDate(sv){ return ymdToDate(sv.deadline); }

/** 締切までの残り日数。0 は本日締切、null は期限なし */
function surveyDaysLeft(sv){ return ymdDaysLeft(sv.deadline); }

/** 期限を "8/16（土）" の形に */
function deadlineLabel(sv){ return ymdLabel(sv.deadline); }

/** 期限と選択方式のバッジ。締切が近いものは色を変える */
function surveyBadges(sv){
  var out = "";
  if(sv.closed){
    out += '<span class="sbadge sbadge-done">締切済み'+(sv.deadline?' · '+esc(deadlineLabel(sv)):'')+'</span>';
  }else{
    var d = surveyDaysLeft(sv);
    if(d === null){
      out += '<span class="sbadge">期限なし</span>';
    }else if(d < 0){
      out += '<span class="sbadge sbadge-done">期限切れ · '+esc(deadlineLabel(sv))+'</span>';
    }else{
      // 残り2日以内は色を変える。締切当日に初めて気づく事態を避けるため。
      out += '<span class="sbadge'+(d<=2?" sbadge-soon":"")+'">⏳ ' +
        (d===0 ? "本日まで" : "残り"+d+"日") + ' · '+esc(deadlineLabel(sv))+'</span>';
    }
  }
  out += '<span class="sbadge sbadge-mode">'+(sv.multi?"複数選択":"単一選択")+'</span>';
  return '<div class="sbadges">'+out+'</div>';
}

/** 自分がまだ答えていない、回答可能なアンケート */
function surveyNeedsMe(sv){
  var me = currentUserId();
  if(sv.closed) return false;
  var d = surveyDaysLeft(sv);
  if(d !== null && d < 0) return false;
  if(state.surveyRevote === sv.id) return true;   // 選び直し中は回答フォームを出す
  return !(sv.votes && sv.votes[me]);
}

/** 選択肢を選ぶ。送信するまでは手元に置くだけ */
function pickVote(surveyId, optId){
  var sv = state.surveys.filter(function(s){ return s.id===surveyId; })[0];
  if(!sv) return;
  var me = currentUserId();
  var cur = state.surveyDraft[surveyId] || (sv.votes && sv.votes[me]) || [];
  var next;
  if(cur.indexOf(optId) >= 0){
    next = cur.filter(function(x){ return x!==optId; });
  }else{
    next = sv.multi ? cur.concat([optId]) : [optId];
  }
  state.surveyDraft[surveyId] = next;
  render();
}

/** 選んだ内容をまとめて書き込む */
function submitVote(surveyId){
  var me = currentUserId();
  var draft = state.surveyDraft[surveyId];
  if(!draft || !draft.length) return;
  var patch = {};
  patch["votes." + me] = draft;
  delete state.surveyDraft[surveyId];
  state.surveyRevote = null;
  write("回答", function(){ return updateDoc(doc(db, "surveys", surveyId), patch); }, true);
}

function renderSurvey(){
  var formHtml = state.surveyShowForm ? renderSurveyForm() : "";
  var trigger = '<button class="dashed-trigger" data-act="'+
    (state.surveyShowForm?"survey-cancel":"survey-open-form")+'">'+
    (state.surveyShowForm?"× 閉じる":"+ アンケートを作成する")+'</button>';

  if(!state.surveys.length){
    return '<div class="tab-pad">'+trigger+formHtml+
      emptyState("📊","まだアンケートがありません")+renderTrash("surveys")+'</div>';
  }

  // 回答待ちのものを分けて、答える場所と結果を見る場所を混ぜない。
  // 広い画面では回答待ちを右に寄せ、左は結果一覧に専念させる。
  var todo = state.surveys.filter(surveyNeedsMe);
  var rest = state.surveys.filter(function(s){ return !surveyNeedsMe(s); });

  if(isWide()){
    return '<div class="survey-cols">' +
      '<div class="survey-main">' + trigger + formHtml +
        (rest.length ? rest.map(renderSurveyCard).join("")
                     : '<div class="prog-note">回答済みのアンケートはまだありません。</div>') +
        renderTrash("surveys") +
      '</div>' +
      '<div class="survey-todo">' +
        (todo.length ? todo.map(renderSurveyVoteCard).join("")
                     : '<div class="card side-card"><div class="side-title">回答待ちはありません</div></div>') +
      '</div>' +
    '</div>';
  }

  return '<div class="tab-pad">' + trigger + formHtml +
    todo.map(renderSurveyVoteCard).join("") +
    rest.map(renderSurveyCard).join("") +
    renderTrash("surveys") +
  '</div>';
}

/**
 * 回答フォーム。選択肢は行ごとのボタンにして、押しやすくする。
 * 選んだ内容は送信するまでローカルに置く。複数選択で1つ選ぶたびに
 * 書き込むと、途中の状態が他の人の画面に出てしまうため。
 */
function renderSurveyVoteCard(sv){
  if(state.editing && state.editing.kind==="survey" && state.editing.id===sv.id && canEdit(sv)){
    return renderSurveyEditForm(sv);
  }
  var me = currentUserId();
  var draft = state.surveyDraft[sv.id] || (sv.votes && sv.votes[me]) || [];

  var rows = (sv.options || []).map(function(opt){
    var on = draft.indexOf(opt.id) >= 0;
    return '<button class="option'+(on?" option--selected":"")+'" ' +
      'data-act="vote-pick" data-id="'+sv.id+'" data-opt="'+esc(opt.id)+'" ' +
      'role="'+(sv.multi?"checkbox":"radio")+'" aria-checked="'+(on?"true":"false")+'">' +
      '<span class="option-box'+(sv.multi?"":" option-box-round")+'">'+(on?"✓":"")+'</span>' +
      '<span>'+esc(opt.label)+'</span>' +

  }).join("");

  return '<div class="card vote-card">' +
    surveyBadges(sv) +
    '<div class="survey-title">'+esc(sv.title)+editedMark(sv)+'</div>' +
    '<div class="vote-opts">'+rows+'</div>' +
    '<button class="btn-post btn-vote" data-act="vote-submit" data-id="'+sv.id+'"'+

}

function renderSurveyForm(){
  return '<div class="card form-card">' +
    '<div class="form-col">' +
      '<input id="surveyFormTitle" class="input" placeholder="質問内容">' +
      '<div id="surveyOptsContainer" class="form-col-tight">' +
        '<input class="input survey-opt" placeholder="選択肢 1">' +
        '<input class="input survey-opt" placeholder="選択肢 2">' +
      '</div>' +
      '<button class="btn-dash" data-act="survey-add-opt">+ 選択肢を追加</button>' +

        '<label class="checkbox-label nowrap"><input type="checkbox" id="surveyFormMulti"> 複数選択可</label>' +

/**
 * votes は {memberId: [optionId]} なので、選択肢ごとの票数はここで数える。
 * 「誰がどれに入れたか」は画面には一切出さない（設計上の約束）。
 */
function voteCounts(sv){
  var counts = {}, total = 0;
  var v = sv.votes || {};
  (sv.options || []).forEach(function(o){ counts[o.id] = 0; });
  for(var memberId in v){
    (v[memberId] || []).forEach(function(optId){
      if(counts[optId] === undefined) counts[optId] = 0;
      counts[optId]++; total++;
    });
  }
  return { counts: counts, total: total };
}

function renderSurveyEditForm(sv){
  var optRows = (sv.options||[]).map(function(o, i){
    return '<input class="input edit-opt" value="'+esc(o.label)+'" aria-label="選択肢 '+(i+1)+'">';
  }).join("");
  return '<div class="card form-card edit-card">' +
    '<div class="edit-head">アンケートを編集</div>' +
    '<div class="form-col">' +
      '<input id="editTitle" class="input" value="'+esc(sv.title)+'">' +
      '<div class="form-col-tight">'+optRows+'</div>' +
      '<div class="edit-note">選択肢の文言だけ直せます。追加・削除はできません（すでに入っている票の行き場が無くなるため）。</div>' +
      '<div class="form-row form-row-center">' +
        '<label class="checkbox-label nowrap"><input type="checkbox" id="editMulti"'+(sv.multi?" checked":"")+'> 複数選択可</label>' +
        '<input type="date" id="editDeadline" class="input" style="flex:1" value="'+esc(sv.deadline||"")+'">' +
      '</div>' +
      '<label class="checkbox-label"><input type="checkbox" id="editClosed"'+(sv.closed?" checked":"")+'> 締め切る（投票を止める）</label>' +
      errorSlot("editFormError") +
      '<div class="form-row">' +
        '<button class="btn-primary" data-act="edit-save" data-kind="survey" data-id="'+sv.id+'">保存する</button>' +
        '<button class="btn-ghost" data-act="edit-cancel">キャンセル</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function renderSurveyCard(sv){
  if(state.editing && state.editing.kind==="survey" && state.editing.id===sv.id && canEdit(sv)){
    return renderSurveyEditForm(sv);
  }
  var me = currentUserId();
  var c = voteCounts(sv);
  var myV = (sv.votes && sv.votes[me]) || [];

  // 結果表示。バーの色は1位＝水色、2位＝江戸紫、以降＝灰。
  // 順位を煽らないよう、数字は票数と割合だけにしている。
  var ranked = (sv.options || []).slice().sort(function(a,b){
    return (c.counts[b.id]||0) - (c.counts[a.id]||0);
  });
  var rankOf = {};
  ranked.forEach(function(o,i){ rankOf[o.id] = i; });

  var optsHtml = (sv.options || []).map(function(opt){
    var cnt = c.counts[opt.id] || 0;
    var pct = c.total>0 ? Math.round(cnt/c.total*100) : 0;
    var voted = myV.indexOf(opt.id)>=0;
    var fill = rankOf[opt.id]===0 ? "" : (rankOf[opt.id]===1 ? " bar__fill--alt" : " bar__fill--mute");
    return '<div class="survey-opt-row">' +
      '<div class="survey-opt-line">' +
        '<span class="survey-opt-label'+(voted?" voted":"")+'">'+(voted?"✓ ":"")+esc(opt.label)+'</span>' +
        '<span class="survey-opt-count">'+cnt+'票・'+pct+'%</span>' +
      '</div>' +
      '<div class="bar"><div class="bar__fill'+fill+'" style="width:'+pct+'%"></div></div>' +
    '</div>';
  }).join("");

  // 回答状況。誰が何に入れたかは出さず、「回答したかどうか」だけを見る。
  var done    = session.members.filter(function(m){ return !!(sv.votes && sv.votes[m.id]); });
  var pending = session.members.filter(function(m){ return !(sv.votes && sv.votes[m.id]); });
  var isOpen  = state.surveyOpenStatus === sv.id;

  return '<div class="card">' +
    '<div class="survey-head">' + avatar(sv.authorId,28) +
      '<div class="survey-head-info">' +
        surveyBadges(sv) +
        '<div class="survey-title">'+esc(sv.title)+editedMark(sv)+'</div>' +
        '<div class="survey-meta">'+esc(getM(sv.authorId).displayName)+'</div>' +
      '</div>' +
      renderTools("survey", sv) +
    '</div>' +
    optsHtml +
    '<div class="survey-foot">' +
      '<span class="survey-total-text">合計 '+c.total+'票</span>' +
      (!sv.closed && myV.length
        ? '<button class="revote-btn" data-act="vote-revote" data-id="'+sv.id+'">回答を変更</button>' : '') +
      '<button class="reader-toggle'+(isOpen?" reader-toggle-open":"")+'" data-act="survey-status" data-id="'+sv.id+'" aria-expanded="'+(isOpen?"true":"false")+'">' +
        '回答 '+done.length+'名' +
        (pending.length ? '<span class="reader-toggle-unread">未回答 '+pending.length+'</span>' : '') +
        '<span class="reader-caret">'+(isOpen?"▲":"▼")+'</span>' +
      '</button>' +
    '</div>' +
    (isOpen ? renderPeoplePanel({
      pendingLabel:"未回答", pending:pending,
      doneLabel:"回答済み", done:done,
      allDoneText:"全員が回答済みです"
    }) : "") +
    (isOpen ? '<div class="survey-privacy">※ 誰がどの選択肢を選んだかは表示しません</div>' : "") +
  '</div>';
}

// ══════════════════════════════════════════════════════════════════
//  RENDER: SHIFT
//  データは Firestore の shifts/{YYYY_M}（Phase 5 で GAS が書き込む）。
// ══════════════════════════════════════════════════════════════════
// 「休み」と「未提出」の区別について。
//
// 原本のセルは、休みでも未提出でも同じ空欄なので、セル単体では区別できない。
// ただし「その人の行がシフト表に無い」ことは区別できる（GAS が氏名で照合して
// 一致した行だけ rows に入れるため）。そこで、
//
//   行が無い          → 未提出（表に載っていない）
//   行はあるが空欄    → 休み
//
// とした。行の中の空欄をさらに分けたい場合は、原本側に「休」などの明示的な
// 記号を入れてもらう必要がある。それ以外に判別材料は無い。
function shiftCellClass(val){
  if(val==="早番") return "shift-early";
  if(val==="遅番") return "shift-late";
  if(val==="21時") return "shift-night";   // 出現頻度が高いのでデザイン上も独立した色を持つ
  if(val) return "shift-other";
  return "shift-off";
}
function shiftCellLabel(val, wide){
  if(val==="早番") return wide ? "早番" : "早";
  if(val==="遅番") return wide ? "遅番" : "遅";
  if(val) return val;
  return "–";
}

/** 表示中の月のシフト表に、その人の行があるか */
function hasShiftRow(sh, memberId){
  return !!(sh && sh.rows && sh.rows[memberId]);
}

/** 絞り込み後のメンバー。チームセレクタと連動する。 */
function shiftFilteredMembers(){
  if(state.shiftTeam === "all") return shiftMembers();
  return shiftMembers().filter(function(m){ return m.team === state.shiftTeam; });
}

/**
 * 週表示で出す日付の範囲を決める。
 *
 * 週の始まりは月曜。手配粗利額シートの Weekly 集計が月曜起点なので、
 * そちらに合わせておかないと「今週の実績」と見比べたときにズレる。
 */
function shiftWeekRange(sh){
  var dates = sh.dates || [];
  var wds = sh.weekdays || [];
  if(!dates.length) return { start:0, end:0 };

  var start = state.shiftWeekStart;
  if(start === null || start === undefined){
    // 本日を含む週。本日が別の月なら、その月の最初の週。
    var t = dates.indexOf(todayDateLabel());
    start = t >= 0 ? t : 0;
    while(start > 0 && String(wds[start]).trim() !== "月") start--;
  }
  start = Math.max(0, Math.min(start, dates.length - 1));

  // 月曜から次の月曜の手前まで。月初・月末は7日に満たないこともある。
  var end = start + 1;
  while(end < dates.length && String(wds[end]).trim() !== "月" && end - start < 7) end++;
  return { start:start, end:end };
}

/** その週の1つ前・1つ後の月曜の index（無ければ null） */
function shiftWeekStep(sh, dir){
  var dates = sh.dates || [], wds = sh.weekdays || [];
  var r = shiftWeekRange(sh);
  if(dir > 0){
    return r.end < dates.length ? r.end : null;
  }
  if(r.start === 0) return null;
  var i = r.start - 1;
  while(i > 0 && String(wds[i]).trim() !== "月") i--;
  return i;
}

/**
 * 本日のシフトを区分ごとにまとめる。
 * 「早番が誰か」を名前で知りたいのが第一の用途なので、区分→氏名の配列にする。
 * どの月を見ていても本日を出すため、当月の購読だけを見る。
 */
function todayShiftGroups(){
  var sh = state.shiftCurrent;
  if(!sh || !sh.dates || !sh.rows) return null;
  var idx = sh.dates.indexOf(todayDateLabel());
  if(idx < 0) return null;

  var order = [], byKind = {}, restCount = 0, unsubmitted = 0;
  shiftMembers().forEach(function(m){
    if(!hasShiftRow(sh, m.id)){ unsubmitted++; return; }
    var v = String(sh.rows[m.id][idx] || "").trim();
    if(!v){ restCount++; return; }
    if(!byKind[v]){ byKind[v] = []; order.push(v); }
    byKind[v].push(m.displayName);
  });

  // 早番・遅番を先に、残りは人数の多い順。運用上その2つを最初に見るため。
  order.sort(function(a,b){
    var rank = function(k){ return k==="早番" ? 0 : k==="遅番" ? 1 : 2; };
    if(rank(a) !== rank(b)) return rank(a) - rank(b);
    return byKind[b].length - byKind[a].length;
  });
  return { order:order, byKind:byKind, rest:restCount, unsubmitted:unsubmitted };
}

/**
 * シフト区分ごとの勤務時間。原本の「運用ルール」シートの定義に合わせている。
 * 上部サマリーに時間まで出すのは、名前だけだと
 * 「その人が今いるのか、これから来るのか」が分からないため。
 */
var SHIFT_TIME = {
  "早番":"8:45-18:00", "遅番":"11:55-21:10", "21時":"8:45-21:00",
  "945":"9:45-19:00", "1045":"10:45-20:00",
  "AM":"8:45-12:45", "PM":"14:00-18:00",
  "記念日":"8:45-16:00", "業務外":"8:45-18:00"
};

/**
 * 広い画面の本日サマリー。区分ごとにカードを横に並べる。
 * これだけ見れば今日が回る、という状態を目標にしている。
 */
function renderTodayShiftWide(){
  var sh = state.shiftCurrent;
  if(!sh || !sh.dates) return "";
  var idx = sh.dates.indexOf(todayDateLabel());
  if(idx < 0) return "";
  var g = shiftGroupsAt(sh, idx);
  if(!g) return "";

  var d = new Date();
  var wd = ["日","月","火","水","木","金","土"][d.getDay()];
  var total = 0;
  g.order.forEach(function(k){ total += g.byKind[k].length; });

  var cards = g.order.map(function(k){
    return '<div class="card tcard '+shiftCellClass(k)+'-card">' +
      '<div class="tcard-head">' +
        '<span class="shift-today-tag '+shiftCellClass(k)+'">'+esc(k)+'</span>' +
        (SHIFT_TIME[k] ? '<span class="tcard-time">'+esc(SHIFT_TIME[k])+'</span>' : '') +
        '<span class="tcard-num">'+g.byKind[k].length+'</span>' +
      '</div>' +
      '<div class="shift-names">'+g.byKind[k].map(shiftNameChip).join("")+'</div>' +
    '</div>';
  }).join("");

  if(!cards){
    cards = '<div class="card tcard"><div class="daycard-empty">' +
      '本日シフトに入っているメンバーはいません</div></div>';
  }

  var foot = [];
  if(g.rest.length) foot.push("休み "+g.rest.length+"名");
  if(g.unsubmitted.length) foot.push("未提出 "+g.unsubmitted.length+"名");

  return '<div class="tsum">' +
    '<div class="tsum-head">' +
      '<span class="shift-today-title">本日 '+(d.getMonth()+1)+'月'+d.getDate()+'日（'+wd+'）のシフト</span>' +
      '<span class="tsum-total">'+total+'名</span>' +
      (foot.length ? '<span class="tsum-rest">'+esc(foot.join(" ・ "))+'</span>' : '') +
    '</div>' +
    '<div class="tsum-grid">'+cards+'</div>' +
  '</div>';
}

function renderTodayShiftCard(){
  if(isWide()) return renderTodayShiftWide();
  var g = todayShiftGroups();
  if(!g) return "";
  var d = new Date();
  var wd = ["日","月","火","水","木","金","土"][d.getDay()];

  var groups = g.order.map(function(k){
    var cls = k==="早番" ? "shift-early" : k==="遅番" ? "shift-late" : "shift-other";
    return '<div class="shift-today-group">' +
      '<span class="shift-today-tag '+cls+'">'+esc(k)+'</span>' +
      '<div class="shift-today-names">'+esc(g.byKind[k].join("、")) +
        '<span class="shift-today-count">'+g.byKind[k].length+'名</span>' +
      '</div>' +
    '</div>';
  }).join("");

  if(!groups){
    groups = '<div class="shift-today-names">本日シフトに入っているメンバーはいません</div>';
  }

  var foot = [];
  if(g.rest) foot.push("休み "+g.rest+"名");
  if(g.unsubmitted) foot.push("未提出 "+g.unsubmitted+"名");

  return '<div class="card shift-today-card">' +
    '<div class="shift-today-head">' +
      '<span class="shift-today-title">本日のシフト</span>' +
      '<span class="shift-today-date">'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+wd+'）</span>' +
    '</div>' +
    groups +
    (foot.length ? '<div class="shift-today-rest">'+esc(foot.join(" / "))+'</div>' : '') +
  '</div>';
}
/** 月切替バー。翌月は原本に無いことが普通にあるので、無いこと自体を表示する。 */
function renderShiftMonthBar(){
  var off = state.shiftMonthOffset;
  var m = monthOf(off);
  return '<div class="shift-bar">' +
    '<button class="shift-nav-btn" data-act="shift-month" data-id="'+(off-1)+'"'+
      (off <= -1 ? ' disabled' : '')+' aria-label="前の月">◀</button>' +
    '<div class="shift-bar-label">'+m.year+'年'+m.label +
      (off===0 ? '<span class="shift-bar-sub">当月</span>' :
       off===-1 ? '<span class="shift-bar-sub">前月</span>' :
                  '<span class="shift-bar-sub">翌月</span>') +
    '</div>' +
    '<button class="shift-nav-btn" data-act="shift-month" data-id="'+(off+1)+'"'+
      (off >= 1 ? ' disabled' : '')+' aria-label="次の月">▶</button>' +
  '</div>';
}

// ══════════════════════════════════════════════════════════════════
//  スマホ用のシフト表示
//
//  デザイン指定は「横スクロールはゼロ」。メンバー×日付の表を縮めて
//  入れるのは無理なので、狭い画面では構造そのものを差し替える。
//
//    PC   : 行 = メンバー、列 = 日付
//    スマホ: 行 = 日付、  列 = シフト種別（縦横を入れ替える）
//
//  DOM が変わるので CSS だけでは切り替えられない。matchMedia で

// ══════════════════════════════════════════════════════════════════
//  INさん（イラスト）
//
//  デザイン指定で出す場面が7つに限定されている。
//  シフト表・目標進捗の数字まわり・重要な連絡・通常のフィード一覧には
//  出さない。数字や連絡の隣に出すと、真面目に読む場面の邪魔になる。
//
//  未達のときに励ます演出も入れない。喜ぶのは達成時だけ。
//  そこを崩すと「励まされている＝まずい状況」の合図になってしまう。
// ══════════════════════════════════════════════════════════════════
var IN_ART = {
  normal:    "in-normal.webp",      // ログイン画面
  guide:     "in-guide.webp",       // 初回オンボーディング
  lonely:    "in-lonely.webp",      // 投稿ゼロ
  satisfied: "in-satisfied.webp",   // 未読ゼロ
  trouble:   "in-trouble.webp",     // 取得失敗
  loading:   "in-normal-sm.webp",   // 読み込み中
  happy:     "in-happy.webp"        // 月間目標を達成
};

/**
 * @param key   IN_ART のキー
 * @param line  添える一言。省略すると画像だけ
 * @param size  画像の一辺(px)
 */
function inChar(key, line, size){
  size = size || 96;
  return '<div class="in-char">' +
    '<img class="in-art" src="./assets/'+IN_ART[key]+'" width="'+size+'" height="'+size+'" alt="" loading="lazy">' +
    (line ? '<div class="in-line">'+esc(line)+'</div>' : '') +
  '</div>';
}

// ══════════════════════════════════════════════════════════════════
//  アイコンの設定
//
//  選ばれた画像はそのまま送らず、必ずブラウザ側で正方形に切って
//  128px まで縮めてから保存する。スマホで撮った写真は数MBあり、
//  そのまま置くと Firestore の1ドキュメント上限に触れるうえ、
//  全員の読み込みが遅くなるため。
// ══════════════════════════════════════════════════════════════════
var AVATAR_PX = 128;

function readAsImage(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error("ファイルを読めませんでした")); };
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){ resolve(img); };
      img.onerror = function(){ reject(new Error("画像として開けませんでした")); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/** 中央を正方形に切り、128px に縮めて data URL にする */
function squareDataUrl(img){
  var side = Math.min(img.naturalWidth, img.naturalHeight);
  var sx = (img.naturalWidth - side) / 2;
  var sy = (img.naturalHeight - side) / 2;
  var canvas = document.createElement("canvas");
  canvas.width = canvas.height = AVATAR_PX;
  var ctx = canvas.getContext("2d");
  ctx.drawImage(img, sx, sy, side, side, 0, 0, AVATAR_PX, AVATAR_PX);
  // webp が使えない環境では jpeg に落ちる
  var url = canvas.toDataURL("image/webp", 0.85);
  if(url.indexOf("data:image/webp") !== 0) url = canvas.toDataURL("image/jpeg", 0.85);
  return url;
}

// ══════════════════════════════════════════════════════════════════
//  掲示板の添付画像
//
//  画像は boardPosts とは別のコレクション（boardImages）に置く。
//  掲示板の一覧はログイン中ずっと購読しているので、画像を投稿と同じ
//  ドキュメントに入れると、タブを開くたびに全員が全部の画像を
//  受け取ることになる。投稿側には ID と縦横だけを持たせ、
//  画像そのものは画面に入ったものだけを1件ずつ取りに行く。
//
//  Storage を使わないのはアイコンと同じ理由（新しいプロジェクトでは
//  Storage に課金プランが必要で、この用途には重い依存）。
// ══════════════════════════════════════════════════════════════════

// 長辺をこの px に収める。掲示板の画像はスクリーンショットが主なので、
// 文字が読める程度を残しつつ、1枚が重くなりすぎない大きさにしている。
var BOARD_IMG_PX = 1280;

// data URL の上限。Firestore の1ドキュメント上限は約1MiB。
// 画像だけで枠を使い切ると同じドキュメントの本文や完了記録が書けなく
// なるため、余裕を残してここで止める。ルール側でも同じ値で弾いている。
var BOARD_IMG_MAX = 900000;

/**
 * 長辺を BOARD_IMG_PX に収め、data URL が上限を切るまで
 * 品質 → 寸法 の順に落としていく。
 * 落としきれなければ null を返す（呼び出し側で断る）。
 */
function fitImageDataUrl(img){
  var scale = Math.min(1, BOARD_IMG_PX / Math.max(img.naturalWidth, img.naturalHeight));
  var baseW = Math.max(1, Math.round(img.naturalWidth  * scale));
  var baseH = Math.max(1, Math.round(img.naturalHeight * scale));
  var canvas = document.createElement("canvas");
  var shrink = [1, 0.8, 0.65, 0.5, 0.35];
  var quality = [0.82, 0.7, 0.55, 0.4];

  for(var s = 0; s < shrink.length; s++){
    canvas.width  = Math.max(1, Math.round(baseW * shrink[s]));
    canvas.height = Math.max(1, Math.round(baseH * shrink[s]));
    var ctx = canvas.getContext("2d");
    // 透過 PNG をそのまま webp/jpeg にすると背景が黒く出るので、白で埋めておく
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    for(var q = 0; q < quality.length; q++){
      var url = canvas.toDataURL("image/webp", quality[q]);
      // webp が使えない環境では jpeg に落ちる
      if(url.indexOf("data:image/webp") !== 0) url = canvas.toDataURL("image/jpeg", quality[q]);
      if(url.length <= BOARD_IMG_MAX){
        return { dataUrl:url, width:canvas.width, height:canvas.height };
      }
    }
  }
  return null;
}

/**
 * 添付画像を選んだとき。which は "boardForm"（投稿）か "editBoard"（編集）。
 * 縮小はこの場で済ませ、送信するまでは手元に置く。
 */
async function pickBoardImage(file, which){
  var slot = which === "editBoard" ? "editFormError" : "boardFormError";
  if(!file) return;
  if(!/^image\//.test(file.type)){
    refuse(slot, true, "画像ファイルを選んでください");
    return;
  }
  try{
    var img = await readAsImage(file);
    var fitted = fitImageDataUrl(img);
    if(!fitted){
      refuse(slot, true, "この画像は小さくできませんでした。別の画像でお試しください");
      return;
    }
    if(which === "editBoard"){
      state.editImageDraft = fitted;
      state.editImageRemove = false;
    }else{
      state.boardImageDraft = fitted;
    }
    render();
  }catch(e){
    refuse(slot, true, e.message || "画像を読み込めませんでした");
  }
}

/** 画像1件を取りに行く。取得済み・取得中なら何もしない */
function loadBoardImage(id){
  if(!id || state.images[id]) return;
  state.images[id] = "loading";
  getDoc(doc(db, "boardImages", id)).then(function(snap){
    var d = snap.exists() ? snap.data() : null;
    state.images[id] = (d && d.dataUrl) ? d : "missing";
    render();
  }).catch(function(err){
    // 1枚の失敗で画面全体に警告を出さない。その枠の中だけに出す。
    state.images[id] = "error";
    render();
  });
}

/**
 * 画面に入った画像だけを読む。
 *
 * 起点はスクロールしている要素（#content）にする。既定の「画面全体」に
 * すると、rootMargin による先読みが内側のスクロール領域には効かない
 * （rootMargin は途中のスクロール領域の切り取りを広げてくれない）。
 * それだと画像が見えた瞬間に読み始めることになり、間に合わない。
 *
 * #content は描き直しのたびに作り直されるので、監視も毎回張り直す。
 * IntersectionObserver が無い環境では、置いてある分をそのまま全部読む
 * （読めないより重いほうがまし）。
 */
var imageObserver = null;
function observeImages(){
  var slots = document.querySelectorAll("[data-img]");
  if(!slots.length) return;
  if(!("IntersectionObserver" in window)){
    Array.prototype.forEach.call(slots, function(el){
      loadBoardImage(el.getAttribute("data-img"));
    });
    return;
  }
  if(imageObserver) imageObserver.disconnect();
  var scroller = document.getElementById("content");
  imageObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(!e.isIntersecting) return;
      imageObserver.unobserve(e.target);
      loadBoardImage(e.target.getAttribute("data-img"));
    });
  }, { root: scroller || null, rootMargin:"400px 0px" });
  Array.prototype.forEach.call(slots, function(el){ imageObserver.observe(el); });
}

// ══════════════════════════════════════════════════════════════════
//  既読（画面に入ったら既読にする）
//
//  以前はカードのどこかを押して初めて既読になっていた。読んだのに
//  未読のまま残るので、「既読◯名」も未読者リストも実態とずれていた。
//
//  今は「一定時間、画面に入っていた」ことを既読の条件にしている。
//  すれ違いざまのスクロールで既読にしないよう、少し待つ。
//
//  待ち時間の管理を要素ではなく投稿IDで持っているのは、待っている
//  最中にほかの人の書き込みで描き直されるため。要素で持つと、描き直しの
//  たびにタイマーが作り直され、複数枚が同時に見えているときに
//  いつまでも既読にならない（書き込み→描き直し→リセットの堂々巡り）。
// ══════════════════════════════════════════════════════════════════
var READ_DWELL_MS = 1000;    // 何ミリ秒見えていたら既読とみなすか
var unreadObserver = null;
var unreadTimers = {};       // postId -> タイマー

function observeUnread(){
  var cards = document.querySelectorAll("[data-unread]");
  if(!cards.length) return;
  // 対応していないブラウザでは、描画された時点のものをそのまま既読にする。
  // 「押さないと既読にならない」に戻すより、こちらのほうが実態に近い。
  if(!("IntersectionObserver" in window)){
    Array.prototype.forEach.call(cards, function(el){
      markBoardRead(el.getAttribute("data-unread"));
    });
    return;
  }
  if(unreadObserver) unreadObserver.disconnect();
  var scroller = document.getElementById("content");
  unreadObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      var id = e.target.getAttribute("data-unread");
      if(!id) return;
      // 画面より背の高いカードは、何割見えたかでは判定できない
      // （長い連絡事項は 60% に届かないまま読み終わる）。
      // 見えている高さそのものも条件に入れておく。
      var enough = e.isIntersecting
                && (e.intersectionRatio >= 0.6 || e.intersectionRect.height >= 240);
      if(enough){
        if(unreadTimers[id]) return;   // すでに待っている。数え直さない
        unreadTimers[id] = setTimeout(function(){
          delete unreadTimers[id];
          markBoardRead(id);
        }, READ_DWELL_MS);
      }else{
        clearTimeout(unreadTimers[id]);
        delete unreadTimers[id];
      }
    });
  }, { root: scroller || null, threshold:[0, 0.25, 0.6] });
  Array.prototype.forEach.call(cards, function(el){ unreadObserver.observe(el); });
}

/**
 * 投稿カードの中の画像。
 *
 * 読み込み前から縦横比どおりの箱を置いておく。あとから高さが決まると、
 * 読んでいる途中の文章が下にずれて視線が飛ぶ。
 */
function renderBoardImage(post){
  if(!post.imageId) return "";
  var ar = (post.imageW && post.imageH) ? (post.imageW + "/" + post.imageH) : "3/2";
  var got = state.images[post.imageId];

  if(got && typeof got === "object"){
    return '<button class="post-img-box" data-act="lightbox" data-id="'+esc(post.imageId)+'" ' +
      'style="aspect-ratio:'+ar+'" aria-label="画像を拡大する">' +
      '<img class="post-img" src="'+got.dataUrl+'" alt="添付画像" decoding="async">' +
    '</button>';
  }

  var note = got === "error"   ? "画像を読み込めませんでした"
           : got === "missing" ? "画像が見つかりません"
           : "";
  // 未取得のときだけ data-img を付ける。これが読み込みの引き金になる。
  return '<div class="post-img-box post-img-empty"'+(got?"":' data-img="'+esc(post.imageId)+'"')+' ' +
    'style="aspect-ratio:'+ar+'">' +
    (note ? '<span class="post-img-note">'+esc(note)+'</span>' : '<span class="post-img-spin"></span>') +
  '</div>';
}

/** 添付欄。投稿フォームと編集フォームで共用する */
function renderImageField(which, post){
  var draft = which === "editBoard" ? state.editImageDraft : state.boardImageDraft;
  var removing = which === "editBoard" && state.editImageRemove;
  var existing = which === "editBoard" && post && post.imageId && !removing ? post.imageId : null;

  var preview = "";
  if(draft){
    preview = '<div class="img-pick-preview">' +
      '<img src="'+draft.dataUrl+'" alt="添付する画像">' +
      '<div class="img-pick-meta">' + draft.width + '×' + draft.height +
        '・約' + Math.round(draft.dataUrl.length / 1024) + 'KB' +
      '</div>' +
      '<button class="btn-ghost img-pick-clear" data-act="img-clear" data-which="'+which+'">添付をやめる</button>' +
    '</div>';
  }else if(existing){
    var got = state.images[existing];
    preview = '<div class="img-pick-preview">' +
      (got && typeof got === "object"
        ? '<img src="'+got.dataUrl+'" alt="いま付いている画像">'
        : '<div class="post-img-empty img-pick-loading"><span class="post-img-spin"></span></div>') +
      '<div class="img-pick-meta">いま付いている画像</div>' +
      '<button class="btn-ghost img-pick-clear" data-act="img-remove" data-which="'+which+'">画像を外す</button>' +
    '</div>';
  }else if(removing){
    preview = '<div class="img-pick-meta">保存すると画像が外れます　' +
      '<button class="btn-ghost img-pick-clear" data-act="img-undo" data-which="'+which+'">やめる</button></div>';
  }

  return '<div class="img-pick">' +
    '<label class="img-pick-btn">' +
      '<input type="file" accept="image/*" data-act="board-img-file" data-which="'+which+'" hidden>' +
      '🖼 ' + (draft || existing ? "画像を選び直す" : "画像を添付する") +
    '</label>' +
    preview +
  '</div>';
}

async function pickAvatarFile(file, targetId){
  if(!file) return;
  if(!/^image\//.test(file.type)){
    state.notice = "画像ファイルを選んでください"; render(); return;
  }
  try{
    var img = await readAsImage(file);
    var url = squareDataUrl(img);
    if(url.length > 110000){
      state.notice = "画像を小さくできませんでした。別の画像でお試しください";
      render(); return;
    }
    state.avatarDraft = url;
    render();
  }catch(e){
    state.notice = e.message || "画像を読み込めませんでした";
    render();
  }
}

function saveAvatar(targetId){
  var url = state.avatarDraft;
  if(!url) return;
  state.avatarDraft = null;
  var id = targetId || currentUserId();
  write("アイコンの保存", function(){
    return setDoc(doc(db, "avatars", id), { dataUrl: url, updatedAt: serverTimestamp() });
  }, true);
  state.avatarFor = null;
}

function clearAvatar(targetId){
  var id = targetId || currentUserId();

  state.avatarFor = null;
  write("アイコンの削除", function(){
    return deleteDoc(doc(db, "avatars", id));
  }, true);
}

/** 指定した日のシフトを種別ごとにまとめる */
function shiftGroupsAt(sh, idx){
  if(!sh || !sh.rows || idx == null || idx < 0) return null;
  var order = [], byKind = {}, rest = [], unsubmitted = [];
  shiftFilteredMembers().forEach(function(m){
    if(!hasShiftRow(sh, m.id)){ unsubmitted.push(m); return; }
    var v = String(sh.rows[m.id][idx] || "").trim();
    if(!v){ rest.push(m); return; }
    if(!byKind[v]){ byKind[v] = []; order.push(v); }
    byKind[v].push(m);
  });
  // 早番・遅番・21時を先に。運用上その3つを最初に見るため。
  order.sort(function(a,b){
    var rank = function(k){ return k==="早番"?0 : k==="遅番"?1 : k==="21時"?2 : 3; };
    if(rank(a)!==rank(b)) return rank(a)-rank(b);
    return byKind[b].length - byKind[a].length;
  });
  return { order:order, byKind:byKind, rest:rest, unsubmitted:unsubmitted };
}

/** 選択中の日。未選択なら本日、本日が範囲外ならその月の1日目 */
function shiftSelectedIdx(sh, todayIdx){
  if(state.shiftDayIdx !== null && state.shiftDayIdx < sh.dates.length) return state.shiftDayIdx;
  return todayIdx >= 0 ? todayIdx : 0;
}

/** 日表示（スマホ既定）。日付を選び、その日の面子を縦に並べる */
function renderShiftDayView(sh, todayIdx){
  var sel = shiftSelectedIdx(sh, todayIdx);

  // 日付の選択だけは横スクロールさせる。表を横に流すのとは別で、
  // 「選ぶための帯」であることが見て分かる形にしている。
  var strip = '<div class="daystrip" role="tablist">' + sh.dates.map(function(d, i){
    return '<button class="daystrip-btn'+(i===sel?" daystrip-btn-on":"")+
      (i===todayIdx?" daystrip-btn-today":"")+'" data-act="shift-day" data-id="'+i+'"'+
      ' role="tab" aria-selected="'+(i===sel?"true":"false")+'">' +
      '<span class="daystrip-d">'+esc(String(d).split("/")[1])+'</span>' +
      '<span class="daystrip-w">'+esc((sh.weekdays||[])[i]||"")+'</span>' +
    '</button>';
  }).join("") + '</div>';
